    title: '第 1 章 シミ・イボ【改訂・追加】（D 研究結果）'
    body_text: |
      第 1 章はシミ（日光黒子・肝斑・後天性真皮メラノサイトーシス）とイボ・ホクロに対するレーザー／光治療を扱う。各節は基礎知識と CQ からなる。
