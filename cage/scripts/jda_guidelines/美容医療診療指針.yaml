notes: |
  - 抽出モードは `layout`。この原本は 1 CQ が「CQ 番号／CQ 文言／推奨度／推奨文／
    有効性・安全性・承認状況／解説文／文献」の**表組み**で刷られており、既定モードでも
    `-raw` でも「推奨度」「推奨文」のラベルと中身が離れてしまう。`-layout` なら
    同じ行に並んで読める。
  - `strip_edge` は**ページ先頭 2 行**だけを見る（柱はページ上端にしか無い）。裸の
    `\d{1,3}` は置いていない（推奨度の「1」「2」やエビデンス件数を巻き添えにするため）。
  - `normalize_radicals: true`。縦書き用の読点・コロン（`︐` U+FE10 / `︓` U+FE13）が
    計 8 か所混じるため。`strip_edge` と `from`/`until` は正規化後の字形で書いてある。
  - ページ内分割の境界は CQ ブロックの先頭行 `CQ`（行頭、後ろは行末か 2 文字以上の空白）と
    節見出し `第N節` / 章見出し `第N章`。CQ 番号（`1—1—1` 等）は行が分かれたり
    CQ 文言の続き行の末尾に付いたりして安定しないので使っていない。
  - 全 115 ページを収めた。落としたページは無い（p.3 と p.114 は白ページで、それぞれ
    `00_表紙・掲載について` と `99_奥付` に含めてある）。
  - 「D 研究結果」以降が本文（p.29〜113）。原本 p.13〜21 は同じ CQ の推奨度・推奨文を
    一覧にした前付なので、本文の CQ ノードとは別に `04_CQ・推奨度一覧` として 1 ノードに
    まとめた（本文側と重複する内容だが、原本の構成をそのまま残した）。
  - 第 6 章の 3 件は「CQ」と刷られているが推奨度を持たず「回答」形式なので、
    title の【】には推奨度の代わりにその旨を書いた。
  - 日本皮膚科学会の単独ガイドラインではなく **5 学会共同**の指針なので、`publisher` は
    原本 1 ページ目の作成主体を連名で書いた（編集は厚生労働科学研究費補助金
    「美容医療に関する調査研究班」美容医療診療指針作成分科会）。
