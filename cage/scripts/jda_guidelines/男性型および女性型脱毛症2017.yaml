id: 男性型および女性型脱毛症2017
title: 男性型および女性型脱毛症診療ガイドライン（2017年版）
guideline: 男性型および女性型脱毛症診療ガイドライン（2017年版）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『男性型および女性型脱毛症診療ガイドライン 2017 年版』(日本皮膚科学会ガイドライン)。
  男性型および女性型脱毛症診療ガイドライン作成委員会が作成し、日本皮膚科学会雑誌に掲載された。
  2010 年の「男性型脱毛症診療ガイドライン」の改訂版で、女性型脱毛症 (female pattern hair loss)
  を対象に加えている。

  構成:
  - ガイドラインについて (1．背景と目的／2．診療ガイドラインの作成手順／3．エビデンスの収集／
    4．エビデンスのレベルと推奨度の決定基準／5．資金提供者，利益相反／6．公開方法／
    7．ガイドラインの改訂／8．免責事項)
  - 総論 (1．疾患概念／2．病態／3．診断／4．治療)
  - CQ1〜CQ14 (表1 Clinical Question のまとめ／内服・外用・植毛術・LED／低出力レーザー・
    かつら・成長因子導入など治療 14 件)

  推奨度は A / B / C1 / C2 / D。**男性型脱毛症と女性型脱毛症で推奨度が分かれる CQ がある**
  (CQ1 フィナステリド・CQ2 デュタステリドは男性型 A／女性型 D、CQ4 植毛術・CQ6 アデノシンも別建て)。

  収録は 1 CQ = 1 ノード (推奨度 + 解説 + 文献)。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '男性型および女性型脱毛症診療ガイドライン\s*2017\s*年版(\s*日本皮膚科学会ガイドライン)?'
  - '男性型および女性型脱毛症診療ガイドライン作成委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
