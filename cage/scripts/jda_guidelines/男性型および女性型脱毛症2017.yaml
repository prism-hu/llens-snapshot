notes: |
  ## 版の扱い
  - 2017 年版。2010 年の「男性型脱毛症診療ガイドライン」の改訂版だが、旧版の PDF は素材に
    含まれないので落とした版は無い。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・作成委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。本文に相対危険度・毛髪数・p 値などの裸の数値が
    多いので `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 15 ページがいずれかのノードに載る。

  ## ページ内分割
  - 総論の開始 (1．疾患概念) と CQ1〜CQ14 の境界を `from` / `until` で割った。
  - **表1 は CQ の一覧表だが、行の書式が本体の見出しと違う** (一覧は `CQ1 フィナステリドの…`、
    本体は `CQ1：フィナステリドの…`) ので、`^CQ\d+[：:]` を境界にすれば一覧行に当たらない。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
