id: 皮膚血管炎・血管障害2023
title: 皮膚血管炎・血管障害診療ガイドライン2023―IgA血管炎，クリオグロブリン血症性血管炎，結節性多発動脈炎，リベド様血管症の治療の手引き2023―
guideline: 皮膚血管炎・血管障害診療ガイドライン2023―IgA血管炎，クリオグロブリン血症性血管炎，結節性多発動脈炎，リベド様血管症の治療の手引き2023―
publisher: 日本皮膚科学会（皮膚血管炎・血管障害診療ガイドライン策定委員会）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮膚血管炎・血管障害診療ガイドライン 2023 ―IgA 血管炎，クリオグロブリン血症性血管炎，
  結節性多発動脈炎，リベド様血管症の治療の手引き 2023―』(日本皮膚科学会ガイドライン)。
  皮膚血管炎・血管障害診療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌 133 巻 9 号
  2079-2134 頁 (2023 年／令和 5 年) に掲載された。

  **『血管炎・血管障害診療ガイドライン 2016 年改訂版』(日皮会誌 127(3), 2017、別 id `血管炎・血管障害2016`) を
  置き換えるものではない。** 2016 年版が皮膚血管炎・血管障害の全体像 (分類・診断・治療) を扱う
  総合ガイドラインであるのに対し、本 2023 年版は **4 疾患 (IgA 血管炎・クリオグロブリン血症性血管炎・
  結節性多発動脈炎／皮膚動脈炎・リベド様血管症) の治療に限って** Minds 2020 ver.3.0 に準拠した
  システマティックレビューと GRADE 相当の手続きで推奨を作り直した「治療の手引き」で、
  学会ページでも 2016 年版と並んで現行掲載されている。したがって両方を収録し、
  診断・分類は 2016 年版、この 4 疾患の治療は 2023 年版、という引き分けになる。

  構成:
  - 総論 (本ガイドラインの目的・2023 の特徴・推奨作成関連資料の位置づけ・エビデンスの確実性と推奨の強さ・血管炎分類 CHCC1994／CHCC2012・対象疾患・免責事項・利益相反・今後の改訂)
  - IgA 血管炎 (定義と機序・疫学・診断・予後／重要臨床課題とシステマティックレビュー／CQ1-1・CQ1-2)
  - クリオグロブリン血症性血管炎 (定義と機序・疫学・クリオグロブリンの検出方法・治療／CQ2-1〜CQ2-5)
  - 結節性多発動脈炎・皮膚動脈炎 (定義と機序・診断・治療／CQ3-1〜CQ3-3・CQ4)
  - リベド様血管症 (定義と機序・疫学・システマティックレビュー・治療)

  推奨は「推奨の強さ (強い／弱い)」と「エビデンスの確実性 (高／中／低／非常に低)」の 2 軸で示される。
  収録は 1 CQ = 1 ノード (推奨表 + 背景 + 解説〈エビデンスの要約〉+ 関連する他の診療ガイドライン等の記載 +
  今後の研究の可能性 + 文献)。

  さらに、学会が本体とは別に zip で公開している **推奨作成関連資料 3 本** (IgA／CryoVas／PAN・CA) を
  子セクション `95_推奨作成関連資料` に収める。本体の CQ からたどれるよう、
  推奨作成関連資料側の CQ ノードの title は本体の CQ ノードと同じ CQ 文言にしてある。
normalize_radicals: true
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '皮膚血管炎\s*・\s*血管障害診療ガイドライン策定委員会'
  - '皮膚血管炎\s*・\s*血管障害診療ガイドライン2023―IgA血管炎，.*'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，2017; 127: …」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
# 推奨作成関連資料 2 (CryoVas) p.48/p.50 の検査値閾値 (3×10⁹/L, 70×10⁹/L) は上付きの 9 が
# テキスト層で潰れて「X109/L」になる (10⁷ 倍ずれる)。紙面どおりに戻す
