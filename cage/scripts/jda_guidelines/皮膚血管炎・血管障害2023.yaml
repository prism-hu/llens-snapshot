notes: |
  ## 2016年版との関係（別文書であって改訂版ではない）
  - 学会の「一般公開ガイドライン」には『血管炎・血管障害診療ガイドライン 2016 年改訂版』
    (日皮会誌 127(3): 299-415, 2017、別 id `血管炎・血管障害2016`) と本 2023 年版が**並んで現行掲載**されている。
  - 原本 1 ページ目の「本ガイドラインの目的」と総論の記述から、2023 年版は
    **IgA 血管炎・クリオグロブリン血症性血管炎・結節性多発動脈炎（皮膚動脈炎を含む）・リベド様血管症の
    4 疾患の「治療」に限った手引き**で、Minds 診療ガイドライン作成マニュアル 2020 ver.3.0 に準拠した
    システマティックレビューで推奨を作り直したもの。分類・診断・その他の血管炎（皮膚白血球破砕性血管炎・
    ANCA 関連血管炎・リウマトイド血管炎など）は 2016 年版が引き続き担う。
  - したがって**旧版として落とさず両方収録**し、この関係を `description` に書いた
    (共通指示の「『改訂』でなく『別文書』なら両方収録し description に関係を書く」)。

  ## 推奨作成関連資料 3 本
  - 本体の各 CQ 末尾にある「推奨作成関連資料（IgAV）＊ … ＊日本皮膚科学会 HP の
    『ガイドライン・指針』ページ参照」が指す資料。学会ページでは本体と別に zip
    (`推奨作成関連資料.zip`) で配布されており、個別 URL が無いので `url:` を省略して
    カタログの `slug:` を配信名にしてある (2026-09-11 に zip から補完したもの)。
  - 疾患ごとに 3 本 (IgA 28p ／ CryoVas 66p ／ PAN・CA 39p) あり、それぞれ CQ 単位に割れたので
    `95_推奨作成関連資料/0N_<疾患>/CQ…` の子セクションにした。
    **推奨作成関連資料側の CQ ノードの title は本体側の CQ ノードと同じ CQ 文言**にしてあり、
    本体 CQ の `body_text` に対応する path を 1 行で書いてある (引く側が本体 → 資料と辿れるように)。
  - PAN・CA の p.39 は資料作成者 (厚生労働科学研究費補助金 難治性血管炎に関する調査研究班 PAN ワーキング
    グループ) と転載禁止の断りだけなので、`00_文献検索式と文献選択` の 2 番目の区間として拾った
    (数字始まりのノード名だと `sorted()` で CQ ノードより前に来てしまうため、独立ノードにしていない)。

  ## 抽出モード
  - **本体は日皮会誌の 2 段組**。既定モードは左右段の行が 1 行ずつ交互に出て文がつながらず、
    `-layout` は 1 行に左段 + 右段が並ぶ。`-raw` (内容ストリーム順) だけが段ごとに上から下へ出るので `mode: raw`。
  - **推奨作成関連資料 3 本は表組みが主体**で 2 段組ではない。`-layout` が桁を保って列の対応が
    いちばん読めるので `mode: layout` にした (既定モードだと表のセルが 1 列に潰れる)。
  - 推奨作成関連資料 3 本には**康熙部首・縦書き用記号の混入がある** (`⾎管炎` `⾏う` `︖` など。
    rec1 で 367 字、rec2 で 554 字、rec3 で 60 字)。本文の引用に出るレベルなので
    `normalize_radicals: true` を manifest 直下に置いた。本体 PDF の混入は 0 件なので影響しない。

  ## ノードの切り方
  - 1 CQ = 1 ノード (推奨表 + 背景 + 解説〈エビデンスの要約〉+ 関連する他の診療ガイドライン等の記載 +
    今後の研究の可能性 + 文献 + 推奨作成関連資料の目次)。**2 つの CQ が同じページで始まる版面**が多いので、
    ほぼすべての CQ 境界で `from` / `until` によるページ内分割を使っている。
  - リベド様血管症には CQ が設定されていない (システマティックレビューの結果を踏まえた治療の記述のみ) ので
    1 ノードにまとめた。
  - 総論の「重要臨床課題の選択」は IgA・CryoVas・PAN の 3 か所に同じ見出しで出るが、
    `from` / `until` は範囲の先頭／末尾ページにしか効かないので取り違えは起きない。

  ## strip
  - raw モードでは柱 (奇数ページ = 書名の長い版、偶数ページ = 策定委員会) とノンブル入りフッタが
    **ページ末尾**に出る。フッタは `●` を必ず含むので、文献リスト中の「日皮会誌，2017; 127: …」とは紛れない。
  - 推奨作成関連資料 3 本には柱もノンブルも無い (テキスト層に出ない) ので strip 不要。
  - `\d{1,3}` の裸のノンブルは無いので `strip_edge` は置いていない
    (推奨作成関連資料の検索件数・エビデンスプロファイルの数値セルを守るため)。

  ## 落としたページ
  - 無し。4 PDF の全 189 ページがどこかのノードに載る。

  ## 原本の誤記への注記 (2026-10-06)
  - 原本の誤記・原本内の食い違いのうち臨床的に読み違えを招くものは、本文を原本の印字どおり残したまま、
    該当箇所の直後 (表は直前) に `（注記：…）` の段落を足した。この段落は収録時に足したもので原本には無い。
    正しい値は断定せず、根拠 (同じ文書の別ページ・表の構造・原典の分類) を添えて「と思われる」に留めた。
  - 本体 p.23 / p.27 CQ2-2 の推奨文が「重症の IgA 血管炎の患者に」(p.27 は patches。p.23 は 2 ノードに割れていて patches が当たらないので、テキスト層そのまま + 注記の overlay)
  - 推奨作成関連資料3 (PAN/CA) p.21 の `○` の位置と推奨文の食い違い
