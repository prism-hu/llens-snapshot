  - {pdf: 皮膚血管炎2023_推奨作成関連資料1_IgA.pdf, find: '18X106/L', replace: '18X10⁶/L', note: '上付き 6 の潰れ (赤血球 >18×10⁶/L)'}
  - {pdf: 皮膚血管炎2023_推奨作成関連資料2_CryoVas.pdf, find: '×106copies', replace: '×10⁶copies', note: '上付き 6 の潰れ (HCV-RNA)'}
  - {pdf: 皮膚血管炎2023_推奨作成関連資料2_CryoVas.pdf, find: 'X109/L', replace: 'X10⁹/L', note: '上付き 9 の潰れ。紙面は 10⁹'}
