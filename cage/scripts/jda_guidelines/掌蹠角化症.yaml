id: 掌蹠角化症
title: 掌蹠角化症診療の手引き
guideline: 掌蹠角化症診療の手引き
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『掌蹠角化症診療の手引き』(掌蹠角化症診療の手引き作成委員会。米田耕造・久保亮治・
  乃村俊史・山本明美・須賀 康・秋山真志・金澤伸雄・橋本 隆)。
  日皮会誌 130(9)：2017-2029，2020（令和 2）に掲載された全 13 ページ。年号を持たない
  「診療の手引き」なので id は主題のみ。

  厚生労働省難治性皮膚疾患克服研究事業の一プロジェクトとして作成された。病変が主として
  皮膚に限局する（狭義の）掌蹠角化症と、掌蹠角化症症候群に属するいくつかの疾患を扱う。
  病名診断・病型診断と重症度判定基準は厚生労働省研究班で提唱されたもの。

  構成は 3 章:

  - I 掌蹠角化症の概要 (p.1-9): 1．定義・特徴（1.1〜1.11 の病型各論）／2．疫学／
    3．治療（外用療法・皮膚切削術・内服療法・合併症に対する治療・患者自身によるケア）／
    4．予後／文献。図（病型診断アルゴリズム）・表1〜表3・別表1 を含む
  - II 診断基準と重症度判定基準 (p.9-10): 1．病名診断／2．病型診断／3．確定診断その他／
    4．重症度判定基準（別表2 のスコア計算表で軽症・中等症・重症の 3 グレードに分類）
  - III クリニカルクエスチョン (p.10-13): CQ1〜CQ9。推奨度は A / B / C1 / C2 / D、
    エビデンスレベルは I〜VI（決定基準は末尾の節）

  収録は 1 節 = 1 ノード、CQ が 1 CQ = 1 ノード（推奨文・同意度・推奨度・解説・文献まで）。
  図・表は参照しやすいように独立ノードにした。
strip_edge:
  # 柱下フッタ (末尾) は奇数/偶数ページで向きが入れ替わる 2 形。走り柱は書名と作成委員会名。
  # 1 ページ目の末尾だけ `<書名> 日本皮膚科学会診療の手引き` の合成バナーが出る。
  # **`\d{1,3}` 単体は入れない** (重症度スコアの 0〜3・表の数値・文献番号が消えるため)
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
    - '掌蹠角化症診療の手引き'
    - '掌蹠角化症診療の手引き作成委員会'
    - '.*日本皮膚科学会診療の手引き'
# 埋め込みフォントの ToUnicode 誤りで「腱」がテキスト層に `伳` (U+4F73) として落ちる
# (紙面は「腱」。アキレス腱の 3 箇所)。全ページに散るので patches ではなく substitutions
substitutions:
  - pdf: 掌蹠角化症診療の手引き.pdf
    find: '伳'
    replace: '腱'
    note: 'ToUnicode 誤り。紙面は腱'
pdfs:
  - file: 掌蹠角化症診療の手引き.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/shosekikakka_3.pdf
    label: 掌蹠角化症診療の手引き
    # 日皮会誌の 2 段組。既定モードは左右の段が 1 行ずつ交互に出て本文が読めない
    mode: raw
