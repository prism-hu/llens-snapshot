notes: |
  **版の判断**: 年号を持たない「診療の手引き」で、学会の「一般公開ガイドライン」
  (https://www.dermatol.or.jp/medical/guideline/4742/) に載っているのはこの 1 本だけ。
  改訂版・旧版は無く、落とした PDF も無い。原本 1 ページ目に「今後，診断や治療の進歩そして
  時代の要請に応じ適宜改訂されていくであろう」とあるので、改訂時は差し替えになる。

  **抽出モード**: 全 13 ページ `raw`。日皮会誌の 2 段組で、pdftotext の既定モードは
  左右の段の行が 1 行ずつ交互に出て本文が読めない。
  多列の表 (p.2 表1・p.3 表2・p.4 表3・p.5 別表1・p.10 別表2) は raw では桁が崩れるので
  `mode: layout` を検討したが、**layout はページ内の読み出し順が raw と変わる**
  (別表1 が p.5 の先頭に来る等) ため、`from` / `until` によるページ内分割と両立しない。
  加えて layout では柱下フッタが 2 行に割れてページ中央に紛れ込み `strip_edge` から外れる。
  よって全ページ raw のままとし、これらの表は `vlm_candidates` に挙げて VLM の overlay に
  任せることにした。なお p.4 (表3) だけは raw でも 1 行 = 1 行の形で素直に出る。

  **strip**: 柱下フッタはページ**末尾**に出て、奇数/偶数ページで向きが入れ替わる
  (`日皮会誌：130（9） ，2017-2029，2020（令和 2）● 2019` と
  `2018 ● 日皮会誌：130（9） ，…` の 2 形)。走り柱は `掌蹠角化症診療の手引き` (奇数頁) と
  `掌蹠角化症診療の手引き作成委員会` (偶数頁)、1 ページ目の末尾だけ
  `掌蹠角化症診療の手引き 日本皮膚科学会診療の手引き` のバナー。`strip_edge` (lines: 3) で
  13 ページすべて落ちることを実測で確認した。ノンブル単体 (`\d{1,3}`) は入れていない
  (別表2 のスコア 0〜3・表の数値・文献番号を巻き添えにするため)。文献欄の日皮会誌は
  読点 (`日皮会誌，`)、フッタはコロン (`日皮会誌：`) なのでコロンで固定すれば
  文献行を巻き込まない。康熙部首・縦書き用記号の混入は 0 件だったので
  `normalize_radicals` は付けていない。
  1 ページ目の書名行は走り柱と同じ文字列なので strip_edge で落ちるが、書名は
  front matter の title にある。

  **ページ内分割**: p.3 は 1.2/1.3/1.4 の 3 病型と表2、p.5 は 1.5/1.6 と別表1、
  p.6 は 1.7〜1.11 の 5 病型、p.7 は 2．疫学/3．治療/4．予後/文献、p.9 は II 章の 4 節、
  p.11 は CQ2〜CQ5、p.12 は CQ6〜CQ9 と、1 ページに複数の節・CQ が始まるので
  `from` / `until` で割った。図・表はいずれも本文のあとに置かれるので、
  raw の読み出し順でも `from` で切り出せば独立ノードにできる。
  なお p.4 が全面 表3 のため、1.4 Greither 型の本文は p.3 → p.5 に飛ぶ (2 区間に分けた)。
  別表2 (p.10 の後半) は物理的には CQ1 の文献 46) の途中に割り込むが、
