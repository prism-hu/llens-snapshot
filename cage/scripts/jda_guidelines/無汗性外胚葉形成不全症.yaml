id: 無汗性外胚葉形成不全症
title: 無汗（低汗）性外胚葉形成不全症の診療手引き
guideline: 無汗（低汗）性外胚葉形成不全症の診療手引き
publisher: 公益社団法人日本皮膚科学会（「無汗（低汗）性外胚葉形成不全症診療手引き」作成委員会）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  原典正式名:「日本皮膚科学会ガイドライン 無汗（低汗）性外胚葉形成不全症の診療手引き」
  （日皮会誌 128(2): 163-167, 2018）。日本皮膚科学会「無汗（低汗）性外胚葉形成不全症診療手引き」
  作成委員会編。タイトルに年号が入らないため id は主題のみ（`無汗性外胚葉形成不全症`）。

  無汗（低汗）性外胚葉形成不全症（hypohidrotic ectodermal dysplasia：HED）は
  発汗低下・乏毛・歯の欠損を三徴とする遺伝性疾患で、EDA / EDAR / EDARADD 等の
  EDAR シグナル系遺伝子変異による。指定難病の診断基準・重症度分類のもとになる文書。

  **CQ を持たない「診療の手引き」**なので、目次の節（1．作成の背景 〜 12．生活指導（付記））で
  ノードを切ってある。9．疫学 と 10．病因・遺伝子異常 のあいだの本文に、原本のまま
  「10．病因・遺伝子異常を参照」という参照行がある。
