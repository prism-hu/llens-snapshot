notes: |
  - **抽出モード**: 日皮会誌の 2 段組。既定モードでは左右の段と文献欄が行単位で混ざるため `-raw`。
  - **ノードの切り方**: CQ を持たない手引きなので目次の節で切った。全 5 ページ・7 ノードで、
    どのノードも 3 千字以下。
  - **`10．病因・遺伝子異常` の重複**: p.3 には本文中の参照行「10．病因・遺伝子異常を参照」と
    節見出し「10．病因・遺伝子異常」の 2 行がある。`until` / `from` は `$` で行末を固定して
    見出しだけに当てている。
  - **重症度分類の表**: p.3 末尾の段抜きの表は `-raw` では判定基準の行が分かれて出るので
    `vlm_candidates` に入れた（節としては `04_病因・遺伝子異常` のページに載る）。
  - 落としたページは無い（全 5 ページがどこかのノードに載る）。
