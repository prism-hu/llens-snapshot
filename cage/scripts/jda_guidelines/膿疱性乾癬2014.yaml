  - path: 05_各治療法の推奨度と解説文
    title: 第V章 各治療法の推奨度と解説文（CQ1〜CQ28）
    body_text: |
      28 項目の臨床設問（CQ）について、推奨度・推奨文・解説・文献を示す章。
      CQ は 1．プライマリーケア／2．内服療法／3．外用療法／4．光線療法／5．生物学的製剤／
      6．顆粒球単球吸着除去療法（GMA）／7．妊婦・授乳婦，小児に対する治療薬選択／8．合併症治療とアウトカム
      の 8 群に分かれる。レチノイド・シクロスポリン・メトトレキサート・PUVA・UVB は
      成人例／小児例／妊婦例／長期安全性で枝番（CQ3-1〜3-4 等）に分かれるので、枝番ごとに 1 ノードにしてある。
      各 CQ の文献は原本で CQ の直後に置かれるので CQ ノードに含まれる。
