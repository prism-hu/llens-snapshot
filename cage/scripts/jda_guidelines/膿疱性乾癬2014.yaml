retrieved_at: '2026-09-07'
description: |
  『膿疱性乾癬（汎発型）診療ガイドライン 2014 年度版』(日本皮膚科学会ガイドライン)。
  日本皮膚科学会膿疱性乾癬（汎発型）診療ガイドライン作成委員会（委員長 照井正ほか 12 名）が作成し、
  日本皮膚科学会雑誌 125 巻 12 号 2211-2257 頁 (2015 年／平成 27 年) に掲載された。
  膿疱性乾癬（汎発型）は厚生労働省の稀少難治性皮膚疾患（指定難病）で、本ガイドラインは
  2006 年／2010 年の診断基準・重症度判定基準と治療指針を引き継いでいる。

  構成 (全 5 章 + 巻末資料):
  - 第 I 章 ガイドライン作成にあたって (背景と目的・位置づけ・特徴・資金提供者と利益相反・エビデンスの収集・エビデンスレベルと推奨度決定基準〈表1〉・公開前レヴューと公開方法・評価と更新計画・免責事項)
  - 第 II 章 膿疱性乾癬（汎発型）の診断基準と重症度判定基準 (定義と主要項目・参考項目・除外項目・臨床統計・重症度判定〈表2〉・治療法とその効果)
  - 第 III 章 膿疱性乾癬（汎発型）の治療ガイドラインと治療指針の要約 (治療アルゴリズム〈図2〉・急性期の推奨療法〈表4〉・標準的乾癬治療の安全使用〈表5〉・関節炎に対する治療〈表6〉・慢性期の光線療法〈表7〉)
  - 第 IV 章 臨床設問 (Clinical Question：CQ) の要約 (表8：28 項目の CQ・エビデンスレベル・推奨度)
  - 第 V 章 各治療法の推奨度と解説文 (CQ1〜CQ28。レチノイド・シクロスポリン・メトトレキサート・PUVA・UVB は小児例／妊婦例／長期安全性で枝番に分かれる)
  - 巻末資料 (顆粒球単球吸着除去療法〈GMA〉の操作方法・治療中の管理・留置針刺入部からの感染防御)

  エビデンスレベルは Ⅰ〜Ⅵ、推奨度は A／B／C1／C2／D（表1）。収録は 1 CQ = 1 ノードで、
  枝番を持つ CQ（CQ3-1〜3-4 等）はそれぞれ独立ノードにしてあるため計 40 の CQ ノードになる。
