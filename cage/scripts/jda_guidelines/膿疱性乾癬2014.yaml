notes: |
  ## 版の扱い
  - 素材 135 本に含まれる膿疱性乾癬のガイドラインはこの 2014 年度版 1 本だけで、旧版・新版は無い。
    学会の「一般公開ガイドライン」でも現行掲載が続いている。
  - 本ガイドラインが参照する「乾癬における生物学的製剤の使用ガイダンス」は別 id
    `乾癬_使用ガイダンス` に、関節症状については `乾癬性関節炎2019` にある。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は 1 行に
    左段 + 右段が並ぶ。`-raw` (内容ストリーム順) だけが段ごとに上から下へ出るので `mode: raw`。
  - 康熙部首の混入は 0 件だったので `normalize_radicals` は付けていない。

  ## ノードの切り方
  - 第 V 章は 1 CQ = 1 ノード。**枝番を持つ CQ (CQ3-1〜3-4・CQ4-1〜4-4・CQ5-1〜5-4・CQ13-1〜13-3・
    CQ14-1〜14-3) は枝番ごとに推奨度が違う**ので、枝番ごとに独立ノードにした (計 40 ノード)。
    表 8 (第 IV 章) の CQ 番号は枝番を持たないので、表 8 の CQ3 は本文の CQ3-1〜3-4 に対応する。
  - 節見出し (2．内服療法・3．外用療法 等) は、その節の最初の CQ ノードの `from` に使ってあるので、
    見出しはその CQ ノードの冒頭に出る。
  - 各 CQ の文献は原本で CQ の直後に置かれるので CQ ノードに含めた (章末にまとめられていない)。

  ## strip
  - raw モードでは柱 (書名・委員会名) とノンブル入りフッタが**ページ末尾**に出る。
    フッタは `●` を必ず含むので、文献リスト中の「日皮会誌，2010; 120: …」とは紛れない。
  - `\d{1,3}` の裸のノンブルは無いので `strip_edge` は置いていない
    (表 2 の重症度スコアや参考データの数値を守るため)。

  ## 落としたページ
  - 無し。全 47 ページがどこかのノードに載る。
