notes: |
  ## 版と従属文書の扱い
  - 本体は 2015 年版 (日皮会誌 125(11): 2049-2060)。改訂版は公開されていない。
  - 学会が併せて公開している「簡易版」(5p、2015.10.20 版) を子セクション `90_簡易版` に収めた。
    簡易版は**日本皮膚科学会・日本リウマチ学会の合同編**で、リウマチ学会側では別名
    (「…ヒドロキシクロロキン使用のための簡易ガイドライン」) で公開されている。
    manifest の `publisher` は本体に合わせて日本皮膚科学会とし、合同である事実はここと
    `description` に書いた。
  - 本手引きには親となる疾患別ガイドラインが日本皮膚科学会側に無いので、単独の id にしてある
    (エリテマトーデスの診療ガイドラインは日本皮膚科学会の掲載物ではない)。

  ## 抽出モード
  - 2 本とも 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので両方 `mode: raw` にした。
  - 康熙部首の混入は 2 本とも 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 本体は柱 (書名・「古川福実 ほか」) と版面フッタを `strip`。
  - 簡易版は日皮会誌の組版ではなく、p.1 の頭書き (両学会の書名 5 行) が raw では p.1 の末尾に
    まとめて出るので、その 5 行だけを `pdfs[].strip` に書いた。
  - 裸のノンブルは `strip_edge` (lines: 3)。用量 (200 mg・400 mg)、理想体重の計算式、
    副作用頻度の数値を守るため `strip` には置いていない。

  ## 落としたページ
  - **簡易版の p.4 は白ページ**なので、どのノードにも載せていない。
  - それ以外 (本体 12 ページ・簡易版の p.1〜3, 5) はすべていずれかのノードに載る。

  ## ページ内分割
  - 本体は節境界 (1．効能又は効果／2．警告／3．禁忌・慎重投与・重要な基本的注意／
    4．用法及び用量／5．副作用／6．妊婦…／利益相反について) がいずれもページの途中に来るので
    `from` / `until` で割った。overlay (VLM) が見出しを `## ` 付きで起こしても当たるように
    `^(#+\s*)?…` の形で書いてある。
  - 簡易版は 1 ページ = 1 まとまりなので分割していない。
