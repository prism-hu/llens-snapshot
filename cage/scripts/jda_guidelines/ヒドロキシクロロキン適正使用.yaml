id: ヒドロキシクロロキン適正使用
title: ヒドロキシクロロキン適正使用の手引き
guideline: ヒドロキシクロロキン適正使用の手引き
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『ヒドロキシクロロキン適正使用の手引き』(日本皮膚科学会)。古川福実・衛藤光・谷川瑛子・
  池田高治・篠田啓・横川直人・山本一彦が作成し、日本皮膚科学会雑誌 125 巻 11 号 2049-2060 頁
  (2015 年／平成 27 年) に掲載された。2015 年 7 月にヒドロキシクロロキン硫酸塩（HCQ、プラケニル®）が
  皮膚エリテマトーデス（CLE）・全身性エリテマトーデス（SLE）に対して国内承認されたことを受けて
  出された、**適正使用のための手引き**（クリニカルクエスチョン形式ではない）。

  構成:
  - はじめに (HCQ の薬理・海外での位置づけ・国内臨床試験の成績／図1 CLASI 活動性スコアの経時推移)
  - 1．効能又は効果，効能効果に関連する使用上の注意 (図2 欧米での CLE 治療アルゴリズム・
    図3 欧米での SLE 治療アルゴリズム)
  - 2．警告
  - 3．禁忌・慎重投与・重要な基本的注意 (図4 網膜症の進行度別の各種検査所見・図5 網膜症の病型別の検査所見)
  - 4．用法及び用量，用法及び用量に関連する使用上の注意 (ブローカ式桂変法による理想体重あたりの
    用量／図6 身長〈理想体重〉と 1 回投与量の関係)
  - 5．副作用 (重大な副作用・その他の副作用／表1 国内試験での重度の皮膚障害の発現時期)
  - 6．妊婦，産婦，授乳婦等への投与
  - 利益相反について・謝辞・文献

  これに学会が併せて公開している簡易版 1 本を子セクションとして収める:
  - `90_簡易版` … 『ヒドロキシクロロキン適正使用の手引き（簡易版）』(2015.10.20 版、5 ページ)。
    **日本皮膚科学会・日本リウマチ学会の合同編**で、日本リウマチ学会側では
    「皮膚エリテマトーデスおよび全身性エリテマトーデスに対するヒドロキシクロロキン使用のための
    簡易ガイドライン」として公開されている。適応・禁忌・慎重投与・用量用法・スクリーニング・
    モニタリング・副作用・網膜毒性・臨床効果・薬理・薬物動態・相互作用・肝腎機能障害・
    妊娠授乳・小児の 15 項目を 1 枚ずつにまとめたもの
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - 'ヒドロキシクロロキン適正使用の手引き'
  - '適正使用の手引き'
  - '古川福実 ほか'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。用量 (200/400 mg)・理想体重の式・副作用頻度の数値を守るため端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
pdfs:
  - file: ヒドロキシクロロキン適正使用の手引き.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/Hydroxychloroquine_Sulfate.pdf
    label: '本体 (日皮会誌 125(11): 2049-2060, 2015)'
    mode: raw
  - file: ヒドロキシクロロキン適正使用の手引き（簡易版）.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/hcqkaniban.pdf
    label: 簡易版 (2015.10.20 版)
    mode: raw
    strip:
      # 簡易版は日皮会誌の組版ではなく、p.1 の頭書き (両学会の書名) が raw では
      # **p.1 の末尾**にまとめて出る。この 5 行だけを落とす
      - '皮膚エリテマトーデスおよび全身性エリテマトーデスに対する'
      - 'ヒドロキシクロロキン診療ガイドライン（日本皮膚科学会・日本リウマチ学会編）'
      - '【日本皮膚科学会】ヒドロキシクロロキン適正使用の手引き（簡易版）\s*（2015\.10\.20 版\)'
      - '【日本リウマチ学会】皮膚エリテマトーデスおよび全身性エリテマトーデスに対する'
      - 'ヒドロキシクロロキン使用のための簡易ガイドライン（2015\.10\.20 版\)'
nodes:
  - path: 00_はじめに
    title: はじめに（HCQ の薬理・海外での位置づけ・国内臨床試験の成績／図1 CLASI 活動性スコアの経時推移）
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [1, 3]
        until: '^(#+\s*)?1．.*効能又は効果'
  - path: 01_効能又は効果
    title: 1．効能又は効果，効能効果に関連する使用上の注意（図2 欧米での CLE 治療アルゴリズム・図3 欧米での SLE 治療アルゴリズム）
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [3, 4]
        from: '^(#+\s*)?1．.*効能又は効果'
        until: '^(#+\s*)?2．警告'
        allow_overlap: true
  - path: 02_警告
    title: 2．警告
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [4, 5]
        from: '^(#+\s*)?2．警告'
        until: '^(#+\s*)?3．禁忌・慎重投与・重要な基本的注意'
        allow_overlap: true
  - path: 03_禁忌・慎重投与・重要な基本的注意
    title: 3．禁忌・慎重投与・重要な基本的注意（図4 ヒドロキシクロロキンによる網膜症の進行度別の各種検査所見・図5 網膜症の病型別の検査所見）
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [5, 7]
        from: '^(#+\s*)?3．禁忌・慎重投与・重要な基本的注意'
        until: '^(#+\s*)?4．.*用法及び用量'
        allow_overlap: true
  - path: 04_用法及び用量
    title: 4．用法及び用量，用法及び用量に関連する使用上の注意（ブローカ式桂変法による理想体重あたりの用量／図6 身長〈理想体重〉と 1 回投与量の関係）
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [7, 8]
        from: '^(#+\s*)?4．.*用法及び用量'
        allow_overlap: true
  - path: 05_副作用
    title: 5．副作用（重大な副作用・その他の副作用／表1 国内試験での重度の皮膚障害の発現時期）
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [9, 10]
        from: '^(#+\s*)?5．副作用'
        until: '^(#+\s*)?6．妊婦'
        allow_overlap: true
  - path: 06_妊婦・産婦・授乳婦等への投与
    title: 6．妊婦，産婦，授乳婦等への投与
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [10, 10]
        from: '^(#+\s*)?6．妊婦'
        allow_overlap: true
  - path: 07_利益相反・謝辞・文献
    title: 利益相反について・謝辞・文献
    body:
      - pdf: ヒドロキシクロロキン適正使用の手引き.pdf
        pages: [11, 12]
        from: '^(#+\s*)?利益相反について'
        allow_overlap: true
  - path: 90_簡易版
    title: ヒドロキシクロロキン適正使用の手引き（簡易版）（2015.10.20 版／日本皮膚科学会・日本リウマチ学会 合同編）
    body_text: |
      本体と同時期に両学会が合同で出した簡易版（5 ページ）。日本リウマチ学会側では
      「皮膚エリテマトーデスおよび全身性エリテマトーデスに対するヒドロキシクロロキン使用のための
      簡易ガイドライン」の名で公開されている。本体と項目立てが違うので子セクションに分けてある。
    children:
      - path: 01_目的から投与中のモニタリングまで
        title: '[簡易版] 目的／1．適応／2．禁忌／3．慎重投与／4．用量・用法／5．投与開始前のスクリーニング（全て必須）／6．投与中のモニタリング'
        body:
          - pdf: ヒドロキシクロロキン適正使用の手引き（簡易版）.pdf
            pages: [1, 1]
      - path: 02_副作用と網膜毒性
        title: '[簡易版] 7．主な副作用とその対応／8．網膜毒性／【参考】臓器系統別副作用のリスト'
        body:
          - pdf: ヒドロキシクロロキン適正使用の手引き（簡易版）.pdf
            pages: [2, 2]
      - path: 03_臨床効果から小児等に対する使用まで
        title: '[簡易版] 9．臨床効果／10．薬理作用／11．薬物動態／12．相互作用／13．肝または腎機能に障害がある場合／14．妊娠・授乳希望への対応／15．小児等に対する使用'
        body:
          - pdf: ヒドロキシクロロキン適正使用の手引き（簡易版）.pdf
            pages: [3, 3]
      - path: 04_参考文献
        title: '[簡易版] 参考文献'
        body:
          - pdf: ヒドロキシクロロキン適正使用の手引き（簡易版）.pdf
            pages: [5, 5]
