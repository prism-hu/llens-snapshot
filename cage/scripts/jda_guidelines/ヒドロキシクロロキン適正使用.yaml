  - {pdf: ヒドロキシクロロキン適正使用の手引き.pdf, pages: [3, 4], why: 図2 欧米での CLE 治療アルゴリズム・図3 欧米での SLE 治療アルゴリズム（フローチャート）}
  - {pdf: ヒドロキシクロロキン適正使用の手引き.pdf, pages: [6, 7], why: 図4 網膜症の進行度別の各種検査所見・図5 網膜症の病型別の検査所見（眼底写真・OCT の図版）}
  - {pdf: ヒドロキシクロロキン適正使用の手引き.pdf, pages: [8, 8], why: 図6 身長（理想体重）と 1 回投与量の関係（投与量の早見図。数値が図中に散る）}
  - {pdf: ヒドロキシクロロキン適正使用の手引き.pdf, pages: [9, 10], why: 表1 国内試験での重度の皮膚障害の発現時期・【その他の副作用】の頻度表（多列表で列が縦に潰れる）}
