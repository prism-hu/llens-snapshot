id: 乳房外パジェット病2025
title: 乳房外パジェット病診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: 乳房外パジェット病診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 公益社団法人日本皮膚科学会／一般社団法人日本皮膚悪性腫瘍学会（皮膚がん診療ガイドライン策定委員会 乳房外パジェット病診療ガイドライングループ）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
normalize_radicals: true
description: |
  原典正式名:「皮膚がん診療ガイドライン第 4 版 乳房外パジェット病診療ガイドライン 2025」
  （日皮会誌 135(1): 1-36, 2025）。公益社団法人日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会
  「皮膚がん診療ガイドライン策定委員会（乳房外パジェット病診療ガイドライングループ）」編、
  代表委員 松下茂人、統括委員長 中村泰大。2021 年の第 3 版（日皮会誌 131: 225-244, 2021）の改訂版で、
  第 3 版は学会の現行一覧に無いため収録していない。推奨は Minds 診療ガイドライン作成マニュアル
  2020 ver.3.0 準拠。

  構成は 3 章立て。第 1 章はガイドラインの目的・作成方法（文献検索・システマティックレビュー・
  推奨決定会議・COI）、第 2 章は総論（定義/起源/疫学・診断・治療）、第 3 章は CQ 6 件
  （CQ3 は 3-1 放射線療法 / 3-2 imiquimod 外用の 2 つの下位設問を持つ）と推奨。

  本体のほかに、学会サイトの「推奨作成関連資料」zip に同梱された **CQ ごとの推奨決定資料**
  7 本（CQ1・CQ2・CQ3-1・CQ3-2・CQ4・CQ5・CQ6）と**スコープ** 1 本を、子セクション
  `95_推奨決定資料` / `96_スコープ` として収録した。推奨決定資料は RC-* フォーム（推奨提示・
  EtD フレームワーク・判断の要約）と SR-* フォーム（文献検索・評価シート・SR レポート）から
  なるので、1 資料を `01_推奨決定` / `02_文献検索と採否` / `03_評価シート` / `04_レビュー結果`
  の 4 ノードに割ってある。本体の CQ ノードと推奨決定資料の CQ ノードは同じ CQ 文言を title に持つ。
