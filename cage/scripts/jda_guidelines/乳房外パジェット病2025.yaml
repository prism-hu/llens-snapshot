notes: |
  - **抽出モード**: 本体は日皮会誌の 2 段組で，既定モードだと左右の段を行単位で交互に拾う
    （p.3 で確認）。`-layout` は段を横に並べたまま出すので，読み順が通る `-raw` を採った。
    推奨決定資料とスコープは Excel/Word 由来の表フォームなので `-layout`。
    ただし推奨決定資料の「評価シート」ページ（SR-5/SR-6/SR-7）だけは表頭が縦組みで，
    `-layout` にしても桁が復元できないまま 1 ページ 1.5 万字の空白を生むので，
    その範囲の区間だけ `mode: raw` にした（`03_評価シート` ノード）。
  - **康熙部首**: 推奨決定資料・スコープの 8 本に `⽣` `⽤` `⾏` 等の康熙部首字形が混入している
    （本体には無い）ため `normalize_radicals: true`。
  - **配信名**: 本体の公式 URL は basename が `Paget%E2%80%99s2025.pdf`（アポストロフィを
    percent-encode したもの）で ASCII の配信名が採れないため，`url:` を省いてカタログの
    `slug: Pagets2025.pdf` を使っている。元 URL は
    <https://www.dermatol.or.jp/uploads/uploads/files/guideline/Paget%E2%80%99s2025.pdf>。
    推奨決定資料 8 本は学会ページの「推奨作成関連資料DL」zip 同梱で単独 URL が無いので同じく `slug:`。
  - **ページの割り方**: p.8 は第1章の末尾（15.2 COI）・第2章の冒頭（定義/起源）・別表1/別表2 が
    同居する。`-raw` では段抜きの別表がページ末尾に回るので，`until`/`from` で
    「第1章の残り」「総論の冒頭」「別表」の 3 つに割った。
    CQ は `文献検索式と文献選択` の表が次ページに食い込むため，CQ 境界は次の CQ 見出し（`CQ2．` 等）で切っている。
  - **旧版**: 2021 年の第 3 版（乳房外パジェット病診療ガイドライン 2021）は学会の現行一覧に無く，
    本版が改訂版なので収録していない。
  - 落としたページは無い（本体 36 ページ・推奨決定資料 7 本 134 ページ・スコープ 11 ページ，すべてどこかのノードに載る）。

