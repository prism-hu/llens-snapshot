    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/melanoma2025_250220.pdf
    label: 本体（全 117 ページ）
    # 学会誌の 2 段組。既定モードは左右の段を 1 行ずつ交互に出し、-layout は段を横に並べたまま
    # 出すのでどちらも読み順が壊れる。-raw だけが「左段を通し → 右段を通し」の順に出る
    mode: raw
