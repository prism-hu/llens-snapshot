            until: '^(#+\s*)?第\s?3\s?章'
  - path: 03_クリニカルクエスチョンと推奨
    title: 第3章 メラノーマ診療ガイドライン クリニカルクエスチョン（CQ）と推奨
    children:
      - path: CQ01
        title: '[CQ1] 爪部浸潤性メラノーマに対する指趾切断術は勧められるか？【推奨の強さ 3（実施しないことを提案）／エビデンスの強さ C（弱）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ01`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [65, 67]
            from: '^(#+\s*)?第\s?3\s?章'
            allow_overlap: true
      - path: CQ02
        title: '[CQ2] センチネルリンパ節（SLN）転移陽性例に対して早期リンパ節郭清を行うことは勧められるか？【推奨の強さ 3（実施しないことを提案）／エビデンスの強さ C（弱い）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ02`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [68, 69]
      - path: CQ03
        title: '[CQ3] 根治切除後の BRAF 変異陰性メラノーマに対する術後補助療法として抗 PD-1 抗体は勧められるか？【推奨の強さ 2（実施することを提案）／エビデンスの強さ C（弱）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ03`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [70, 72]
      - path: CQ04
        title: '[CQ4] 根治切除後の BRAF 変異陽性メラノーマに対する術後補助療法は BRAF/MEK 阻害薬と抗 PD-1 抗体のいずれが勧められるか？【推奨の強さ 5（推奨なし）／エビデンスの強さ C（弱）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ04`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [73, 74]
      - path: CQ05
        title: '[CQ5] 臨床的に明らかな領域リンパ節転移を有するメラノーマに対して術前補助療法は勧められるか？【推奨の強さ 2（実施することを提案）／エビデンスの強さ D（とても弱い）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ05`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [75, 78]
      - path: CQ06
        title: '[CQ6] 領域リンパ節郭清を行った皮膚メラノーマに術後放射線療法は勧められるか？【推奨の強さ 5（推奨なし）／エビデンスの強さ B（中）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ06`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [79, 81]
            until: '^(#+\s*)?CQ7'
      - path: CQ07
        title: '[CQ7] 根治切除不能な BRAF 変異陰性メラノーマの一次治療は抗 PD-1 抗体，抗 PD-1 抗体＋抗 CTLA-4 抗体のいずれが勧められるか？【推奨の強さ 3（実施しないことを提案）／エビデンスの強さ C（弱）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ07`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [81, 83]
            from: '^(#+\s*)?CQ7'
            allow_overlap: true
      - path: CQ08
        title: '[CQ8] 根治切除不能な BRAF 変異陽性例の一次治療は BRAF/MEK 阻害薬，抗 PD-1 抗体，ないしは抗 PD-1 抗体＋抗 CTLA-4 抗体併用療法のいずれが勧められるか？【推奨の強さ 5（推奨なし）／エビデンスの強さ C（弱）】'
        body_text: |
          推奨決定資料は `95_推奨決定資料/CQ08`。
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
