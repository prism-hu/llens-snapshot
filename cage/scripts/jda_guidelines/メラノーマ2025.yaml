nodes:
  - path: 00_表紙・目次
    title: 表紙・作成委員・目次
    body_text: |
      表紙（書名・版・作成主体・策定委員の所属）と目次。版・発行年・作成委員会の根拠になるので収録した。
    body:
      - pdf: メラノーマ診療ガイドライン2025.pdf
        pages: [1, 3]
        until: '^(#+\s*)?第1章 メラノーマ診療ガイドラインについて'
  - path: 01_ガイドラインについて
    title: 第1章 メラノーマ診療ガイドラインについて
    children:
      - path: 01_目的・対象・注意事項・改訂の特徴
        title: '[第1章] 1〜5 本ガイドラインの目的／改訂の目的／適用が想定される対象者・利用対象者／使用する場合の注意事項／改訂ガイドラインの特徴'
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [3, 4]
            from: '^(#+\s*)?第1章 メラノーマ診療ガイドラインについて'
            allow_overlap: true
      - path: 02_エビデンス収集方法
        title: '[第1章] 6 エビデンス収集方法（文献検索）'
        body:
          - {pdf: メラノーマ診療ガイドライン2025.pdf, pages: [5, 5]}
      - path: 03_システマティックレビューと推奨決定の方法
        title: '[第1章] 7〜8 システマティックレビューの方法／推奨決定の方法（推奨の強さ・エビデンスの強さ・パネル会議・CQ 担当者）'
        body:
          - {pdf: メラノーマ診療ガイドライン2025.pdf, pages: [6, 7]}
      - path: 04_CQ番号の変更・改訂作業・外部評価
        title: '[第1章] 9〜12 作成過程における CQ 番号の変更／ガイドライン改訂作業の実際／外部評価・パブリックコメント／今後の改訂と目指すべき改訂のあり方'
        body:
          - {pdf: メラノーマ診療ガイドライン2025.pdf, pages: [8, 8]}
      - path: 05_モニタリング・資金・利益相反
        title: '[第1章] 13〜15 出版後のガイドラインのモニタリング／資金／利益相反（COI の申告と対応）'
        body:
          - {pdf: メラノーマ診療ガイドライン2025.pdf, pages: [9, 9]}
  - path: 02_メラノーマ総論
    title: 第2章 メラノーマ総論
    children:
      - path: 01_メラノーマの疫学と病因
        title: '[第2章] 1 メラノーマの疫学と病因（1.1 疫学／1.2 病因，危険因子）'
        body:
          - pdf: メラノーマ診療ガイドライン2025.pdf
            pages: [10, 15]
            until: '^(#+\s*)?2[．.]メラノーマの診断'
      - path: 02_メラノーマの診断
        title: '[第2章] 2 メラノーマの診断（肉眼による視診／ダーモスコピー／生検／病理診断／スクリーニング画像検査）'
        body:
