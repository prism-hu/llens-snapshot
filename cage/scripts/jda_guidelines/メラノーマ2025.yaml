notes: |
  - **抽出モードは本体だけ `raw`**。学会誌の 2 段組で、既定モードは左右の段を 1 行ずつ交互に
    吐き、`-layout` は段を横に並べたまま出す（どちらも読み順が壊れる）。`-raw` だけが
    「左段を通し → 右段を通し」の順になる。副作用として図表のキャプションと柱がページ末尾に
    回るが、柱はそこで `strip_edge` に当たるので都合がよい。推奨決定資料とスコープは 1 段組の
    フォームなので既定モードのまま。
  - **`normalize_radicals: true`**。原本に康熙部首の字形が混ざる（本体の図キャプション
    `センチネルリンパ節⽣検`・`⾏い`、推奨決定資料の `⽖部`・`⽂献`・`⽤`・`⽩人`・`⻑い`、
    スコープの `⽬次に戻る` 等）。`strip` / `from` / `until` は正規化後の字形で書いてある。
  - **`strip_edge` に `\d{1,3}` を置いていない**。本体の柱は
    `3178 ● 日皮会誌：134（13），3149-3265，2024（令和 6）`（偶数ページ）と
    `日皮会誌：…● 3179`（奇数ページ）の形で、裸のノンブル行が無い。全 117 ページで
    柱が末尾 2 行に固まることを確認した（`strip_edge` の `lines: 3` で足りる）。
    推奨決定資料・スコープにはノンブルも柱も無く、目次リンクの `目次に戻る` だけが
    各ページ先頭に出るので、これを `strip` に入れた。
  - **ページ内分割（`from` / `until`）**は 6 箇所。p.3（目次の続き｜第 1 章）、p.15 / p.17 /
    p.25 / p.29 / p.34 / p.39 / p.46 / p.52 / p.60（第 2 章の節境界）、p.65（第 2 章 10.3｜
    第 3 章＋CQ1）、p.81（CQ6 の文献検索式｜CQ7）、p.93（CQ10 の文献検索式｜CQ11）、
    p.97（CQ11 の文献検索式｜CQ12）、p.100（CQ12 の文献検索式｜文献）。overlay が当たっても
    効くよう、すべて `^(#+\s*)?…` の形で書いた。境界ページを共有する側（`from` を持つ後ろの
    ノード）には `allow_overlap: true` を付けてあるので、二重掲載の警告は出ない。
  - **推奨決定資料の割り方**：1 PDF = 1 ノードだと 24,000〜130,000 字になるので、原本が
    そのまま持っている Minds の様式区分（RC-4〜RC-7、SR-1〜SR-15）ごとに割った。
    様式の見出しは必ずページ先頭に来る（全 12 本 344 ページで確認）ので、`from` / `until` は
    使わず物理ページだけで切れている。同じ様式が何ページも続く塊は 1 ノードにまとめ、
    それでも 22,000 字を超える 2 箇所（CQ9 の SR-6 評価シート 観察研究 13 ページ、
    CQ7 の SR-4 引用文献リスト 2 ページ）だけページで分割した。
  - **本体 CQ と推奨決定資料 CQ の title を揃えた**（`[CQ1] …【推奨の強さ …／エビデンスの強さ …】`）。
