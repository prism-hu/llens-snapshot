id: メラノーマ2025
title: メラノーマ診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: メラノーマ診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 日本皮膚科学会・日本皮膚悪性腫瘍学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮膚がん診療ガイドライン第 4 版 メラノーマ診療ガイドライン 2025』
  （公益社団法人日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会 皮膚がん診療ガイドライン
  策定委員会（メラノーマ診療ガイドライングループ）編、日皮会誌 134(13): 3149-3265, 2024（令和 6）、
  2025 年 2 月 20 日更新版）。2007 年の「皮膚悪性腫瘍診療ガイドライン」に始まり、2015 年 第 2 版、
  2019 年 第 3 版を経た改訂版で、メラノーマ分冊は第 4 版にあたる。推奨は Minds 2020 ver.3.0 準拠。

  構成（全 3 章 + 文献）:
  - 第 1 章 メラノーマ診療ガイドラインについて（目的・対象・文献検索・SR の方法・推奨決定の方法・COI）
  - 第 2 章 メラノーマ総論（疫学と病因、診断、病期と治療方針・経過観察、手術療法、センチネル
    リンパ節生検・領域リンパ節郭清、放射線療法、周術期薬物療法、進行期治療（殺細胞性抗がん剤・
    分子標的薬 / 免疫チェックポイント阻害薬）、ICI と分子標的薬の併用・逐次投与）
  - 第 3 章 クリニカルクエスチョン（CQ）と推奨（CQ1〜CQ12）
  - 文献

  本体のほかに、学会ページの「推奨作成関連資料DL」zip に同梱されている **CQ ごとの推奨決定資料**
  （CQ1〜CQ12、Minds 様式の RC-4〜RC-7 / SR-1〜SR-15）を `95_推奨決定資料/CQ01`〜`CQ12` に、
  **スコープ**（SC-1〜SC-4）を `96_スコープ` に子セクションとして収めた。本体の CQ ノードと
  推奨決定資料の CQ ノードは同じ title を持たせてあるので、本体 → 推奨決定資料と辿れる。
normalize_radicals: true
strip:
  # 推奨決定資料・スコープの各ページ先頭に入る目次リンク（本体には出ない）
  - '目次に戻る'
strip_edge:
  # 本体（学会誌組版）の柱とノンブル。**raw 抽出ではページ末尾 2 行に固まって出る**ので端だけに効かせる
  # （'\d{1,3}' は置かない。本体は裸のノンブル行を持たず、表の数値を巻き添えにするだけなので）
  lines: 3
  patterns:
    - '.*日皮会誌：134（13）.*'
    - '皮膚がん診療ガイドライン策定委員会（メラノーマ診療ガイドライングループ）'
    - '皮膚がん診療ガイドライン第 4 版 メラノーマ診療ガイドライン 2025.*'
pdfs:
