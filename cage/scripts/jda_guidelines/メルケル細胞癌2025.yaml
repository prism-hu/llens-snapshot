id: メルケル細胞癌2025
title: メルケル細胞癌診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: メルケル細胞癌診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 日本皮膚科学会・日本皮膚悪性腫瘍学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
normalize_radicals: true
description: |
  『メルケル細胞癌診療ガイドライン 2025』(皮膚がん診療ガイドライン第 4 版 / 公益社団法人
  日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会 皮膚がん診療ガイドライン策定委員会
  (メルケル細胞癌診療ガイドライングループ) / 日本皮膚科学会雑誌 135(2), 213-256, 2025 年)。

  メルケル細胞癌 (Merkel cell carcinoma) は高齢者の日光露光部に好発する高悪性度の皮膚神経内分泌
  腫瘍で、メルケル細胞ポリオーマウイルス (MCPyV) 陽性例と紫外線関連の陰性例に分かれる。
  Minds 準拠で作成され、CQ は 4 課題 6 問 (CQ1 / CQ2 / CQ3-1 / CQ3-2 / CQ3-3 / CQ4、
  推奨の強さ 1〜5 / エビデンスの強さ A〜D)。

  構成は 3 章 + 文献:
  - 第 1 章 メルケル細胞癌診療ガイドラインについて (目的・対象・作成方法・COI、別表 1 委員一覧)
  - 第 2 章 メルケル細胞癌総論 (疫学と病因 / 診断 / 病期分類と治療指針 / 手術療法 /
    放射線療法 / 薬物療法)
  - 第 3 章 クリニカルクエスチョン (CQ) と推奨

  子セクション:
  - `95_推奨決定資料/CQ01`〜`CQ04` … 学会が「推奨作成関連資料 DL」zip で公開している
    CQ ごとの推奨決定資料 (RC-7 EtD フレームワーク + SR-1〜SR-15 のシステマティックレビュー
    関連資料)。**本体の CQ ノードと title を揃えてある**
  - `96_スコープ` … 同 zip 同梱のスコープ (SC-1〜SC-4)
strip_edge:
  # 日皮会誌の柱とノンブル。raw モードではページ末尾の 2 行に来る
  lines: 3
  patterns:
  - '\d{1,4} ● 日皮会誌：135（2）\s*，213-256，2025（令和 7）'
  - '日皮会誌：135（2）\s*，213-256，2025（令和 7）● \d{1,4}'
  - '皮膚がん診療ガイドライン策定委員会（メルケル細胞癌診療ガイドライングループ）'
  - '皮膚がん診療ガイドライン第 4 版 メルケル細胞癌診療ガイドライン 2025( 日本皮膚科学会ガイドライン)?'
pdfs:
  - file: メルケル細胞癌診療ガイドライン2025.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/Merkel2025.pdf
    label: 本体 (全 44 ページ)
    # 学会誌組版の 2 段組。既定モードは左段と右段を 1 行ずつ交互に出すので raw を使う
    mode: raw
