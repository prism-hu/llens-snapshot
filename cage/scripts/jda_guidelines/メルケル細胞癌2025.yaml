  - {file: MCC_CQ_4_推奨決定資料.pdf,   slug: jda_merkel_2025_cq4_rec.pdf,   label: CQ4 推奨決定資料,   mode: layout}
  - {file: MCC_SC_推奨決定資料.pdf,     slug: jda_merkel_2025_sc.pdf,        label: スコープ SC-1〜SC-4, mode: layout}
