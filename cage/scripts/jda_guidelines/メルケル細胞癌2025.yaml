notes: |
  - **本体は日本皮膚科学会雑誌の 2 段組**。既定モードは左段と右段を 1 行ずつ交互に出して
    本文が読めなくなるため、本体は `mode: raw` (内容ストリーム順)。
    **推奨決定資料 7 本は 1 段組だが EtD フレームワーク・SR 評価シートが表主体**なので
    `mode: layout` に分けた。
  - **`normalize_radicals: true`**。推奨決定資料 7 本の埋め込みフォントが
    **康熙部首・CJK 部首補助の字形**を使っており、`pdftotext` 出力に `⽂献` `⼆次` `⼊`
    `⽣存` `⻑` などが 195〜722 字/ファイル混ざる (本体 PDF には無い)。そのまま読むと
    引用が別字になるので正規化した。`strip_edge` の正規表現は正規化後の字形で書いてある。
  - 柱とノンブル (`日皮会誌：135（2），213-256，2025（令和 7）● 213` 形式) を
    `strip_edge` (lines: 3) で落とした。推奨の強さ・合意率・病期・線量など**裸の数値行が
    本文に多い**ので、`\d{1,3}` は `strip` に置かず日皮会誌の行ごと edge で落とした。
