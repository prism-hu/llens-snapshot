  # SR の評価シート・EtD フレームワークが表主体なので layout
  - {file: MCC_CQ_1_推奨決定資料.pdf,   slug: jda_merkel_2025_cq1_rec.pdf,   label: CQ1 推奨決定資料,   mode: layout}
  - {file: MCC_CQ_2_推奨決定資料.pdf,   slug: jda_merkel_2025_cq2_rec.pdf,   label: CQ2 推奨決定資料,   mode: layout}
  - {file: MCC_CQ_3-1_推奨決定資料.pdf, slug: jda_merkel_2025_cq3_1_rec.pdf, label: CQ3-1 推奨決定資料, mode: layout}
  - {file: MCC_CQ_3-2_推奨決定資料.pdf, slug: jda_merkel_2025_cq3_2_rec.pdf, label: CQ3-2 推奨決定資料, mode: layout}
