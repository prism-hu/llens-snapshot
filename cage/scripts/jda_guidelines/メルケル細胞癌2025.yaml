      SR-11 システマティックレビューレポートのまとめ / SR-15 Future Research Question) が入る。
      1 資料 18〜33 ページ・5 万〜11 万字あるので、様式ごとにノードを割った。
      **本体の CQ ノード (`03_クリニカルクエスチョンと推奨/CQ01`〜) と title を揃えてある。**
      単独 URL は無く zip 同梱なので、配信名は `jda_merkel_2025_cq<n>_rec.pdf` を自分で付けた。
    children:
      - path: CQ01
        title: '[CQ1 推奨決定資料] メルケル細胞癌原発巣の手術療法の際に，1 cm 以下の側方マージンは勧められるか？【術後放射線療法を施行しない場合：推奨の強さ 4（実施しないことを推奨）／エビデンスの強さ D、施行する場合：推奨の強さ 3（実施しないことを提案）／エビデンスの強さ D】'
        children:
          - {path: 01_EtDフレームワーク, title: '[CQ1 推奨決定資料] RC-7 EtD フレームワーク（Clinical recommendation: Individual perspective）', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: [1, 5]}]}
          - {path: 02_データベース検索結果, title: '[CQ1 推奨決定資料] SR-1 データベース検索結果', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: [6, 8]}]}
          - {path: 03_文献検索フローチャート, title: '[CQ1 推奨決定資料] SR-2 文献検索フローチャート（PRISMA 声明を改変）', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: 9}]}
          - {path: 04_二次スクリーニング後の一覧表, title: '[CQ1 推奨決定資料] SR-3 二次スクリーニング後の一覧表', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: 10}]}
          - {path: 05_引用文献リスト, title: '[CQ1 推奨決定資料] SR-4 引用文献リスト', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: 11}]}
          - {path: 06_評価シート_観察研究, title: '[CQ1 推奨決定資料] SR-6 評価シート 観察研究 (アウトカムごと)', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: [12, 15]}]}
          - {path: 07_評価シート_エビデンス総体, title: '[CQ1 推奨決定資料] SR-7 評価シート エビデンス総体', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: 16}]}
          - {path: 08_定性的システマティックレビュー, title: '[CQ1 推奨決定資料] SR-9 定性的システマティックレビュー', body: [{pdf: MCC_CQ_1_推奨決定資料.pdf, pages: [17, 18]}]}
