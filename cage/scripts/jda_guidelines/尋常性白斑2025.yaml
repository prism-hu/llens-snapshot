notes: |
  ## 版の扱い
  - 第 2 版 (2025)。初版 (2012 年) の PDF は素材に含まれないので落とした版は無い。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・策定委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。VitiQoL の選択肢 (□0〜□6)、相対危険度、
    自己免疫疾患の合併率などを守るため `strip` には置いていない。
  - 実測では、この原本のノンブルは必ず `●` 付きの版面フッタの中に入るので `strip` 側で片付き、
    `strip_edge` が落とすのは **図6「診療アルゴリズム その2」のページ (p.13) にある
    図中の数字 3 行 (`2` `3` `1`) だけ**。当該ページは vlm_candidates に入れてあり
    overlay で置き換わるので、そのまま残している。

  ## 落としたページ
  - 落としたページは無い。全 41 ページがいずれかのノードに載る。

  ## ページ内分割
  - 大節 (5．〜12．) の境界、治療法各論の節 (11.1〜11.16) の境界、CQ3-2 の境界を
    `from` / `until` で割った。
  - **CQ の見出しは節見出し (11.x) の直後に来る**ので、境界には CQ 番号ではなく
    **節番号 (`^11\.4\s` など)** を使った。こうすると「11.4 PUVA 療法」の見出しと解説が
    CQ4 のノードに収まる。`^11\.1\s` は `11.10`〜`11.16` には当たらない (数字の直後が
    空白でないため)。
  - CQ3-1 と CQ3-2 は同じ節 (11.3 タクロリムス軟膏) にあるので、CQ3-2 だけ
    `^CQ3-2[．.]` を境界に使っている。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
