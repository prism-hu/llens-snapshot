id: 尋常性白斑2025
title: 尋常性白斑診療ガイドライン第2版2025
guideline: 尋常性白斑診療ガイドライン第2版2025
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『尋常性白斑診療ガイドライン 第 2 版 2025』(日本皮膚科学会ガイドライン)。
  尋常性白斑診療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌に掲載された。
  初版 (2012 年) の改訂版で、化学白斑 (ロドデノール誘発性脱色素斑を含む) と
  JAK 阻害剤などの新規治療を加えている。

  構成:
  - 1．ガイドライン改定の背景／2．ガイドラインの位置づけ／3．免責事項・利益相反／
    4．尋常性白斑の根拠（エビデンス）に基づく診療
  - 5．尋常性白斑の分類，疫学，病態（表1 分類・図1 メラノサイトの持続的損傷に関わる要因・
    図2 発症，進展，回復に関与する細胞と分子）
  - 6．尋常性白斑患者の皮膚癌罹患率（尋常性白斑パラドックス・コホート研究・紫外線療法は安全か・
    他臓器癌発症率・今後の治療方針と問題点）
  - 7．化学白斑（経緯・名称と定義・原因化学物質〈図3・表2〉・臨床症状・診断・予後・
    発症メカニズム〈図4 RD によるメラノサイト特異的な細胞障害〉・治療・生活指導）
  - 8．診療アルゴリズムと白斑・白皮症の病型分類（図5〜図7 診療アルゴリズム・
    図9 先天性白斑／白皮症の病型分類・図10 後天性白斑の病型分類）
  - 9．鑑別診断，診断，臨床症状の評価（表3 診断手順・表4 初診アセスメントチェックリスト・
    図8 VSAS・図11/図12 写真撮影法・図13 12 の身体評価領域と 6 段階の脱色素斑スケール・
    図14 VASI・図15 VDAS／VDIS・表5 VitiQoL）
  - 10．治療（本邦での治療の実態・治療法・併用療法〈総論〉）
  - 11．治療法（11.1〜11.16。CQ1〜CQ11 を含む）と 12．併用療法

  推奨度は **1（強い推奨）／2（弱い推奨）** と **エビデンスの確実性 A／B** を組み合わせた
  「1A」「2B」等の形で示され、病型 (非分節型〈顔面・頸部/それ以外〉・分節型) ごとに分かれるものもある。
  収録は 1 CQ = 1 ノード。CQ を持たない節 (11.12 JAK 阻害剤〜11.16 補助療法、12．併用療法) は
  節でまとめている。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '尋常性白斑診療ガイドライン第\s*2\s*版\s*2025(\s*日本皮膚科学会ガイドライン)?'
  - '尋常性白斑診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
