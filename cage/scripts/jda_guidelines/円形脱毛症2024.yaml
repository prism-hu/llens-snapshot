id: 円形脱毛症2024
title: 円形脱毛症診療ガイドライン2024
guideline: 円形脱毛症診療ガイドライン2024
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『円形脱毛症診療ガイドライン 2024』(日本皮膚科学会ガイドライン)。
  円形脱毛症診療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌に掲載された。
  2017 年版の改訂版で、経口 JAK 阻害薬の登場を反映している。

  構成:
  - ガイドラインについて (1．背景と目的／2．診療ガイドラインの作成手順／3．エビデンスの収集／
    4．エビデンスレベルと推奨度の決定基準〈表1 CQ 一覧と推奨度〉／5．CQ 選択の考え方／
    6．資金提供者・利益相反／7．公開方法／8．ガイドラインの改訂／9．免責事項)
  - 疾患の理解 (1．病態／2．頻度／3．遺伝的要因／4．合併症／5．AA と Health-related QoL／
    6．経済的負荷／7．予後)
  - 診断 (1．臨床症状〈図1 AA の主な臨床型〉／2．鑑別診断／3．AA の分類・重症度〈SALT スコア〉／
    4．ヘアプルテスト／5．トリコスコピー〈図2〉／6．病理組織学的所見〈図3〉／
    図4 AA cube に基づく AA 治療の考え方)
  - CQ1〜CQ25 (ステロイド局注／外用／内服／パルス・局所免疫療法・経口 JAK 阻害薬・
    抗ヒスタミン薬・セファランチン・カルプロニウム・ミノキシジル外用／内服・冷却療法・
    紫外線療法・光線療法・シクロスポリン・MTX・生物学的製剤・漢方薬・抗うつ薬／抗不安薬・
    免疫抑制剤外用・プロスタグランジン製剤・催眠／心理療法・PRP 療法・かつら)

  エビデンスレベルは A（高い）／B（低い）／C（とても低い）、推奨度の強さは
  **1 強い推奨／2 弱い推奨／3 推奨しない** の 3 段階。収録は 1 CQ = 1 ノード。
# 原本の本文に康熙部首の字形が混ざる (`⽅` `⼿` の 2 箇所)。引用に出るので正規化する
normalize_radicals: true
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '円形脱毛症診療ガイドライン\s*2024(\s*日本皮膚科学会ガイドライン)?'
  - '円形脱毛症診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。表1 の推奨度 (1/2/3)・SALT スコア・有効率を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
pdfs:
  - file: 円形脱毛症診療ガイドライン2024.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/AAGL2024.pdf
    label: 円形脱毛症診療ガイドライン2024
    mode: raw
nodes:
  - path: 01_ガイドラインについて
    title: ガイドラインについて（1．背景と目的／2．診療ガイドラインの作成手順／3．エビデンスの収集／4．エビデンスレベルと推奨度の決定基準〈表1 CQ 一覧と推奨度〉／5．CQ 選択の考え方／6．資金提供者・利益相反／7．公開方法／8．ガイドラインの改訂／9．免責事項）
    body:
