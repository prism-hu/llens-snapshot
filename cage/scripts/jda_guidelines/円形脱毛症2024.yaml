        allow_overlap: true
  - path: 03_診断と治療の考え方
    title: 診断（1．臨床症状〈図1 AA の主な臨床型〉／2．鑑別診断／3．AA の分類・重症度〈SALT スコア〉／4．ヘアプルテスト／5．トリコスコピー〈図2〉／6．病理組織学的所見〈図3〉）と治療アルゴリズムの考え方
