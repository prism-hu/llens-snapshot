    title: クリニカルクエスチョン（CQ1〜CQ25）
    body_text: |
      円形脱毛症（AA）の治療についての 25 件のクリニカルクエスチョン。
      各ノードは推奨文・推奨度・解説・文献を持つ。推奨度は 1 強い推奨／2 弱い推奨／3 推奨しない。
      図4「AA cube に基づく AA 治療の考え方」は原本の組版上 CQ1 のページに流れ込んでいる。
