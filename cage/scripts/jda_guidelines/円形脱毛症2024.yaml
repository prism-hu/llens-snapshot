  - {pdf: 円形脱毛症診療ガイドライン2024.pdf, pages: [10, 12], why: 図1 AA の主な臨床型・図2 AA の急性期で観察されるトリコスコピー所見・図3 AA の代表的な病理組織学的所見（臨床写真・ダーモスコピー像・病理像）}
  - {pdf: 円形脱毛症診療ガイドライン2024.pdf, pages: [14, 14], why: 図4 AA cube に基づく AA 治療の考え方（年齢・重症度・罹病期間の 3 軸で治療を並べた立体図）}
notes: |
  ## 版の扱い
  - 2024 年版。2017 年版の改訂版だが、旧版の PDF は素材に含まれないので落とした版は無い。
  - 同じ脱毛症でも『男性型および女性型脱毛症診療ガイドライン（2017年版）』(別 id
    `男性型および女性型脱毛症2017`) は別疾患・別文書なので別 id にしてある。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - **本文に康熙部首の字形が 2 箇所ある** (「医師の裁量権を規制し治療⽅針を…」の `⽅` U+2F8D、
    「保険診療の⼿引き書ではない」の `⼿` U+2F3F)。引用に出ると別字になるので
    `normalize_radicals: true` を付けた。担当 23 本のうち康熙部首があるのはこの 1 本だけ。

  ## strip / strip_edge
  - 柱 (書名・策定委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。**表1 の推奨度は裸の 1 桁数字 (1/2/3)** で、
    `strip` に `\d{1,3}` を置くとこれが消えるので端だけに効かせている。
    SALT スコアや有効率も同じ理由。

  ## 落としたページ
  - 落としたページは無い。全 36 ページがいずれかのノードに載る。

  ## ページ内分割
  - 大区分の境界 (1．病態／1．臨床症状) と CQ1〜CQ25 の境界を `from` / `until` で割った。
  - **p.3 の表1 は CQ の一覧だが、行の書式が本体の見出しと違う** (一覧は
    `CQ1 ステロイド局所注射療法は有用か 1` と末尾に推奨度が付き、本体は `CQ1 ステロイド局所注射療法は有用か`)。
    どのみち一覧は p.3、本体は p.14 以降なので、`^CQ<n>\s` を境界にしても取り違えは起きない。
  - `^CQ1\s` は `CQ10`〜`CQ19` には当たらない (数字の直後が空白でないため)。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
