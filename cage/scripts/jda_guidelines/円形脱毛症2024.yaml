        body:
          - pdf: 円形脱毛症診療ガイドライン2024.pdf
            pages: [14, 15]
            from: '^(#+\s*)?CQ1[\s‌]'
            until: '^(#+\s*)?CQ2[\s‌]'
            allow_overlap: true
