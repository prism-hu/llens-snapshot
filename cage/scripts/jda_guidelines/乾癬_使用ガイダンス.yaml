notes: |
  ## 束ね方
  - 学会の「一般公開ガイドライン」では 2 本が別項目で掲載されているが、**親となる乾癬本体の
    診療ガイドラインがこの素材 135 本の中に無い**ため、どちらにも従属先が無い。薬剤系統ごとに
    id を 2 つ立てるより、同じ委員会 (乾癬分子標的薬安全性検討委員会) が同じ節立てで出している
    運用文書として 1 id にまとめ、子セクション `01_生物学的製剤2022` / `02_JAK阻害内服薬` にした
    (割り当て表の指示どおり)。
  - 膿疱性乾癬 (汎発型) の生物学的製剤については、本ガイダンスが
    『膿疱性乾癬（汎発型）診療ガイドライン』を参照するよう指示している (別 id `膿疱性乾癬2014`)。
  - 乾癬性関節炎については別 id `乾癬性関節炎2019` がある。

  ## 版の扱い
  - 生物学的製剤の使用ガイダンスは版を重ねており、本文中でも 2019 年版が参照されているが、
    素材にあるのは 2022 年版だけなので落とした旧版は無い。
  - JAK 阻害内服薬のガイダンスは年版を名乗らない (日皮会誌 133(1), 2023)。

  ## 抽出モード
  - どちらも日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` (内容ストリーム順) だけが段ごとに上から下へ出るので両方 `mode: raw`。
  - 康熙部首の混入は両 PDF とも 0 件なので `normalize_radicals` は付けていない。

  ## ノードの切り方
  - **表 1 (生物学的製剤) は p.4-6 の 3 ページを丸ごと占め**、本文は p.3 → p.7 と飛ぶ。
    そのため `04_対象患者についての重要な注意事項` の本文が p.3 と p.7 の 2 区間に分かれ、
    表 1 は独立ノード `05_表1_乾癬で使用可能な生物学的製剤` にしてある。
  - JAK 側も同じ形で、**表 2 (p.6) が 1 ページを占めて本文が p.5 → p.7 と飛ぶ**。
    表 2 は投与前検査の節に属するので `03_効能効果・用法用量・治療禁忌・投与前後の検査` の
    2 番目の区間として拾い、`04_注意すべき事象とその対策` を p.5 の途中 + p.7-10 の 2 区間にした。

  ## strip
  - raw モードでは柱 (書名・委員会名) とノンブル入りフッタが**ページ末尾**に出る。
    フッタは `●` を必ず含むので、文献リスト中の「日皮会誌，2022; 132: …」とは紛れない。
  - `\d{1,3}` の裸のノンブルは無いので `strip_edge` は置いていない (表 1・表 2 の数値を守るため)。

  ## 落としたページ
