id: 乾癬_使用ガイダンス
title: 乾癬における生物学的製剤・JAK阻害内服薬の使用ガイダンス
guideline: 乾癬における生物学的製剤・JAK阻害内服薬の使用ガイダンス
publisher: 日本皮膚科学会（日本皮膚科学会乾癬分子標的薬安全性検討委員会）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  日本皮膚科学会乾癬分子標的薬安全性検討委員会が出している、乾癬の分子標的薬 2 系統の使用ガイダンスを
  1 つにまとめたもの。学会の「一般公開ガイドライン」では 2 本が別項目で掲載されているが、
  親となる乾癬本体の診療ガイドラインがこの素材の束に無いため、薬剤系統ごとの子セクションとして束ねてある。

  - `01_生物学的製剤2022` … 『乾癬における生物学的製剤の使用ガイダンス（2022 年版）』
    (日皮会誌 132 巻 10 号 2271-2296 頁、2022 年／令和 4 年)。インフリキシマブ・アダリムマブ・
    ウステキヌマブ・セクキヌマブ・イキセキズマブ・ブロダルマブ・グセルクマブ・リサンキズマブ・
    セルトリズマブ ペゴル・チルドラキズマブ・ビメキズマブと、インフリキシマブ BS／アダリムマブ BS を扱う。
  - `02_JAK阻害内服薬` … 『乾癬におけるヤヌスキナーゼ（JAK）阻害内服薬（JAK1 阻害薬と TYK2 阻害薬）の
    使用ガイダンス』(日皮会誌 133 巻 1 号 1-12 頁、2023 年／令和 5 年)。ウパダシチニブ（JAK1 阻害薬）と
    デュークラバシチニブ（TYK2 阻害薬）を扱う。

  いずれも CQ 形式ではなく、使用指針の目的／医師および医療施設の条件／対象患者／効能・効果と用法・用量／
  治療禁忌／副作用が発現しやすい患者への注意事項と対策／併用療法、という節立ての運用文書。
  使用は日本皮膚科学会が承認した「乾癬分子標的薬使用承認施設」に限定される旨が両者に書かれている。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '乾癬における生物学的製剤の使用ガイダンス（2022\s*年版）(\s*日本皮膚科学会ガイダンス)?'
  - '乾癬におけるヤヌスキナーゼ（JAK）阻害内服薬（JAK1\s*阻害薬と\s*TYK2\s*阻害薬）の使用ガイダンス(\s*日本皮膚科学会ガイダンス)?'
  - '日本皮膚科学会乾癬分子標的薬安全性検討委員会'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，2022; 132: …」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
