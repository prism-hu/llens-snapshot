notes: |
  ## 版の扱い
  - 2018 年に日皮会誌 128(10) に掲載された版。年を持たない書名なので id にも年を付けていない。
    改訂版は公開されていない。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・「皮膚粘膜病変診療コンセンサス会議メンバー」) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。エビデンスレベル (1b・2・5 等) と同意度 (4.67 等) を
    守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 15 ページがいずれかのノードに載る。

  ## ページ内分割
  - 第 II 章の開始と CQ1〜CQ24 の境界をすべて `from` / `until` で割った。
    第 II 章の見出しと「口腔内アフタ性潰瘍（CQ1〜CQ6）：図 7」の案内行は CQ1 のノードの冒頭に入る。
  - **図7〜図11 の治療アルゴリズムは原本では第 I 章のページ (p.5〜7) に組まれている**ので、
    p.5・p.6 のものは第 I 章のノードに、p.7 のもの (図11) は CQ1 のノードに載る。
    これは学会誌組版で図が本文と別に流し込まれるためで、原文の並びは変えていない。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
