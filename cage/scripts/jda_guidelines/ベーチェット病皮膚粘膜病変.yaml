id: ベーチェット病皮膚粘膜病変
title: ベーチェット病の皮膚粘膜病変診療ガイドライン
guideline: ベーチェット病の皮膚粘膜病変診療ガイドライン
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『ベーチェット病の皮膚粘膜病変診療ガイドライン』(日本皮膚科学会ガイドライン)。
  皮膚粘膜病変診療コンセンサス会議メンバーが作成し、日本皮膚科学会雑誌 128 巻 10 号
  2087-2101 頁 (2018 年／平成 30 年) に掲載された。

  構成 (全 2 章):
  - 第 I 章 (I．はじめに／II．皮膚粘膜病変の概要 — 1．口腔内アフタ性潰瘍〈図1〉、
    2．外陰部潰瘍〈図2〉、3．皮膚症状〈結節性紅斑・毛包炎（痤瘡）様皮疹と針反応・
    皮下の血栓性静脈炎・その他、図3〜図6〉、および図7〜図11 の治療アルゴリズム)
  - 第 II 章 皮膚粘膜病変 CQ (CQ1〜CQ24。口腔内アフタ性潰瘍 CQ1〜6、外陰部潰瘍 CQ7〜10、
    結節性紅斑 CQ11〜17、毛包炎様皮疹 CQ18〜20、皮下の血栓性静脈炎 CQ21〜24)

  各 CQ は推奨文・エビデンスレベル (1a〜6)・推奨の強さ (A/B/C1/C2/D)・**同意度** (5 点満点)・
  解説・文献を持つ。収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - 'ベーチェット病の皮膚粘膜病変診療ガイドライン(\s*日本皮膚科学会ガイドライン)?'
  - '皮膚粘膜病変診療コンセンサス会議メンバー'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。エビデンスレベル・同意度の数値を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
