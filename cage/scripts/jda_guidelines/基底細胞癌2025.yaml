        title: '[CQ4] 手術療法や放射線療法不能もしくは転移性の基底細胞癌に対して，殺細胞性抗がん剤と比べて免疫チェックポイント阻害薬は勧められるか？【推奨の強さ 2（実施することを提案）／エビデンスの強さ C（弱）】'
        body:
