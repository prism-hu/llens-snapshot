      - path: CQ3
        title: '[CQ3] 手術療法が困難な主として表在型基底細胞癌に対し，他の局所療法（5-FU 軟膏外用療法，凍結療法）と比べ imiquimod 外用療法は勧められるか？【推奨の強さ 2（実施することを提案）／エビデンスの強さ C（弱）】'
        body:
          - pdf: 基底細胞癌診療ガイドライン2025.pdf
