  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [4, 5], why: 別表 1 委員一覧 + 表 1 エビデンスレベルの分類 (表)}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [14, 15], why: 再発リスク分類・TNM 分類・病期分類の表 (`0 期 Tis NO MO` のように行が裸の数値記号で始まる)}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [17, 21], why: 外科的切除・Mohs 手術・切除マージンの成績一覧表 (横長・多列)}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [26, 27], why: imiquimod・patidegib の臨床試験一覧表 (`1 日 1 回週 7 日 87.9%` のような裸の数値行が並ぶ)}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [29, 30], why: 経過観察スケジュールの表 (各国ガイドラインの比較)}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [33, 34], why: CQ1 の文献検索式 (`#` 付き検索式と件数の表)}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [35, 36], why: CQ2 の文献検索式}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [38, 39], why: CQ3 の文献検索式}
  - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [42, 44], why: CQ4 の文献検索式}
notes: |
  - **原本は日本皮膚科学会雑誌の 2 段組**。既定モードは左段と右段を 1 行ずつ交互に出して
    本文が読めなくなるため、全ページ `mode: raw` (内容ストリーム順) にした。
    `-layout` では 2 段が 1 行に並ぶだけで読み順は直らない。
  - 柱とノンブル (`日皮会誌：135（8），1829-1880，2025（令和 7）● 1829` 形式) を
    `strip_edge` (lines: 3) で落とした。切除マージンの mm・Gy・％・再発率など**裸の数値だけの
    行が本文中に多い**ので、`\d{1,3}` は `strip` に置かず、日皮会誌の行を丸ごと edge で落とす形にした。
  - 節見出しは `1 本ガイドラインの目的` のように**番号と本文の間が半角スペース**
    (章によっては折り返しで空白が増える) なので、`from`/`until` は `^\d+\s+見出し` の形で書いた。
  - CQ3・CQ4 の見出しは折り返していて 1 行に収まらないため、`^CQ3` / `^CQ4` だけで
    アンカーした (同じページの手前には文献検索式の `#` 行しか無く、先頭一致する行は無い)。
  - 全 52 ページがどれかのノードに載っている。表紙・目次は `00_表紙・目次・作成委員会` に
    入れた (作成委員会の構成と `日皮会誌：135（8），1829-1880，2025` の書誌がここにしか無いため)。
  - **皮膚がん診療ガイドライン第 4 版 (2025) のうち、基底細胞癌だけは学会の
    「推奨作成関連資料 DL」zip が公開されていない** (カタログの note)。よって他の
    皮膚がん 2025 の id と違い `95_推奨決定資料` の子セクションが無い。
  - 旧版 (皮膚悪性腫瘍診療ガイドライン第 3 版 2021 の基底細胞癌) はカタログに無く、
    本 PDF が現行版。
