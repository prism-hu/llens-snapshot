    body:
      - {pdf: 基底細胞癌診療ガイドライン2025.pdf, pages: [1, 3], until: '^(#+\s*)?第 1 章'}
  - path: 01_ガイドラインについて
    title: 第 1 章 基底細胞癌診療ガイドラインについて
    children:
      - path: 01_目的・対象・改訂の特徴
        title: '[第 1 章 1〜5] 本ガイドラインの目的／改訂の目的／適応が想定される対象者／使用上の注意事項／改訂ガイドラインの特徴 (別表 1 委員一覧)'
        body:
          - pdf: 基底細胞癌診療ガイドライン2025.pdf
