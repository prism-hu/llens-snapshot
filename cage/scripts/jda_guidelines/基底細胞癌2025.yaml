  - path: 03_クリニカルクエスチョンと推奨
    title: 第 3 章 基底細胞癌診療ガイドライン クリニカルクエスチョン（CQ）と推奨
    children:
      - path: CQ1
        title: '[CQ1] 有色素性基底細胞癌において縮小マージン切除を行うことは勧められるか？【推奨の強さ 2（実施することを提案）／エビデンスの強さ C（弱）】'
        body:
          - pdf: 基底細胞癌診療ガイドライン2025.pdf
            pages: [30, 34]
            from: '^(#+\s*)?第 3 章 基底細胞癌診療ガイドライン'
            until: '^(#+\s*)?CQ2 切除断端陽性の基底細胞癌'
            allow_overlap: true
      - path: CQ2
        title: '[CQ2] 切除断端陽性の基底細胞癌に対して，術後放射線療法は追加切除に比べて勧められるか？【推奨の強さ 3（実施しないことを提案）／エビデンスの強さ D（とても弱い）】'
        body:
          - pdf: 基底細胞癌診療ガイドライン2025.pdf
