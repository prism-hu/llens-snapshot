id: 基底細胞癌2025
title: 基底細胞癌診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: 基底細胞癌診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 日本皮膚科学会・日本皮膚悪性腫瘍学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『基底細胞癌診療ガイドライン 2025』(皮膚がん診療ガイドライン第 4 版 / 公益社団法人
  日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会 皮膚がん診療ガイドライン策定委員会
  (基底細胞癌診療ガイドライングループ) / 日本皮膚科学会雑誌 135(8), 1829-1880, 2025 年)。

  基底細胞癌 (basal cell carcinoma) は本邦で最も頻度の高い皮膚悪性腫瘍で、欧米と異なり
  有色素性の病型が多い。本ガイドラインは Minds 準拠で作成され、CQ4 件 (推奨の強さ 1〜4 /
  エビデンスの強さ A〜D) を持つ。

  構成は 3 章 + 文献:
  - 第 1 章 基底細胞癌診療ガイドラインについて (目的・対象・作成方法・COI)
  - 第 2 章 基底細胞癌総論 (定義・疫学・病因 / 診断 / 治療方針 / 手術療法 / 放射線療法 /
    非手術・非放射線局所療法 / 全身薬物療法 / 経過観察)
  - 第 3 章 クリニカルクエスチョン (CQ) と推奨 (CQ1〜CQ4)

  第 3 章は 1 CQ = 1 ノード (推奨・解説・文献検索式まで)、第 1・2 章は節ごとに 1 ノード。
  **皮膚がん 2025 の 7 ガイドラインのうち、基底細胞癌だけは「推奨作成関連資料」zip が
  公開されていない**ので、この id には推奨決定資料の子セクションが無い。
strip_edge:
  # 日皮会誌の柱とノンブル。raw モードではページ末尾の 2 行に来る
  # (`\d{1,3}` を strip に置くと切除マージンの mm・Gy・％ の数値行まで消えるので edge 側)
  lines: 3
  patterns:
  - '\d{1,4} ● 日皮会誌：135（8）\s*，1829-1880，2025（令和 7）'
  - '日皮会誌：135（8）\s*，1829-1880，2025（令和 7）● \d{1,4}'
  - '皮膚がん診療ガイドライン策定委員会（基底細胞癌診療ガイドライングループ）'
  - '皮膚がん診療ガイドライン第 4 版 基底細胞癌診療ガイドライン 2025( 日本皮膚科学会ガイドライン)?'
pdfs:
  - file: 基底細胞癌診療ガイドライン2025.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/basal_cell_carcinoma_2025.pdf
    label: 本体 (全 52 ページ)
    # 学会誌組版の 2 段組。既定モードは左右の段を 1 行ずつ交互に出すので raw を使う
    mode: raw
nodes:
  - path: 00_表紙・目次・作成委員会
