notes: |
  - 本体・簡略版は学会誌 (日皮会誌) の 2 段組。既定モードでは左右の段が 1 行ずつ交互に
    出力されるため `mode: raw` にした。別表 1〜3 は横組みの表が主体なので `mode: layout`
    (既定や raw では列の対応が完全に失われる)。
  - `strip` / `strip_edge` は manifest 直下には置かず PDF ごとに書いた。ノンブル用の
    `\d{1,3}` を全体に効かせると、別表 2・3 の表セルの裸の数字 (検索件数・例数) まで
    端の行で消えてしまうため。本体は柱とノンブルが「日皮会誌：136（4）…● 375」の
    1 行に同居するので数字だけのパターンは要らず、簡略版だけが裸のノンブルを持つ。
  - 別表 1〜3 は URL の basename が WordPress の 32 桁ハッシュ
    (537c16638a3e17b2539e5a284f306b83.pdf 等) で配信名として意味をなさないため、
    `url:` を省いて `slug:` にカタログの命名 (jda_urticaria_2026_table1〜3.pdf) を
    使った。原本 URL は以下のとおり:
    - 別表1 https://www.dermatol.or.jp/dermatol/wp-content/uploads/2013/08/537c16638a3e17b2539e5a284f306b83.pdf
