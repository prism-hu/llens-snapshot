id: 蕁麻疹2026
title: 蕁麻疹診療ガイドライン2026（第4版）
guideline: 蕁麻疹診療ガイドライン2026（第4版）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
normalize_radicals: true
description: |
  『蕁麻疹診療ガイドライン 2026（第 4 版）』(蕁麻疹診療ガイドライン策定委員会。
  日皮会誌 136(4), 375-493, 2026。原本 1 ページ目に「2026 年 7 月 21 日更新版」の表記)。
  2005 年「蕁麻疹・血管性浮腫の治療ガイドライン」→ 2011 年「蕁麻疹診療ガイドライン」
  → 2018 年版 と続く系列の第 4 版で、国際ガイドライン (EAACI/GA2LEN/EuroGuiDerm/
  APAAAACI 2021・2025 改定) との整合をとりながら本邦の現状を踏まえて改定された。

  構成:
  - 第 I 章 蕁麻疹診療の概要 (定義・症状と疫学・病態・診断と分類・検査・評価・治療・
    予後・診療手順)
  - 第 II 章 蕁麻疹診療の行動指針 (委員投票つきの行動指針 1.1〜4.x)
  - 第 III 章 蕁麻疹の EBMs
    - 第 1 部 臨床設問 (CQ1〜CQ34。推奨度 1〜5 とエビデンスレベル A〜D)
    - 第 2 部 構造化抄録 (リスト一覧。中身は別表 2)
    - 第 3 部 病型別の治療のエビデンス (A〜L の病型 × 11 治療 = 132 項目)

  学会ページには本体のほかに別表 1〜3 と簡略版が掲載されている。いずれも本体に
  従属する掲載物なので同じ manifest の子セクションに収めた:
  - `90_簡略版` … 本体の要点を 26 ページにまとめたもの
  - `91_別表1` … シュニッツラー症候群 診断基準 (第 I 章 5.4 蕁麻疹関連疾患から参照)
  - `92_別表2` … 構造化抄録 (第 III 章 第 2 部の本体。40 項目)
  - `93_別表3` … 第 III 章 第 3 部の各項目で用いた検索式 (91 項目)

  収録は第 I・II 章が 1 節 = 1 ノード、第 III 章 第 1 部が 1 CQ = 1 ノード、
  第 3 部が 1 病型 (A〜L) = 1 ノード、別表 2 が 1 構造化抄録 = 1 ノード、
  別表 3 が 1 検索式 = 1 ノード。
# 原本の誤記への注記 (2026-10-06、<redacted> 決定: 本文は原本どおり残し注記を足す)。
# このページは overlay が無くテキスト層が紙面どおりなので、patches で該当行の直後に
# `（注記：…）` の 1 段落を差す (find をそのまま残して後ろに足すだけ。原本の字面は変えない)。
# `note:` は書かない — 書くと `> [修正履歴反映]` の行が差さり、修正履歴が出たように読めるため。
patches:
  - pdf: "蕁麻疹診療ガイドライン2026（第4版）簡略版.pdf"
    page: 22
    find: "84.2%（16/18） 10.5%（2/18）\n総投票数 18 名（棄権 1 名）"
    replace: "84.2%（16/18） 10.5%（2/18）\n総投票数 18 名（棄権 1 名）\n（注記：2.8 の 1 回目の「84.2%（16/18）」「10.5%（2/18）」は原本の印字のまま転記した。分子・分母どおりなら 88.9%・11.1% で、印字の % は分母を 19（投票 18 名＋棄権 1 名）とした値と一致する。どちらが意図された値かは原本からは決められない。）"
