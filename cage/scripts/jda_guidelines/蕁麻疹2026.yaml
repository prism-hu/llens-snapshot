    (ほかの 4 本には無い)。本文の引用に出るので正規化する。strip / from / until の
    パターンは正規化後の字形で書いてある。
  - 5 本すべて全ページがいずれかのノードに載る (落としたページは無い)。
  - 1 ページに 2 つ以上の CQ が始まる箇所 (p.48 の CQ6/CQ7、p.50 の CQ8/CQ9、
    p.55 の CQ13/CQ14、p.56 の CQ15/CQ16、p.64 の CQ23/CQ24、p.67 の CQ26/CQ27、
