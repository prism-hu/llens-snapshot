id: 皮膚瘙痒症2020
title: 皮膚瘙痒症診療ガイドライン2020
guideline: 皮膚瘙痒症診療ガイドライン2020
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮膚瘙痒症診療ガイドライン 2020』(日本皮膚科学会ガイドライン)。佐藤貴浩ほかが作成し、
  日本皮膚科学会雑誌 130 巻 (2020 年／令和 2 年) に掲載された。

  皮膚瘙痒症 (皮疹が無いのに痒みを生じる疾患。汎発性／限局性) の診療ガイドライン。

  構成:
  - 1．ガイドラインの背景，位置づけ／2．定義と分類／3．疫学
  - 4．病態，発症機序／5．臨床症状／6．検査／7．皮膚瘙痒症治療アルゴリズム（別表）
    (表1 汎発性皮膚瘙痒症を惹起する内臓疾患・表2 かゆみを誘発する薬剤)
  - CQ1〜CQ14 (保湿剤・抗ヒスタミン薬・ステロイド外用・鎮痒性外用薬・紫外線療法・免疫抑制薬・
    カプサイシン軟膏・抗不安薬／抗うつ薬・ナルフラフィン塩酸塩・レセルピン・プレガバリン・
    ガバペンチン・漢方薬・ノイロトロピン®／表3 スキンケアの例・表4 主な抗ヒスタミン薬の
    鎮静作用による分類・表5 代表的な鎮痒性外用薬／保湿剤の例・表6 主な漢方薬)
  - 付表1 エビデンスのレベルと推奨度の決定基準（皮膚悪性腫瘍グループ）

  推奨度は A / B / C1 / C2 / D、エビデンスレベルは I〜VI。収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '皮膚瘙痒症診療ガイドライン\s*2020(\s*日本皮膚科学会ガイドライン)?'
  - '佐藤貴浩 ほか'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。有病率・有効率などの裸の数値を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
# 原本の誤記への注記 (2026-10-06、<redacted> 決定: 本文は原本どおり残し注記を足す)。
# このページは overlay が無くテキスト層が紙面どおりなので、patches で該当行の直後に
# `（注記：…）` の 1 段落を差す (find をそのまま残して後ろに足すだけ。原本の字面は変えない)。
# `note:` は書かない — 書くと `> [修正履歴反映]` の行が差さり、修正履歴が出たように読めるため。
patches:
  - pdf: "皮膚瘙痒症診療ガイドライン2020.pdf"
    page: 3
    find: "表 1 汎発性皮膚瘙痒症を惹起する内臓疾患"
    replace: "表 1 汎発性皮膚瘙痒症を惹起する内臓疾患\n（注記：下表の「真性赤血球増多少」は原本の印字のまま転記した。真性赤血球増多症の誤記と思われる。）"
  - pdf: "皮膚瘙痒症診療ガイドライン2020.pdf"
    page: 3
    find: "表 2 かゆみを誘発する薬剤"
    replace: "表 2 かゆみを誘発する薬剤\n（注記：下表の薬剤名には原本の誤植と思われるものがあり、原本の印字のまま転記した: フェノブロフェン（フェノプロフェン）、ドプタミン（ドブタミン）、ジキタリス製剤（ジギタリス製剤）、プロセミド（フロセミド）。括弧内は一般的な表記で、誤植と思われるものの推定である。）"
pdfs:
