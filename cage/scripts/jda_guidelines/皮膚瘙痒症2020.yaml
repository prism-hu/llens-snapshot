  - {pdf: 皮膚瘙痒症診療ガイドライン2020.pdf, pages: [18, 18], why: 付表1 エビデンスのレベルと推奨度の決定基準（2 段の対応表）}
notes: |
  ## 版の扱い
  - 2020 年版。改訂版は公開されていない。姉妹ガイドラインの『痒疹診療ガイドライン2020』
    (別 id `痒疹2020`) と同じ作成グループ・同じ版面で、表 (スキンケア・抗ヒスタミン薬の分類・
    鎮痒性外用薬／保湿剤・漢方薬) の内容が一部重なるが、別の文書なので別 id にしてある。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・「佐藤貴浩 ほか」) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。有病率・有効率・ステロイド外用薬の濃度など
    裸の数値が本文に多いので `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 18 ページがいずれかのノードに載る。

  ## ページ内分割
  - 節境界 (4．病態，発症機序)、CQ1〜CQ14 の境界、付表1 の開始を `from` / `until` で割った。
  - 学会誌組版のため表は本文の途中に組まれ、raw では節見出しより後ろに流れる
    (表3〜表6 は CQ2・CQ3 のノードに載る)。どのノードにどの表が載るかは vlm_candidates に書いた。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。

  ## 原本の誤記への注記 (2026-10-06)
  - 原本の誤記・原本内の食い違いのうち臨床的に読み違えを招くものは、本文を原本の印字どおり残したまま、
    該当箇所の直後 (表は直前) に `（注記：…）` の段落を足した。この段落は収録時に足したもので原本には無い。
    正しい値は断定せず、根拠 (同じ文書の別ページ・表の構造・原典の分類) を添えて「と思われる」に留めた。
  - p.3 表1・表2 の病名・薬剤名の誤植 (patches)、p.5 治療アルゴリズムの「プレカバリン」、p.7 表6 の「牛舎腎気丸」(p.7 は 2 ノードに割れていて patches が当たらないので、テキスト層そのまま + 注記の overlay)
