notes: |
  ## 版と従属文書の扱い
  - 本体は 2017 年版 (日皮会誌 127(7): 1483-1521)。全面改訂版は公開されていないので、
    学会が後から出した「補遺版」(5p、DPP-4 阻害薬関連水疱性類天疱瘡) を同じ manifest の
    子セクション `90_補遺版` に収めた。CQ の番号体系が独立しているので統合していない。

  ## 配信名 (slug)
  - 2 本とも URL の basename が `bullous%20pemphigoid.pdf` のように percent-encode を含み
    ASCII の配信名にならないので `url:` を書かず、カタログの slug
    (`bullous_pemphigoid.pdf` / `bullous_pemphigoid_ADD2023.pdf`) を使った。
  - 補遺版の cache 上のファイル名には**ゼロ幅接合子 (U+200C)** が入っている。
    `pdfs[].file` は cache の実ファイル名をそのまま写してある。

  ## 抽出モード
  - 2 本とも日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 2 本とも 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・作成委員会名) と版面フッタ (「1520 ● 日皮会誌：127（7）1483-1521，2017（平成 29）」)
    を `strip` に置いた。フッタは `●` を必ず含むので文献中の「日皮会誌」引用とは紛れない。
  - 裸のノンブルは `strip_edge` (lines: 3)。BPDAI／MMPDAI の点数区分 (≦14 点・15〜34 点 等) や
    治療一覧の投与量を守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。本体 39 ページ・補遺版 5 ページのすべてがいずれかのノードに載る。

  ## ページ内分割
  - 章境界 (概要の 3 疾患／II 診断基準／III 治療指針／治療指針の 3 疾患／CQ 一覧／
    エビデンスレベルと推奨度の決定基準) と 39 件の CQ 境界をすべて `from` / `until` で割った。
  - 治療指針の疾患境界は原本で「粘膜類天疱瘡」「後天性表皮水疱症」の 1 行見出しなので、
    `^(#+\s*)?粘膜類天疱瘡$` のように行全体で受けている。全 39 ページを走査して、
    この 3 語だけの行は当該見出し以外に無いことを確認した。
  - **p.21〜22 には「CQ 一覧」があり、CQ 本体と同じ文言の行が並ぶ**。BP-CQ1 の一覧行は p.21、
    本体は p.22 にあり、各 CQ の `from` は本体側のページだけを見るので取り違えは起きない。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
