id: 類天疱瘡
title: 類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン
guideline: 類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン』(日本皮膚科学会ガイドライン)。
  類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン作成委員会 (氏家英之ほか 16 名) が作成し、
  日本皮膚科学会雑誌 127 巻 7 号 1483-1521 頁 (2017 年／平成 29 年) に掲載された。
  厚生労働省難治性疾患等克服研究事業「稀少難治性皮膚疾患に関する調査研究」の支援を受けている。

  対象は**水疱性類天疱瘡（BP）・粘膜類天疱瘡（MMP）・後天性表皮水疱症（EBA）**の 3 疾患。
  構成:
  - I 概要 (3 疾患それぞれの定義・特徴／疫学／病態生理／臨床症状・病理所見・検査所見／治療／予後)
  - II 類天疱瘡（後天性表皮水疱症を含む）の診断基準と重症度判定基準 (表1 診断基準・表2 BPDAI に基づく重症度判定基準)
  - III 治療指針 (3 疾患それぞれの「治療における心構え」「治療方針」「病勢評価」「再燃時」。
    図1〜図3 治療アルゴリズム・表3〜表7)
  - CQ 一覧と CQ 本体 (BP-CQ1〜14／MMP-CQ1〜13／EBA-CQ1〜12 の計 39 件)
  - エビデンスレベルと推奨度の決定基準 (皮膚悪性腫瘍診療ガイドラインの分類を採用。推奨度 A/B/C1/C2/D)

  収録は 1 CQ = 1 ノード (推奨度 + 解説 + 文献)。CQ を持たない章は原本の節で 1 ノードにしてある。

  これに学会が後から公開した従属文書 1 本を子セクションとして収める:
  - `90_補遺版` … 『類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン 補遺版』
    (日本皮膚科学会類天疱瘡診療ガイドライン策定委員会、5 ページ)。DPP-4 阻害薬関連水疱性類天疱瘡の
    CQ1〜CQ5
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン(\s*補遺版)?(\s*日本皮膚科学会ガイドライン)?'
  - '類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン作成委員会'
  - '日本皮膚科学会類天疱瘡（後天性表皮水疱症を含む）診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。BPDAI／MMPDAI の点数・表の数値を守るため strip ではなく端だけに効かせる
  lines: 3
  patterns:
    - '\d{1,3}'
# 長音符が U+2015 (―) で抽出される (紙面はー)。grep で当たらなくなるので戻す
substitutions:
  - {find: 'アミロイド―シス', replace: 'アミロイドーシス', note: '長音符のグリフ違い'}
