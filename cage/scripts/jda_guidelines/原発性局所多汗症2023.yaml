id: 原発性局所多汗症2023
title: 原発性局所多汗症診療ガイドライン2023年改訂版
guideline: 原発性局所多汗症診療ガイドライン2023年改訂版
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『原発性局所多汗症診療ガイドライン 2023 年改訂版』(日本皮膚科学会ガイドライン)。
  原発性局所多汗症診療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌に掲載された。
  **2023 年 12 月に一部改訂**された版 (原本の柱にその旨が入っている)。

  構成:
  - 1．ガイドライン作成の背景／2．ガイドラインの位置づけ／3．免責条項／4．資金提供者，利益相反／
    5．エビデンスのレベルと推奨度
  - 6．概念／7．分類／8．病態（表1 続発性多汗症の原因）／9．疫学／
    10．多汗症と精神的障害度の関係／11．臨床症状と検査（HDSS・Minor 法など）
  - 12．治療法と予後 と アルゴリズム解説（図1〜図6：部位別〈腋窩・手掌・足底・頭部顔面〉の
    診療アルゴリズムと多汗症診療アルゴリズム）
  - 13．クリニカルクエスチョン CQ1〜CQ10 (塩化アルミニウム外用・外用抗コリン薬・
    水道水イオントフォレーシス・A 型ボツリヌス毒素局注・内服療法・交感神経遮断術・
    神経ブロック・機器治療・代償性発汗・精神〈心理〉療法)、および末尾の
    「CQ のまとめ 2023 原発性局所多汗症」(CQ1〜CQ10 の部位別推奨度一覧表)

  推奨度は A / B / C1 / C2 / D で、**多くの CQ は部位ごと (頭部・顔面／腋窩／手掌／足底) に
  別々の推奨度**を持つ。収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '原発性局所多汗症診療ガイドライン\s*2023\s*年改訂版.*'
  - '原発性局所多汗症診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。有病率・濃度・発症年齢などの裸の数値を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
