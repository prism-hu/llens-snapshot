notes: |
  ## 版の扱い
  - 2023 年改訂版で、さらに **2023 年 12 月に一部改訂**が入っている
    (配信 PDF 名 `takansho2023_231220.pdf` の日付と柱の表記が一致する)。旧版は素材に無い。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名 + 一部改訂の注記・策定委員会名) と版面フッタを `strip`。柱は改訂注記の有無で
    2 通りあるので `原発性局所多汗症診療ガイドライン\s*2023\s*年改訂版.*` の形で受けている。
  - 裸のノンブルは `strip_edge` (lines: 3)。有病率 (5.33％ 等)、塩化アルミニウムの濃度、
    ボツリヌス毒素の単位、発症年齢などの裸の数値を守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 32 ページがいずれかのノードに載る。

  ## ページ内分割
  - 節境界 (6．概念／8．病態／9．疫学／10．／11．／12．／13．) と CQ1〜CQ10 の境界を
    `from` / `until` で割った。「13．クリニカルクエスチョン」の見出しは CQ1 のノードの冒頭に入る。
  - **末尾の「CQ のまとめ 2023 原発性局所多汗症」(CQ1〜CQ10 の部位別推奨度一覧表) は
    CQ10 のノードに入っている**。原本ではこの表が p.31〜32 に CQ10 の本文と互い違いに
    流し込まれており、`from` / `until` では本文と表を分離できないため (表の途中に CQ10 の
    解説が挟まる)。表の内容は各 CQ の title の推奨度にも写してある。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
