    page: 20
    find: "表 3 CEAP 分類 2020"
    replace: "表 3 CEAP 分類 2020\n（注記：この表の臨床分類（C 分類）と病因分類（E 分類）は原本の印字のまま転記した。原本では「浮腫」に記号が付かず、C3 以降の記号と説明がずれて印字されている（原本の誤記）。出典の CEAP 分類 2020 年版（Lurie F, et al. J Vasc Surg Venous Lymphat Disord 2020）の定義では C3 = 浮腫、C4 = 慢性静脈疾患由来の皮膚皮下組織変化、C4a = 色素沈着・湿疹、C4b = 脂肪皮膚硬化症・白色萎縮、C4c = 静脈拡張冠（corona phlebectatica）、C5 = 治癒した潰瘍、C6 = 活動性潰瘍、C6r = 再発した活動性潰瘍 であり、病因分類は Es = 二次性、Ec = 先天性 である（下表の「E3s」「Es 先天性」も原本の誤記）。下表の C3〜C6r と E 分類の記号と説明の組は、この定義と食い違う。）"
  - pdf: "創傷・褥瘡・熱傷ガイドライン（2023）2 褥瘡診療ガイドライン（第3版）.pdf"
    page: 49
    find: "図 11 CQ2 カデキソマー・ヨウ素 有害事象発生率 フォレストプロット"
    replace: "図 11 CQ2 カデキソマー・ヨウ素 有害事象発生率 フォレストプロット\n（注記：図 11 の統合値 1.32［0.64, 2.71］は原本の印字のまま。同じページの本文と図 17（エビデンス総体、p.51）は同じアウトカムを 1.37（95％信頼区間 0.61〜3.06）としており、原本内で食い違う。どちらが正しいかは原本からは決められない。）"
