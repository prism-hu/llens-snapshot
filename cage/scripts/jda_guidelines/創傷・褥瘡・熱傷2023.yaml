  - path: 01_創傷一般
    title: 創傷・褥瘡・熱傷ガイドライン（2023）－1 創傷一般（第3版）
    body_text: |
      分冊 1「創傷一般（第 3 版）」(日皮会誌 133(11), 2519-2564, 2023)。疾患を限定せずに
      「傷を治す」ための基本方針を整理した総論で、CQ ではなく**質問 1〜7** の形を取る。
      浅い慢性期皮膚創傷と深い慢性期皮膚創傷を分けて記述する。
    children:
      - path: 01_概要
        title: '[創傷一般] 策定の背景・位置付け／第3版での主な変更点／資金提供者・利益相反・エビデンスの収集・ガイドライン改訂作業の実際'
        body:
          - {pdf: 創傷・褥瘡・熱傷ガイドライン（2023）1 創傷一般（第3版）.pdf, pages: [1, 2]}
      - path: 02_策定委員会・公表と改訂計画・用語の定義
        title: '[創傷一般] 創傷一般（第3版）策定委員会／公表前のレビュー・公表後の活用促進・改定計画・公表後のモニタリング／用語の定義'
        body:
          - pdf: 創傷・褥瘡・熱傷ガイドライン（2023）1 創傷一般（第3版）.pdf
