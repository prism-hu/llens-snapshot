  - path: 02_褥瘡
    title: 創傷・褥瘡・熱傷ガイドライン（2023）－2 褥瘡診療ガイドライン（第3版）
    body_text: |
      分冊 2「褥瘡診療ガイドライン（第 3 版）」(日皮会誌 133(12), 2735-2797, 2023)。
      GRADE approach に沿って策定され、CQ は 4 件 (外科的デブリードマン・外用薬・
      ドレッシング材・局所陰圧閉鎖療法)、いずれも**弱い推奨**。CQ 以外は第 2 章の診療概要と
      第 5 章の解説 1〜7 (小項目 1.1〜7.4) が本体。
    children:
      - path: 01_第1章_褥瘡診療ガイドラインについて
        title: '[褥瘡] 目次／第1章 褥瘡診療ガイドライン（第3版）について（策定の背景・位置付け・第3版での主な変更点・エビデンスの収集・システマティックレビューと推奨決定の方法・策定委員会・CQ のまとめ）'
        body:
          - pdf: 創傷・褥瘡・熱傷ガイドライン（2023）2 褥瘡診療ガイドライン（第3版）.pdf
            pages: [1, 5]
            until: '^(#+\s*)?第 2 章 褥瘡診療概要'
      - path: 02_第2章_褥瘡診療概要
        title: '[褥瘡] 第2章 褥瘡診療概要（診断・危険因子の評価／予防・ケア／急性期・浅い褥瘡・深い褥瘡の治療／治療の評価／他の治療法）'
        body:
          - pdf: 創傷・褥瘡・熱傷ガイドライン（2023）2 褥瘡診療ガイドライン（第3版）.pdf
            pages: [5, 7]
            from: '^(#+\s*)?第 2 章 褥瘡診療概要'
            until: '^(#+\s*)?第 3 章'
            allow_overlap: true
      - path: 03_CQと推奨
        title: '[褥瘡] 第3章 褥瘡診療ガイドライン クリニカルクエスチョン（CQ）と推奨'
        children:
          - path: CQ01
            title: '[褥瘡 CQ1] 褥瘡の治療に外科的デブリードマンを推奨するか？【弱い推奨／ステージ III 以上の褥瘡の治療にデブリードマンの施行を提案する】'
            body_text: |
              システマティックレビューの詳細は `06_SR詳細/CQ01`。
            body:
              - pdf: 創傷・褥瘡・熱傷ガイドライン（2023）2 褥瘡診療ガイドライン（第3版）.pdf
                pages: [7, 8]
                from: '^(#+\s*)?第 3 章'
                until: '^(#+\s*)?CQ2\s'
                allow_overlap: true
          - path: CQ02
            title: '[褥瘡 CQ2] 褥瘡の治療に外用薬の使用を推奨するか？【弱い推奨／ステージ III 以上の褥瘡の治療にカデキソマー・ヨウ素，ブクラデシン，ポビドンヨード・シュガーの使用を提案する】'
            body_text: |
