notes: |
  6 分冊 325 ページのうち、**落としたページは無い** (全ページがどこかのノードに載る)。
  表紙・著者一覧・目次は各分冊の第 1 章ノードに、策定委員会名簿と COI 一覧は
  `90_策定委員会名簿・COI` に収めた (版・発行年・作成委員会の根拠になるため)。

  ## 抽出モード

  6 分冊とも日皮会誌の 2 段組組版で、pdftotext の**既定モードでは左右の段の行が 1 行ずつ
  交互に出て本文が読めない**。`-layout` は段が横に並ぶだけで散文に向かない。
  そこで **全 PDF `mode: raw`** (内容ストリーム順) にした。raw なら段ごとに正しい順で出る。
  康熙部首・縦書き用記号の混入は 6 分冊とも 0 件だったので `normalize_radicals` は付けない。

  **表が主体のページも raw のままにして `vlm_candidates` に回した。** `-layout` は表
  (表6 創傷被覆・保護材等一覧、表3 CEAP 分類 2020、表4 代表的な弾性ストッキング、
  表2 足関節部での圧迫圧、表4 外傷に対する抗破傷風療法 等) の桁は保つが、同じページに
  載っている散文が 2 段交互になって壊れる。ページ単位でモードを変えると散文を犠牲にするので、
  本文は raw で通し、表の再現は後工程の VLM overlay に任せる方針にした。

  ## strip_edge

  raw ではページ**末尾 2 行**に「柱下フッタ」と「走り柱」が出る。フッタは奇数/偶数ページで
  向きが入れ替わる (`日皮会誌：… ● 2519` と `2520 ● 日皮会誌：…`) ので 2 パターンを
  manifest 直下に置き、分冊ごとに違う走り柱 (書名 / `創傷・褥瘡・熱傷ガイドライン策定委員会`
  系) は `pdfs[].strip_edge.patterns` に置いた (patterns は加算される)。1 ページ目だけ末尾に
  `<書名> 日本皮膚科学会ガイドライン` の合成バナー行が出るので `.*日本皮膚科学会ガイドライン`
  も足した。**裸の数字のパターン (`\d{1,3}`) は 1 つも入れていない** — 表の数値セルや
  推奨度の数字が消えるため。文献欄の「日皮会誌，」(読点) はフッタの「日皮会誌：」(コロン) と
  区別できるので巻き込まない。6 分冊 325 ページの先頭/末尾 3 行に機械的に当てて、
  消し残りの柱 0 件・本文の巻き添え 0 件を実測確認した。

  ## ノードの切り方

  分冊ごとに CQ / 質問 / 解説の番号が振り直されるので、title には必ず分冊名の文脈を
  `[褥瘡 CQ2]` `[創傷一般 質問5]` `[糖尿病性皮膚潰瘍 解説9]` `[熱傷 CQ2]` の形で入れた。

  - 分冊 1 (創傷一般) は CQ 形式ではなく「質問 1〜7」の総論なので、質問 1 件 = 1 ノード
    (回答 + 解説まで)。文献は巻末に一括 (質問別ではない) なので `10_文献` の 1 ノードにした
  - 分冊 2〜6 は「第 3 章 CQ と推奨」と「第 6 章 各 CQ システマティックレビューの詳細」に
    **同じ CQ が 2 回**出る。第 3 章側を `03_CQと推奨/CQnn`、第 6 章側を `06_SR詳細/CQnn` に分け、
    本体 CQ ノードの `body_text` に「システマティックレビューの詳細は `06_SR詳細/CQnn`」の
    1 行を置いた。title は同じ CQ 文言を使い、SR 側だけ末尾に「システマティックレビューの詳細」を付けた
  - 分冊 2 の第 5 章「解説」は解説 1〜7 の下に小項目 1.1〜7.4 があり、各小項目が
    「推奨文 + 根拠 + 文献」の単位になっているので **小項目 1 件 = 1 ノード** (25 ノード)。
    解説 6 だけは小項目に割れていないので 1 ノード
  - 分冊 3 の第 5 章「解説」は解説 1〜13 が小項目に割れていないので **解説 1 件 = 1 ノード**
    (分冊 2 と同じ基準を当てるとこちらは割れない、という非対称)
  - 分冊 5 は第 4 章が厚い (略語一覧・用語の説明・診断/検査の説明・治療法の説明) ので
    4 子ノードに割った
  - 1 ページに 2 つの見出しが始まるページは `from` / `until` で割った。パターンは overlay
    (VLM が `## ` 付きで見出しを起こす) にも当たるよう `^(#+\s*)?…` の形で書いた。
    本文中の「（質問 2）」のような参照は行頭に来ないので巻き込まない
  - 見出し文言には **ZWNJ (U+200C) と BEL (U+0007)** が混ざる (`第 1 章 ‌<BEL> 膠原病…`、
    `解説 3 ‌<BEL> SLE にともなう…`)。`from` / `until` はいずれも ZWNJ の**手前まで**の
    短いパターン (`^(#+\s*)?第\s?3\s?章`、`^(#+\s*)?解説\s?5`、`^(#+\s*)?CQ2`) に当てている。
    分冊 3 の原本**ファイル名**にも「3」の直後に ZWNJ が入っているので、
    `pdfs[].file` は実ファイル名をそのまま写してある
  - `from` / `until` で 1 ページを 2 ノードに割っている箇所は、後ろのノードの範囲要素に
    `allow_overlap: true` を付けてある (意図した共有であり、重複警告を出さないため)

  ## 原本の事情でこうした、という箇所

  - 分冊 4 の SR 詳細は、raw の内容ストリーム順の都合で **CQ1 の図11 (PDE5 阻害薬
