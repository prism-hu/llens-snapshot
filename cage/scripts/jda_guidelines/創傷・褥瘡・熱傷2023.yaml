id: 創傷・褥瘡・熱傷2023
title: 創傷・褥瘡・熱傷ガイドライン（2023）
guideline: 創傷・褥瘡・熱傷ガイドライン（2023）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『創傷・褥瘡・熱傷ガイドライン（2023）』(日本皮膚科学会 / 創傷・褥瘡・熱傷ガイドライン
  策定委員会)。2017 年版 (第 2 版) の改訂で、**6 分冊**が日本皮膚科学会雑誌に順次分載された。
  分冊ごとに策定グループが分かれ、**CQ 番号・図表番号・文献番号が分冊ごとに振り直される**
  (= 分冊が事実上独立した 1 本のガイドライン)。

  - `01_創傷一般` 創傷一般（第 3 版）… 日皮会誌 133(11), 2519-2564, 2023。CQ 形式ではなく
    「質問 1〜7」の総論で、創傷治癒環境の調整・洗浄・消毒・外用薬・ドレッシング材・疼痛・
    陰圧閉鎖療法を扱う (質問 7 は第 3 版で新設)
  - `02_褥瘡` 褥瘡診療ガイドライン（第 3 版）… 日皮会誌 133(12), 2735-2797, 2023。
    CQ 4 件 (外科的デブリードマン・外用薬・ドレッシング材・局所陰圧閉鎖療法) と解説 1〜7
  - `03_糖尿病性皮膚潰瘍・壊疽` 糖尿病性皮膚潰瘍・壊疽診療ガイドライン（第 3 版）…
    日皮会誌 133(13), 2969-3024, 2023。CQ 3 件 (骨髄炎の画像検査・局所陰圧閉鎖療法・
    多血小板血漿) と解説 1〜13
  - `04_膠原病・血管炎にともなう皮膚潰瘍` 膠原病・血管炎にともなう皮膚潰瘍診療ガイドライン
    （第 3 版）… 日皮会誌 134(1), 1-63, 2024。CQ 4 件 (全身性強皮症・皮膚石灰沈着・
    血管炎・リウマトイド血管炎)
  - `05_下腿潰瘍・下肢静脈瘤` 下腿潰瘍・下肢静脈瘤診療ガイドライン（第 3 版）…
    日皮会誌 134(2), 225-272, 2024。CQ 4 件 (超音波検査・圧迫療法・手術療法・硬化療法)
  - `06_熱傷` 熱傷診療ガイドライン（第 3 版）… 日皮会誌 134(3), 509-557, 2024。
    CQ 3 件 (予防的抗菌薬全身投与・ドレッシング材・トラフェルミン)

  分冊 2〜6 は章立てが共通で、第 1 章 (ガイドラインについて)、第 2 章 (診療概要・アルゴリズム)、
  第 3 章 (CQ と推奨)、第 4 章 (用語の定義)、第 5 章 (解説)、第 6 章 (各 CQ システマティック
  レビューの詳細)、巻末に策定委員会名簿と COI 一覧。推奨は GRADE approach / Minds 2020 準拠。

  収録は **1 CQ = 1 ノード** (推奨表 + 背景・目的 + 解説 + 文献)。第 3 章と第 6 章に同じ CQ が
  2 回出るので、第 3 章側を `03_CQと推奨/CQnn`、第 6 章側を `06_SR詳細/CQnn` に分け、
  本体 CQ ノードの `body_text` から参照を張ってある。CQ 番号が分冊ごとに振り直されるため、
  各ノードの title には `[褥瘡 CQ2]` `[熱傷 CQ2]` のように**分冊名の文脈**を必ず入れている。
strip_edge:
  # 柱下フッタ (奇数/偶数ページで向きが入れ替わる 2 形)。分冊ごとの走り柱・バナーは
  # pdfs[].strip_edge.patterns に置く (patterns は加算される)。
  # **`\d{1,3}` 単体は入れない** — 表の数値・推奨度の数字が消えるため。
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
