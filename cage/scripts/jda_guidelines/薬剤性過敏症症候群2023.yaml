id: 薬剤性過敏症症候群2023
title: 薬剤性過敏症症候群診療ガイドライン2023
guideline: 薬剤性過敏症症候群診療ガイドライン2023
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『薬剤性過敏症症候群診療ガイドライン 2023』(日本皮膚科学会ガイドライン)。
  薬剤性過敏症症候群診療ガイドライン作成委員会が作成し、日本皮膚科学会雑誌に掲載された。
  薬剤性過敏症症候群 (drug-induced hypersensitivity syndrome, DIHS) と、類似概念の
  DRESS (drug reaction with eosinophilia and systemic symptoms) を扱う。

  構成 (全 3 章 + CQ):
  - 第 1 章 ガイドライン策定にあたって (1.1 背景と目的／1.2 位置付けと特徴／
    1.3 エビデンスレベルと推奨度／1.4 免責事項／1.5 今後の更新計画／1.6 利益相反／
    表1-1 DIHS の診断基準・表1-2 DRESS の診断基準)
  - 第 2 章 (2.1 疾患概念／2.2 疫学／2.3 病態／2.4 臨床症状／2.5 重症度／
    2.6 検査所見とバイオマーカー／2.7 鑑別診断／表2 DIHS/DRESS severity score)
  - 第 3 章 (3.1 診断までの診療の流れ／3.2 治療目的と治療方針／表3 DIHS 治療指針〈2022〉)
  - CQ1〜CQ17 (被疑薬・重症度予見・病理組織・初診時診断・TARC・DLST・パッチテスト・
    ステロイド全身投与／外用／パルス・IVIG・免疫抑制療法・多剤感作・CMV 再活性化・
    長期経過観察・自己抗体・SJS/TEN との鑑別)

  推奨度は「強く推奨する／弱く推奨する」、エビデンスレベルは A〜D。収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '薬剤性過敏症症候群診療ガイドライン\s*2023(\s*日本皮膚科学会ガイドライン)?'
  # 柱は「作成委員会」と「策定委員会」の 2 通りが混在する (原本の誤植と思われる)
  - '薬剤性過敏症症候群診療ガイドライン(作成|策定)委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。重症度判定スコアの配点や検査値の閾値を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
# 不等号付き等号のグリフ落ち (紙面 ≧ / ≦)
substitutions:
  - {find: '＜ ＿', replace: '≦', note: '≦ のグリフがテキスト層で ＜ と ＿ に割れる。紙面は ≦'}
