notes: |
  ## 版の扱い
  - 2023 年版。旧版 (2009 年の「重症薬疹」関連の手引き等) は素材に含まれないので落とした版は無い。
  - 本ガイドラインと『重症多形滲出性紅斑 スティーヴンス・ジョンソン症候群・中毒性表皮壊死症
    診療ガイドライン』(別 id `SJS・TEN`) は相互参照がある (CQ17 が SJS/TEN との鑑別を扱う) が、
    別の文書なので別 id にしてある。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・作成委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。重症度判定スコアの配点 (−1/0/2 等)、検査値の閾値
    (ALT 400・CRP 2 等)、診断基準の項目番号を守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 22 ページがいずれかのノードに載る。

  ## ページ内分割
  - 章境界 (第2章／第3章) と CQ1〜CQ17 の境界を `from` / `until` で割った。
  - CQ 番号の書式が揺れている (`CQ1．…` と `CQ6 DLST は…` のように「．」が無いものがある) ので、
    境界は `^(#+\s*)?CQ<n>[．.\s]` の形にしてある。この形なら `CQ1` が `CQ10` に当たることもない。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように `^(#+\s*)?…` を付けてある。
