notes: |
  - **抽出モードは `raw`**。学会誌の 2 段組で、既定モードは左右の段を 1 行ずつ交互に吐く
    （p.2 で「診断書」の本文と右段の文献リストが 1 行おきに混ざる）。`-raw` は左段を通しで
    出してから右段に移るので読み順が保てる。`-layout` は段を横に並べたままなので不可。
  - **`normalize_radicals` は付けていない**（`pdftotext` 出力に康熙部首・縦書き用記号の
    混入は無かった。4 ページ全数で確認）。
  - **p.1 と p.4 はテキスト層が壊れている**（枠組み表の埋め込みフォントで、欧文と数字が
    1 文字ずつ分かち書きになる: `B u l l o u s C o n g e n i t a l`、`ケラチン 1 ，1 0 または 2 e`、
    `S i e me n s 型`）。日本語は読めるので本文は収録しつつ、`vlm_candidates` に挙げて
    該当ノードの `body_text` に注意書きを置いた。p.2-3 の本文は健全なので `text_caveat` は
    付けていない。
  - **ページ内分割**は p.2 の 1 箇所（診断書｜治療指針）。overlay が当たっても効くよう
    `^(#+\s*)?治療指針（案：平成 19 年 11 月）` の形で書き、ページを共有する `03_治療指針` 側に
    `allow_overlap: true` を付けた。
  - **落としたページは無い**（全 4 ページがどこかのノードに載る）。
  - 旧版・別文書の判断: この文書はカタログに 1 本しか無く、改訂版・追補版は掲載されていない
    （本文には「今後 3 年毎に更新される予定」とあるが、2026-09-07 時点の学会ページに
    2008 年版より新しいものは無い）。魚鱗癬関連の他の掲載物も無い。
