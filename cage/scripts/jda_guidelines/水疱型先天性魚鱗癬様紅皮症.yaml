id: 水疱型先天性魚鱗癬様紅皮症
title: 日本皮膚科学会診療ガイドライン：水疱型先天性魚鱗癬様紅皮症
guideline: 水疱型先天性魚鱗癬様紅皮症診療ガイドライン
publisher: 日本皮膚科学会・厚生労働科学研究 稀少難治性皮膚疾患に関する研究班
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『日本皮膚科学会診療ガイドライン：水疱型先天性魚鱗癬様紅皮症』
  （日皮会誌 118(3): 343-346, 2008（平 20）、2008 年 1 月）。厚生労働科学研究費補助金・
  難治性疾患克服研究事業「稀少難治性皮膚疾患に関する研究班」（北島康雄班長）で作成された
  診断・診療ガイドラインを、日本皮膚科学会ガイドライン作成委員会（委員長 池田志斈）が
  学会ガイドラインとして掲載したもの。全 4 ページ。

  中身は診断基準・重症度分類・治療指針で、CQ・推奨度（Minds 形式）は持たない。収録は
  - 診断書と治療指針（案：平成 20 年 1 月）— 1 ページに収めた要約版
  - 診断書（案：平成 19 年 11 月）— 臨床的項目・組織学的項目・診断・遺伝子診断・除外診断と
    根拠文献（エビデンスレベル V）
  - 治療指針（案：平成 19 年 11 月）— 治療法 5 項目（いずれも推奨度 C1）と根拠文献
  - 別添 診断の手引き（平成 19 年 3 月）— 概念・診断の手引き・亜型（Siemens 型）・鑑別診断
  の 4 ノード。

  本文に「ガイドラインの作成に当って種々調査を行ったが，医学専門家報告あるいは症例報告と
  いった資料しか検出されなかった．従って本ガイドラインにはエビデンスが無いことを付記する」
  との断りがある。
