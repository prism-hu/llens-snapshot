id: 有棘細胞癌2025
title: 有棘細胞癌診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: 有棘細胞癌診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 公益社団法人日本皮膚科学会／一般社団法人日本皮膚悪性腫瘍学会（皮膚がん診療ガイドライン策定委員会 有棘細胞癌診療ガイドライングループ）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
normalize_radicals: true
description: |
  原典正式名:「皮膚がん診療ガイドライン第 4 版 有棘細胞癌診療ガイドライン 2025」
  （日皮会誌 135(6): 1531-1578, 2025）。公益社団法人日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会
  「皮膚がん診療ガイドライン策定委員会（有棘細胞癌診療ガイドライングループ）」編。
  推奨は Minds 診療ガイドライン作成マニュアル 2020 ver.3.0 準拠。

  構成は 3 章立て。第 1 章はガイドラインの目的・作成方法（文献検索・システマティックレビュー・
  推奨決定会議・COI）、第 2 章は総論（概念と定義・疫学・発生母地と発症要因・臨床像・病理組織像・
  鑑別疾患・画像診断・手術療法・放射線療法・全身薬物療法・その他の治療・予後）、
  第 3 章は CQ 6 件と推奨。日光角化症・ボーエン病（上皮内有棘細胞癌）も対象に含む。

  本体のほかに、学会サイトの「推奨作成関連資料」zip に同梱された **CQ ごとの推奨決定資料**
  6 本と**スコープ** 1 本を、子セクション `95_推奨決定資料` / `96_スコープ` として収録した。
  推奨決定資料は 1 資料を `01_推奨決定` / `02_文献検索と採否` / `03_評価シート` / `04_レビュー結果`
  の 4 ノードに割ってある。本体の CQ ノードと推奨決定資料の CQ ノードは同じ CQ 文言を title に持つ。
