  - **抽出モード**: 本体は日皮会誌の 2 段組なので `-raw`（読み順が通る唯一のモード）。
    推奨決定資料・スコープは Excel/Word 由来のフォームなので `-layout`。ただし評価シート
    （SR-5/SR-6/SR-7）のページだけは表頭が縦組みで `-layout` でも桁が復元できず，
    1 ページ 1.5 万字の空白を生むので，その区間だけ `mode: raw` にした（`03_評価シート` ノード）。
  - **康熙部首**: 推奨決定資料・スコープ 7 本に `⼿` `⽤` `⽐` 等の康熙部首字形が混入している
    （本体には無い）ため `normalize_radicals: true`。
  - **ページの割り方**: CQ は `文献検索式と文献選択` の表が次ページに食い込むので，
    境界は次の CQ 見出し（`CQ2` 等）で切っている（p.27・p.32・p.37・p.39 が 2 つの CQ にまたがる）。
    p.3 は目次の末尾と第 1 章の冒頭が同居するので `第 1 章` で割った。
  - **配信名**: 推奨決定資料 6 本とスコープは学会ページの「推奨作成関連資料DL」zip 同梱で
    単独 URL が無いので `url:` を省き，カタログの `slug:` を使っている。
  - **ノードの大きさ**: 最大ノードは CQ4 推奨決定資料の `02_文献検索と採否/02_二次スクリーニングと引用文献`
    （約 2 万字）。SR-3 の一覧表が 3 ページ続く 1 つの表なので、これ以上はページ境界でしか割れない。
  - 落としたページは無い（本体 48 ページ・推奨決定資料 6 本 102 ページ・スコープ 13 ページ）。

