id: 色素性乾皮症
title: 色素性乾皮症診療ガイドライン
guideline: 色素性乾皮症診療ガイドライン
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『色素性乾皮症診療ガイドライン』(日本皮膚科学会ガイドライン / 色素性乾皮症診療ガイドライン
  改定委員会 編 / 日本皮膚科学会雑誌 125(11), 2013-2022, 2015 年)。厚生労働科学研究費補助金
  (難治性疾患等政策研究事業)「神経皮膚症候群に関する調査研究」班の成果を取り込んだ改定版で、
  2009 年の初版 (日皮会誌 119: 1359-1377) を置き換えるもの。

  色素性乾皮症 (xeroderma pigmentosum：XP) は日光露光部に皮膚がんを高頻度に発症する遺伝性
  光線過敏症で、本邦患者の半数以上に進行性の神経症状を合併する。指定難病であり、
  本ガイドラインは新診断基準 (表 3) と重症度分類 (表 4) を収める。

  CQ 形式ではなく通し見出しの構成 (背景・免責条項 / 定義・概念 / 疫学 / 病因・病態 / 症状 /
  診断のための各種検査 / 診断基準と重症度分類 / 鑑別疾患 / 治療・患者ケア / 予後 / 結語 / 文献)
  なので、見出し 1 節 = 1 ノードで切った (短い節は隣と束ねた)。
strip_edge:
  # 日皮会誌の柱とノンブル。raw モードでは**ページ末尾の 2 行**に来る
  # (`\d{1,4}` は表の数値を巻き添えにするので strip でなく strip_edge)
  lines: 3
  patterns:
  - '\d{1,4} ● 日皮会誌：125（11）\s*，2013-2022，2015（平成 27）'
  - '日皮会誌：125（11）\s*，2013-2022，2015（平成 27）● \d{1,4}'
  - '色素性乾皮症診療ガイドライン改定委員会'
  - '色素性乾皮症診療ガイドライン'
  - '日本皮膚科学会ガイドライン'
pdfs:
  - file: 色素性乾皮症診療ガイドライン.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/shikisoseikanpisyouguideline.pdf
    label: 本体 (全 10 ページ)
    # 学会誌組版の 2 段組。既定モードは左右の段を 1 行ずつ交互に出してしまうので raw
    # (内容ストリーム順 = 段ごとの読み順) を使う
    mode: raw
nodes:
  - path: 01_ガイドライン作成の背景・免責条項
    title: ガイドライン作成の背景／ガイドラインの位置付け・免責条項
    body:
      - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: [1, 2], until: '^(#+\s*)?定義・概念'}
  - path: 02_定義・概念・疫学・病因・病態
    title: 定義・概念／疫学／病因・病態
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: 2
        from: '^(#+\s*)?定義・概念'
        until: '^(#+\s*)?症状'
        allow_overlap: true
  - path: 03_症状
    title: 症状 (皮膚症状・神経症状・眼症状)
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: [2, 4]
        from: '^(#+\s*)?症状'
        until: '^(#+\s*)?XP 診断のための各種検査'
        allow_overlap: true
  - path: 04_診断のための各種検査
    title: XP 診断のための各種検査 (光線照射試験・DNA 修復試験・遺伝子解析)
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: 4
        from: '^(#+\s*)?XP 診断のための各種検査'
        until: '^(#+\s*)?XP 診断基準と重症度分類'
        allow_overlap: true
  - path: 05_診断基準と重症度分類
    title: XP 診断基準と重症度分類 (図 1 診断フローチャート・表 3 新診断基準・図 2 患者フォロー・表 4 重症度)
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: 4
        from: '^(#+\s*)?XP 診断基準と重症度分類'
        until: '^(#+\s*)?XP の鑑別疾患'
        allow_overlap: true
      - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: [5, 6]}
  - path: 06_鑑別疾患
    title: XP の鑑別疾患 (雀卵斑・遺伝性対側性色素異常症・骨髄性プロトポルフィリン症ほか)
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: 4
        from: '^(#+\s*)?XP の鑑別疾患'
        allow_overlap: true
      - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: 7, until: '^(#+\s*)?治療・患者ケア'}
  - path: 07_治療・患者ケア
    title: 治療・患者ケア
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: [7, 8]
        from: '^(#+\s*)?治療・患者ケア'
        until: '^(#+\s*)?予後'
        allow_overlap: true
  - path: 08_予後
    title: 予後
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: [8, 9]
        from: '^(#+\s*)?予後'
        until: '^(#+\s*)?結語'
        allow_overlap: true
  - path: 09_結語
    title: 結語
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: 9
        from: '^(#+\s*)?結語'
        until: '^(#+\s*)?文 献'
        allow_overlap: true
  - path: 10_文献
    title: 文献
    body:
      - pdf: 色素性乾皮症診療ガイドライン.pdf
        pages: [9, 10]
        from: '^(#+\s*)?文 献'
        allow_overlap: true
vlm_candidates:
  - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: 2, why: 表 1 XP の原因遺伝子とその臨床および細胞学的特徴 (多列の表)}
  - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: 3, why: 表 2 XP の病型分類と本邦での発症頻度}
  - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: 5, why: 図 1 XP 診断フローチャート + 表 3 新診断基準 (図表のみのページ)}
  - {pdf: 色素性乾皮症診療ガイドライン.pdf, pages: 6, why: 図 2 XP 確定診断後の患者フォロー + 表 4 重症度の評価と分類 (図表のみのページ)}
notes: |
  - **原本は日本皮膚科学会雑誌の 2 段組**。既定モード (`pdftotext` フラグ無し) は左段と右段を
    1 行ずつ交互に出して本文が読めなくなるため、全ページ `mode: raw` (内容ストリーム順) にした。
    `-layout` も試したが、2 段が 1 行に並ぶだけで読み順の問題は解決しない。
  - 柱 (`色素性乾皮症診療ガイドライン` / `色素性乾皮症診療ガイドライン改定委員会` /
    `日本皮膚科学会ガイドライン`) とノンブル (`日皮会誌：125（11）…● 2013` 形式) を
    `strip_edge` (lines: 3) で落とした。**p.1 冒頭の書名行も柱と同じ文字列**なので巻き添えで
    消える (版・発行年は `日皮会誌：125（11），2013-2022，2015` の行が柱と一体で、これも落ちる)。
    作成委員会の委員名・所属は p.1 の本文として残っている。
  - 全 10 ページがどれかのノードに載っている。図表だけのページ (p.5 図 1 + 表 3、
    p.6 図 2 + 表 4) は `05_診断基準と重症度分類` に付けたうえで `vlm_candidates` に挙げた。
  - 2009 年の初版 (日皮会誌 119: 1359-1377) はカタログに無く、本 PDF が現行版。
