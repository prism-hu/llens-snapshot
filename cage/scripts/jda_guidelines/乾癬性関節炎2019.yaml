notes: |
  ## 版の扱い
  - 本ガイドラインは初版で、旧版は無い。素材 135 本の中に乾癬性関節炎の別版は含まれない。
  - 乾癬本体の診療ガイドラインはこの束に無く、乾癬の薬剤ガイダンス 2 本は別 id
    `乾癬_使用ガイダンス` に束ねてある (親の乾癬 GL が素材に無いため)。本ガイドラインは
    「乾癬性関節炎」という独立した疾患のガイドラインなので、そちらとは束ねていない。

  ## 作成主体
  - 日本皮膚科学会ガイドラインだが、厚生労働科学研究費補助金 難治性疾患等政策研究事業
    「乾癬性関節炎の不可逆的関節破壊進行阻止のための早期発見と治療を目指した診療ガイドライン策定に
    関する研究」研究班 (研究代表 朝比奈昭彦、平成 29〜30 年度) との合同なので、`publisher` に連名で書いた。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は 1 行に
    左段 + 右段が並ぶ。`-raw` (内容ストリーム順) だけが段ごとに上から下へ出るので `mode: raw`。
  - 康熙部首の混入は 0 件だったので `normalize_radicals` は付けていない。

  ## ノードの切り方
  - 第 VI 章は 1 CQ = 1 ノードで 32 件。2 つの CQ が同じページで始まる版面が多いので、
    ほぼすべての CQ で `from` / `until` によるページ内分割を使っている。
  - **p.33 は CQ1 の本文 (上) と 表14〜16 (下) が同居する**。表 14〜16 は第 VI 章全体の判定基準なので、
    CQ1 の本文は「表 14」の行の手前で切り、表の側は `00_エビデンスの収集とCQ・判定基準` の
    3 番目の区間として拾ってある。
  - CQ の文献は原本で各 CQ の直後に置かれるので、CQ ノードに含めた (章末にまとめられていない)。

  ## strip
  - raw モードでは柱 (書名・委員会名) とノンブル入りフッタが**ページ末尾**に出る。
    フッタは `●` を必ず含むので、文献リスト中の「日皮会誌，2018; 128: 2431-2502」とは紛れない。
  - `\d{1,3}` の裸のノンブルは無いので `strip_edge` は置いていない
    (表8 の推奨度「1」「2」や CASPAR 分類基準の配点を守るため)。

  ## 落としたページ
  - 無し。全 59 ページがどこかのノードに載る (p.58-59 の略語一覧も `07_略語一覧` に入れてある)。
