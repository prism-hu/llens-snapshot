id: 乾癬性関節炎2019
title: 乾癬性関節炎診療ガイドライン2019
guideline: 乾癬性関節炎診療ガイドライン2019
publisher: 日本皮膚科学会乾癬性関節炎診療ガイドライン作成委員会／厚生労働科学研究費補助金 難治性疾患等政策研究事業 乾癬性関節炎研究班
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『乾癬性関節炎診療ガイドライン 2019』(日本皮膚科学会ガイドライン)。日本皮膚科学会乾癬性関節炎診療
  ガイドライン作成委員会と厚生労働科学研究費補助金 難治性疾患等政策研究事業 乾癬性関節炎研究班
  (研究代表 朝比奈昭彦) の合同で作成し、日本皮膚科学会雑誌 129 巻 13 号 2675-2733 頁
  (2019 年／令和元年) に掲載された。皮膚科医・内科領域リウマチ医・整形外科領域リウマチ医・放射線科医からなる
  委員が、日本皮膚科学会ガイドライン委員会の委託を受けて作成している。

  乾癬性関節炎 (関節症性乾癬、psoriatic arthritis：PsA) の疾患概念・診断・画像検査・治療指針・小児例を扱う。

  構成 (全 6 章):
  - 第 I 章 ガイドライン作成に当たって (背景と目標・位置づけと特徴・免責事項・更新計画・利益相反)
  - 第 II 章 PsA とは (疾患概念・疫学・発症メカニズム・臨床症状・CASPAR 分類基準・皮膚／爪所見との関係・鑑別診断・重症度の評価・血液検査とバイオマーカー・併存症・リスク因子・患者 QOL 評価・スクリーニング質問票・予後)
  - 第 III 章 PsA の画像検査の方法および所見
  - 第 IV 章 PsA の診療の流れと治療指針 (リウマチ医と皮膚科医の連携・T2T とタイトコントロール・治療方法と対応する CQ・生物学的製剤の使用順位・本邦における治療の問題点)
  - 第 V 章 小児 PsA (若年性 PsA の概念・分類基準・疫学・病態・臨床症状・検査・診断／鑑別診断・治療・経過と予後)
  - 第 VI 章 臨床設問 (Clinical Question：CQ1〜CQ32)

  エビデンスレベルは A (高い)／B (低い)／C (とても低い)、推奨度は 1 (強い推奨)／2 (弱い推奨) で示され、
  推奨度をつけにくい CQ はエビデンスレベルのみ (本文では「推奨度−」)。基準は表 13〜16 にある。
  収録は 1 CQ = 1 ノード。
