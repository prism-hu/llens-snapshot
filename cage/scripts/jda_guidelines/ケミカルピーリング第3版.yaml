  - {pdf: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）.pdf, pages: [4, 5], why: 疾患別（ざ瘡・日光（性）黒子・肝斑・雀卵斑・炎症後色素沈着・小じわ）の薬剤・推奨度・参考文献の表。raw ではセルが 1 行ずつに割れ、行の対応が読み取れない}
  - {pdf: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）.pdf, pages: [7, 7], why: 表 4「EBM に基づいた疾患別推奨度」。raw では列順が逆転し（「参考文献 推奨度 試薬名 疾患」）、数字も 1 桁ずつ分かれる}
  - {pdf: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）.pdf, pages: [1, 1], why: 標題紙（誌名・巻号・著者と所属）。raw では目次と著者一覧の段組が混ざる}
notes: |
  - 抽出モードは `raw`。学会誌の 2 段組で、既定モードは左右の段を 1 行ずつ交互に出して
    本文が読めなくなる。`-raw`（内容ストリーム順）なら左段 → 右段の順に素直に出る。
    引き換えに**表は列順が逆転し数字が 1 桁ずつ分かれる**ので、表のあるページ
    （p.3・p.4・p.5・p.7）を `vlm_candidates` に挙げた。
  - `strip_edge` は「ノンブル + 柱」がまとまって出る末尾 1 行だけを狙う。裸の `\d{1,3}` は
    置いていない（表 3 の濃度「20〜35%」や表 4 の推奨度の数字を巻き添えにするため）。
  - 全 10 ページを 5 ノードに収めた。落としたページは無い。
  - 参考文献 25〜27 は原本 p.7 の版面上「6．施行上の注意」より後ろに置かれているため、
    `03_施行上の注意` の末尾に入る（内容としては `02_疾患別の推奨度と解説` の
    B．参考文献リストの続き）。原本の刷り位置をそのまま残す方を採った。
  - 本文に康熙部首の混入は無い（`normalize_radicals` は付けていない）。
