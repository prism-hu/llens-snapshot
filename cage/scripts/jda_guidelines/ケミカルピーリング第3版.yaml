        allow_overlap: true
  - path: 04_最後に・文献・英文抄録
    title: 7．最後に（2001 年版・2004 年版の適応疾患分類と改訂第 3 版での変更）／文献／英文抄録（Guidelines for Chemical Peeling, 3rd Edition）
    body:
      - pdf: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）.pdf
        pages: [8, 10]
        from: '^(#+\s*)?7．最後に'
        allow_overlap: true
vlm_candidates:
