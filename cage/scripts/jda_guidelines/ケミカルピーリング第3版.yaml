id: ケミカルピーリング第3版
title: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）
guideline: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『日本皮膚科学会ケミカルピーリングガイドライン（改訂第 3 版）』（日本皮膚科学会
  ケミカルピーリングガイドライン作成委員会、委員長 古川福実。日皮会誌 118(3)：347―355、
  2008 年）。2001 年版・2004 年版に続く 3 度目の版で、2006 年に日本皮膚科学会学術委員会が
  求めた evidence-based medicine（EBM）準拠の改訂として、13 名の委員会が作成した。

  構成（全 7 節・10 ページ）:
  - 1．はじめに（経緯・位置づけ）
  - 2．ケミカルピーリングの基本的理念
  - 3．施行基準（A．剝離深度／B．使用薬剤例／C．剝離深度と使用薬剤例、表 2・表 3）
  - 4．EBM に基づいたガイドライン作成の基本方針（エビデンスレベル I〜VI と推奨度 A/B/C1/C2/D）
  - 5．EBM に基づいた疾患に対する推奨度と解説（ざ瘡・日光（性）黒子・肝斑・雀卵斑・
    炎症後色素沈着・小じわの 6 疾患、薬剤別の推奨度と参考文献リスト、表 4）
  - 6．施行上の注意（施術上／施術後）
  - 7．最後に（2001/2004 年版から適応疾患を EBM 重視で絞った経緯）

  推奨度は本邦にエビデンスレベルの高い論文がない項目について欧米の報告を根拠とした
  ものに「＃」が付く。収録は 7 節を 5 ノードにまとめ、全 10 ページを収めた
  （学会誌の英文抄録ページも含む）。
pdfs:
  - file: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/1372913831_1.pdf
    label: 日本皮膚科学会ケミカルピーリングガイドライン（改訂第3版）
    # 学会誌の 2 段組。既定モードは左右段を 1 行ずつ交互に出してしまい本文が読めない。
    # `-raw` (内容ストリーム順) だと左段 → 右段の順に素直に出るので raw を採る
    # (表だけは列順が逆転するので vlm_candidates に挙げた)
    mode: raw
strip_edge:
  # ノンブルと柱。raw では**ページ末尾の 1 行**に「ノンブル + 柱」がまとまって出る
  # (p1 だけ柱が無い)。裸の `\d{1,3}` は置かない (表 3・表 4 の濃度や推奨度の数字を守る)
  lines: 2
  patterns:
    - '\d{1,3} 古川\s+福実ほか'
    - '日本皮膚科学会ケミカルピーリングガイドライン（改訂第 3 版）\s+\d{1,3}'
