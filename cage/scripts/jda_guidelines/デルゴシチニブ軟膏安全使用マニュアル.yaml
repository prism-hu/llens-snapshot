id: デルゴシチニブ軟膏安全使用マニュアル
title: デルゴシチニブ軟膏（コレクチム®軟膏0.5％）安全使用マニュアル
guideline: デルゴシチニブ軟膏（コレクチム軟膏0.5％）安全使用マニュアル
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『デルゴシチニブ軟膏（コレクチム®軟膏 0.5％）安全使用マニュアル』
  (デルゴシチニブ軟膏安全使用マニュアル作成委員会。日皮会誌 130(7), 1581-1588, 2020)。

  デルゴシチニブはヤヌスキナーゼ (JAK) 阻害薬で、JAK ファミリーのキナーゼをすべて
  阻害する。その軟膏がアトピー性皮膚炎の治療薬として 2020 年 1 月に世界に先駆けて
  本邦で承認された。本マニュアルは処方する医師が安全に使用するために理解しておく
  べき留意事項 (アトピー性皮膚炎の確実な診断、全身性影響、局所有害事象、他の治療
  との併用) をまとめたもの。除外すべき疾患・鑑別すべき皮膚感染症の臨床写真
  (図 1〜図 9) を多く含む。

  アトピー性皮膚炎診療ガイドライン2024 とは別の掲載物 (親ガイドラインを持たない
  独立掲載) なので単独の id にしてある。CQ9 (デルゴシチニブ軟膏はすすめられるか)
  が対応する臨床設問。

  収録は原本の節 (1．〜7．) = 1 ノード。
