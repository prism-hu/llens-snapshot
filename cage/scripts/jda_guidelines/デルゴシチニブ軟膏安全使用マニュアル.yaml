notes: |
  - 学会誌 (日皮会誌) の 2 段組版面なので `mode: raw`。柱は 2 行に割れて
    ページ末尾に回るため `strip_edge` で 3 行ぶん受けている。
  - 原本のファイル名にはゼロ幅接合子 (U+200C) が「）」と「安全使用マニュアル」の
    間に混ざっている (学会サイトの表示名をそのまま使っているため)。`pdfs[].file` は
    cache 上の実ファイル名どおりに書いてある。
  - 全 8 ページがいずれかのノードに載る (落としたページは無い)。
  - 図 1〜図 9 は鑑別すべき疾患・皮膚感染症の臨床写真で、本マニュアルの要点の
    ひとつ。テキスト層にはキャプションしか出ないので vlm_candidates に挙げた。
  - 親となるアトピー性皮膚炎診療ガイドライン2024 とは学会ページ上で独立掲載
    されているので、割り当て表どおり単独 id にした。
  - 旧版は無い (2020 年策定の初版。学会ページの URL が `Delgocitinib_guidance_2.pdf`
    と `_2` 付きだが、掲載されているのはこの 1 本だけ)。
