id: 穿孔性皮膚症
title: 穿孔性皮膚症（perforating dermatosis）の診療の手引き
guideline: 穿孔性皮膚症（perforating dermatosis）の診療の手引き
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『穿孔性皮膚症（perforating dermatosis）の診療の手引き』(日本皮膚科学会診療の手引き)。
  川上民裕・秋山真志・須賀康・中野創・三苫千景・山本明美・米田耕造が作成し、
  日本皮膚科学会雑誌に掲載された。

  穿孔性皮膚症は真皮成分が表皮を貫いて排出される一群の疾患で、本手引きは
  **後天性反応性穿孔性膠原線維症・蛇行性穿孔性弾性線維症・キルレ病・穿孔性毛包炎**の
  4 疾患を扱う。

  構成 (全 3 章):
  - 第 1 章 診療の手引き作成にあたって (特徴・エビデンスレベルと論文の抽出・同意度の採用・
    推奨度／推奨文の基準・資金源と利益相反／表1 エビデンスレベルの分類・表2 同意度の基準・
    表3 推奨文の決定方法)
  - 第 2 章 穿孔性皮膚症の診断基準と重症度分類 (表4 診断基準・表5 重症度分類)
  - 第 3 章 穿孔性皮膚症の clinical question (CQ1〜CQ9。疾患ごとに図1〜図4)

  推奨度は A / B / C1 / C2 / D、エビデンスレベルは 1〜6、これに委員の**同意度** (5 点満点) を併記する。

  収録は 1 CQ = 1 ノード (推奨文 + エビデンスレベル／同意度／推奨度 + 解説 + 文献)。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '穿孔性皮膚症（perforating dermatosis）の\s*診療の手引き(\s*日本皮膚科学会診療の手引き)?'
  - '穿孔性皮膚症（perforating dermatosis）の診療の手引き'
  - '川上民裕 ほか'
  - '日本皮膚科学会診療の手引き'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。重症度分類のスコアや同意度の数値を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
