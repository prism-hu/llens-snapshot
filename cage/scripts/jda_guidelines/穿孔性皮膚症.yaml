notes: |
  ## 版の扱い
  - 年の付かない「診療の手引き」で、旧版・改訂版は公開されていない。id も年を付けていない。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・「川上民裕 ほか」) と版面フッタを `strip` に置いた。
  - 裸のノンブルは `strip_edge` (lines: 3)。重症度分類のスコア (0〜18 等) と同意度 (4.72 等) を
    守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 10 ページがいずれかのノードに載る。

  ## ページ内分割
  - 章境界 (第2章／第3章)、疾患の節境界 (2．蛇行性穿孔性弾性線維症／3．キルレ病／4．穿孔性毛包炎)、
    CQ 境界をすべて `from` / `until` で割った。各疾患の節見出しは、その疾患の最初の CQ の
    ノードの冒頭に入る。
  - 学会誌組版のため表・図は本文の途中に組まれ、raw では節見出しより後ろに流れる
    (表5 重症度分類は第2章のページだが CQ1 の側に出る)。どのノードにどの図表が載るかは
    vlm_candidates に列挙してある。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
