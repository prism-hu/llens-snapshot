      判断の要約・推奨のタイプ）と SR-* フォーム（データベース検索結果・文献検索フローチャート・
      二次スクリーニング一覧・引用文献リスト・バイアスリスク評価シート・定性的システマティック
      レビュー・メタアナリシス・SR レポート）からなる。
