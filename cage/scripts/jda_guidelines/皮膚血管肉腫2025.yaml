id: 皮膚血管肉腫2025
title: 皮膚血管肉腫診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: 皮膚血管肉腫診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 公益社団法人日本皮膚科学会／一般社団法人日本皮膚悪性腫瘍学会（皮膚がん診療ガイドライン策定委員会 皮膚血管肉腫診療ガイドライングループ）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
normalize_radicals: true
description: |
  原典正式名:「皮膚がん診療ガイドライン第 4 版 皮膚血管肉腫診療ガイドライン 2025」
  （日皮会誌 135(3): 557-603, 2025）。公益社団法人日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会
  「皮膚がん診療ガイドライン策定委員会（皮膚血管肉腫診療ガイドライングループ）」編。
  推奨は Minds 診療ガイドライン作成マニュアル 2020 ver.3.0 準拠。

  構成は 3 章立て。第 1 章はガイドラインの目的・作成方法、第 2 章は総論（疫学と病因・診断・
  病期分類・手術療法・放射線療法・化学療法・免疫療法・新規治療薬・緩和）、第 3 章は CQ 5 件と推奨。
  頭頸部発症例だけでなく、放射線照射後血管肉腫（RAAS）とリンパ浮腫続発性皮膚血管肉腫
  （Stewart-Treves 症候群）も対象に含む（CQ5）。

  同じセクションの `頭部血管肉腫`（頭部血管肉腫診療ガイドライン、日皮会誌 125(10), 2015）は
  本版の実質的な前身にあたるが、対象を頭部に限り推奨度の枠組みも旧式（A/B/C1/C2/D）で、
  学会の現行一覧に掲載が続いているため別 id で収録してある。現行の推奨は本版を見ること。

  本体のほかに、学会サイトの「推奨作成関連資料」zip に同梱された **CQ ごとの推奨決定資料**
  5 本と**スコープ** 1 本を、子セクション `95_推奨決定資料` / `96_スコープ` として収録した。
  推奨決定資料は 1 資料を `01_推奨決定` / `02_文献検索と採否` / `03_評価シート` / `04_レビュー結果`
  の 4 ノードに割ってある。本体の CQ ノードと推奨決定資料の CQ ノードは同じ CQ 文言を title に持つ。
