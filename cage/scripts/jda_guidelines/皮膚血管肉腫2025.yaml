notes: |
  - **推奨決定資料のファイル名**: `AS_CQ1_0305.pdf` 〜 `AS_CQ5_0305.pdf` にはファイル名に
    「推奨決定資料」の語が無いが、1 ページ目が `【RC-4 推奨提示】`（CQ1〜CQ4）/
    `【RC-4 推奨提示】`（CQ5、RAAS と STS で 2 ページ）で始まり、
    乳房外パジェット病・有棘細胞癌の推奨決定資料とまったく同じ RC-*/SR-* フォーム構成である
    ことを全 5 本で確認した。学会 zip の中では `皮膚血管肉腫_推奨決定資料/CQn_0305.pdf` に置かれている。
  - **抽出モード**: 本体は日皮会誌の 2 段組なので `-raw`。推奨決定資料・スコープは
    Excel/Word 由来のフォームなので `-layout`。ただし評価シート（SR-6/SR-7）のページだけは
    表頭が縦組みで `-layout` でも桁が復元できず 1 ページ 1.5 万字の空白を生むので、
    その区間だけ `mode: raw` にした（`03_評価シート` ノード）。
  - **康熙部首**: 推奨決定資料・スコープ 6 本に `⾎` `⾁` `⽤` 等の康熙部首字形が混入している
    （本体には無い）ため `normalize_radicals: true`。
  - **配信名**: 本体の公式 URL は WordPress の 32 桁ハッシュ
    （<https://www.dermatol.or.jp/dermatol/wp-content/uploads/2013/08/48299b0f090cb6ba8c81eeb342b7fff6.pdf>）で
    再アップロードのたびに変わるため、`url:` を省いてカタログの `slug: jda_angiosarcoma_2025.pdf`
    を配信名に使っている。推奨決定資料 5 本とスコープは zip 同梱で単独 URL が無いので同じく `slug:`。
  - **旧版 / 別文書**: `頭部血管肉腫`（2015 年、18 ページ）は本版の前身だが対象を頭部に限り、
    推奨度も旧式（A/B/C1/C2/D）で学会の現行一覧に残っているので、落とさず別 id で収録した。
  - **ページの割り方**: CQ 境界は次の CQ 見出し（`CQ3．` 等）で切っている。
    p.24（第2章末尾＋第3章冒頭）、p.29（CQ2 の文献検索式＋CQ3 冒頭）、
    p.36（CQ4 の文献検索式＋CQ5 冒頭）、p.40（CQ5 の文献検索式＋文献）が 2 ノードにまたがる。
  - **ノードの大きさ**: 最大ノードは CQ5 推奨決定資料の `02_文献検索と採否/02_二次スクリーニング後の一覧表`
    （約 2.5 万字）。RAAS と STS の 2 疾患ぶんの採否表が 3 ページ続く 1 つの表で、
    `-layout` でないと列が読めない（`-raw` では行が崩れる）。これ以上はページ境界でしか割れない。
  - 落としたページは無い（本体 47 ページ・推奨決定資料 5 本 94 ページ・スコープ 8 ページ）。

