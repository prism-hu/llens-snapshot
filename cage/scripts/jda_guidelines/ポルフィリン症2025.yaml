id: ポルフィリン症2025
title: ポルフィリン症診療ガイドライン2025
guideline: ポルフィリン症診療ガイドライン2025
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『ポルフィリン症診療ガイドライン 2025』(日本皮膚科学会ガイドライン)。
  ポルフィリン症診療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌 135 巻 9 号
  2015-2060 頁 (2025 年／令和 7 年) に掲載された。
  **皮膚ポルフィリン症と急性ポルフィリン症の両方**を扱う。

  構成:
  - 1．ガイドライン作成の背景と目標／2．位置づけ／3．免責事項／4．利益相反／
    5．エビデンスレベルと推奨度の決定事項（表1 略称一覧）
  - 6．定義・概念（表2 ポルフィリン症の病型と原因遺伝子）
  - 7．診断基準，重症度分類（7.1 皮膚ポルフィリン症の診断基準／7.2 急性ポルフィリン症の
    診断基準〈表3 急性ポルフィリン症の誘因〉／7.3 重症度分類）
  - 8．疫学／9．病因・病態（図1 ヘム合成経路とポルフィリン症）／10．症状（表4 発症年齢と
    臨床的特徴・表5 急性ポルフィリン症の自覚的初発症状）
  - 11．診断のための各種検査（表6 皮膚ポルフィリン症の鑑別疾患・表7 病型別ポルフィリン体
    および前駆体プロフィール・図2 皮膚ポルフィリン症の診断フローチャート・
    図3 急性ポルフィリン症のスクリーニング検査・図4 急性ポルフィリン症の診断フローチャート）
  - 12．合併症／13．鑑別診断（表8 偽ポルフィリン症の原因・表9 ポルフィリン尿症）／
    14．治療・予防／15．結語
  - 16．クリニカルクエスチョン CQ1〜CQ13（表10 CQ 一覧と推奨度）

  推奨度は **A：行うよう強く推奨する／B：行うよう推奨する／C1：選択肢の一つとして推奨する／
  C2：十分な根拠がないので推奨しない／D：行わないよう推奨する**。収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - 'ポルフィリン症診療ガイドライン\s*2025(\s*日本皮膚科学会ガイドライン)?'
  - 'ポルフィリン症診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。表10 の CQ 番号 (裸の 1〜13)・酵素活性の％・投与量を守るため端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
