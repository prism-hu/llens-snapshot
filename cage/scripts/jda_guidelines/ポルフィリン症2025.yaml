notes: |
  ## 版の扱い
  - 2025 年版 (日皮会誌 135(9): 2015-2060)。旧版は素材に含まれない。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・策定委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。**表10 の CQ 番号は裸の 1〜13** で、
    `strip` に `\d{1,3}` を置くと消える。酵素活性の％や投与量も同じ理由。

  ## 落としたページ
  - 落としたページは無い。全 46 ページがいずれかのノードに載る。

  ## ページ内分割
  - 節境界 (6．〜16．) と CQ1〜CQ13 の境界、末尾の「文 献」の開始を `from` / `until` で割った。
    「16．クリニカルクエスチョン（CQ）」の見出しは CQ1 のノードの冒頭に入る。
  - 学会誌組版のため表・図は本文の途中に組まれ、raw では節見出しより後ろに流れる
    (表10 の CQ 一覧は CQ2 のノードに載る)。どのノードにどの図表が載るかは
    title と vlm_candidates に書いた。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
