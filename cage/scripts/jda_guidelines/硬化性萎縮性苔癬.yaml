description: |
  原典正式名:「日本皮膚科学会ガイドライン 硬化性萎縮性苔癬 診断基準・重症度分類・診療ガイドライン」
  （日皮会誌 126(12): 2251-2257, 2016）。硬化性萎縮性苔癬 診断基準・重症度分類・診療ガイドライン
  委員会（長谷川稔ほか）編。タイトルに年号が入らないため id は主題のみ（`硬化性萎縮性苔癬`）。

  硬化性萎縮性苔癬（lichen sclerosus et atrophicus：LSA／国際的には lichen sclerosus）の
  診断基準（2 項目＋除外疾患）、重症度分類（機能障害・多発・拡大の 3 項目の合計点、2 点以上で重症）、
  および CQ 8 件（推奨度は新 Minds の「推奨の強さ 1/2/なし」＋「エビデンスのレベル A〜D」の併記、
  例: 2D）を収める。CQ の要約表（表3）とエビデンスレベル対応表（表2）、診療アルゴリズム（図1）を持つ。

  収録は 1 CQ = 1 ノード。
