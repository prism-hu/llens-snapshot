notes: |
  - **抽出モード**: 日皮会誌の 2 段組。既定モードでは左右の段が行単位で混ざるため `-raw`。
  - **ノードの切り方**: 1 CQ = 1 ノード。1 ページに 2〜3 個の CQ が並ぶので `from` / `until` で割った。
    `-raw` は段抜きの表・図をページ末尾に回すので、表1（p.1）・図1/表2（p.2）・表3（p.3）は
    そのページを占める CQ のノードに載る（表1 と図1/表2 は CQ2、表3 は CQ3）。title に断ってある。
  - **ファイル名の全角スペース**: cache 上のファイル名は「硬化性萎縮性苔癬␣診断基準…」で
    区切りが全角スペース（U+3000）。
  - **配信名**: 公式 URL は basename が `lichen%20sclerosus%20et%20atrophicus.pdf`（半角空白を
    percent-encode したもの）で ASCII の配信名が採れないため、`url:` を省いてカタログの
    `slug: lichen_sclerosus_et_atrophicus.pdf` を使っている。元 URL は
    <https://www.dermatol.or.jp/uploads/uploads/files/guideline/lichen%20sclerosus%20et%20atrophicus.pdf>。
  - 落としたページは無い（全 7 ページがどこかのノードに載る）。
