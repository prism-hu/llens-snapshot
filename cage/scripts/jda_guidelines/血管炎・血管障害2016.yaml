    # `-raw` (内容ストリーム順) なら左段 → 右段の順に素直に出る
    mode: raw
strip_edge:
  # ノンブル + 柱。raw ではページ**末尾**の 2 行にまとまって出る (p.1 だけ先頭にも出る)。
  # 裸の `\d{1,3}` は置かない (推奨度の数字・表の数値・文献番号を守る)
  lines: 3
  patterns:
    - '日皮会誌：127（3）\s*，299-415，2017（平成 29）●\s*\d{1,3}'
    - '\d{1,3}\s*●\s*日皮会誌：127（3）\s*，299-415，2017（平成 29）'
    - '血管炎・血管障害診療ガイドライン 2016 年改訂版'
    - '日本皮膚科学血管炎・血管障害診療ガイドライン改訂版作成委員会'
    - '日本皮膚科学会ガイドライン'
