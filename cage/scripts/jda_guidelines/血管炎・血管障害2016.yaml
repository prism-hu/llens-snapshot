id: 血管炎・血管障害2016
title: 血管炎・血管障害診療ガイドライン2016年改訂版
guideline: 血管炎・血管障害診療ガイドライン2016年改訂版
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『血管炎・血管障害診療ガイドライン 2016 年改訂版』（日本皮膚科学血管炎・血管障害診療
  ガイドライン改訂版作成委員会、委員長 古川福実。日皮会誌 127(3)：299―415、2017 年）。
  2008 年の『血管炎・血管障害ガイドライン』（日皮会誌 118：2095―2187）の改訂版で、
  2012 年に改訂された Chapel Hill Consensus Conference 分類（CHCC2012）に対応して
  皮膚科の視点から作り直したもの。エビデンスレベル（I〜VI）と推奨度（A / B / C1 / C2 / D）は
  日本皮膚科学会編『皮膚悪性腫瘍診療ガイドライン（第 2 版）』の基準に拠る。

  構成は総論（作成の背景・位置づけ・免責条項・エビデンスレベルと推奨度の決定基準・
  Chapel Hill 分類 1994 と 2012・診療アルゴリズム）と、疾患ごとの 21 章（各章は「概説」＋
  CQ）、巻末の CQ 推奨度一覧・略語一覧表・診療アルゴリズム図（図 4〜23）からなる。
  CQ は全 127 件。

  疾患章（CHCC2012 のカテゴリー順）:
  - 診療アルゴリズム（全身性血管炎・皮膚血管炎の分類とアルゴリズム）
  - 大型血管炎: 巨細胞性動脈炎（GCA）
  - 中型血管炎: 結節性多発動脈炎（PAN）
  - ANCA 関連小型血管炎: 顕微鏡的多発血管炎（MPA）／多発血管炎性肉芽腫症（GPA）／
    好酸球性多発血管炎性肉芽腫症（EGPA）
  - 免疫複合体性小型血管炎: クリオグロブリン血症性血管炎（CV）／IgA 血管炎（IgAV）／
    低補体血症性蕁麻疹様血管炎（HUV）
  - 種々の血管を侵す血管炎: ベーチェット病（BD）
  - 単一臓器の血管炎: 皮膚白血球破砕性血管炎（CLA）／皮膚動脈炎（CA）
  - 全身性疾患に続発する血管炎: ループス血管炎／リウマトイド血管炎／サルコイド血管炎
  - 誘因の推定される続発性血管炎: C 型／B 型肝炎ウイルス関連／薬剤関連／癌関連血管炎
  - 血管障害: リベド様血管症／抗リン脂質抗体症候群（APS）

  収録は 1 CQ = 1 ノード（推奨文・推奨度・解説・文献まで）。章ごとに「概説」を
  `00_概説`（GPA のみ原本の見出しに合わせて `00_概念`）として置いた。

  **『皮膚血管炎・血管障害診療ガイドライン 2023 ― IgA 血管炎，クリオグロブリン血症性
  血管炎，結節性多発動脈炎，リベド様血管症の治療の手引き ―』（別 id
  `皮膚血管炎・血管障害2023`）との関係**: 2023 の手引きは表題の 4 疾患の**治療**に限った
  別建ての文書で、本 2016 年改訂版を置き換えるものではない（学会の一般公開ガイドライン
  一覧にも両方が現行として並んでいる）。この 4 疾患の治療について引くときは 2023 の
  手引きのほうが新しい。診断・鑑別・4 疾患以外の血管炎は本 2016 年改訂版が引き続き
  唯一の全体ガイドライン。
