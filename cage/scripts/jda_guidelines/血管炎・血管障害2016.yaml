notes: |
  - 抽出モードは `raw`。学会誌の 2 段組で、既定モードは左右の段を 1 行ずつ交互に出して
    本文が読めなくなる（p.3 で確認）。`-raw`（内容ストリーム順）なら左段 → 右段の順に
    素直に出る。引き換えに表はセルが 1 行ずつに割れるので、表・図のあるページを
    `vlm_candidates` に挙げた。
  - `strip_edge` は柱とノンブル（raw ではページ末尾の 2 行にまとまって出る）を狙う。
    窓は 3 行。裸の `\d{1,3}` は置いていない（推奨度・表の数値・文献番号を巻き添えにする）。
  - CQ の見出しは原本が `GCA-CQ1` のように**疾患の略号 + CQ 番号**で刷っているので、
    ページ内分割（`from` / `until`）の境界にそのまま使った。1 ページに 2〜4 個の CQ が
    始まる版面が多く、章の切れ目も同じページに来るため、ほぼ全ノードで
    `allow_overlap: true` を付けている（隣接する CQ が境界ページを共有するのは意図した形）。
  - 原本の CQ 番号には誤りが 1 つある。低補体血症性蕁麻疹様血管炎（HUV）章の第 6 問だけ
    `UV-CQ6` と刷られている（他は `HUV-CQ1`〜`HUV-CQ5`）。`from` / `until` は原本どおり
    `UV-CQ6` で書き、ノードの path と title は章に合わせて CQ6 / HUV としてある。
  - GPA 章だけ総論の見出しが「概説」ではなく「概念」なので、ノード名も `00_概念` にした。
  - 全 117 ページを収めた。落としたページは無い。
  - 本文に康熙部首の混入は無い（`normalize_radicals` は付けていない）。
  - **2023 年の『皮膚血管炎・血管障害診療ガイドライン 2023』（IgA 血管炎・クリオグロブリン
    血症性血管炎・結節性多発動脈炎・リベド様血管症の治療の手引き）は本書の改訂版ではなく、
    4 疾患の治療に限った別文書**なので、両方を収録している（別 id
    `皮膚血管炎・血管障害2023`）。学会の一般公開ガイドライン一覧でも 2016 年改訂版が
    アーカイブでなく現行として掲載され続けている。
