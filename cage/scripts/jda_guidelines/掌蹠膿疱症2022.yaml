notes: |
  ## 束ね方
  - 学会ページでは「掌蹠膿疱症診療の手引き2022」と「掌蹠膿疱症におけるグセルクマブ使用上の注意」が
    別項目として掲載されているが、後者は前者に従属する薬剤別文書なので同じ id の子セクション
    `80_グセルクマブ使用上の注意` に収めた (共通指示の「使用ガイダンス・使用上の注意は親疾患 GL と同じ manifest」)。
    グセルクマブ文書は 2019 年 5 月公開で手引き 2022 より先行するが、旧版ではなく別建ての製剤文書。

  ## 抽出モード
  - 本体は日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` (内容ストリーム順) だけが段ごとに上から下へ出るので `mode: raw`。
  - グセルクマブ文書は 1 段組の配布資料なので既定モード。こちらだけページ下端に裸のノンブル (1〜4) が
    出るので、`pdfs[].strip_edge` (lines: 3) をこの PDF にだけ足してある
    (本体に効かせると重症度スコアの素点や検索件数を巻き添えにする)。
  - グセルクマブ文書の本文に縦書き用記号 (`︓` `︔`) が 2 箇所混ざるので `normalize_radicals: true`。
    本体 PDF には混入 0 件。

  ## ノードの切り方
  - 第 6 章は 1 CQ = 1 ノードで 45 件。CQ の節見出し (2.1 病巣感染治療 等) は、その節の
    最初の CQ ノードの `from` に使ってあるので、見出しは配下の CQ ノードの冒頭に出る。
  - **表 3 (CQ 一覧) は p.34 の 1 ページ丸ごと**を占め、本文は p.33 → p.35 と飛ぶ。
    そのため CQ1-5 の本文だけが p.33 と p.35 の 2 区間に分かれ、p.34 は独立ノード
