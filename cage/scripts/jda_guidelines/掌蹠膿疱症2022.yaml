id: 掌蹠膿疱症2022
title: 掌蹠膿疱症診療の手引き2022
guideline: 掌蹠膿疱症診療の手引き2022
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『掌蹠膿疱症診療の手引き 2022』(日本皮膚科学会診療の手引き)。日本皮膚科学会掌蹠膿疱症診療の手引き
  策定委員会が作成し、日本皮膚科学会雑誌 132 巻 9 号 2055-2113 頁 (2022 年／令和 4 年) に掲載された。
  掌蹠膿疱症 (palmoplantar pustulosis：PPP) と掌蹠膿疱症性骨関節炎 (PAO) を扱う。

  構成 (全 6 章):
  - 第 1 章 手引き作成にあたって (背景と目標・位置づけと特徴・更新計画・利益相反・エビデンスの収集・エビデンスレベルと推奨度の決定事項・免責事項)
  - 第 2 章 掌蹠膿疱症の診断と重症度 (定義と診断・臨床像・病理組織像・ダーモスコピー像・鑑別診断・遺伝子と HLA・掌蹠外病変・骨関節症状・併存症・重症度評価)
  - 第 3 章 掌蹠膿疱症の臨床統計と QoL (PPP／PAO の疫学・QoL)
  - 第 4 章 掌蹠膿疱症の発症病理 (病態生理〈皮膚病変・病巣扁桃・歯性病巣〉・病巣感染との関係・タバコとの関係・金属アレルギーとの関係)
  - 第 5 章 掌蹠膿疱症の治療アルゴリズム
  - 第 6 章 各治療の推奨度と解説 (臨床設問 CQ1-1〜CQ3-4、計 45 件)

  推奨度は A／B／B＊／C1／C2／D、エビデンスレベルは Ⅰ〜Ⅵ で示される (表 3 に一覧)。
  CQ は 1．実臨床での frequently asked questions (CQ1-1〜CQ1-10)、2．皮疹に対する治療 (CQ2-1-1〜CQ2-7)、
  3．骨関節症状に対する治療 (CQ3-1-1〜CQ3-4) の 3 群に分かれる。収録は 1 CQ = 1 ノード。

  あわせて、薬剤別文書『掌蹠膿疱症におけるグセルクマブ使用上の注意』(日本皮膚科学会 生物学的製剤安全性検討委員会、
  2019 年 5 月 17 日) を子セクション `80_グセルクマブ使用上の注意` として同じ id に収める。
  掌蹠膿疱症で初めて承認された生物学的製剤の使用上の注意で、本手引き 2022 に先行する従属文書。
normalize_radicals: true
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '掌蹠膿疱症診療の手引き\s*2022(\s*日本皮膚科学会診療の手引き)?'
  - '日本皮膚科学会掌蹠膿疱症診療の手引き策定委員会'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，2015; 125: …」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
