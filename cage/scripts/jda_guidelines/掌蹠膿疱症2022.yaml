    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/Guselkumab_palmopad%20pustulosis_guidance.pdf
    # URL の basename に %20 (空白) が入るので配信名にできない。カタログの slug を使う
    slug: Guselkumab_palmopad_pustulosis_guidance.pdf
    label: '掌蹠膿疱症におけるグセルクマブ使用上の注意 (2019.5.17)'
    # こちらは 1 段組の配布資料。既定モードで素直に出る
    mode: default
    strip_edge:
