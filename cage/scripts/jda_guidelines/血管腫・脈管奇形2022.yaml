id: 血管腫・脈管奇形2022
title: 血管腫・脈管奇形・血管奇形・リンパ管奇形・リンパ管腫症 診療ガイドライン2022（第3版）
guideline: 血管腫・脈管奇形・血管奇形・リンパ管奇形・リンパ管腫症診療ガイドライン2022 第3版
publisher: 厚生労働科学研究費補助金 難治性疾患等政策研究事業「難治性血管腫・脈管奇形・血管奇形・リンパ管腫・リンパ管腫症および関連疾患についての調査研究」班（研究代表者 秋田定伯）／「難治性小児消化器疾患の医療水準向上および移行期・成人期のQOL向上に関する研究」班（研究代表者 田口智章）／「呼吸器系先天異常疾患の診療体制構築とデータベースおよび診療ガイドラインに基づいた医療水準向上に関する研究」班（研究代表者 臼井規朗）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  原典正式名:「血管腫・脈管奇形・血管奇形・リンパ管奇形・リンパ管腫症 診療ガイドライン 2022」
  （第 3 版、発行年月日 2023 年 3 月 31 日、503 ページ）。第 1 版「血管腫・血管奇形診療ガイドライン
  2013」、第 2 版「血管腫・血管奇形・リンパ管奇形診療ガイドライン 2017」の改訂版で、
  「Minds 診療ガイドライン作成マニュアル 2017」に準拠する。

  作成主体は厚生労働科学研究費補助金 難治性疾患等政策研究事業の 3 研究班の合同
  （「難治性血管腫・脈管奇形・血管奇形・リンパ管腫・リンパ管腫症および関連疾患についての調査研究」班
  〈秋田班〉が主体、「難治性小児消化器疾患の医療水準向上および移行期・成人期の QOL 向上に関する研究」班
  〈田口班〉と「呼吸器系先天異常疾患の診療体制構築とデータベースおよび診療ガイドラインに基づいた
  医療水準向上に関する研究」班〈臼井班〉のリンパ管奇形疾患研究グループが作成協力）。
  外部評価は日本形成外科学会・日本皮膚科学会・日本医学放射線学会・日本 IVR 学会・日本小児科医会・
  日本小児外科学会の各代表理事および疫学・病理学の専門家・患者会が担当した。
  日本皮膚科学会は「一般公開ガイドライン」のページから本文 PDF（研究班ホームページ issvaa.jp）へ
  リンクしている。

  構成（全 5 章 + 序章 + 併載）:
  - 序章 ガイドラインサマリー（CQ 38 件と推奨の一覧）／診療アルゴリズム／用語・略語一覧
  - 第 1 章 作成組織・作成方針（作成組織名簿、作成経過・COI・作成資金・作成工程）
  - 第 2 章 スコープ（疾患トピックの基本的特徴、CQ リスト、SR の方法、推奨作成から公開まで）
  - 第 3 章 総説 — 総論（ISSVA 分類／画像診断／病理診断〈血管系・リンパ管系〉／分子生物学〈血管系・
    リンパ管系〉）と各論（乳児血管腫、先天性血管腫、房状血管腫、毛細血管奇形、静脈奇形、動静脈奇形、
    リンパ管奇形、リンパ管腫症・ゴーハム病、脈管奇形関連症候群 19 項目）
  - 第 4 章 クリニカルクエスチョン（CQ）および推奨 — CQ1〜CQ38
  - 第 5 章 公開後の取り組み
  - 併載「乳幼児巨大肝血管腫診療ガイドライン総説」（別の作成方法による総説。診断基準・重症度分類つき）

  収録は **1 CQ = 1 ノード**（推奨文・推奨の強さ・エビデンス総体の強さ・解説・文献検索式・文献・
  一般向けサマリーまでを 1 ノードに収める）。第 4 章の CQ は原本ではフラットに CQ1〜38 が並ぶが、
  CQ 番号が疾患ごとにまとまっているので、対象疾患のディレクトリ（動静脈奇形／静脈奇形／毛細血管奇形／
  乳児血管腫／脈管奇形関連症候群／カポジ肉腫様血管内皮細胞腫・房状血管腫／リンパ管奇形／
  リンパ管腫症・ゴーハム病／原発性リンパ浮腫）を 1 段挟んだ。総説は目次の節（総論 6 節・各論 10 節、
  うち脈管奇形関連症候群はさらに疾患ごと 19 ノード）で切っている。
  推奨の強さは 1（強い）/ 2（弱い）、エビデンス総体の強さは A（強）/ B（中）/ C（弱）/ D（非常に弱い）。
