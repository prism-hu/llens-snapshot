id: 尋常性痤瘡・酒皶2023
title: 尋常性痤瘡・酒皶治療ガイドライン2023
guideline: 尋常性痤瘡・酒皶治療ガイドライン2023
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『尋常性痤瘡・酒皶治療ガイドライン 2023』(日本皮膚科学会ガイドライン)。
  尋常性痤瘡・酒皶治療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌に掲載された。
  **尋常性痤瘡 (にきび) と酒皶を 1 冊で扱う**ガイドラインで、症候別病型分類に基づく
  治療推奨を示す。

  構成:
  - 序 (背景・目的・対象・用語の定義〈萎縮性瘢痕など〉・作成方法)
  - 表1 Clinical Question のまとめ 2023 (CQ1〜CQ47・CQ S1〜S4 の推奨度一覧)
  - 尋常性痤瘡治療アルゴリズムと酒皶病型別治療一覧 (図1 尋常性痤瘡治療アルゴリズム 2023・
    表2 酒皶病型別治療一覧 2023・表3 策定委員会の構成と利益相反)
  - 尋常性痤瘡の CQ1〜CQ47 (炎症性皮疹 CQ1〜17／面皰 CQ18〜24／炎症を伴う囊腫・硬結 CQ25・26／
    炎症軽快後の寛解維持 CQ27〜29／瘢痕 CQ30〜34／痤瘡全般 CQ35〜47)
  - 酒皶の CQ S1〜S4 (紅斑毛細血管拡張型〈第 1 度〉／丘疹膿疱型〈第 2 度〉／瘤腫型・鼻瘤〈第 3 度〉／
    スキンケア)

  推奨度は A / B / C1 / C2 / D で、薬剤ごとに分かれるものが多い (`A＊` は保険適用等の条件付き)。
  収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '尋常性痤瘡・酒皶治療ガイドライン\s*2023(\s*日本皮膚科学会ガイドライン)?'
  - '尋常性痤瘡・酒皶治療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。薬剤の濃度 (0.1％・2.5％ 等) や有効率を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
