notes: |
  ## 版の扱い
  - 2023 年版 (配信 PDF は 2023-08-20 版)。2017 年版の改訂版だが、旧版の PDF は素材に
    含まれないので落とした版は無い。
  - **尋常性痤瘡と酒皶が 1 冊にまとまった原本**なので、id も 1 本 (`尋常性痤瘡・酒皶2023`) に
    してある。CQ の番号体系も痤瘡が CQ1〜47、酒皶が CQ S1〜S4 と 1 冊の中で通っている。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・策定委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。薬剤の濃度 (0.1％ゲル・2.5％ゲル・3％配合ゲル)、
    有効率、症例数を守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 44 ページがいずれかのノードに載る。

  ## ページ内分割
  - 序 (p.1〜4)・表1 (p.5〜7) はページ境界と一致するので分割していない。アルゴリズム節の開始
    (p.8) と CQ1〜CQ47・CQ S1〜CQ S4 の境界は `from` / `until` で割った。
  - **p.5〜7 の表1 は CQ の一覧だが、行の書式が本体の見出しと違う** (一覧は `CQ2 炎症性皮疹に…`、
    本体は `CQ2：炎症性皮疹に…` と全角コロンが入る)。境界を `^CQ<n>[：:]` にしてあるので
    一覧行には当たらない。`^CQ1[：:]` が `CQ11：`〜`CQ17：` に当たることもない
    (数字の直後がコロンでないため)。
  - 酒皶の CQ は `CQ S1：` のように S 付きなので、`^CQ S<n>[：:]` を境界にしている。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
