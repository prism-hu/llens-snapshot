notes: |
  **版の判断**: 2012 年の「第 1 版」だが、これが現行版。学会の「一般公開ガイドライン」
  (https://www.dermatol.or.jp/medical/guideline/4742/) に改訂版の掲載が無く、カタログの
  note も同ページからのリンクとしか書いていない。原本 1 ページ目にも「第 1 版」とあり、
  末尾「最後に」で「将来，次の第 2 版作成も必要となると思われます」と書かれたまま
  止まっている。よって第 1 版を現行版として収録した (旧版として落とした PDF は無い)。

  **抽出モード**: 全 13 ページ `raw`。日皮会誌の 2 段組で、pdftotext の既定モードは
  左右の段の行が 1 行ずつ交互に出て本文が読めない。`layout` は段が横に並ぶだけで
  散文に向かない。`-raw` (内容ストリーム順) が段ごとに正しい順で出る。

  **strip**: この原本だけ柱下フッタ (`564 ● 日皮会誌：122（3） ，561-573，2012（平成 24）`
  / `日皮会誌：…● 563` の 2 形) と走り柱がページの**先頭 2 行**に出る (他の日皮会誌組版は
  末尾)。`strip_edge` (lines: 3) は先頭・末尾の両方を見るので同じ書き方で効く。実測で
  13 ページすべて落ちることを確認した。ノンブル単体 (`\d{1,3}`) は入れていない
  (表の数値・上付き文献番号・MIM 番号を巻き添えにするため)。康熙部首・縦書き用記号の
  混入は 0 件だったので `normalize_radicals` は付けていない。
  1 ページ目の書名行 (`皮膚疾患遺伝子診断ガイドライン（第 1 版）`) は走り柱と同じ文字列
  なので strip_edge で落ちるが、書名は front matter の title にある。

  **落としたページ**: 無し。全 13 ページがどこかのノードに載る。

  **表の配置**: 日皮会誌の組版では表が「次の節が始まるページの上部」に置かれるため、
  raw の読み出し順では表が節の切れ目をまたぐ。結果として
  `表 1`(遺伝性角化症) は「4．遺伝カウンセリング」ノードの p.4 部分の先頭に、
  `表 5`(色素性乾皮症) は「3．遺伝性色素異常症」ノードの p.9 部分の先頭に出る。
  どちらもキャプション付きで判別できるので、節の見出しを正しく切ることを優先して
  そのままにした (該当ページは vlm_candidates に入れてあり、overlay で正しく起こされる)。
