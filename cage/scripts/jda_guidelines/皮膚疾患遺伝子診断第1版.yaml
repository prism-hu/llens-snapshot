id: 皮膚疾患遺伝子診断第1版
title: 皮膚疾患遺伝子診断ガイドライン（第1版）
guideline: 皮膚疾患遺伝子診断ガイドライン（第1版）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮膚疾患遺伝子診断ガイドライン（第 1 版）』(皮膚疾患遺伝子診断ガイドライン作成委員会。
  澤村大輔・池田志斈・鈴木民夫・錦織千佳子・武藤正彦・清水 宏)。
  日皮会誌 122(3)：561-573，2012（平成 24）に掲載された全 13 ページ。

  日本医学会「医療における遺伝学的検査・診断に関するガイドライン」(2011 年 2 月) の
  皮膚科各論として作成されたもので、両方を併せて読むことが原本の求める使い方。
  CQ 形式ではなく、総論 4 節 + 各論 7 節の構成:

  - 総論: 1．遺伝子診断の目的と基本理念／2．インフォームド・コンセント／
    3．遺伝子（DNA）検査の結果の解釈とその説明／4．遺伝カウンセリング
  - 各論: 1．遺伝性角化症／2．表皮水疱症／3．遺伝性色素異常症（眼皮膚白皮症・
    遺伝性対側性色素異常症・まだら症・Waardenburg 症候群）／4．色素性乾皮症（XP）／
    5．ポルフィリン症（EPP・VP）／6．神経皮膚症候群（von Recklinghausen 病・Pringle 病）／
    7．疾患感受性遺伝子

  収録は 1 節 = 1 ノード。表 1〜表 6・図 1・図 2 は本文中に置かれる。
strip_edge:
  # この原本だけ柱下フッタと走り柱が**ページ先頭 2 行**に出る (他の日皮会誌組版は末尾)。
  # lines: 3 は先頭・末尾の両方を見るので書き方は同じ。
  # **`\d{1,3}` 単体は入れない** (表の数値・文献番号・MIM 番号が消えるため)
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
    - '皮膚疾患遺伝子診断ガイドライン（第 1 版）'
    - '皮膚疾患遺伝子診断ガイドライン作成委員会'
    - '.*日本皮膚科学会ガイドライン'
pdfs:
  - file: 皮膚疾患遺伝子診断ガイドライン（第1版）.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/1372912645_1.pdf
    label: 皮膚疾患遺伝子診断ガイドライン（第1版）
    # 日皮会誌の 2 段組。既定モードは左右の段が 1 行ずつ交互に出て読めないので raw
    mode: raw
