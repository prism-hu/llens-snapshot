notes: |
  - 学会誌 (日皮会誌) の 2 段組版面。既定モードでは左右の段が 1 行ずつ交互に出力される
    ため `mode: raw` にした。raw では柱 (書名／委員会名) とノンブルを含む出典行が
    ページ末尾 3 行に回るので `strip_edge` で受けている。
  - 全 45 ページがいずれかのノードに載る (落としたページは無い)。
  - 1 ページに 2 つ以上の節が始まる箇所 (p.2 の 6．/7．、p.18 の (2)/(3)、p.22 の (4)/(5)、
    p.32 の (8)/11．/(1) など) は `from` / `until` で割った。
  - 手湿疹診療ガイドライン (2018) と付表 4・5 (食品微量元素含有表、アレルゲン金属と
    歯科金属の対応表) が重複するが、別ガイドラインなので両方に収録している。
  - 2009 年版 (日皮会誌 119: 1757) は本版の改定前の版で、学会の掲載ページには
    置かれていない (cache にも無い)。現行版のみの収録。
