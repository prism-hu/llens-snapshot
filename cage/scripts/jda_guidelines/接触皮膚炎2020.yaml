id: 接触皮膚炎2020
title: 接触皮膚炎診療ガイドライン2020
guideline: 接触皮膚炎診療ガイドライン2020
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『接触皮膚炎診療ガイドライン 2020』(日本皮膚科学会接触皮膚炎診療ガイドライン
  改定委員会。日皮会誌 130(4), 523-567, 2020)。2009 年版の改定版。

  推奨度・エビデンスレベルは皮膚悪性腫瘍グループの「エビデンスのレベルと推奨度の
  決定基準」(付表 1) に基づく (エビデンスレベル I〜VI，推奨度 A / B / C1 / C2 / D)。

  構成 (全 11 節 + 付表 6 点):
  - 1〜5 総論 (作成の背景・位置づけ・免責条項・エビデンスのレベルと推奨度・概念)
  - 6 分類 / 7 病態 (感作相・惹起相) / 8 疫学
  - 9 臨床症状と検査 (パッチテストの準備・手順・判定。ジャパニーズスタンダード
    アレルゲン 2015 の陽性率と年次変化を含む)
  - 10 アレルゲンの推定 (部位別の原因、職業性・日用品・化粧品/毛染め・食物・金属・
    植物・医薬品/医療材料・光線の関与した接触皮膚炎を Q&A 形式で解説)
  - 11 治療法の EBM (ステロイド・免疫抑制剤・抗ヒスタミン薬・紫外線療法・
    金属ダイエット・バリアクリーム/手袋・パッチテスト)
  - 付表 1〜6 (エビデンスのレベルと推奨度の決定基準、上位 10 アレルゲンの変遷、
    金属パッチテストアレルゲン、食品微量元素含有表、アレルゲン金属と歯科金属の対応表、
    湿疹型薬疹の原因薬)

  収録は 1 節 (原本の「10．（N）…」レベル) = 1 ノード。
pdfs:
  - file: 接触皮膚炎診療ガイドライン2020.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/130_523contact_dermatitis2020.pdf
    label: 接触皮膚炎診療ガイドライン2020 (全 45 ページ)
    mode: raw
    # 学会誌の 2 段組。既定モードでは左右の段が 1 行ずつ交互に出るため raw を使う。
    # raw では柱とノンブルがページ末尾 3 行に回る。
    strip_edge:
      lines: 3
      patterns:
        - '接触皮膚炎診療ガイドライン 2020( 日本皮膚科学会ガイドライン)?'
        - '日本皮膚科学会接触皮膚炎診療ガイドライン委員会'
        - '.*日皮会誌：130（4）.*'
