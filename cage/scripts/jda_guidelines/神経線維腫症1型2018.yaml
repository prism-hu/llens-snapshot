notes: |
  - **原本は日本皮膚科学会雑誌の 2 段組**。既定モードは左段と右段を 1 行ずつ交互に出して
    読めなくなるため、全ページ `mode: raw` (内容ストリーム順) にした。
  - 柱とノンブル (`日皮会誌：128（1），17-34，2018（平成 30）● 17` 形式) を `strip_edge`
    (lines: 3) で落とした。**p.1 冒頭の書名行は 2 行に折り返されていて柱の文字列と一致しない**
    ので残っている (作成委員会の委員名も p.1 本文として残る)。
  - 第 2 章の CQ 境界は原本の `CQ<n>：` 見出し (全角コロン)。p.13 の**表 7 (推奨度一覧)** には
    `CQ2 皮膚の神経線維腫に…` のように**コロン無し**の行が並ぶので、`CQ\d+：` の形で
    アンカーして表の行を拾わないようにした。
  - 全 18 ページがどれかのノードに載っている。
  - 2008 年版 (日皮会誌 118: 1657-1666) はカタログに無く、本 PDF が現行版。
