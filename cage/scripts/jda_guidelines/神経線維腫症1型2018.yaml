description: |
  『神経線維腫症 1 型（レックリングハウゼン病）診療ガイドライン 2018』(日本皮膚科学会
  ガイドライン / 神経線維腫症 1 型診療ガイドライン改定委員会 編 / 日本皮膚科学会雑誌
  128(1), 17-34, 2018 年)。2008 年に日本皮膚科学会が作成した「NF1（レックリングハウゼン病）
  の診断基準および治療ガイドライン」の改定版。厚生労働科学研究費補助金 (難治性疾患等政策
  研究事業)「神経皮膚症候群に関する診療科横断的検討による科学的根拠に基づいた診療指針の確立」
  研究班の班員・研究協力者と日本皮膚科学会委託委員により作成された。

  構成は 2 章:
  - 第 1 章 … NF1 診療の基本的事項 (背景・位置付け・症状・診断・重症度分類・鑑別診断・
    治療・遺伝相談) の 2008 年版からの改定
  - 第 2 章 … NF1 の治療に関するエビデンスに基づいたクリニカルクエスチョン
    (CQ1〜CQ13、推奨度 A/B/C1/C2/D)

  第 2 章は 1 CQ = 1 ノード、第 1 章は見出し 1 節 = 1 ノードで切った。
