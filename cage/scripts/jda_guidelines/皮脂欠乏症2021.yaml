id: 皮脂欠乏症2021
title: 皮脂欠乏症診療の手引き2021
guideline: 皮脂欠乏症診療の手引き
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮脂欠乏症診療の手引き 2021』(皮脂欠乏症診療の手引き作成委員会。佐伯秀久・常深祐一郎・
  新井 達・市山 進・加藤則人・菊地克子・久保亮治・照井 正・中原剛士・二村昌樹・室田浩之・
  五十嵐敦之)。日皮会誌 131(10)：2255-2270，2021（令和 3）に掲載された全 16 ページ。

  皮脂欠乏症 (乾皮症) のうち医療用保湿剤による治療が必要な皮膚症状を定義し、標準化された
  診断・治療を示すことを目的とする。文献検索は原則 2020 年 12 月末まで。

  構成は 2 章:

  - 第 I 章 (総論、p.1-11): 1．はじめに（目的・免責事項・利益相反）／
    2．定義，病態，症状，疫学，診断など／3．治療（治療薬・外用方法・患者指導）／
    4．予後／5．保湿剤処方の実態調査／6．結語／文献
  - 第 II 章 皮脂欠乏症の EBMs (p.11-16): CQ1〜CQ6。推奨の強さは 1（強い推奨）/
    2（弱い推奨）、エビデンスレベルは A（高い）/B（低い）/C（とても低い）

  収録は総論が 1 節 = 1 ノード、CQ が 1 CQ = 1 ノード (推奨文・推奨度・解説・文献まで)。
strip_edge:
  # 柱下フッタは奇数/偶数ページで向きが入れ替わる 2 形。走り柱は書名と作成委員会名。
  # 1 ページ目の末尾だけ `<書名> 日本皮膚科学会診療の手引き` の合成バナーが出る。
  # **`\d{1,3}` 単体は入れない** (推奨度の数字・表のスコア・文献番号が消えるため)
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
    - '皮脂欠乏症診療の手引き 2021'
    - '皮脂欠乏症診療の手引き作成委員会'
    - '.*日本皮膚科学会診療の手引き'
