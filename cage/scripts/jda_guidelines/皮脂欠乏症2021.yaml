notes: |
  **名称のゆれ**: cache 上のファイル名と本文の書名は「皮脂欠乏症診療の手引き 2021」だが、
  学会の「一般公開ガイドライン」ページの表示およびカタログの `guideline` 列は年号なしの
  「皮脂欠乏症診療の手引き」。カタログ note にもその旨が書かれている。`guideline` は
  カタログに合わせて年号なし、`title`・`id` は原本の書名に合わせて 2021 付きにした。
  改訂版は出ておらず、これが現行版 (旧版として落とした PDF は無い)。

  **抽出モード**: 全 16 ページ `raw`。日皮会誌の 2 段組で、pdftotext の既定モードは
  左右の段の行が 1 行ずつ交互に出て本文が読めない。`layout` は段が横に並ぶだけで
  散文に向かない。`-raw` (内容ストリーム順) が段ごとに正しい順で出る。

  **strip**: 柱下フッタはページ**末尾**に出て、奇数/偶数ページで向きが入れ替わる
  (`日皮会誌：131（10） ，2255-2270，2021（令和 3）● 2257` と
  `2256 ● 日皮会誌：131（10） ，…` の 2 形)。走り柱は `皮脂欠乏症診療の手引き 2021`
  (奇数頁) と `皮脂欠乏症診療の手引き作成委員会` (偶数頁)、1 ページ目の末尾だけ
  `皮脂欠乏症診療の手引き 2021 日本皮膚科学会診療の手引き` のバナー。`strip_edge`
  (lines: 3) で 16 ページすべて落ちることを実測で確認した。ノンブル単体 (`\d{1,3}`) は
  入れていない (推奨度「1」「2」・表のスコア・文献番号を巻き添えにするため)。
  文献欄の日皮会誌は読点 (`日皮会誌，`)、フッタはコロン (`日皮会誌：`) なので、
  コロンで固定すれば文献行を巻き込まない。康熙部首・縦書き用記号の混入は 0 件だったので
  `normalize_radicals` は付けていない。
  1 ページ目の書名行は走り柱と同じ文字列なので strip_edge で落ちるが、書名は
  front matter の title にある。

  **ページ内分割**: p.12 は「第II章の総説の続き + CQ1 + CQ2 の開始」、p.13 は
  「CQ2 の続き + CQ3」、p.15 は「CQ4 の続き + CQ5 + CQ6 の開始」と 1 ページに
  2 つの CQ が始まるので `from` / `until` で割った。CQ 一覧 (表 10) の項目は
  `CQ1. …` (ピリオド)、CQ 本体の見出しは `CQ1：…` (全角コロン) で表記が違うので、
  コロンで固定すれば一覧を誤って切らない。

  **推奨度**: CQ1〜CQ5 は「推奨度：1」、CQ6 だけ推奨度の記載が無く
  「エビデンスレベル：B」のみ (推奨度をつけにくい CQ はエビデンスレベルの評価のみ、と
  第II章の総説に断りがある)。title にはその通りに書いた。

  **落としたページ**: 無し。全 16 ページがどこかのノードに載る。
