id: 頭部血管肉腫
title: 頭部血管肉腫診療ガイドライン
guideline: 頭部血管肉腫診療ガイドライン
publisher: 公益社団法人日本皮膚科学会（頭部血管肉腫診療ガイドライン作成委員会）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  原典正式名:「日本皮膚科学会ガイドライン 頭部血管肉腫診療ガイドライン」
  （日皮会誌 125(10): 1871-1888, 2015）。頭部血管肉腫診療ガイドライン作成委員会（委員長 増澤幹男）編。
  タイトルに年号が入らないため id は主題のみ（`頭部血管肉腫`）。

  総説（病名・発生頻度・腫瘍特性・診断と病勢の把握・腫瘍特性に基づく治療方針）と
  Clinical Question 13 件からなる。推奨度は A / B / C1 / C2 / D の旧式分類
  （Minds の GRADE 準拠に切り替わる前の枠組み）で、エビデンスは「レベル I〜VI」で示される。

  **同じセクションの `皮膚血管肉腫2025`（皮膚血管肉腫診療ガイドライン 2025、皮膚がん診療
  ガイドライン第 4 版）が後継にあたり、こちらは頭部に限定した旧版**。2025 年版は頭頸部以外
  （放射線照射後血管肉腫・Stewart-Treves 症候群）も扱い、推奨も Minds 2020 ver.3.0 準拠の
  GRADE 方式に切り替わっている。現行の推奨は 2025 年版を見ること。本書は学会の
  「一般公開ガイドライン」一覧に掲載が続いているため落とさずに収録した
  （動注化学療法・Mohs paste／フェノール腐食・胸腔内治療など、2025 年版が CQ として扱わない
  項目の記述が残る）。
