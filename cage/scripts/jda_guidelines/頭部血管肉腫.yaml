notes: |
  - **旧版として残す判断**: 本書は `皮膚血管肉腫2025`（皮膚がん診療ガイドライン第 4 版）の
    実質的な前身だが、①対象が頭部に限られること、②推奨度が旧式（A/B/C1/C2/D）であること、
    ③学会の「一般公開ガイドライン」一覧に現在も掲載されていること、から「改訂で置き換わった
    同一文書」ではなく**別文書**として扱い、単独 id で収録した。description に後継との関係を書いてある。
  - **抽出モード**: 日皮会誌の 2 段組で、各 CQ の直後に参考文献の段が入る版面。既定モードでは
    本文と参考文献が行単位で混ざる（p.4・p.6 で確認）ため `-raw`。
  - **ページの割り方**: 1 ページに 2 つの CQ が始まる箇所が多い（p.5・p.9・p.15 など）ので、
    CQ 境界は次の CQ 見出し（`CQ2．` 等）で切っている。CQ11 は p.13〜15 にまたがり、
    p.15 の後半に図1（TNM 分類）、p.16 に図2（アルゴリズム）が入るので CQ12 のノードに含めた。
  - **図**: 図1・図2 は画像で、テキスト層にはキャプション行しか出ない（p.16 は本文が文献のみ）。
    どちらも `vlm_candidates` に入れてある。
  - 落としたページは無い（全 18 ページがどこかのノードに載る）。
