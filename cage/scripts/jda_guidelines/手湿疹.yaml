notes: |
  - 学会誌 (日皮会誌) の 2 段組版面。既定モードでは左右の段が 1 行ずつ交互に出力されて
    本文が読めなかったので `mode: raw` にした。raw では柱 (書名／筆頭著者名) と
    ノンブルを含む出典行がページ末尾 3 行に回るので、`strip_edge` で受けている。
  - `strip_edge` の柱パターンは 1 ページ目の書名 (大扉の「手湿疹診療ガイドライン」) も
    巻き添えにするが、直後の作成委員会行は残るので実害はないと判断した。
  - 全 20 ページがいずれかのノードに載る (落としたページは無い)。
  - 1 ページに 2 つ以上の CQ が始まる箇所 (p.13 は CQ2b / CQ3a / CQ3b の 3 つ、
    p.14 は CQ4 / CQ5、p.18 は CQ7 / CQ8) は `from` / `until` で割った。
  - 原本には版・発行年を示す独立ページが無く、出典 (日皮会誌 128(3), 367-386, 2018) は
    各ページの柱に印字されている。strip_edge で落ちるので description に書き写した。
  - 旧版は存在しない (2018 年策定の初版で、学会ページにも 1 本しか掲載が無い)。
