id: 手湿疹
title: 手湿疹診療ガイドライン
guideline: 手湿疹診療ガイドライン
publisher: 日本皮膚科学会，日本皮膚アレルギー・接触皮膚炎学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『手湿疹診療ガイドライン』(日本皮膚科学会，日本皮膚アレルギー・接触皮膚炎学会，
  手湿疹診療ガイドライン委員会。日皮会誌 128(3), 367-386, 2018)。2014 年から委員会
  および書面審議を行って策定された，本邦の手湿疹の基本的・標準的治療の目安。

  推奨度・エビデンスレベルは皮膚悪性腫瘍グループの「エビデンスのレベルと推奨度の
  決定基準」(付表 1) に基づく (エビデンスレベル I〜VI，推奨度 A / B / C1 / C2 / D)。

  構成:
  - 総論 (背景・位置づけ・免責条項・エビデンスのレベルと推奨度・概念・分類)
  - 病態と診断 (発症機序による分類，皮疹の形態による分類，鑑別診断)
  - 疫学
  - 検査方法 (パッチテスト，プリックテスト)
  - 抗原 (金属・ゴム・樹脂・植物などアレルゲン各論)
  - クリニカルクエスチョン CQ1〜CQ9 (保湿剤・ステロイド・免疫抑制薬・抗ヒスタミン薬・
    紫外線療法・金属ダイエット・レチノイド・手袋・治療法と予後)

  収録は 1 節 = 1 ノード，CQ 部は 1 CQ = 1 ノード (推奨度・推奨文・解説・文献まで)。
pdfs:
  - file: 手湿疹診療ガイドライン.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/Hand_eczema_GL.pdf
    label: 手湿疹診療ガイドライン (全 20 ページ)
    mode: raw
    # 学会誌の 2 段組。既定モードだと左右の段が 1 行ずつ交互に出て本文が読めない
    # (`-raw` は内容ストリーム順なので段ごとに素直に並ぶ)。
    # raw では柱とノンブルが**ページ末尾**に回るので strip_edge で受ける。
    strip_edge:
      lines: 3
      patterns:
        - '手湿疹診療ガイドライン( 日本皮膚科学会ガイドライン)?'
        - '高山かおる ほか'
        - '.*日皮会誌：128（3）.*'
