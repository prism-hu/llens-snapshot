notes: |
  ## 版の扱い
  - 第 2 版 (2026)。初版の PDF は素材に含まれないので落とした版は無い。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・策定委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。LoS-JSS の配点、重症度分類の点数、
    合意度の中央値を守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 52 ページがいずれかのノードに載る。
  - **目次は p.1 の冒頭にあり、第 1 章の本文と同じページに組まれている**ので、
    落とさずに `01_ガイドラインについて` の冒頭に入れてある (title にも明記)。
    目次の行は `CQ1 限局性強皮症のどのような…― ―――― 1548` のようにリーダー罫と
    印字ページ番号が付く形で、CQ 本体の見出しとは別物。

  ## ページ内分割
  - 章境界 (第2章／第3章)、第 2 章の節境界 (2．病型分類〜7．治療・長期経過)、
    CQ1〜CQ20 の境界、末尾の「文 献」の開始を `from` / `until` で割った。
    第 3 章の見出しは CQ1 のノードの冒頭に入る。
  - 目次 (p.1) にも `CQ1 …` で始まる行があるが、CQ1 の `from` は p.16 にしか効かないので
    取り違えは起きない。`^CQ1\s` が `CQ10`〜`CQ20` に当たることもない。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
