id: 限局性強皮症2026
title: 限局性強皮症診療ガイドライン2026（第2版）
guideline: 限局性強皮症診療ガイドライン2026（第2版）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『限局性強皮症診療ガイドライン 2026（第 2 版）』(日本皮膚科学会ガイドライン)。
  限局性強皮症診療ガイドライン策定委員会が作成し、日本皮膚科学会雑誌 (通しページ 1533-1584) に
  掲載された。初版の改訂版。

  構成 (全 3 章):
  - 第 1 章 限局性強皮症診療ガイドライン 2026（第 2 版）について (1．背景と目的／
    2．本診療ガイドラインの位置付け／3．ガイドライン作成体制と改訂の経緯／
    4．エビデンスの収集と推奨決定の基本方針／6．免責事項／7．公開および改訂)
  - 第 2 章 限局性強皮症の診療概要 (1．疾患概念／2．病型分類〈表1 Tuffanelli と Winkelmann の分類・
    表2 Peterson らの分類〉／3．疫学／4．診断・評価法〈表4 Sato らの generalized morphea の
    分類基準・表5 LoS-JSS 点数表・表6 LoS-ADL 評価表・表7 重症度分類〉／5．鑑別／6．合併症／
    7．治療・長期経過)
  - 第 3 章 クリニカルクエスチョン（CQ）と推奨 CQ1〜CQ20

  推奨度は **GRADE 式の「1（推奨する）／2（提案する）」＋エビデンスの確実性 A〜D** の組み合わせ
  (1B・2D など) で示され、これに策定委員の**合意度** (中央値［四分位範囲］) が併記される。
  **1 つの CQ が治療の組み合わせごとに複数の推奨度を持つ**ことがある (CQ1・CQ7・CQ20)。
  収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '限局性強皮症診療ガイドライン\s*2026（第\s*2\s*版）(\s*日本皮膚科学会ガイドライン)?'
  - '限局性強皮症診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。LoS-JSS の配点・重症度分類の点数・合意度の数値を守るため端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
# 不等号付き等号のグリフ落ち (紙面 ≧ / ≦)
substitutions:
  - {find: '＞ ＿', replace: '≧', note: '≧ のグリフがテキスト層で ＞ と ＿ に割れる。紙面は ≧'}
