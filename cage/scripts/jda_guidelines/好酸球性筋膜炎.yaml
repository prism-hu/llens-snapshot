description: |
  原典正式名:「日本皮膚科学会ガイドライン 好酸球性筋膜炎 診断基準・重症度分類・診療ガイドライン」
  （日皮会誌 126(12): 2241-2250, 2016）。好酸球性筋膜炎 診断基準・重症度分類・診療ガイドライン
  委員会（神人正寿ほか）編。タイトルに年号が入らないため id は主題のみ（`好酸球性筋膜炎`）。

  好酸球性筋膜炎（eosinophilic fasciitis、Shulman 症候群）の診断基準・重症度分類と、
  CQ 16 件（診断 CQ1〜CQ8、治療 CQ9〜CQ15、経過 CQ16）を収める。推奨度は新 Minds の
  「推奨の強さ 1/2/なし」＋「エビデンスのレベル A〜D」の併記（例: 1D）。
  CQ の要約表（表3）、エビデンスレベル対応表（表2）、診療アルゴリズム（図1）、
  orange-peel-like appearance / groove sign の臨床所見（図2）を持つ。

  収録は 1 CQ = 1 ノード。
