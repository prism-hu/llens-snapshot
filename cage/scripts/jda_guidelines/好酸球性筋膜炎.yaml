notes: |
  - **抽出モード**: 日皮会誌の 2 段組。既定モードでは左右の段が行単位で混ざるため `-raw`。
  - **ノードの切り方**: 1 CQ = 1 ノード（CQ1〜CQ16）。1 ページに 3〜4 個の CQ が並ぶので
    `from` / `until` で割った。境界パターンは原本の見出しが 2 行に折り返すものがあるので
    折り返し前の 1 行目に合わせ、行末を `$` で固定してある — p.3 の表3
    （`CQ8 注意すべき合併症は何か？ 2D` のように推奨度が同じ行に続く）に誤って当たらないようにするため。
  - **表・図の載る先**: `-raw` は段抜きの表・図をページ末尾に回すので、表1（p.1）は CQ1、
    図1/表2（p.2）と表3（p.3）は CQ3、図2（p.4）は CQ5 のノードに載る。title に断ってある。
  - **ファイル名の全角スペース**: cache 上のファイル名は「好酸球性筋膜炎␣診断基準…」で
    区切りが全角スペース（U+3000）。配信名は URL basename の `kousankyu.pdf`。
  - 落としたページは無い（全 10 ページがどこかのノードに載る）。
