id: 皮膚リンパ腫2025
title: 皮膚リンパ腫診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
guideline: 皮膚リンパ腫診療ガイドライン2025（皮膚がん診療ガイドライン第4版）
publisher: 日本皮膚科学会・日本皮膚悪性腫瘍学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮膚リンパ腫診療ガイドライン 2025』(皮膚がん診療ガイドライン第 4 版 / 公益社団法人
  日本皮膚科学会・一般社団法人日本皮膚悪性腫瘍学会 皮膚がん診療ガイドライン策定委員会
  (皮膚リンパ腫診療ガイドライングループ) / 日本皮膚科学会雑誌 135(6), 1433-1529, 2025 年)。

  皮膚リンパ腫は皮膚に原発もしくは親和性の高い悪性リンパ腫の一群で、暫定病型を含め 18 病型が
  定義されている。菌状息肉症/セザリー症候群が最多 (本邦 45.2%)、次いで成人 T 細胞白血病・
  リンパ腫。Minds 準拠で作成され、CQ12 件 (推奨の強さ 1〜4 または「推奨なし」/
  エビデンスの強さ A〜D) を持つ。

  構成は 4 章 + 文献:
  - 第 1 章 皮膚リンパ腫診療ガイドラインについて (目的・対象・作成方法・COI、別表 1 委員一覧、
    別表 2 CQ 一覧と投票の棄権)
  - 第 2 章 皮膚リンパ腫総論 (病型・疫学 / 診断に必要な知識 / 病期分類 / 予後)
  - 第 3 章 皮膚リンパ腫各論 (T 細胞・NK 細胞リンパ腫 / 皮膚 B 細胞リンパ腫 / その他)
  - 第 4 章 クリニカルクエスチョン (CQ) と推奨 (CQ1〜CQ12)

  第 4 章は 1 CQ = 1 ノード (推奨・投票結果・背景・解説・文献検索式まで)。第 3 章の
  菌状息肉症/セザリー症候群は治療手段ごとの (1)〜(10) が長いので、それぞれ 1 ノードに割った。

  子セクション:
  - `95_推奨決定資料/CQ01`〜`CQ12` … 学会が「推奨作成関連資料 DL」zip で公開している
    CQ ごとの推奨決定資料 (RC-3 推奨の強さ決定投票用紙 + RC-7 EtD フレームワーク)。
    **本体の CQ ノードと title を揃えてある**
  - `96_スコープ` … 同 zip 同梱のスコープ (SC-1 疾患トピックの基本的特徴 / SC-2 診療アルゴリズム /
    SC-3 スコープ / SC-4 CQ の設定)
strip_edge:
  # 日皮会誌の柱とノンブル。raw モードではページ末尾の 2 行に来る
  # (`\d{1,3}` を strip に置くと推奨の強さ・合意率・病期の数値行まで消えるので edge 側)
  lines: 3
  patterns:
  - '\d{1,4} ● 日皮会誌：135（6）\s*，1433-1529，2025（令和 7）'
  - '日皮会誌：135（6）\s*，1433-1529，2025（令和 7）● \d{1,4}'
  - '皮膚がん診療ガイドライン策定委員会（皮膚リンパ腫診療ガイドライングループ）'
  - '皮膚がん診療ガイドライン第 4 版 皮膚リンパ腫診療ガイドライン 2025( 日本皮膚科学会ガイドライン)?'
# 不等号付き等号のグリフ落ち (紙面 ≧ / ≦)
substitutions:
  - {find: '＞ ＿', replace: '≧', note: '≧ のグリフがテキスト層で ＞ と ＿ に割れる。紙面は ≧'}
