    `strip_edge` (lines: 3) で落とした。推奨の強さ・エビデンスの強さ・合意率・病期・線量など
    **裸の数値行が本文に多い**ので、`\d{1,3}` は `strip` に置かず日皮会誌の行ごと edge で落とした。
  - 原本は折り返した見出しに `‌` (U+200C) と `\x07` を挟む
    (`CQ7 ‌ <BEL> 菌状息肉症への低線量…`)。U+200C は build が消すが `\x07` は残るので、
