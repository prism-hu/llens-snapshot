id: 壊疽性膿皮症2022
title: 壊疽性膿皮症診療の手引き2022
guideline: 壊疽性膿皮症診療の手引き2022
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『壊疽性膿皮症診療の手引き 2022』(日本皮膚科学会診療の手引き)。
  壊疽性膿皮症診療の手引き作成委員会が作成し、日本皮膚科学会雑誌に掲載された。
  壊疽性膿皮症 (pyoderma gangrenosum；PG) の診療の手引き。

  構成 (全 12 章):
  - 第 1 章 背景と目標 (位置づけと特徴・免責条項・今後の更新計画・利益相反・
    エビデンスの収集・エビデンスレベルと推奨度の決定事項)
  - 第 2 章 壊疽性膿皮症の疾患概念 / 第 3 章 診断基準と重症度分類 (表1 海外で提唱されている
    診断基準・表2 PG 診断基準の比較) / 第 4 章 疫学 / 第 5 章 臨床 (サブタイプ・
    Post-operative PG・Drug-induced PG・稀な部位・妊婦・小児・Pathergy・臨床検査所見) /
    第 6 章 病理組織像 / 第 7 章 鑑別診断 / 第 8 章 病態 / 第 9 章 基礎疾患・併存症
    (表3 本邦 PG 患者の特徴) / 第 10 章 自己炎症性疾患としての壊疽性膿皮症
    (PAPA 症候群・Hz/Hc 症候群・PASH 症候群) / 第 11 章 治療
  - 第 12 章 臨床設問（CQ）CQ1〜CQ29

  推奨度は A / B / C1 / C2 / D。CQ1〜CQ6 (診断に関するもの) は推奨度を付けず解説のみ。
  収録は 1 CQ = 1 ノード。

  これに学会が別に公開している薬剤別の手引き 1 本を子セクションとして収める:
  - `80_アダリムマブ使用手引き` … 『壊疽性膿皮症におけるアダリムマブの使用手引き』
    (壊疽性膿皮症診療におけるアダリムマブの使用手引き策定委員会、11 ページ)。
    適応・用法用量・国内第 III 相試験・適応になる場合／禁忌になる場合・Q&A 19 件
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '壊疽性膿皮症診療の手引き\s*2022(\s*日本皮膚科学会診療の手引き)?'
  - '壊疽性膿皮症診療の手引き作成委員会'
  - '壊疽性膿皮症におけるアダリムマブの使用手引き(\s*日本皮膚科学会診療の手引き)?'
  - '壊疽性膿皮症診療におけるアダリムマブの使用手引き策定委員会'
  - '日本皮膚科学会診療の手引き'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。診断基準の項目番号・投与量・発症率を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
