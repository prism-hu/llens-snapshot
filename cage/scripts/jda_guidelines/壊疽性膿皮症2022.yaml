notes: |
  ## 版と従属文書の扱い
  - 本体は 2022 年版。改訂版は公開されていない。
  - 『壊疽性膿皮症におけるアダリムマブの使用手引き』(11p) は学会ページでは独立掲載だが、
    本体の CQ25 (生物学的製剤) を薬剤単位に掘り下げた従属文書なので、同じ manifest の
    子セクション `80_アダリムマブ使用手引き` に収めた (共通指示の「使用ガイダンス類は
    親疾患の GL と同じ manifest の子セクション」に従った)。
  - **化膿性汗腺炎のアダリムマブ使用上の注意 (`Adalimumab_HS_Guidance.pdf`) は別疾患**なので
    ここには入れていない (化膿性汗腺炎の id の担当分)。

  ## 抽出モード
  - 2 本とも日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、
    `-layout` は 1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので
    両方 `mode: raw` にした。
  - 康熙部首の混入は 2 本とも 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (2 本それぞれの書名・委員会名) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。診断基準の項目番号、アダリムマブの投与量、
    発症率などを守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。本体 26 ページ・アダリムマブ使用手引き 11 ページのすべてが
    いずれかのノードに載る。

  ## ページ内分割
  - 本体は第 2〜12 章の章境界と CQ1〜CQ29 の境界、章末の「文 献」の開始を `from` / `until` で
    割った。第 12 章の見出しは CQ1 のノードの冒頭に入る。
  - アダリムマブ使用手引きは節境界 (3．／4．／5．) で割った。5．の Q&A 19 件は
    1 ノードにまとめてある (1 項目あたり数行と短く、相互に参照し合うため)。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
