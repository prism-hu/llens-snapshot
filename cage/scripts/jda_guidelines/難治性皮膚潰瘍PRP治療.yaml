id: 難治性皮膚潰瘍PRP治療
title: 多血小板血漿（PRP）を用いた難治性皮膚潰瘍の治療について
guideline: 多血小板血漿（PRP）を用いた難治性皮膚潰瘍の治療について
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『多血小板血漿（PRP）を用いた難治性皮膚潰瘍の治療について』(日本皮膚科学会、
  公開日 2020 年 3 月 6 日、全 4 ページ)。

  **これはガイドラインではなく学会の見解文書** (再生医療等安全性確保法下での
  実施要件を示したもの) である。自己多血小板血漿 (PRP) を褥瘡を含む難治性皮膚潰瘍に
  用いる場合の、対象疾患・選択基準・除外基準・中止基準と、『再生医療等の安全性の
  確保等に関する法律』に基づく手続き (（特定）認定再生医療等委員会での
  『第 3 種再生医療等提供計画』審査 → 厚生労働省への提供計画提出) を示し、
  採血・PRP 調整・投与・治療スケジュールの実施方法を記載する。CQ・推奨度・
  エビデンスレベルは持たない。

  構成は角括弧見出し ([対象疾患] [選択基準] [除外基準] [中止基準]
  [再生医療等の安全性の確保等に関する法律] [実施方法] [治療方法]) と、
  p.4 の「別添 閉鎖系分離機器使用の場合」(2020 年 1 月 31 日現在で認証・承認されている
  血液分離機器の一覧表)。4 ページなので 1 ページ = 1 ノードとした。
strip_edge:
  # ノンブルは各ページの**先頭行**に `1 / 4` の形で出る (raw モード)。
  # 日皮会誌組版ではないので柱・走り柱は無い。`\d{1,3}` 単体は入れない
  lines: 3
  patterns:
    - '\d+ / \d+'
