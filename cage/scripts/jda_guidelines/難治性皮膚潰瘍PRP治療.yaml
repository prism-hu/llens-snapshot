notes: |
  - **ガイドラインではなく学会の見解文書**。学会の「一般公開ガイドライン」ページに
    並んでいるが、原本には CQ も推奨度もエビデンスレベルも無く、再生医療等安全性確保法の
    下で PRP を難治性皮膚潰瘍に用いるときの実施要件 (適応・除外・中止・手続き・手技) を
    示したものである。`description` にもその旨を書いた。
  - 抽出モードは `raw`。1 段組なので既定でも散文は読めるが、p.4 の機器一覧表が
    既定モードでは列ごとに縦に並んで行の対応が壊れる。raw は表の 1 行が 1 行で出る。
  - `strip_edge` はノンブル `N / 4` だけ (raw ではページ**先頭行**に出る)。日皮会誌組版では
    ないので柱・走り柱は無い。`\d{1,3}` 単体は入れていない (本文に裸の数字行が出るため)。
  - 全 4 ページを 1 ページ = 1 ノードで収録。落としたページは無い。
  - p.2 の「『参考』先進医療技術 B における PRP 調整手順」は本文の一部なので実施方法の
    ノードに含めた (別ノードにしていない)。
