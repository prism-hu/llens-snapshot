notes: |
  - 1 ページの学会見解文書。テキスト層は健全（1 段組・図表なし）なので既定モードのまま、
    `strip` / `strip_edge` は要らなかった（柱もノンブルも無い）。康熙部首の混入も無いので
    `normalize_radicals` は付けていない。
  - **全 1 ページを収録**（落としたページは無い）。
  - 学会ページでは「皮膚真菌症診療ガイドライン2025」とは別に独立掲載されている学術委員会文書で、
    薬剤の使用ガイダンス類とは性格が違う（親 GL の付随文書ではなく、検査キットに対する学会見解）。
    割り当てに従って単独 id とした。皮膚真菌症診療ガイドライン2025 は別 id（別担当）。
  - `vlm_candidates` は無し（図表が無く、テキスト層だけで全文が読める）。
