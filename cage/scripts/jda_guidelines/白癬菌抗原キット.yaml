id: 白癬菌抗原キット
title: 白癬菌抗原キット（販売名：デルマクイック® 爪白癬）の臨床活用に関して
guideline: 白癬菌抗原キット（販売名：デルマクイック 爪白癬）の臨床活用に関して
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  日本皮膚科学会 皮膚真菌症ガイドライン委員会・医療問題検討委員会による見解文書
  （2021 年 11 月 12 日）。爪白癬診断用の白癬菌抗原キット（デルマクイック® 爪白癬）について、
  皮膚科臨床現場での位置づけ（KOH 直接鏡検の補完として使用する）と、非専門医が使用する
  場合の取り扱いを示し、Q&A 2 件を付す。A4 1 ページ。

  ガイドラインではなく学会の見解文書なので CQ・推奨度は無い。1 ページ 1 ノードで収録した。
