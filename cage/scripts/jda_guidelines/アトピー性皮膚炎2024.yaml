id: アトピー性皮膚炎2024
title: アトピー性皮膚炎診療ガイドライン2024
guideline: アトピー性皮膚炎診療ガイドライン2024年版
publisher: 日本皮膚科学会，日本アレルギー学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『アトピー性皮膚炎診療ガイドライン 2024』(公益社団法人日本皮膚科学会／一般社団法人
  日本アレルギー学会 アトピー性皮膚炎診療ガイドライン策定委員会。日皮会誌 134(11),
  2741-2843, 2024)。皮膚科診療を専門とする医師向けの日本皮膚科学会ガイドラインと、
  アレルギー疾患診療に関わる医師向けの厚生労働省研究班／日本アレルギー学会ガイドライン
  を 2018 年に統合したものの改訂版 (2021 年版の改訂)。

  構成:
  - 第 I 章 (1．はじめに／2．定義，病態，疫学，診断，重症度など／3．治療／
    4．小児における注意事項)
  - 第 II 章 アトピー性皮膚炎の EBMs (CQ1〜CQ38。推奨度 1/2 とエビデンスレベル A〜D)
  - 付表 1〜3 (CDLQI，QP9，JCMV-CADIS の評価票)
  - 文献

  学会ページでは付随ガイダンス 2 本 (JAK 阻害内服薬・生物学的製剤) が独立に掲載されて
  いるが、本体と一体で使うものなので同じ manifest の子セクション
  (`80_使用ガイダンス_JAK阻害内服薬` / `81_使用ガイダンス_生物学的製剤`) に収めた。

  収録は第 I 章が 1 節 (x.y レベル) = 1 ノード、第 II 章が 1 CQ = 1 ノード。
pdfs:
