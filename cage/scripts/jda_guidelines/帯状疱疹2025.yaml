id: 帯状疱疹2025
title: 帯状疱疹診療ガイドライン2025
guideline: 帯状疱疹診療ガイドライン2025
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『帯状疱疹診療ガイドライン 2025』（日本皮膚科学会 帯状疱疹診療ガイドライン策定委員会、
  委員長 浅田秀夫。日皮会誌 135(3)：527-556，2025(令和 7)）。日本皮膚科学会として**初版**
  （本文 1.1 が「帯状疱疹診療ガイドライン（第 1 版）作成の目的」）。策定費用はすべて
  日本皮膚科学会が負担。エビデンスのレベル分類（I〜VI）と推奨度（A / B / C1 / C2 / D）を用いる。

  帯状疱疹後神経痛（PHN）の診療には CQ を設けず、日本ペインクリニック学会の
  「ペインクリニック治療指針 改訂第 7 版」「神経障害性疼痛薬物療法ガイドライン 改訂第 2 版
  （追補版を含む）」「非がん性慢性疼痛に対するオピオイド鎮痛薬処方ガイドライン 改訂第 3 版」
  を参照する方針をとっている。

  構成:
  - 第 1 章 ガイドライン作成にあたって（作成の目的・背景・位置づけ・エビデンスレベルと
    推奨度・資金提供者と利益相反）
  - 第 2 章 帯状疱疹総論（2.1 病因・病態／2.2 疫学／2.3 臨床症状／2.4 合併症／
    2.5 診断，検査／2.6 治療／2.7 感染対策／2.8 予防）
  - 第 3 章 クリニカルクエスチョン（CQ）と推奨（CQ1〜CQ25。診断 8 件・治療 13 件・予防 4 件）
  - 文献（1)〜174)）

  収録は 1 CQ = 1 ノード、第 2 章は 1 節 = 1 ノード。
strip_edge:
  # 柱下フッタ (奇数/偶数ページで左右が入れ替わる 2 形) と走り柱。ページ末尾に出る。
  # **`\d{1,3}` 単体は入れない** (推奨度表・表の数値・文献番号が消えるため)
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
    - '帯状疱疹診療ガイドライン\s*2025'
    - '帯状疱疹診療ガイドライン策定委員会'
    - '.*日本皮膚科学会ガイドライン'
pdfs:
  - file: 帯状疱疹診療ガイドライン2025.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/Taijouhoushin2025.pdf
