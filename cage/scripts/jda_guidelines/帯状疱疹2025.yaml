notes: |
  - 原本は日皮会誌 135(3)：527-556，2025（令和 7）に掲載された 30 ページの学会誌組版
    （2 段組）。**抽出は全ページ `raw`**。既定モードでは左右の段の行が 1 行ずつ交互に出て
    本文が読めず、`layout` は段が横に並ぶだけで散文にならない。`-raw`（内容ストリーム順）
    だけが段ごとに正しい順で出る。
  - strip は使わず `strip_edge`（端 3 行）だけ。柱下フッタは奇数/偶数ページで左右が
    入れ替わる 2 形（`日皮会誌：… ● 527` と `528 ● 日皮会誌：…`）で、どちらも
    `日皮会誌：`（コロン）を含む。文献欄の日皮会誌は `日皮会誌，`（読点）なので巻き込まない。
    走り柱は `帯状疱疹診療ガイドライン 2025`（奇数ページ）と `帯状疱疹診療ガイドライン策定委員会`
    （偶数ページ）、1 ページ目だけ末尾に `… 日本皮膚科学会ガイドライン` の合成バナー。
    **`\d{1,3}` 単体は入れていない**（推奨度の記号・表の数値・文献番号が消えるため）。
  - `strip_edge` は先頭 3 行にも効くので、**p.1 の冒頭 2 行（表題と策定委員会名）が
    走り柱と同文のため落ちる**。表題・作成主体は manifest の title / publisher と
    `01_ガイドライン作成にあたって` の body_text に残した（策定委員 16 名の名簿は本文に残る）。
  - `normalize_radicals` は付けていない（康熙部首・縦書き用記号の混入 0 件を実測）。
  - **落としたページは無い（p.1-30 全ページがどこかのノードに載る）。** 表紙・目次・奥付に
    あたるページは無く、1 ページ目が表題・策定委員・第 1 章を兼ねている。
  - ノード粒度: CQ は 1 CQ = 1 ノード（25 件）、第 2 章は原本の節 2.1〜2.8 = 1 ノード、
    第 1 章は 2 ページで節も短いので 1 ノードにまとめた。**1 ページに 2〜3 個の CQ が
    始まるページが多い**（p.12 に CQ1/CQ2、p.14 に CQ4/CQ5、p.18 に CQ11/CQ12/CQ13、
    p.20 に CQ15/CQ16/CQ17、p.24 に CQ23/CQ24/CQ25 と文献）ので `from` / `until` で割り、
    同じページを共有する側に `allow_overlap: true` を付けた。
  - 第 3 章の章見出し（`第 3 章 クリニカルクエスチョン（CQ）と推奨`）は CQ1 の直前に
    1 行だけ出るので、`CQ01` の範囲を章見出しから始めて拾っている。
  - title の推奨度は各 CQ の推奨度表から写した。CQ14（ステロイド）と CQ18（オピオイド）は
    推奨度が 1 CQ に複数あるので、原本の項目名ごと併記した。CQ24 の設問末尾は原本が
    半角 `?`（他の CQ は全角 `？`）なので、そのまま写している。
  - 文献（1)〜174)、p.24-30）は 1 ノードで 3 万字を超えるので、`04_文献/` の下に
    ページ境界の文献番号で 2 ノードに割った（p.24 は CQ23〜CQ25 が前半にあるので
    `from: '^文\s*献'` で切っている）。
  - 帯状疱疹後神経痛（PHN）の治療は本ガイドラインに CQ が無く、2.6 治療と図3 の中で
    日本ペインクリニック学会のガイドラインを参照する形で扱われている（description 参照）。
