id: 化膿性汗腺炎2020
title: 化膿性汗腺炎診療の手引き2020
guideline: 化膿性汗腺炎診療の手引き2020
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『化膿性汗腺炎診療の手引き 2020』(日本皮膚科学会ガイドライン)。化膿性汗腺炎診療の手引き策定委員会
  (葉山惟大・照井正ほか 18 名) が作成し、日本皮膚科学会雑誌 131 巻 1 号 1-28 頁 (2021 年／令和 3 年) に掲載された。
  化膿性汗腺炎 (hidradenitis suppurativa：HS) についての本邦初の手引きで、CQ 形式ではなく
  章・節立ての総説形式をとる。

  構成 (全 7 章):
  - 第 1 章 背景 (背景と目標・位置づけと特徴・更新計画・利益相反・エビデンスの収集・エビデンスレベルと推奨度・免責条項)
  - 第 2 章 定義と診断基準 (定義・診断基準・分類と重症度評価〈Hurley 病期分類／Sartorius スコア／IHS4／PGA〉・臨床分類・治療の評価〈HiSCR〉)
  - 第 3 章 疫学 (有病率・性差・好発年齢・罹病期間・好発部位・QOL・悪化因子・併存疾患・有棘細胞癌／Crohn 病／外痔瘻の合併)
  - 第 4 章 発症機序 (病理組織・炎症・遺伝的背景〈γ-secretase〉・喫煙／肥満／細菌／機械的刺激／ホルモン)
  - 第 5 章 合併症 (急性・慢性局所性・悪性腫瘍・全身性・リウマチ疾患)
  - 第 6 章 治療 (外用薬・内服療法・注射薬など・生物学的製剤・外科療法・補助的治療法)
  - 第 7 章 治療のまとめとアルゴリズム

  あわせて、先行する薬剤別文書『化膿性汗腺炎におけるアダリムマブの使用上の注意／化膿性汗腺炎の診療の手引き』
  (2019 年 3 月 1 日 web 公開、アダリムマブ・化膿性汗腺炎診療の手引き策定委員会) を
  子セクション `80_アダリムマブ使用上の注意` として同じ id に収める。2019 年 2 月のアダリムマブ
  適応追加を受けて作られた製剤別の注意事項で、本手引き 2020 とは別文書 (本手引きが置き換えたものではない)。
