notes: |
  ## 束ね方
  - 学会ページでは「化膿性汗腺炎診療の手引き2020」と「化膿性汗腺炎におけるアダリムマブの使用上の注意」が
    別項目として掲載されているが、後者は前者に従属する薬剤別文書なので同じ id の子セクション
    `80_アダリムマブ使用上の注意` に収めた (共通指示の「使用ガイダンス・使用上の注意は親疾患 GL と同じ manifest」)。
  - アダリムマブ文書は 2019 年 3 月公開で 2020 年の手引きより**先行**する。後半の【参考資料】は
    短い「化膿性汗腺炎の診療の手引き」だが、これは 2020 年の手引きの旧版ではなく欧米文献のまとめなので、
    落とさずそのまま子ノードに入れてある (2020 の手引きが本体)。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は 1 行に
    左段 + 右段が並ぶ。`-raw` (内容ストリーム順) だけが段ごとに上から下へ出るので両 PDF とも `mode: raw`。
  - 康熙部首の混入は 0 件だったので `normalize_radicals` は付けていない。

  ## strip
  - raw モードでは柱 (書名・委員会名) とノンブル入りフッタが**ページ末尾**に出る。
    フッタは `●` を必ず含むので、文献リスト中の「日皮会誌，2018; 128: …」とは紛れない。
    アダリムマブ文書にはノンブルも柱も無い (テキスト層に出ない)。
  - `\d{1,3}` の裸のノンブルは無いので `strip_edge` は置いていない (重症度スコアの素点を守るため)。

  ## 落としたページ
  - 無し。両 PDF の全ページがどこかのノードに載る。
