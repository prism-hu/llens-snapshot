id: 尋常性疣贅2019
title: 尋常性疣贅診療ガイドライン 2019（第 1 版）
guideline: 尋常性疣贅診療ガイドライン2019
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『尋常性疣贅診療ガイドライン 2019（第 1 版）』(日本皮膚科学会尋常性疣贅診療
  ガイドライン策定委員会、日皮会誌 129(6): 1265-1292, 2019 (令和 1))。委員長は
  渡辺大輔 (愛知医科大学)。わが国で初めて尋常性疣贅の治療を質的に評価した
  ガイドラインで、それまでは英国皮膚科学会のガイドライン (2014) と Cochrane の
  システマティックレビューしか拠り所が無かった。

  構成は**章番号つきの 14 節**で、CQ は「11．尋常性疣贅の治療」の小節 11.4 に
  24 件まとまっている (推奨度 A/B/C1/C2/D。基準は日本皮膚科学会編 皮膚悪性腫瘍
  診療ガイドラインに準拠)。CQ は物理的治療法 (CQ1-7)・化学的治療法 (CQ8-11)・
  薬理学的治療法 (CQ12-17)・免疫学的治療法 (CQ18-22)・その他 (CQ23 プラセボ、
  CQ24 暗示療法) に分かれる。

  構成 (全 14 節):
  - 1〜4 節 作成の目的・背景・位置付け・利益相反
  - 5 節 疣贅の定義 (表 1 疣贅の分類)
  - 6 節 HPV の特徴と生活環 (粒子とゲノム構造・分類と疾患・生活環。表 2 用語集)
  - 7〜9 節 病型分類、疫学、感染経路
  - 10 節 診断および検査 (視診・ダーモスコピー・病理組織・免疫組織・HPV 遺伝子型同定)
  - 11 節 尋常性疣贅の治療 (治療の概説、エビデンス収集、分類基準、CQ 24 件。表 4 疣贅治療一覧)
  - 12 節 疣贅治療アルゴリズム (図 1) と参考アルゴリズム 3 種 (足底・多発性・小児)
  - 13〜14 節 治癒判定、結語
  - 末尾に英文抄録

  収録は 1 節 = 1 ノード。11 節だけは長いので小節 11.1〜11.4 を子ノードにし、
  さらに 11.4 の 24 CQ を 1 CQ = 1 ノードにした。
strip_edge:
  # 日皮会誌の柱下フッタ (奇数/偶数ページで左右が入れ替わる 2 形)、走り柱、
  # 1 ページ目の右上バナー (この原本では走り柱と 1 行に合成されている)。
  # **ページの先頭/末尾 3 非空行だけ**に効かせる。`\d{1,3}` 単体は入れない
  # (表 1〜4 の数値、HPV 型番号、推奨度の数字を巻き添えにするため)。
  # 文献欄の日皮会誌は読点 (`日皮会誌，`)、フッタはコロン (`日皮会誌：`)
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
    - '尋常性疣贅診療ガイドライン 2019（第 1 版）'
    - '日本皮膚科学会尋常性疣贅診療ガイドライン策定委員会'
    - '.*日本皮膚科学会ガイドライン'
pdfs:
  - file: 尋常性疣贅診療ガイドライン2019（第1版）.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/yuzei_gl2019.pdf
    label: 本体 (全 28 ページ)
    # 日皮会誌の 2 段組。既定モードは左右の段の行が 1 行ずつ交互に出て本文が読めず、
    # layout は段が横に並ぶだけで散文にならない。raw (内容ストリーム順) が
    # 段ごとに正しい順で出る
    mode: raw
