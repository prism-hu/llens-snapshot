notes: |
  - 抽出モードは全ページ `raw`。日皮会誌の 2 段組で、既定モードは左右の段の行が
    1 行ずつ交互に出て本文が読めない。`layout` は段が横に並ぶだけで散文にならない。
    raw (内容ストリーム順) が段ごとに正しい順で出る。
  - `strip_edge` (lines: 3) は柱下フッタ 2 形 (奇数/偶数ページで左右が入れ替わる)、
    走り柱 2 種、1 ページ目のバナー (この原本では走り柱と 1 行に合成されて
    `尋常性疣贅診療ガイドライン 2019（第 1 版） 日本皮膚科学会ガイドライン` と出る)。
    `\d{1,3}` 単体は入れていない (表 1〜4 の数値、HPV 型番号、有効率のパーセントを
    巻き添えにするため)。文献欄の「日皮会誌，」は読点、フッタは「日皮会誌：」コロン。
  - **p.1 の先頭 2 行 (標題「尋常性疣贅診療ガイドライン 2019（第 1 版）」と
    「日本皮膚科学会尋常性疣贅診療ガイドライン策定委員会」) は走り柱と同じ文字列**なので
    strip_edge で落ちる。版・作成主体は manifest の title / publisher / description が
    持っている。策定委員の氏名は p.1 に残っており `01_ガイドライン作成の目的` に、
    所属一覧は `04_利益相反` に入る。
  - `normalize_radicals` は不要 (康熙部首・縦書き用記号の混入 0 件を実測)。
  - 節の見出しには U+200C (ZWNJ) と U+0007 (BEL) が混ざるものがある
    (`1．<ZWNJ> <BEL> 尋常性疣贅…`、`11.4 <ZWNJ> <BEL> 治療薬についての…`)。ZWNJ は build の
    clean が落とすが BEL は残るので、`from` / `until` は番号までで打ち切ってある。
  - 全 28 ページがどこかのノードに載る。落としたページは無い。表紙・目次・奥付は
    この原本には無い (日皮会誌の記事なので 1 ページ目が本文の始まり)。
  - **本文の CQ 番号と表 4・図 1 の CQ 番号が食い違う** (本文は CQ1 外科的切除 /
    CQ2 いぼ剝ぎ法 / CQ3 液体窒素凍結療法 …、表 4 と図 1 は液体窒素凍結療法を CQ2、
    電気凝固を CQ3、いぼ剝ぎ法を CQ6 とする)。原本のままの食い違いで、
    **ノードの path と title は本文側の番号**に揃えてある。表 4 は
    `11_尋常性疣贅の治療/04_治療についてのCQ` に、図 1 は `12_疣贅治療アルゴリズム` に
    そのまま入っているので、引く側は両方を見られる。
  - raw の内容ストリーム順の都合で、表は本文の途中や末尾に割り込む。
    p.8 の表 3 は 11.3 のものなので 11.3 に 2 区間目として拾い CQ3 は表 3 の直前で切った。
    p.9 の表 4 は 11.4 全体のものなので 11.4 に 2 区間目として拾い、CQ3 の p.9 分は
    表 4 の直前までとした。
  - 第 1 版のみ。2026-09-07 時点で学会の一般公開ガイドラインページに改訂版・追補版は無い。

