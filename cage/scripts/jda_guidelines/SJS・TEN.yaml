id: SJS・TEN
title: 重症多形滲出性紅斑 スティーヴンス・ジョンソン症候群（皮膚粘膜眼症候群）・中毒性表皮壊死症 診療ガイドライン
guideline: 重症多形滲出性紅斑 スティーヴンス・ジョンソン症候群・中毒性表皮壊死症診療ガイドライン
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『重症多形滲出性紅斑 スティーヴンス・ジョンソン症候群（皮膚粘膜眼症候群）・中毒性表皮壊死症
  診療ガイドライン』(日本皮膚科学会ガイドライン)。重症多形滲出性紅斑ガイドライン作成委員会が作成し、
  日本皮膚科学会雑誌 126 巻 9 号 1637-1685 頁 (2016 年／平成 28 年) に掲載された。厚生労働科学研究費補助金
  難治性疾患等政策研究事業 (難治性疾患政策研究事業)「重症多形滲出性紅斑の病態解明と治療指針作成に
  関する研究」班と連携して作られている。

  本体の構成:
  - 序文 (目的と対象・位置づけ・資金提供者と利益相反・推奨度の決定基準・表1 略語一覧・エビデンスのレベル分類)
  - I．スティーヴンス・ジョンソン症候群（SJS）の診断基準
  - II．中毒性表皮壊死症（TEN）の診断基準
  - III．SJS 及び TEN の重症度分類 (表2・表3 継時的病勢評価スコア表)
  - IV．SJS 及び TEN の治療指針（2016）(ステロイド全身投与・IVIg・その他の全身療法・局所療法・免責事項)
  - V．診療ガイドライン (CQ1〜CQ67。原因／病態／診断／検査／治療〈全身療法・皮膚局所療法・眼病変〉／
    後遺症・続発症／回復後のケア)
  - VI．疫学調査結果 (基礎疾患・感染症の関与・臓器病変・眼病変・治療実態・小児例・DIHS オーバーラップ)
  - VII．疾患の理解のために (関係リンク・補足解説／参考資料〈DIHS 診断基準・表10 SCORTEN・表11 ALDEN〉・海外の参考資料)

  推奨度は A / B / C1 / C2 / D、エビデンスのレベルは I〜VI で示される。

  これに学会が後から公開した従属文書 2 本を子セクションとして収める:
  - `90_補遺2025` … 『重症多形滲出性紅斑 スティーヴンス・ジョンソン症候群（皮膚粘膜眼症候群）・
    中毒性表皮壊死症診療ガイドライン補遺 2025』(重症多形滲出性紅斑診療ガイドライン策定委員会、14 ページ)。
    CQ1〜CQ16 と、SJS/TEN 診断基準（2025）(表3) の改訂を含む
  - `91_補遺追記2025` … 同補遺への追記 (2 ページ)。ステロイド不応 SJS/TEN に対するエタネルセプトの
    Clinical Question 1 件

  収録は 1 CQ = 1 ノード (推奨文 + 解説 + 文献)。CQ を持たない章 (診断基準・重症度分類・治療指針・
  疫学調査結果・疾患の理解のために) は原本の節で 1 ノードにしてある。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '重症多形滲出性紅斑\s*スティーヴンス・ジョンソン症候群・中毒性表皮壊死症\s*診療ガイドライン(\s*日本皮膚科学会ガイドライン)?'
  - '重症多形滲出性紅斑スティーヴンス・ジョンソン症候群・中毒性表皮壊死症診療ガイドライン'
  - '重症多形滲出性紅斑スティーヴンス・ジョンソン症候群（皮膚粘膜眼症候群）\s*・中毒性表皮壊死症診療ガイドライン補遺\s*(追記\s*)?2025(\s*日本皮膚科学会ガイドライン)?'
  - '重症多形滲出性紅斑ガイドライン作成委員会'
  - '重症多形滲出性紅斑ガイドライン策定委員会'
  - '重症多形滲出性紅斑診療ガイドライン策定委員会'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。診断基準の番号・表の数値を守るため strip ではなく端だけに効かせる
  lines: 3
  patterns:
    - '\d{1,3}'
# 不等号付き等号のグリフ落ち (紙面 ≧ / ≦)
substitutions:
  - {find: '＞ ＿', replace: '≧', note: '≧ のグリフがテキスト層で ＞ と ＿ に割れる。紙面は ≧'}
