notes: |
  ## 版と従属文書の扱い
  - 本体は 2016 年版 (日皮会誌 126(9): 1637-1685)。**本体の全面改訂版は公開されていない**ので、
    学会が後から出した「補遺 2025」(14p) と「補遺 追記 2025」(2p) を同じ manifest の
    子セクション `90_補遺2025` / `91_補遺追記2025` に収めた。3 本とも学会の一般公開ガイドライン
    ページからリンクされている別 PDF で、CQ の番号体系が互いに独立しているため統合はしていない。
  - 補遺 2025 は診断基準を更新している (表3 SJS/TEN 診断基準（2025）)。本体 I／II の診断基準と
    併存するので、引くときは**補遺側が新しい**。

  ## 配信名 (slug)
  - 本体の URL は `.../EM%20major%281%29.pdf` で、basename が percent-encode を含み ASCII の
    配信名にならないので `url:` を書かず、カタログの `slug: EM_major_1.pdf` を使った。
  - 補遺 追記 2025 の URL は WordPress の 32 桁ハッシュ名なので同様に
    `slug: jda_sjs_ten_2025_addendum_note.pdf` を使った。
  - cache 上のファイル名には**ゼロ幅接合子 (U+200C)** が混ざっているものがある
    (補遺2025)。manifest の `pdfs[].file` は cache の実ファイル名をそのまま写してある。

  ## 抽出モード
  - 3 本とも日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので全 PDF を `mode: raw` にした。
  - 康熙部首の混入は 3 本とも 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・作成委員会名) と版面フッタ (「1670 ● 日皮会誌：126（9），1637-1685，2016（平成 28）」)
    を `strip` に置いた。フッタは `●` を必ず含むので文献中の「日皮会誌」引用とは紛れない。
  - 裸のノンブルは `strip_edge` (lines: 3)。診断基準の項目番号 (1.〜5.)、SCORTEN／ALDEN の配点、
    疫学調査の集計値を守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。本体 49 ページ・補遺 14 ページ・追記 2 ページのすべてがいずれかの
    ノードに載る。

  ## ページ内分割
  - 本体は 1 ページに 2〜4 件の CQ が始まる版面 (p.36 は CQ53〜CQ56 の 4 件) なので、
    CQ 境界・章境界 (2．病態／3．診断／4．検査／5．治療／5-2．皮膚局所療法／5-3．眼病変／
    6．後遺症・続発症／7．回復後のケア／VI／VII) をすべて `from` / `until` で割った。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
  - 章見出しがある境界では CQ 番号ではなく**章見出し**を境界にした (章見出しの行が次の CQ の
    ノードの冒頭に入る)。

  ## そのほか
  - 表・図は学会誌組版のため本文の途中に組まれ、raw では節見出しより後ろに流れる。
    どのノードにどの表が載るかは title に明記した。
