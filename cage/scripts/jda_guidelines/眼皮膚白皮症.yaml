notes: |
  - **原本 (本体) は日本皮膚科学会雑誌の 2 段組**。既定モードは左段と右段を 1 行ずつ交互に
    出して読めなくなるため `mode: raw` (内容ストリーム順) にした。
    **補遺は 1 段組で全ページが表**なので、桁を保つ `mode: layout` に分けた。
  - 柱 (`眼皮膚白皮症診療ガイドライン` / `…診断ガイドライン作成委員会` — 原本で「診療」と
    「診断」が混在する) とノンブル (`日皮会誌：124（10）…● 1897` 形式) を `strip_edge`
    (lines: 3) で落とした。**p.1 冒頭の書名行も柱と同じ文字列**なので巻き添えで消える。
  - 各節の末尾に節ごとの「文 献」が付く体裁なので、文献は節のノードに含めた
    (文献だけのノードは作っていない)。
  - 本体 15 ページ・補遺 3 ページの全ページがどれかのノードに載っている。
  - 補遺は「改訂」ではなく**本体に追加する別文書**なので、本体を落とさず
    子セクション `90_補遺2017` として両方収録した。
