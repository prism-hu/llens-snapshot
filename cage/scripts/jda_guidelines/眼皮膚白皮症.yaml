  - path: 90_補遺2017
    title: 補遺 (2017) — 指定難病の診断基準・病型診断の診断基準・重症度基準
    body_text: |
      2015 (平成 27) 年に眼皮膚白皮症が医療費助成対象疾患 (指定難病) に含まれたことを受け、
      示された診断基準・病型診断の診断基準・重症度基準を本ガイドラインに取り込んだ補遺
      (日皮会誌 127(2), 133-135, 2017)。表 1 診断基準、表 2 診断のカテゴリー、
      表 3 病型診断のための診断基準、表 4 症候型白皮症の診断基準、表 5 重症度を判定する基準。
    body:
      # p.1 は 2 段組の地の文なので raw、p.2〜3 は診断基準・重症度基準の表なので layout
      - {pdf: 眼皮膚白皮症診療ガイドライン補遺.pdf, pages: 1, mode: raw}
      - {pdf: 眼皮膚白皮症診療ガイドライン補遺.pdf, pages: [2, 3]}
