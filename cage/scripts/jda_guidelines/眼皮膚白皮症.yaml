id: 眼皮膚白皮症
title: 眼皮膚白皮症診療ガイドライン
guideline: 眼皮膚白皮症診療ガイドライン
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『眼皮膚白皮症診療ガイドライン』(日本皮膚科学会ガイドライン / 眼皮膚白皮症診療ガイドライン
  作成委員会 編 / 日本皮膚科学会雑誌 124(10), 1897-1911, 2014 年) と、その
  『補遺』(同 127(2), 133-135, 2017 年)。

  眼皮膚白皮症 (oculocutaneous albinism：OCA) はメラニン生合成経路の異常による先天性の
  低色素症で、皮膚・毛髪・眼の低色素、視力障害・眼振を呈する。ヘルマンスキー・パドラック
  症候群、チェディアック・東症候群、グリセリ症候群などの症候型を含む。

  本体は 12 の通し見出し (背景・位置づけ・免責条項 / 定義・概念 / 疫学 / 病因・病態 / 症状 /
  診断 / 検査 / 生活指導 / 治療に関する Clinical Question / 眼科的側面) からなり、
  Clinical Question は治療に関する CQ1〜6 と眼科領域の CQ7〜8 の計 8 問 (推奨度 A〜D)。
  1 CQ = 1 ノードで切り、それ以外は見出し 1 節 = 1 ノード (短い節は隣と束ねた)。

  『補遺』は 2015 年の指定難病化にともなって示された診断基準 (表 1・表 2)、
  病型診断の診断基準 (表 3・表 4)、医療費助成のための重症度基準 (表 5) を取り込んだもので、
  子セクション `90_補遺2017` に収めた。
strip_edge:
