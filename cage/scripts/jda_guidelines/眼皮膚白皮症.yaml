  - '日皮会誌：12[47]（\d{1,2}）\s*，[\d-]+，20\d\d（(平成|令和) \d{1,2}）● \d{1,4}'
  - '眼皮膚白皮症診(療|断)ガイドライン作成委員会'
  - '眼皮膚白皮症診(療|断)ガイドライン( 補遺)?( 日本皮膚科学会ガイドライン)?'
