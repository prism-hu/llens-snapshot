id: 痒疹2020
title: 痒疹診療ガイドライン2020
guideline: 痒疹診療ガイドライン2020
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『痒疹診療ガイドライン 2020』(日本皮膚科学会ガイドライン)。佐藤貴浩ほかが作成し、
  日本皮膚科学会雑誌 130 巻 7 号 1607-1626 頁 (2020 年／令和 2 年) に掲載された。

  構成:
  - 1．ガイドラインの背景，位置づけ（1.1 背景／1.2 ガイドラインの位置づけ）／
    2．定義と分類（2.1 痒疹の定義と概念／2.2 分類〈図1 臨床型と要因〉）／3．疫学
  - 4．病態・発症機序／5．臨床症状（5.1 慢性に経過する主な痒疹の症状）／6．検査／
    7．痒疹治療アルゴリズム（図2）
  - CQ1〜CQ18 (ステロイド外用／内服・抗ヒスタミン薬・ビタミン D3 外用・液体窒素療法・
    鎮痒性外用薬・紫外線療法・免疫抑制薬・カプサイシン軟膏・サリドマイド・抗不安薬／抗うつ薬・
    ナルフラフィン塩酸塩・抗生剤内服・保湿剤・レセルピン・ガバペンチン／プレガバリン・漢方薬・
    ノイロトロピン®・創傷被覆材／表1 スキンケアの例・表2 主な抗ヒスタミン薬の鎮静作用による分類・
    表3 主なステロイド外用薬／局所注射薬の種類・表4 代表的な鎮痒性外用薬／保湿剤の例・表5 主な漢方薬)
  - 付表1 エビデンスのレベルと推奨度の決定基準（皮膚悪性腫瘍グループ）

  推奨度は A / B / C1 / C2 / D、エビデンスレベルは I〜VI。収録は 1 CQ = 1 ノード。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '痒疹診療ガイドライン\s*2020(\s*日本皮膚科学会ガイドライン)?'
  - '佐藤貴浩 ほか'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。ステロイド外用薬の濃度・有効率などを守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
pdfs:
  - file: 痒疹診療ガイドライン2020.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/yoshinGL2020.pdf
    label: '痒疹診療ガイドライン2020 (日皮会誌 130(7): 1607-1626, 2020)'
    mode: raw
nodes:
