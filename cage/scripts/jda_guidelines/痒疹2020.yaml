notes: |
  ## 版の扱い
  - 2020 年版。改訂版は公開されていない。姉妹ガイドラインの『皮膚瘙痒症診療ガイドライン2020』
    (別 id `皮膚瘙痒症2020`) と同じ作成グループ・同じ版面で、スキンケアや抗ヒスタミン薬の表が
    一部重なるが、別の文書なので別 id にしてある。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・「佐藤貴浩 ほか」) と版面フッタを `strip`。
  - 裸のノンブルは `strip_edge` (lines: 3)。ステロイド外用薬の濃度 (0.05% 等)、有効率などの
    裸の数値が本文・表に多いので `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 20 ページがいずれかのノードに載る。

  ## ページ内分割
  - 節境界 (4．病態・発症機序)、CQ1〜CQ18 の境界、付表1 の開始を `from` / `until` で割った。
  - 学会誌組版のため表は本文の途中に組まれ、raw では節見出しより後ろに流れる
    (表1〜表5 は CQ2・CQ3 のノードに載る)。どのノードにどの表が載るかは vlm_candidates に書いた。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、境界は `^(#+\s*)?…` の形で書いてある。
