      - path: CQ01
        title: '[CQ1] ステロイド外用，内服は痒疹に有効か？【推奨度：外用 B／局注・亜鉛華（単）軟膏重層・内服 C1】'
        body:
          - pdf: 痒疹診療ガイドライン2020.pdf
            pages: [4, 5]
            from: '^(#+\s*)?CQ1[：:]'
            until: '^(#+\s*)?CQ2[：:]'
            allow_overlap: true
      - path: CQ02
