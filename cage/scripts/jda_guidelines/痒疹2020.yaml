    title: 1．ガイドラインの背景，位置づけ（1.1 背景／1.2 ガイドラインの位置づけ）／2．定義と分類（2.1 痒疹の定義と概念／2.2 分類〈図1 臨床型と要因〉）／3．疫学
    body:
      - pdf: 痒疹診療ガイドライン2020.pdf
        pages: [1, 3]
        until: '^(#+\s*)?4．病態・発症機序'
  - path: 02_病態・臨床症状・検査・治療アルゴリズム
    title: 4．病態・発症機序／5．臨床症状（5.1 慢性に経過する主な痒疹の症状）／6．検査／7．痒疹治療アルゴリズム（図2）
