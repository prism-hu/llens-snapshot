      各ノードは推奨度・推奨文・解説・文献を持つ。
      表1〜表5 (スキンケア・抗ヒスタミン薬の分類・ステロイド外用薬／局所注射薬・
      鎮痒性外用薬／保湿剤・漢方薬) は原本の組版上 CQ2・CQ3 のページに流れ込んでいる。
