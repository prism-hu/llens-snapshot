id: 結節性硬化症2024
title: 結節性硬化症診療ガイドライン2024
guideline: 結節性硬化症診療ガイドライン2024
publisher: 日本皮膚科学会・日本結節性硬化症学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『結節性硬化症診療ガイドライン 2024』(日本皮膚科学会 / 日本結節性硬化症学会 /
  難治性疾患等政策研究事業「神経皮膚症候群および色素性乾皮症・ポルフィリン症の学際的診療体制に
  基づく医療最適化と患者 QOL 向上のための研究」班「結節性硬化症の診断基準及び治療ガイドライン」
  改訂委員会 編 / 日本皮膚科学会雑誌 134(9), 2237-2254, 2024 年)。

  結節性硬化症 (tuberous sclerosis complex：TSC) は TSC1/TSC2 遺伝子の変異による常染色体
  顕性遺伝の全身性過誤腫症で、皮膚・脳神経系・腎・心・肺・眼・骨など全身に病変を生じる。
  指定難病。

  構成は 6 節:
  1. ガイドライン作成の背景 / 2. 定義・概念 / 3. 疫学 (表 1 新規診断基準) /
  4. 遺伝子診断 (表 2 重症度分類) / 5. 症状別の検査・治療ガイドライン
  (5.1 心病変 … 5.11 遺伝相談) / 6. 結語

  CQ 形式ではないため見出し 1 節 = 1 ノードで切った。中心になる第 5 節は臓器別の
  11 小節があるので、`04_症状別の検査・治療ガイドライン` の下に子ノードとして並べた。
strip_edge:
  # 日皮会誌の柱とノンブル。raw モードではページ末尾の 2 行に来る
  lines: 3
  patterns:
  - '\d{1,4} ● 日皮会誌：134（9）\s*，2237-2254，2024（令和 6）'
  - '日皮会誌：134（9）\s*，2237-2254，2024（令和 6）● \d{1,4}'
  - '「結節性硬化症の診断基準及び治療ガイドライン」改訂委員会ほか'
  - '結節性硬化症診療ガイドライン 2024'
  - '日本皮膚科学会ガイドライン'
pdfs:
  - file: 結節性硬化症診療ガイドライン2024.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/TSC2024.pdf
    label: 本体 (全 18 ページ)
    # 学会誌組版の 2 段組。既定モードは左右の段を 1 行ずつ交互に出すので raw を使う
    mode: raw
nodes:
  - path: 01_背景
    title: 略語／1. ガイドライン作成の背景
    body:
      - {pdf: 結節性硬化症診療ガイドライン2024.pdf, pages: [1, 2], until: '^(#+\s*)?2．定義・概念'}
  - path: 02_定義・概念・疫学・診断基準
    title: 2. 定義・概念／3. 疫学 (表 1 新規診断基準)
    body:
      - pdf: 結節性硬化症診療ガイドライン2024.pdf
        pages: [2, 3]
        from: '^(#+\s*)?2．定義・概念'
        until: '^(#+\s*)?4．遺伝子診断'
        allow_overlap: true
  - path: 03_遺伝子診断・重症度分類
    title: 4. 遺伝子診断 (表 2 重症度分類)
    body:
      - pdf: 結節性硬化症診療ガイドライン2024.pdf
        pages: [3, 4]
        from: '^(#+\s*)?4．遺伝子診断'
        until: '^(#+\s*)?5．症状別の検査・治療ガイドライン'
        allow_overlap: true
  - path: 04_症状別の検査・治療ガイドライン
    title: 5. 症状別の検査・治療ガイドライン
    body:
      - pdf: 結節性硬化症診療ガイドライン2024.pdf
        pages: 4
        from: '^(#+\s*)?5．症状別の検査・治療ガイドライン'
        until: '^(#+\s*)?5\.1．心病変'
        allow_overlap: true
    children:
      - path: 01_心病変
        title: '[5.1] 心病変 (心横紋筋腫)'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: 4
            from: '^(#+\s*)?5\.1．心病変'
            until: '^(#+\s*)?5\.2．皮膚病変'
            allow_overlap: true
      - path: 02_皮膚病変
        title: '[5.2] 皮膚病変 (白斑・血管線維腫・シャグリンパッチ・爪囲線維腫)'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: [4, 7]
            from: '^(#+\s*)?5\.2．皮膚病変'
            until: '^(#+\s*)?5\.3．中枢神経病変'
            allow_overlap: true
      - path: 03_中枢神経病変
        title: '[5.3] 中枢神経病変 (てんかん・TAND・上衣下巨細胞性星細胞腫)'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: [7, 9]
            from: '^(#+\s*)?5\.3．中枢神経病変'
            until: '^(#+\s*)?5\.4．腎病変'
            allow_overlap: true
      - path: 04_腎病変
        title: '[5.4] 腎病変 (血管筋脂肪腫・腎囊胞・腎悪性腫瘍)'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: [9, 11]
            from: '^(#+\s*)?5\.4．腎病変'
            until: '^(#+\s*)?5\.5．呼吸器病変'
            allow_overlap: true
      - path: 05_呼吸器病変
        title: '[5.5] 呼吸器病変 (リンパ脈管筋腫症 LAM・MMPH)'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: [11, 13]
            from: '^(#+\s*)?5\.5．呼吸器病変'
            until: '^(#+\s*)?5\.6．眼病変'
            allow_overlap: true
      - path: 06_眼・骨・肝・消化管・その他の病変
        title: '[5.6〜5.10] 眼病変／骨病変／肝臓の腫瘍／消化管の病変／その他の病変'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: [13, 14]
            from: '^(#+\s*)?5\.6．眼病変'
            until: '^(#+\s*)?5\.11．遺伝相談'
            allow_overlap: true
      - path: 07_遺伝相談
        title: '[5.11] 遺伝相談'
        body:
          - pdf: 結節性硬化症診療ガイドライン2024.pdf
            pages: 14
            from: '^(#+\s*)?5\.11．遺伝相談'
            until: '^(#+\s*)?6．結語'
            allow_overlap: true
  - path: 05_結語
    title: 6. 結語
    body:
      - pdf: 結節性硬化症診療ガイドライン2024.pdf
        pages: 14
        from: '^(#+\s*)?6．結語'
        until: '^(#+\s*)?文 献'
        allow_overlap: true
  - path: 06_文献
    title: 文献
    body:
      - pdf: 結節性硬化症診療ガイドライン2024.pdf
        pages: [14, 18]
        from: '^(#+\s*)?文 献'
        allow_overlap: true
vlm_candidates:
  - {pdf: 結節性硬化症診療ガイドライン2024.pdf, pages: 2, why: 表 1 新規診断基準 (大症状・小症状の一覧)}
  - {pdf: 結節性硬化症診療ガイドライン2024.pdf, pages: 3, why: 表 2 重症度分類 (臓器 × 重症度の大きな横長表。テキスト層ではセルの対応が崩れる)}
  - {pdf: 結節性硬化症診療ガイドライン2024.pdf, pages: 4, why: 表 2 重症度分類の続き + 5.1 心病変の検査・治療フロー}
notes: |
  - **原本は日本皮膚科学会雑誌の 2 段組**。既定モードは左段と右段を 1 行ずつ交互に出して
    読めなくなるため、全ページ `mode: raw` (内容ストリーム順) にした。
  - 柱とノンブル (`日皮会誌：134（9），2237-2254，2024（令和 6）● 2237` 形式) を
    `strip_edge` (lines: 3) で落とした。**p.1 冒頭の書名行 `結節性硬化症診療ガイドライン 2024`
    も柱と同じ文字列**なので巻き添えで消える。作成 3 団体 (日本皮膚科学会・日本結節性硬化症
    学会・研究班) と改訂委員の氏名は p.1 の本文として残っている。
  - `\d{1,3}` を `strip` に置くと表 2 (重症度分類) の `3cm` や病変径の数値行を巻き添えに
    するので、ノンブルは日皮会誌の行ごと `strip_edge` で落とす形にした。
  - CQ を持たないガイドラインなので、見出し 1 節 = 1 ノード。第 5 節だけは臓器別に
    11 小節あるので子ノードにし、隣接する短い小節 (5.6 眼病変〜5.10 その他の病変) は
    1 ノードに束ねた。
  - 全 18 ページがどれかのノードに載っている。
  - 2018 年版 (日皮会誌 128: 1-16) はカタログに無く、本 PDF が現行版。
