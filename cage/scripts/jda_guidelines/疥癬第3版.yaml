id: 疥癬第3版
title: 疥癬診療ガイドライン（第 3 版）
guideline: 疥癬診療ガイドライン（第3版）
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『疥癬診療ガイドライン（第 3 版）』(日本皮膚科学会疥癬診療ガイドライン策定委員会、
  日皮会誌 125(11): 2023-2048, 2015 (平成 27))。2005 年の初版・2007 年の第 2 版に続く
  第 3 版で、5% フェノトリンローションが 2014 年 8 月に疥癬の効能・効果で保険適用に
  なったことを受けて改訂された。委員長は石井則久 (国立感染症研究所ハンセン病研究センター)。

  CQ を前面に出した構成ではなく、**章番号つきの 18 節**からなる本文で、CQ は
  「13．疥癬の治療」の小節 d) に 11 件まとまっている (エビデンスレベル・推奨度は
  日本皮膚科学会編 皮膚悪性腫瘍診療ガイドラインの基準に準拠)。

  構成 (全 18 節):
  - 1〜4 節 作成の目的・背景・位置付け・利益相反
  - 5〜9 節 疥癬の定義、ヒゼンダニの生態、病型分類 (通常疥癬／角化型疥癬)、感染経路、臨床症状
  - 10〜12 節 検査 (顕微鏡検査・ダーモスコピー検査・血液学的検査)、疫学的流行状況、診断
  - 13 節 治療 (治療薬の CQ 11 件、薬剤各論、治療法の実際、年齢別・妊婦授乳婦の使用例ほか)
  - 14 節 治癒判定と治癒後の症状、再感染・再燃
  - 15 節 感染予防対策 (集団発生・予防治療・集団予防治療)
  - 16〜18 節 海外での治療薬、動物疥癬、結語
  - 末尾に英文抄録

  収録は 1 節 = 1 ノード。13 節だけは長いので小節 a)〜j) を子ノードにし、
  さらに小節 d) の 11 CQ を 1 CQ = 1 ノードにした。
strip_edge:
  # 日皮会誌の柱下フッタ (奇数/偶数ページで左右が入れ替わる 2 形)、走り柱、
  # 1 ページ目の右上バナー。**ページの先頭/末尾 3 非空行だけ**に効かせる。
  # `\d{1,3}` 単体は入れない (表の数値・推奨度の数字を巻き添えにするため)。
  # 文献欄の日皮会誌は読点 (`日皮会誌，`)、フッタはコロン (`日皮会誌：`) なので混同しない
  lines: 3
  patterns:
    - '\d{1,4}\s*●\s*日皮会誌：.*'
    - '日皮会誌：.*●\s*\d{1,4}'
    - '疥癬診療ガイドライン（第 3 版）'
    - '日本皮膚科学会疥癬診療ガイドライン策定委員会'
    - '.*日本皮膚科学会ガイドライン'
pdfs:
  - file: 疥癬診療ガイドライン（第3版）.pdf
    url: https://www.dermatol.or.jp/uploads/uploads/files/guideline/kaisenguideline.pdf
    label: 本体 (全 26 ページ)
    # 日皮会誌の 2 段組。既定モードは左右の段の行が 1 行ずつ交互に出て本文が読めず、
    # layout は段が横に並ぶだけで散文にならない。raw (内容ストリーム順) が
    # 段ごとに正しい順で出る
    mode: raw
