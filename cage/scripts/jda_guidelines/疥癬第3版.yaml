notes: |
  - 抽出モードは全ページ `raw`。日皮会誌の 2 段組で、既定モードは左右の段の行が
    1 行ずつ交互に出て本文が読めない。`layout` は段が横に並ぶだけで散文にならない。
    raw (内容ストリーム順) が段ごとに正しい順で出る。
  - `strip_edge` (lines: 3) は柱下フッタ 2 形 (奇数/偶数ページで左右が入れ替わる)、
    走り柱 2 種、1 ページ目のバナー。`\d{1,3}` 単体は入れていない (表 1〜7 の数値、
    推奨度の数字、薬物動態の数値を巻き添えにするため)。文献欄の「日皮会誌，」は
    読点、フッタは「日皮会誌：」コロンなので文献は巻き込まない。
  - **p.1 の先頭 2 行 (標題「疥癬診療ガイドライン（第 3 版）」と
    「日本皮膚科学会疥癬診療ガイドライン策定委員会」) は走り柱と同じ文字列**なので
    strip_edge で落ちる。版・作成主体は manifest の title / publisher / description が
    持っているので補っていない。策定委員の氏名と所属は p.1 に残っており
    `01_ガイドライン作成の目的` と `03_ガイドラインの位置付け` のノードに入る。
  - `normalize_radicals` は不要 (康熙部首・縦書き用記号の混入 0 件を実測)。
  - 節の見出しには U+0007 (BEL) が混ざるものがある (`1．<BEL> 疥癬診療…`、
    `14．<BEL> 疥癬の治癒判定…`、`d）<BEL> 治療薬についての…`、`j）<BEL> ステロイド…`)。
    `from` / `until` はこの位置をまたがないよう番号までで打ち切ってある。
  - 全 26 ページがどこかのノードに載る。落としたページは無い。表紙・目次・奥付は
    この原本には無い (日皮会誌の記事なので 1 ページ目が本文の始まり)。
  - p.24 は raw の内容ストリーム順の都合で「17．動物疥癬」の本文のあとに
    「表 7 各国の疥癬治療薬の位置づけ」が出る。表 7 は 16 節のものなので、
    16 節に 2 区間目として拾い、17 節は表 7 の直前で切っている。
  - 18 節の「結語」に「2018 年までに第 4 版を発表予定」とあるが、2026-09-07 時点で
    学会の一般公開ガイドラインページに載っているのは第 3 版のみ。旧版 (2005 年初版・
    2007 年第 2 版) は同ページに無く、収録対象にしていない。
