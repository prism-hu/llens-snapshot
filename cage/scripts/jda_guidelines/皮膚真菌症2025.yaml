id: 皮膚真菌症2025
title: 皮膚真菌症診療ガイドライン2025
guideline: 皮膚真菌症診療ガイドライン2025
publisher: 日本皮膚科学会・日本医真菌学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『皮膚真菌症診療ガイドライン 2025』(日本皮膚科学会・日本医真菌学会合同皮膚真菌症診療
  ガイドライン策定委員会、委員長 福田知雄。日皮会誌 135(13)：2511-2566，2025(令和 7))。
  2009 年『皮膚真菌症診断・治療ガイドライン』(初版)、2019 年『日本皮膚科学会皮膚真菌症
  診療ガイドライン 2019』に続く**第 3 版**で、2019 年版をたたき台に改訂したもの。
  作成費用は日本皮膚科学会が負担。エビデンスレベル (I〜VI) と推奨度 (A / B / C1 / C2 / D)
  の分類は『皮膚悪性腫瘍診療ガイドライン第 2 版』に準拠する。

  構成:
  - 概要 (背景と目的・作成手順・資金提供者と利益相反・表 1 CQ 一覧と推奨度・
    エビデンスレベルと推奨度の分類・公開方法・改訂・免責事項)
  - 第 1 章 疾患概念と診断・治療の原則 (表在性皮膚真菌症 6 項・深在性皮膚真菌症 5 項)
  - 第 2 章 真菌検査法 (直接鏡検・真菌培養・その他の検査法 9 項)
  - 第 3 章 皮膚真菌症の原因菌 (菌名と変遷・留意すべき皮膚真菌症 4 項)
  - 第 4 章にあたる CQ1〜CQ21 (治療。1 CQ = 1 ノード)
  - 文献 (1)〜367))

  収録は CQ を 1 CQ = 1 ノード、CQ 以外の章は 1 節 (1.1 / 2.1 / 3.1 …) = 1 ノード。
strip_edge:
