notes: |
  - 原本は日皮会誌 135(13)：2511-2566，2025（令和 7）に掲載された 56 ページの学会誌組版
    （2 段組）。**抽出は全ページ `raw`**。既定モードでは左右の段の行が 1 行ずつ交互に出て
    本文が読めず、`layout` は段が横に並ぶだけで散文にならない。`-raw`（内容ストリーム順）
    だけが段ごとに正しい順で出る。
  - **`url:` を書いていない。** カタログの url は
    <https://www.dermatol.or.jp/dermatol/wp-content/uploads/2013/08/19e2ae577a696f81acf51fdcc0173e2c.pdf>
    で、basename が WordPress の 32 桁ハッシュ（再アップロードで変わる）。build は
    「url があるならその basename が配信名」なので、そのままだと配信 PDF 名がハッシュに
    なってしまう。`url:` を省略してカタログの slug（`jda_dermatomycosis_2025.pdf`）を
    配信名にし、ノードの source は manifest 直下の学会掲載ページに落とした。
  - **書名にゆれがある。** 原本 1 ページ目・柱・文献 3) はいずれも
    「皮膚真菌症診療ガイドライン 2025」だが、学会「一般公開ガイドライン」ページの
    表示は「皮膚真菌診療ガイドライン2025」（「症」が無い）。原本を正とした。
  - `publisher` は原本 1 ページ目の作成主体どおり **日本皮膚科学会・日本医真菌学会**
    （合同の「皮膚真菌症診療ガイドライン策定委員会」が策定）。
  - strip は使わず `strip_edge`（端 3 行）だけ。柱下フッタは奇数/偶数ページで左右が
    入れ替わる 2 形（`日皮会誌：… ● 2511` と `2512 ● 日皮会誌：…`）で、どちらも
    `日皮会誌：`（コロン）を含む。文献欄の日皮会誌は `日皮会誌，`（読点）なので巻き込まない。
    走り柱は `皮膚真菌症診療ガイドライン 2025`（奇数ページ）と
    `日本皮膚科学会・日本医真菌学会合同皮膚真菌症診療ガイドライン策定委員会`（偶数ページ）、
    1 ページ目だけ末尾に `… 日本皮膚科学会ガイドライン` の合成バナー。
    **`\d{1,3}` 単体は入れていない**（推奨度表の記号・表の数値・文献番号が消えるため）。
  - `normalize_radicals` は付けていない（康熙部首・縦書き用記号の混入 0 件を実測）。
  - **落としたページは無い（p.1-56 全ページがどこかのノードに載る）。** 表紙・目次・奥付に
    あたるページは無く、1 ページ目が表題・策定委員・概要を兼ねている。
  - ノード粒度: CQ は 1 CQ = 1 ノード（21 件）。CQ 以外の章は原本の節（1.1 / 2.1 / 3.1 …）
    = 1 ノード。1 ページに 2〜4 個の節・CQ が始まるページが多い（p.10 に 2.1/2.2/2.3、
    p.16 に 3.1〜3.5、p.28 に CQ4/CQ5 …）ので `from` / `until` で割り、同じページを
    共有する側に `allow_overlap: true` を付けた。
  - title の推奨度は p.2「表 1 Clinical question と推奨度」と各 CQ の推奨文表の両方で
    突き合わせ、21 件すべて一致することを確認した（A 17 件・B 4 件）。
  - 文献（1)〜367)、p.43-56）は 1 ノードで 7 万字を超えるので、`05_文献/` の下に
    ページ境界の文献番号で 5 ノードに割った（p.43 は CQ21 の本文が前半にあるので
    `from: '^文\s*献'` で切っている）。
  - 本ガイドラインに関連する学術委員会文書「白癬菌抗原キット（販売名：デルマクイック®
    爪白癬）の臨床活用に関して」（1 ページ）は学会ページで**独立掲載**されており、
    カタログでも別 guideline 行になっているので、この manifest には束ねていない。
