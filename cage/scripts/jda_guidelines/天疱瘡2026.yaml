id: 天疱瘡2026
title: 天疱瘡診療ガイドライン2026
guideline: 天疱瘡診療ガイドライン2026
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『天疱瘡診療ガイドライン 2026』(日本皮膚科学会ガイドライン)。天疱瘡診療ガイドライン策定委員会
  (山上淳・高橋勇人・舩越建ほか 20 名) が作成し、日本皮膚科学会雑誌 136 巻 3 号 189-210 頁
  (2026 年／令和 8 年) に掲載された。2010 年版 (日皮会誌 120: 1443-1460) の改訂版。

  「Minds 診療ガイドライン作成マニュアル」に従い、重要臨床課題から CQ を設定して
  PICO に基づく文献検索 (Cochrane Library / PubMed / 医中誌、いずれも 2021 年 12 月まで) を
  行い、策定委員会推奨決定会議で推奨を決定している。推奨は「強く推奨／弱く推奨／
  行わないことを提案／行わないことを推奨／推奨なし」、エビデンスは「強い／中程度」等で示される。

  構成 (全 3 章):
  - 第 1 章 天疱瘡診療ガイドラインについて (目的・改訂・エビデンス収集・推奨決定・COI)
  - 第 2 章 天疱瘡の総論 (定義・疫学・病態生理・臨床病型・診断と重症度判定・治療)
  - 第 3 章 天疱瘡診療ガイドライン (CQ1〜CQ7)

  収録は 1 CQ = 1 ノード (推奨度表 + 解説)。第 2 章の総論は原本の節 (1．定義〜6．治療) で割り、
  6．治療だけは分量が大きいので「治療方針」と「治療各論 (A ステロイド内服〜H その他)」の
  2 ノードに分けた。文献 (1〜102) は 1 ノードにまとめてある。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '天疱瘡診療ガイドライン\s*2026(\s*日本皮膚科学会ガイドライン)?'
  - '天疱瘡診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，2010; 120: …」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。表 2 PDAI の素点・表 4 の投与量など数値セルを守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
pdfs:
  - file: 天疱瘡診療ガイドライン2026.pdf
    url: https://www.dermatol.or.jp/dermatol/wp-content/uploads/2013/08/tenpousou2026.pdf
    label: '天疱瘡診療ガイドライン2026 (日皮会誌 136(3): 189-210, 2026)'
    # 2 段組の学会誌組版。既定モードは左右段の行が 1 行ずつ交互に出て文がつながらない。
    # -layout は 1 行に左段 + 右段が並んで同じく読めない。-raw (内容ストリーム順) だけが
    # 段ごとに上から下へ出るので raw を採る (このコーパスの学会誌組版すべてに共通)
    mode: raw
nodes:
