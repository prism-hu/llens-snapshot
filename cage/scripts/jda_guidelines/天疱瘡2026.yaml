  - path: 03_CQ
    title: 第3章 天疱瘡診療ガイドライン（CQ1〜CQ7）
    body_text: |
      推奨決定会議で推奨を作成した 7 件のクリニカルクエスチョン。各ノードは
      「推奨度／エビデンス／推奨文」の表と解説を自己完結して持つ。
    children:
      - path: CQ1
        title: '[CQ1 ステロイド内服] 中等症以上の天疱瘡に対して，初期治療として 1 mg/kg/日のプレドニゾロン（PSL）内服は推奨されるか？【強く推奨／エビデンス 中程度】'
        body:
          - pdf: 天疱瘡診療ガイドライン2026.pdf
            pages: [14, 15]
            from: '^(#+\s*)?CQ1[．.]'
            until: '^(#+\s*)?CQ2[．.]'
            allow_overlap: true
      - path: CQ2
        title: '[CQ2 免疫抑制薬併用] 中等症以上の天疱瘡に対する寛解導入において，免疫抑制薬（アザチオプリン，シクロスポリン，ミコフェノール酸モフェチル）の併用は，ステロイド単剤療法に比べて推奨されるか？【弱く推奨／エビデンス 中程度】'
        body:
          - pdf: 天疱瘡診療ガイドライン2026.pdf
            pages: [15, 15]
            from: '^(#+\s*)?CQ2[．.]'
            until: '^(#+\s*)?CQ3[．.]'
            allow_overlap: true
      - path: CQ3
        title: '[CQ3 血漿交換・IVIG] 中等症以上の天疱瘡に対する初期治療が不十分だった場合，早期に寛解導入するために，血漿交換療法，免疫グロブリン大量療法（IVIG）の追加は推奨されるか？【強く推奨／エビデンス 中程度】'
        body:
          - pdf: 天疱瘡診療ガイドライン2026.pdf
            pages: [15, 16]
            from: '^(#+\s*)?CQ3[．.]'
            until: '^(#+\s*)?CQ4[．.]'
            allow_overlap: true
      - path: CQ4
        title: '[CQ4 リツキシマブ] ステロイド全身療法（免疫抑制薬併用も含む）で寛解導入困難な症例において，リツキシマブの追加は推奨されるか？【強く推奨／エビデンス 強い】'
        body:
          - pdf: 天疱瘡診療ガイドライン2026.pdf
            pages: [16, 16]
            from: '^(#+\s*)?CQ4[．.]'
            until: '^(#+\s*)?CQ5[．.]'
            allow_overlap: true
      - path: CQ5
        title: '[CQ5 リツキシマブ] ステロイド減量中の再燃例に対して，リツキシマブの追加は推奨されるか？【強く推奨／エビデンス 強い】'
        body:
          - pdf: 天疱瘡診療ガイドライン2026.pdf
