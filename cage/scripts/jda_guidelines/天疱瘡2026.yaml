notes: |
  ## 版の扱い
  - 本ガイドラインは 2010 年版 (日皮会誌 120: 1443-1460) の改訂版だが、2010 年版の PDF は
    学会の公開ページに無く素材にも含まれないため、落とした版は無い。

  ## 抽出モード
  - 日皮会誌の 2 段組。**既定モードでは左段と右段の行が 1 行ずつ交互に出て文がつながらない**、
    `-layout` では 1 行に左段 + 右段が並んで同じく読めない。`-raw` (内容ストリーム順) だけが
    段ごとに上から下へ出るので `mode: raw` を採った。
  - 康熙部首の混入は 0 件だったので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - raw モードでは柱 (ノド柱「天疱瘡診療ガイドライン 2026」「天疱瘡診療ガイドライン策定委員会」)
    と版面フッタ (「202 ● 日皮会誌：136（3），189-210，2026（令和 8）」) が**ページ末尾**に出る。
    フッタは `●` を必ず含むので、文献の「日皮会誌，2010; 120: 1443―1460」とは紛れない。
  - 裸のノンブルは `strip_edge` (lines: 3) に置いた。`strip` に置くと表 2 PDAI の素点や
    表 4 の投与量が巻き添えになる。

  ## 落としたページ
  - 落としたページは無い。全 22 ページがいずれかのノードに載る (p.1 の表題・策定委員会名簿は
    第 1 章のノード冒頭に入っている = 版・発行年・作成委員会の根拠)。

  ## ページ内分割
  - 学会誌組版なので、表・図は本文の途中で組まれ、raw モードでは**その節の見出しより後ろ**に
    流れる。表 1 (診断基準)・表 2 (PDAI) は物理的に「6．治療」より後ろに出るので、
    ノードとしては `06_治療方針` に載っている (title に明記した)。原文の並びを崩さない方針に
    従って、表だけを 05 のノードへ移すことはしていない。
  - 総論の節境界 (2．疫学／3．病態生理／4．臨床病型／5．診断と重症度判定／6．治療／A．ステロイド内服)、
    第 2 章・第 3 章の章境界、CQ1〜CQ7 の境界、謝辞はいずれも 1 ページの途中に来るので
    `from` / `until` で割った。overlay (VLM) が見出しを `## ` 付きで起こしても当たるように
    `^(#+\s*)?…` の形で書いてある。
