description: |
  『家族性良性慢性天疱瘡診療ガイドライン 2023』(日本皮膚科学会ガイドライン)。
  家族性良性慢性天疱瘡診療ガイドライン策定委員会 (岩田浩明・宮内俊成・古村南夫ほか) が作成し、
  日本皮膚科学会雑誌 134 巻 2 号 273-287 頁 (2024 年／令和 6 年) に掲載された。
  家族性良性慢性天疱瘡 (Hailey-Hailey 病、ATP2C1 遺伝子変異による常染色体顕性遺伝性の
  表皮内水疱症) の診療ガイドライン。

  構成:
  - 序 (策定委員会・目的・エビデンスレベルと推奨度の基準・利益相反)
  - 総論 (1．原因と発症機序／2．症状／3．疫学／4．予後／5．病理組織学的所見)
  - 6．診断・重症度評価 (1．診断基準〈主要項目・参考項目〉／2．重症度分類) と治療アルゴリズム (図)
  - CQ1〜CQ15 (外用・内服・手術・レーザー・紫外線・ボツリヌス毒素など治療 15 件)
  - エビデンスレベルと推奨度の決定基準・文献

  推奨度は A / B / C1 / C2 / D と、策定委員による**平均同意度** (5 点満点) を併記する形。

  収録は 1 CQ = 1 ノード (推奨度表 + 解説 + 文献)。
strip:
  # 柱 (ノド柱・書名)。日皮会誌の学会誌組版で、raw モードでは**ページ末尾**に出る
  - '家族性良性慢性天疱瘡診療ガイドライン\s*2023(\s*日本皮膚科学会ガイドライン)?'
  - '家族性良性慢性天疱瘡診療ガイドライン策定委員会'
  - '日本皮膚科学会ガイドライン'
  # ノンブル入りの版面フッタ。`●` を必ず含むので文献中の「日皮会誌，…」とは紛れない
  - '\d{1,4}\s*●\s*日皮会誌.*'
  - '日皮会誌.*●\s*\d{1,4}'
strip_edge:
  # 裸のノンブル。重症度分類の点数や平均同意度の数値を守るため strip ではなく端だけ
  lines: 3
  patterns:
    - '\d{1,3}'
