notes: |
  ## 版の扱い
  - 2023 年策定・2024 年掲載の初版。旧版は無い。

  ## 抽出モード
  - 日皮会誌の 2 段組。既定モードは左右段の行が交互に出て文がつながらず、`-layout` は
    1 行に左段 + 右段が並ぶ。`-raw` だけが段ごとに上から下へ出るので `mode: raw` にした。
  - 康熙部首の混入は 0 件なので `normalize_radicals` は付けていない。

  ## strip / strip_edge
  - 柱 (書名・策定委員会名) と版面フッタ (「日皮会誌：134（2），273-287，2024（令和 6）● 277」)
    を `strip` に置いた。フッタは `●` を必ず含む。
  - 裸のノンブルは `strip_edge` (lines: 3)。重症度分類の点数と平均同意度 (4.2・2.79 等) を
    守るため `strip` には置いていない。

  ## 落としたページ
  - 落としたページは無い。全 15 ページがいずれかのノードに載る。

  ## ページ内分割で気をつけた点
  - **p.6 の冒頭に CQ1〜CQ15 の「CQ 一覧」があり、各行が CQ 本体の見出しと 1 字も違わない**。
    `from` / `until` は最初にマッチした行で切るので、p.6 に載る CQ1・CQ2 だけは CQ 番号を
    境界に使えない。代わりに
    - CQ 一覧のノード … `until: '^推奨度 推奨文 平均同意度'` (CQ1 の推奨度表の直前まで)
    - CQ1 … `from: '^推奨度 推奨文 平均同意度'`、`until: '^C1 行うことを考慮してもよいが，十分な根拠がない 3\.0$'`
    - CQ2 … `from:` 同じ C1 行 (p.6 で 1 回しか出ない)
    としてある。この切り方だと **CQ1 の見出し行は CQ 一覧ノードの末尾に、CQ2 の見出し行は
    CQ1 ノードの末尾に**入る (原文はどこにも欠けない)。CQ3 以降のページには一覧が無いので
    `^CQn\s` をそのまま境界に使っている。
  - overlay (VLM) が見出しを `## ` 付きで起こしても当たるように、CQ 番号の境界は
    `^(#+\s*)?…` の形で書いてある (上記 p.6 の 2 つは本文の表の行が境界なので付けていない)。
