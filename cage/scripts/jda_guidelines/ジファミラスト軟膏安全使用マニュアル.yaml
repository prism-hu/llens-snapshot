notes: |
  - 学会誌 (日皮会誌) の 2 段組版面なので `mode: raw`。柱は 2 行に割れて
    ページ末尾に回るため `strip_edge` で 3 行ぶん受けている。
  - `strip_edge` の柱パターンは 1 ページ目の大扉タイトル 1 行目も巻き添えにするが、
    続く「軟膏 0.3％，1％）」「安全使用マニュアル」の 2 行は残る。
  - 全 9 ページがいずれかのノードに載る (落としたページは無い)。
  - 親となるアトピー性皮膚炎診療ガイドライン2024 とは学会ページ上で独立掲載
    されており、本文も AD ガイドラインの付随ガイダンス (JAK 阻害内服薬・
    生物学的製剤) とは体裁が違う (「安全使用マニュアル」)。割り当て表どおり
    単独 id にした。
  - 旧版は無い (2022 年策定の初版)。
