id: ジファミラスト軟膏安全使用マニュアル
title: ジファミラスト軟膏（モイゼルトⓇ軟膏0.3％，1％）安全使用マニュアル
guideline: ジファミラスト軟膏（モイゼルト軟膏0.3％，1％）安全使用マニュアル
publisher: 日本皮膚科学会
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  『ジファミラスト軟膏（モイゼルトⓇ軟膏 0.3％，1％）安全使用マニュアル』
  (ジファミラスト軟膏安全使用マニュアル作成委員会。日皮会誌 132(7), 1627-1635, 2022)。

  ジファミラストはホスホジエステラーゼ 4 (PDE4) 阻害薬で、その軟膏製剤が
  アトピー性皮膚炎の治療薬として 2021 年 9 月に世界に先駆けて本邦で承認された。
  本マニュアルは処方する医師が安全に使用するために理解しておくべき留意事項
  (経皮吸収と全身への影響、局所副作用、他の治療との併用) をまとめたもの。

  アトピー性皮膚炎診療ガイドライン2024 とは別の掲載物 (親ガイドラインを持たない
  独立掲載) なので単独の id にしてある。CQ10 (ジファミラスト軟膏はすすめられるか)
  が対応する臨床設問。

  収録は原本の節 (1．〜8．) = 1 ノード。
