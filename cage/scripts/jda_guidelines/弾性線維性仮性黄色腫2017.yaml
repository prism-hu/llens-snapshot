notes: |
  - **抽出モード**: 日皮会誌の 2 段組。既定モードでは左右の段が行単位で混ざるため `-raw`。
  - **CQ の割り方**: 1 ページに 3〜4 個の CQ が並ぶので、すべて `from` / `until` で割った。
    CQ の**見出しリスト**（p.3 末〜p.4 冒頭）と**本体の見出し**は文言が同じだが、
    リスト側は「疫学 CQ1：␣重症度基準…」のように全角コロンの後に制御文字＋空白が入るため、
    `^疫学 CQ1：重症度基準` のように「コロンの直後から本文が始まる」形のパターンでリストを避けている。
  - **産婦 CQ1 の文言ゆれ**: CQ 一覧では「妊娠，出産は可能か？」、本体の見出しでは
    「PXE 患者の妊娠における流産のリスクは高いか？」と文言が違う（原本のまま）。
    title には本体側を採り、一覧側を括弧で添えた。
  - **節番号の飛び**: 原本は 9．治療 の次が 11．クリニカルクエスチョン で、10．が無い（原本のまま）。
  - **重症度分類の表**: p.2〜3 の重症度分類は段抜きの表で、`-raw` では
    「E0 / 矯正視力0.7以上，かつ異常視野欠損なし」のように行が分かれて出る。`vlm_candidates` に入れた。
  - 落としたページは無い（全 8 ページがどこかのノードに載る）。
