id: 弾性線維性仮性黄色腫2017
title: 弾性線維性仮性黄色腫診療ガイドライン（2017年版）
guideline: 弾性線維性仮性黄色腫診療ガイドライン2017
publisher: 公益社団法人日本皮膚科学会（「弾性線維性仮性黄色腫診療ガイドライン」策定委員会）
source: https://www.dermatol.or.jp/medical/guideline/4742/
retrieved_at: '2026-09-07'
description: |
  原典正式名:「日本皮膚科学会ガイドライン 弾性線維性仮性黄色腫診療ガイドライン（2017 年版）」
  （日皮会誌 127(11): 2447-2454, 2017）。「弾性線維性仮性黄色腫診療ガイドライン」策定委員会
  （委員長 宇谷厚志）編。厚生労働科学研究費補助金 難治性疾患等政策研究事業「稀少難治性皮膚疾患
  に関する調査研究」班の全国実態調査を基礎にしている。

  弾性線維性仮性黄色腫（pseudoxanthoma elasticum：PXE）は ABCC6 遺伝子変異による全身の
  弾性線維の変性・石灰化をきたす指定難病で、皮膚・眼（網膜色素線条）・心血管・消化管の
  4 臓器に病変が及ぶ。本ガイドラインは診断基準（2017 年改訂版）と臓器別の重症度分類（S/E/CV/GI）
  を定め、臓器別の CQ 16 件（疫学 1・皮膚 2・眼 2・心血管 5・消化管 3・産婦 3）に推奨度
  （A / B / C1 / C2 / D）と解説を付す。

  収録は 1 CQ = 1 ノード。CQ の一覧（11．クリニカルクエスチョン の冒頭に置かれた見出しリスト）は
  `05_CQ一覧` に分けてある。
