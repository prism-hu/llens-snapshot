id: 院内がん登録標準登録様式2016
title: がん診療連携拠点病院等 院内がん登録 標準登録様式 2016年版
guideline: がん診療連携拠点病院等 院内がん登録 標準登録様式 2016年版
publisher: 国立研究開発法人 国立がん研究センター がん対策研究所 がん登録センター
source: https://ganjoho.jp/med_pro/cancer_control/can_reg/hospital/regulation.html
retrieved_at: '2026-09-11'
description: |
  『がん診療連携拠点病院等 院内がん登録 標準登録様式 2016 年版』(国立研究開発法人
  国立がん研究センター がん対策研究所 がん登録センター)。がん登録等の推進に関する法律
  第 44 条に基づく「院内がん登録の実施に係る指針」(厚生労働省告示第四百七十号、
  平成 27 年 12 月 15 日) の第二 三 (1) にいう「国立がん研究センターが提示する院内がん登録に
  係る標準的な登録様式」の本体で、拠点病院等が院内がん登録で登録すべき標準登録項目
  105 項目の定義・選択肢コード・登録ルールを定める。

  収録したのは掲載ページ (がん情報サービス「院内がん登録の標準登録様式」) にある 2 本:

  - **本体** `2016manual.pdf` 147 ページ。表紙に 2015-12-28 から 2026-04-01 までの更新日が
    列挙され、各ページ上端の柱は「第 1 版 更新日:2026／4」。ただし PDF 自体は
    2026-07-27 に作り直されており (CreationDate/ModDate)、掲載ページの更新日表示も
    「2026.07.27」。**最新の修正 (2026-07-27) まで反映済みの版**である (後述)
  - **修正履歴** `2016_shusei.pdf` 21 ページ。2026-07-27 / 2026-04-01 / 2025-09-09 /
    2025-06-16 の 4 ブロックが新しい順に並び、各ブロックは「頁 / 修正詳細 / 修正前 / 修正後」の
    4 列表

  構成:
  - 総論 5 節 (院内がん登録の根拠法令、登録対象、標準登録項目、日付型項目の書式、
    がん治療・初回治療の定義) と凡例 (■◆ 共通項目 / ● 標準項目 / ◇ 管理項目)
  - 標準登録項目 105 項目 = 基本情報 8 / 腫瘍情報 33 / 初回治療情報 31 / 生存状況情報 10 /
    管理情報 23。1 項目 = 1 ノードで、各項目は「項目番号・項目名・別名・項目区分」の見出し行に
    続けて【項目の書式】【コードの選択】【摘要】【登録時の注意】【互換情報】(2006 年度版の
    項目番号との対応) を持つ
  - 付録 4 本 (大臣指針、2006 年度版修正版からの変換表、TNM 分類等 病期関連コード表、
    病理組織診によらない診断根拠のときに用いてよい形態コード表)
  - 巻末 4 ページの標準登録様式一覧表 (全項目を 1 枚に並べた早見表)
# 本文に康熙部首の字形 (⾏ U+2F8F / ⽤ U+2F64 / ⽣ U+2F63 …) と縦書き用記号 (︓ U+FE13) が
# 残っており、read_doc の戻りをそのまま引用すると「⽣存状況」になるので潰す。
# 下の strip / strip_edge と patches.find は **正規化後**の字形に対して書く
normalize_radicals: true
strip:
  # 本体 147 ページ中 137 ページ (p.7-143) の柱。康熙部首の「︓」(U+FE13) と全角スラッシュを
  # 使っているので、後段で NFKC 正規化を挟んでも落ちるように文字クラスで受ける
  - '第\s*1\s*版\s*更新日[︓:：]\s*2026\s*[／/]\s*4'
  # 巻末の一覧表 4 ページ (p.144-147) の柱。本文中の「…標準登録様式 2016 年版」として決定された」
  # のような文はこれより長いので fullmatch に掛からない
  - '標準登録様式\s+2016\s*年版'
strip_edge:
  # ノンブルだけ。`\d{1,3}` を strip (全行) に置くと【コードの選択】表の
  # 選択肢コード (400 / 4100 は 4 桁だが 10 / 20 / 21 などは 2 桁) が巻き添えになる
  lines: 3
  patterns:
    - '\d{1,3}'
pdfs:
  - file: 2016manual.pdf
    url: https://ganjoho.jp/med_pro/cancer_control/can_reg/hospital/pdf/2016manual.pdf
    label: 標準登録様式 2016 年版 本体 (全 147 ページ)
    # 既定モードでは【コードの選択】の 3 列表 (コード / 名称 / 説明) が 1 セル 1 行に平たくなり、
    # セルの折り返し行がページ末尾に飛ぶ。付録 3 の 8 列表・付録 4 の 4 列表・巻末一覧表は
    # 列の対応が完全に失われる。layout なら全部 1 行に保たれるので layout で通す
    mode: layout
  - file: 2016_shusei.pdf
    url: https://ganjoho.jp/med_pro/cancer_control/can_reg/hospital/pdf/2016_shusei.pdf
    label: 修正履歴 (2026 年 7 月 27 日まで、全 21 ページ)
    # 「修正前 / 修正後」の 2 列が崩れると意味が反転するので layout 必須
    mode: layout
