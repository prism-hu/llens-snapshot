  - **抽出モードは layout** (`pdfs[].mode: layout`、両 PDF とも)。各項目ページの主役である
    【コードの選択】の 3 列表 (コード / 選択肢名 / 説明) は、既定モードでは 1 セル 1 行に
    平たくなり、しかもセルの折り返し (例: 物理 p.53 の「440 遠隔転移」の説明 2 行目
    「始めている状態」) が表の末尾まで飛ばされてコードとの対応が切れる。付録 3 の 8 列表・
