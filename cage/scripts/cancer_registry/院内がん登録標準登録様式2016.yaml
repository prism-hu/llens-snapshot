    body_text: |
      修正履歴 PDF は日付ブロックごとに「頁 / 修正詳細 / 修正前 / 修正後」を並べたもの。
      **「頁」は本体の印字ページ番号**で、2026-07-27 / 2026-04-01 / 2025-09-09 の 3 ブロックは
      現行の印字ページ番号 (物理ページ = 印字 + 6)、2025-06-16 ブロックだけは**改訂前の版の
      ページ番号**を指すので現行の印字ページとはずれる (例: 2025-06-16 の「頁 48」=
      現行の印字 p.47 [580] 進展度・治療前)。

      **ここに載っている修正はすべて本体 PDF `2016manual.pdf` に反映済み**である
      (2026-07-27 分を含む。照合の内訳は `_index.md` の「収録にあたっての判断」を参照)。
      本ツリーの本文は本体 PDF そのままで、修正履歴による差分適用はしていない。
