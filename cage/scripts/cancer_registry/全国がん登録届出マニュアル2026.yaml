id: 全国がん登録届出マニュアル2026
title: 全国がん登録 届出マニュアル 2026（ダウンロード版）
guideline: 全国がん登録 届出マニュアル 2026
publisher: 厚生労働省・国立がん研究センター
source: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/gan/gan_toroku.html
retrieved_at: '2026-09-11'
description: |
  『全国がん登録 届出マニュアル 2026（ダウンロード版）』（厚生労働省 / 国立研究開発法人
  国立がん研究センター。編集は国立がん研究センターがん対策研究所、2026 年 4 月 1 日発行。
  2015 年 10 月 1 日初版、2017・2019 改訂版、2022・2025 発行に続く現行版）。

  がん登録等の推進に関する法律（平成 25 年法律第 111 号）第 6 条により、病院又は指定された
  診療所の管理者は、原発性のがんについて当該病院等における初回の診断が行われたとき、
  一定の期間内に所在地の都道府県知事へ届け出る義務を負う。本書はその届出情報を作成する
  ための実務マニュアルで、**届出の対象・期限・提出方法**（第 1 章）、**届出 27 項目（項目番号 1〜26 + 備考）の
  1 項目ずつの定義・コード・記入上の注意**（第 2 章）、**遡り調査に基づく届出**（第 3 章）、
  **法令集と ICD-O-3 コード表・電子ファイル提出形式**（付録）から成る。

  構成:
  - 第 1 章 届出の対象と方法 — 届出の対象（がんの種類・患者・病院等）／届出情報の作成と
    届出方法（作成時期・期限・提出形式・GTOL による届出・届出チャート）
  - 第 2 章 届出項目について — 届出項目の概説（項目一覧・がん治療と初回治療の定義・
    進展度の定義と総則）に続き、患者基本情報 7 項目 / 腫瘍情報 10 項目 /
    初回の治療情報 8 項目 / 届出時の状況 1 項目 / その他 1 項目 の計 27 見出しを
    **1 項目 = 1 ノード**で収める
  - 第 3 章 死亡者新規がん情報に関する通知に基づく届出 — 遡り調査の方法・届出の方法
  - 付録［1］法令集（法律・施行令・施行規則）／［2］ICD-O-3 の性状コード 2・3 の組織型と
    和名／［3］局在コードと和名／［4］その他の政令で定める疾病／［5］電子ファイルによる
    提出形式

  本文中の「・・・」で始まる見出しは Q&A 風のコラムで、**独立ノード**として
  `コラム_` 接頭辞で収めた（患者からの質問への答え方、届出票を誰が作ってよいか、
  都道府県からの照会、院内での情報保護、死亡診断書と死亡者情報票の関係の 5 本）。
# 本文に康熙部首の字形 (⾏ U+2F8F / ⽤ U+2F64 / ⽣ U+2F63 …) と縦書き用記号 (︓ U+FE13) が
# 残っており、read_doc の戻りをそのまま引用すると「⽣存状況」になるので潰す。
# 下の strip / strip_edge と patches.find は **正規化後**の字形に対して書く
normalize_radicals: true
strip:
  # 版面の柱（章名）。ページ上端に毎ページ入る。章扉ページでは同じ文字列が章題として
  # 印字されるが、ノードの title が章名を持つので落として構わない。
  # **目次ページの行（章名 + 点リーダ + ページ番号）は fullmatch しない**ので、
  # `.*` を付けた緩いパターンにはしない（目次を巻き添えにする）
  - '第 1 章：届出の対象と方法'
  - '第 2 章：届出項目について'
  - '第 3 章：死亡者新規がん情報に関する通知に基づく届出'
  - '第 3 章：死亡者新規がん情報に関する'   # 第 3 章扉 (p.69) は柱が 2 行に割れる
  - '通知に基づく届出'
strip_edge:
  # ノンブルと付録のノンブル。**必ず strip_edge 側**に置く — `\d{1,3}` を strip に置くと
  # 届出項目の項目番号（1〜29）・院内がん登録の項目番号（100〜999）・進展度コード
  # （400/410/420/430/440/499/660/777）・ICD-O-3 の 4 桁形態コードまで消える。
  # -layout 出力では全 134 ページでノンブルが**末尾の非空行**に来ることを確認済み
  # （端 3 行の窓に裸の数字が他に入らないことも確認した）
  lines: 3
  patterns:
    - '\d{1,3}'
    - '付録［[0-9\-]+］\d{1,3}'
pdfs:
  - file: 001728039.pdf
    url: https://www.mhlw.go.jp/content/001728039.pdf
    label: 全国がん登録 届出マニュアル 2026（ダウンロード版）
    # 既定モード（フラグ無し）はこの原本では表が全滅する。届出項目ページのヘッダ表
    # （項目番号 / 全国・院内 / 用途 / 集計）、届出項目一覧、ICD-O-3 コード表（2 段組）、
    # 付録［5］の対応表がいずれもセル単位で 1 行ずつに分解され、行と列の対応が消える。
    # -layout は本文（1 段組）も素直に出る（左インデントが付くだけ）ので全ページ layout。
    mode: layout
