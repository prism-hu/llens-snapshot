notes: |
  **原本と取得**
  - 原本は厚生労働省サイトの `001728039.pdf`（3,690,525 bytes、134 物理ページ）。
    掲載ページは厚労省「がん登録」
    <https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/gan/gan_toroku.html>
    で、「全国がん登録　届出マニュアル2026［3.6MB］」のリンク先として
    <https://www.mhlw.go.jp/content/001728039.pdf> が張られている（2026-09-11 に
    HEAD で 200 / Content-Length がローカルの原本と一致することを確認した）。
    同じ内容は国立がん研究センターがん情報サービス
    <https://ganjoho.jp/med_pro/cancer_control/can_reg/registration_hospital/rep-manu.html>
    からも同一 URL で配布されている。厚労省サイトには別コンテンツ ID
    （`10901000/001741635.pdf`）の同名 PDF も存在するが、本収録は手元の原本と
    バイト数が一致する `001728039.pdf` を正とする。
  - 版の根拠は奥付（物理 p.133）の「2026 年 4 月 1 日 2026 発行」。初版は 2015 年 10 月 1 日で、
    2017・2019 改訂版、2022・2025 発行を経た現行版。**旧版（2025 以前）は収録しない**。

  **抽出モード**
  - 全ページ `-layout`（`mode: layout`）。既定モード（フラグ無し）では届出項目ページの
    ヘッダ表（項目番号／全国・院内／用途／集計）、届出項目一覧、ICD-O-3 コード表（2 段組）、
    付録［5］の対応表がいずれもセルごとに 1 行へ分解され、行と列の対応が失われる。
    本文は 1 段組なので `-layout` でも素直に出る（左インデントが付くだけ）。
  - `strip` / `strip_edge` は**この `-layout` 出力に合わせて**書いてある。モードを変えるなら
    両方書き直すこと。ノンブルは全 134 ページで「末尾の非空行」に来ること、端 3 行の窓に
    裸の数字が他に入らないことを実測で確認した（`\d{1,3}` を `strip` に置くと、項目番号
    1〜29・院内項目番号 100〜999・進展度コード 400/410/…/777・ICD-O-3 の 4 桁形態コードが
    全部消える）。

  **ツリーの切り方**
  - 原本の目次の階層をそのまま写した。第 2 章は**1 届出項目 = 1 ノード**（患者基本情報 7 /
    腫瘍情報 10 / 初回の治療情報 8 / 届出時の状況 1 / その他 1 = 27 項目）。
    「届出時の状況」「その他」は配下が 1 項目しか無いのでディレクトリを作らず、
    `05_届出時の状況_死亡日` `06_その他_備考` として葉に畳んだ。
  - 「・・・」で始まるコラムは 5 本とも**独立ノード**にし、path を `コラム_`、title に
    「コラム」を入れた。1 ページ丸ごとのもの（p.14 患者さんからの質問、p.68 情報等の保護）は
    そのまま、節と同居するもの（p.17 / p.20 / p.72）は `from` / `until` でページ内分割した
    （後ろ側に `allow_overlap: true`）。
  - 付録［1-1］の法律は 23 ページ・約 25,800 字あり 1 ノードでは大きすぎるので、
    章で割り、さらに第二章（約 20,000 字）は法律自身の節で 6 つに割った。
    分割の境界はすべて法律の章名・節名の行そのもの（ノンブルや柱は使っていない）。
  - 付録［2］は《性状 3 一覧》（p.111-117）と《性状 2 一覧》（p.118）でページが割れるので
    2 ノードにした（`from` / `until` は不要）。

  **落としたページ（全 134 ページ中 18 ページ）**
  - 目次 2 ページ（物理 p.4-5）。点リーダの行が 7,500 字ほどあり、doc ツリー自体が
    同じ役目を果たすので落とした。**発行年・版の根拠になる奥付（p.133）は収録した**。
  - 白紙・ノンブルだけのページ 16 枚（物理 p.2, 3, 6, 8, 10, 25, 27, 28, 70, 74, 110,
    119, 124, 126, 132, 134）。strip 後の本文が 0〜2 字で、うち p.110 は原本に
    「白 紙」とだけ印字されている。p.25 / p.27 は柱とノンブルしか無い章末の余白。
  - これ以外の 116 ページはすべてどれかのノードに載る。

  **既知の読みにくさ（VLM パス待ち）**
  - 届出項目ページ冒頭の「項目番号／全国・院内／用途／集計」の 4 分割セルは、
    `-layout` でも読み順が「全国 → 項目番号 → 用途 → 集計 → 院内」と入れ替わって出る。
    値（項目番号・用途の 管理/照合/集計）はすべて残っているので `vlm_candidates` には
    入れていないが、overlay を作るならここも整える余地がある。
  - ICD-O-3 のコード表（付録［2］［3］［4］）は `-layout` でコードと和名の対が
    1 行に保たれるので候補に入れていない。長い和名が次行に折り返す行が各ページに
    数行ある（例: 9654 ホジキンリンパ腫, リンパ球減少型, びまん性線／維症性）。
