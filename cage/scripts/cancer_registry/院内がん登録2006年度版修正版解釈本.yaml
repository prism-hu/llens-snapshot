notes: |
  **この版を入れる理由（旧版だが落とさない）**

  現行は 2016 年版で、2016 年版は 2016 年 1 月 1 日診断症例から適用される。本版が要るのは
  (1) 2015 年 12 月 31 日以前の診断症例の登録・照合・遡及集計、(2) 2016 年版の各項目にある
  【互換情報】「2006 年度版 項目番号」の参照先、の 2 つ。`01_brief.md` の「旧版は削除する」は
  同じ版系列の前版を残さないという意味で、**適用症例の時期が違うこの 2 本は別ドメイン**として
  並立させている。title にはすべて `[2006年度版 …]` の接頭辞を付けたので、2016 年版と
  grep で混ざっても一目で区別できる。

  **落としたページ（物理 3-5 = 目次）**

  3 ページの目次だけ収録していない。リーダ罫（`····`）で埋まっていて読みにくく、しかも
  印字ページ番号しか持たないので doc ツリーでは使えない（各ノードの `_index.md` に build が
  「収録」一覧を出すので目次の役は果たされる）。**表紙と改訂検討メンバー（物理 1-2）は
  収録した** — 表紙の 3 つの日付が版の根拠になるため。残り（物理 6-88）は全ページどこかの
  ノードに載っている。

  なお**原本の目次のページ番号は一貫していない**。個別の登録項目（患者 ID 番号 = 12 など）は
  印字ノンブルを指すが、総論の【…】節（「…について」= 6、「変更内容」= 8 など）は物理ページを
  指していて 1 ずれる。manifest の `pages` は**すべて物理ページ**（ノンブル + 1）。

  **1 ノードの単位（1 項目ではなく 1 定義シート）**

  原本はページ右上に「項目番号：N」または「項目番号：N-M」の柱を持ち、これが 1 枚の定義
  シートの単位になっている。範囲になっているシート（30-42、80-101、240-260、360-430、
  640-790 など 17 枚）は、複数の関連項目を並べたうえで**末尾の解説文を全項目で共有**している
  （「氏名（姓・名・フリガナ）について」= 30-42、「診断時住所について」= 80-101、
  「【日付の書式（フォーマット）について】」= 50-60 / 460-470 / 530-540 / 640-790 / 850-861）。
  1 項目 = 1 ノードに割ると、この解説文が最後の項目にだけ付いて他の項目が定義の文脈を失う。
  そこで**シートを割らず 1 ノード**とし、代わりにノードの title にそのシートが載せる
  **全項目の番号と項目名**を並べた。項目番号でも項目名でも grep で当たる。

  例外は総論の物理 9 ページだけで、ここは独立した 2 節（登録対象について／登録項目について）が
  1 ページに載るので `until` / `from` で割った（後半に `allow_overlap: true`）。

  **path の並び**

  walker は `sorted()` 順に子を返すので、項目番号は**3 桁ゼロ埋め**にした（`010_`・`030-042_`・
  `080-101_`）。ゼロ埋めしないと `10 < 110 < 120 < … < 20` の順になって原本順が崩れる。
  path segment に括弧は使えないので `診断日0（発端日）` → `120_診断日0_発端日` のように
  外し、括弧付きの正式名は title に残した。

  **抽出モード（layout）とテキスト層**

  全ページ `mode: layout`。各項目の見出し表（項目番号／項目名／別 名／必須・標準・オプションの別）
  は既定モードだと 1 セル 1 行にばらけ、「項目番号 / 項目名 / 別 名 / 標準項目、オプション項目の別 /
  240 / TNM分類（UICC）T分類 / 主要 5 部位については、●」のように**どの値がどの列か分からなくなる**。
  `-layout` なら桁が保たれて表として読める。壁深達度（物理 47）・根治度対応表（物理 59）・
  付録（物理 77-88）の差はさらに大きい。

  テキスト層は**健全**。(cid:N) 0 件、私用領域・CJK 部首補助・康熙部首・U+FFFD いずれも 0 件で、
  数字・○・◆●△・全角ローマ数字（Ⅰ〜Ⅳ）が正しく出る。Distiller 7.0 / 2006 年の古い PDF だが
  文字化け・欠落は見つからなかったので `text_caveat` は置いていない。`is_thin`（clean 後 40 字未満）に
  当たるページも無い（最小は物理 42 の 64 字）。

  **strip の判断**

  - 柱は 2 行（「第 N 版 更新日：YYYY/M/D」と「項目番号：N」）。**落としたのは後者だけ**。
    前者は**項目ごとに値が違い**（第1版/第2版/第3版、更新日 2006/10/2・2006/12/25・2007/1/31・
    2012/3/1・2012/12/11 の 5 種）、どの項目定義が 2012 年の改訂で書き換わったかを示す
    唯一の手がかりなので本文に残した
  - ノンブルは `strip_edge`（`\d{1,3}`、lines: 3）。この原本は選択肢コード（`1 有 2 無 9 不明`）・
    都道府県コード・壁深達度コード・進展度コードが**裸の数字の行**として大量に出るので、
    `strip` 側に置くと全滅する
  - **付録（物理 77-88）のノンブルは落ちない。** 横長ページなので `-layout` 出力ではノンブルが
    ページ中ほどの行頭に来て（`76       30   フリガナ …`）、端 3 行の窓に入らない。
    本文に混じるが、`\d{1,3}` を全行に効かせて対応表の数値を壊すより害が小さいので許容した

  **項目名が目次と本文で違う 1 件**

  項目番号182 は本文の見出し表では「診断・治療区分」だが、目次では
  「診断及び初回治療・経過観察が行われた施設の別」になっている。title に両方入れてある。

  **付表だけ 3 ノードに割った**

  付録の付表（物理 77-81）は 5 ページ通しで 1 枚の表だが、`-layout` 抽出で約 22,000 字になり
  「1 ノード 2 万字を超えたら節で割る」（`22_jns_guidelines.md`）に当たる。項目区分の切れ目に
  近いページ境界で 77-78 / 79-80 / 81 の 3 ノートに割った（それぞれ項目番号 10〜230 /
  231〜760 / 770〜870）。表のヘッダ行は各ページの先頭に再掲されているので、割っても
  列の意味は失われない。

  **図表（vlm_candidates 15 ページ）**

  ラスタ画像を含むのは物理 7（系譜図）だけで、他はすべてベクタの罫線表。それでも
  壁深達度（47）・根治度対応表（59）・付録の対応表（77-88）は `-layout` でも列の対応が
  崩れるので候補に挙げた。
