id: 院内がん登録2006年度版修正版解釈本
title: がん診療連携拠点病院 院内がん登録 標準登録様式 登録項目とその定義 2006年度版 修正版【解釈本】
guideline: がん診療連携拠点病院 院内がん登録 標準登録様式 登録項目とその定義 2006年度版 修正版【解釈本】
publisher: がん臨床研究事業「地域がん診療拠点病院の機能向上に関する研究」班 院内がん登録小班
source: https://ganjoho.jp/med_pro/cancer_control/can_reg/hospital/regulation.html
retrieved_at: '2026-09-11'
description: |
  『がん診療連携拠点病院 院内がん登録 標準登録様式 登録項目とその定義 2006 年度版 修正版【解釈本】』
  (がん臨床研究事業「地域がん診療拠点病院の機能向上に関する研究」班〔主任研究者：池田 恢〕
  院内がん登録小班。全 88 ページ)。表紙に **2012 年 3 月 1 日 / 2006 年 12 月 25 日 /
  2006 年 10 月 2 日** の 3 つの日付があり、2006 年 10 月 2 日が初版、2006 年 12 月 25 日が
  修正版、2012 年 3 月 1 日が最終の版起こしにあたる (各登録項目のページ右上に
  「第 N 版 更新日：YYYY/M/D」が印字されており、項目ごとに最終改訂日が違う)。

  **これは旧版である。** 現行は 2016 年版で、2016 年版は **2016 年 1 月 1 日診断症例から**
  適用される。したがって本版が要るのは次の 2 つの場合:

  1. **2015 年 12 月 31 日以前の診断症例**の登録・照合・遡及集計。その時期の症例は
     本版の定義 (項目番号・選択肢コード・進展度やステージの体系) で登録されている
  2. **2016 年版の各項目にある【互換情報】「2006 年度版 項目番号」の参照先**。
     2016 年版から旧項目番号を引いたとき、その定義本文はここにある

  「標準登録様式」そのもの (項目一覧) ではなく、各項目が何を意味し何をどうコードするかを
  述べた**解釈本**である。構成:

  - 総論 6 節 — 定義の成立経緯 / 2006 年度版修正版の変更内容 / 登録対象 / 登録項目の
    必須(◆)・標準(●)・オプション(△)の別 / がん治療・初回治療の定義 / 今後検討が必要な事項
  - 登録項目の定義 — 【基本情報】【診断情報】【腫瘍情報】【初回治療情報】【予後情報】
    【診療科情報】【管理用項目・その他】の 7 区分、項目番号 10〜870
  - 付録 — 付表 (2003 年度版 / 2006 年度版 / 2006 年度版修正版の登録項目一覧と対応)、
    別添 1 (2003 年度版対応表)、別添 2 (2006 年度版対応表)、
    別添 3 (地域がん登録標準登録票項目対応表)、別添 4 (標準項目から必須項目への変換ロジック)

  収録は **1 ノード = 原本の 1 定義シート** (ページ右上の「項目番号：N」または「項目番号：N-M」が
  くくる単位)。原本は関連する項目をまとめて 1 シートに載せ、末尾の解説文
  (「氏名（姓・名・フリガナ）について」「診断時住所について」「日付の書式について」など) を
  その全項目で共有しているため、1 項目ずつに割ると大半の項目が定義の文脈を失う。
  シートが複数項目をくくる場合は、ノードの title に**その全項目の番号と項目名**を並べてあるので、
  項目番号でも項目名でも grep で当たる。
# 本文に康熙部首の字形 (⾏ U+2F8F / ⽤ U+2F64 / ⽣ U+2F63 …) と縦書き用記号 (︓ U+FE13) が
# 残っており、read_doc の戻りをそのまま引用すると「⽣存状況」になるので潰す。
# 下の strip / strip_edge と patches.find は **正規化後**の字形に対して書く
normalize_radicals: true
strip:
  # ページ右上の柱のうち「項目番号：N」だけを落とす (ノードの path / title と完全に重複する)。
  # 隣の「第 N 版 更新日：YYYY/M/D」は**落とさない** — 項目ごとに版と最終改訂日が違い、
  # 2012 年改訂で手の入った項目を見分ける唯一の手がかりなので本文に残す価値がある
  - '項目番号[：:][0-9０-９]{2,3}(?:[-－][0-9０-９]{2,3})?'
strip_edge:
  # ノンブル。項目定義ページ (物理 13-76) では必ず最終非空行に来る。
  # `\d{1,3}` を strip 側に置くとコード値 (選択肢の 1/2/9、都道府県コード、
  # 壁深達度コード、進展度コード) が全滅するので必ず strip_edge 側
  lines: 3
  patterns:
    - '\d{1,3}'
pdfs:
  - file: 2006_teigi.pdf
    url: https://ganjoho.jp/med_pro/cancer_control/can_reg/hospital/pdf/2006_teigi.pdf
    label: 2006年度版 修正版【解釈本】(全 88 ページ)
    # 全ページ layout。既定モードだと各項目の見出し表 (項目番号 / 項目名 / 別名 /
    # 必須・標準・オプションの別) が 1 セル 1 行にばらけて対応が読めなくなる
    mode: layout
