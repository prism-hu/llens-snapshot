notes: |
  ## 発行主体（1 ページ目・奥付で確認）
  - 診断基準（2p）: 「作成者」の記載はなく、末尾に「日本神経学会承認日 ２０１４年１月２４日」のみ。
    内容・体裁は診療マニュアル（同じ研究班）と一致するため、publisher は研究班とした。
  - 診療マニュアル（31p）: 表紙に「協力 一般社団法人 日本神経学会（日本神経学会承認日 2019年11月23日）」、
    p2-3 に「神経変性疾患領域における基盤的調査研究班 研究代表者 中島健二」以下の班員・研究分担者・執筆担当者・監修者。
    したがって発行主体は厚生労働省 難治性疾患政策研究事業の研究班で、日本神経学会は協力・承認の立場。

  ## 落としたページ
  - 診療マニュアル p1: 表紙（書名・協力・承認日。description に転記済み）。
  - 診療マニュアル p2-3: 研究班名簿（研究代表者・班員・研究分担者・執筆担当者・監修）。主要人名は description に転記済み。
  - 診療マニュアル p4: 目次。p6: 白ページ。
  - 診断基準 PDF は 2 ページとも収録（欠落なし）。

  ## ページ境界の確認
  - 章・節の境界（p7 第1章Ⅰ / p12 Ⅱ診断 / p17 Ⅲ対応・治療 / p19 第2章Ⅰ / p23 Ⅱ診断 / p29 Ⅲ対応・治療）は
    すべて当該ページ本文の見出し行（「Ⅱ 診断」「Ⅲ 対応・治療の原則と選択肢」等）を確認して決めた。
  - このマニュアルには目次に印字ページ番号が振られておらず、目次とのページずれは発生しない。

  ## strip / strip_edge・章 _index の本文
  - 診療マニュアルの柱 (書名 1 行) を `strip`、ノンブルを `strip_edge` (lines: 2) に置いた。
    この 2 本には端に数値だけの行が 2 つ並ぶページが無いので、表の数値セルの巻き添えは起きない。
  - 章 (`01_紀伊ALS` / `02_紀伊ALS-PDC`) と `02_診療マニュアル` の `_index.md` は、原本の該当ページを
    収録していないので `body_text` で書いた案内文と子の一覧だけになる。

  ## その他
  - 診療マニュアルの Ⅲ 節は冒頭に「以下の回答は、エビデンスに基づいたものではなく経験に基づいたエキスパートオピニオンである。」
    と明記されている。ノード本文にその 1 行が含まれる。
  - 診断基準 PDF のファイル名（「紀伊ALS／PDCの診断基準_…」）は download_log の Guideline 列＋PDF 列の連結で、
    中身は 1 文書（疾患概念＋診断基準＋重症度分類）。ファイル名と実体のずれはない。
  - vlm_candidates は 5 ページ。診断カテゴリー (Possible / Probable / Definite の組み合わせ) と重症度分類、
    疫学の多列表が対象で、overlay 待ち。
  - 診療マニュアル p20（QⅠ-3〜5）と p24（QⅡ-3〜4）はいずれも実ページを確認したところ表・図が無い
    平文で、pdftotext の抽出も乱れていない（穂原地区の粗有病率・7 サブタイプの説明もすべて 1 段組の
    地の文）。以前の why は「古座川地区の粗有病率表」「QⅡ-3 の 7 臨床型の一覧」など実在しない表を
    指しており誤りだったため、vlm_candidates から外した。QⅡ-2（p23）の診断基準は表ではないが、
    診断基準 PDF と同一内容で Possible/Probable/Definite の組み合わせがレイアウトに依存するため
    候補として残し、why を実体（箇条書きであり表ではない）に合わせて書き直した。
