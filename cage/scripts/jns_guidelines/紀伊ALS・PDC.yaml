id: 紀伊ALS・PDC
title: 紀伊 ALS／ALS-parkinsonism-dementia complex（PDC） 診断基準・診療マニュアル
guideline: 紀伊 ALS／PDC の診断基準・紀伊半島南部に多発する ALS と ALS-parkinsonism-dementia complex に関する診療マニュアル
publisher: 厚生労働省 難治性疾患政策研究事業「神経変性疾患領域における基盤的調査研究」班（研究代表者 中島健二／日本神経学会協力）
source: https://www.neurology-jp.org/guidelinem/kii_als/kii_als.pdf
retrieved_at: '2026-09-05'
description: |
  紀伊半島南部（和歌山県田辺市〜三重県松阪市を結ぶライン以南、牟婁郡とその周辺）に多発する
  筋萎縮性側索硬化症（紀伊 ALS）と、パーキンソニズム・認知症を単独または複合して示す
  ALS-parkinsonism-dementia complex（ALS/PDC）に関する、日本神経学会掲載の 2 文書を 1 つのディレクトリ (`{{DOC_BASE}}/診療ガイドライン/神経疾患/紀伊ALS・PDC/`) にまとめたもの。

  収録した 2 文書:
  1. **紀伊 ALS/PDC の診断基準**（2 ページ、日本神経学会承認日 2014年1月24日）。疾患概念（地域性・臨床病型・神経病理学的所見）、
     診断基準（Possible / Probable / Definite）、重症度分類Ⅰ〜Ⅴ。作成は厚生労働省の研究班。
  2. **紀伊半島南部に多発する ALS と ALS-parkinsonism-dementia complex に関する診療マニュアル**（31 ページ、
     日本神経学会承認日 2019年11月23日）。編集は厚生労働省 難治性疾患政策研究事業「神経変性疾患領域における基盤的調査研究」班
     （研究代表者 中島健二、(独)国立病院機構松江医療センター院長）、協力 一般社団法人 日本神経学会。
     執筆担当は小久保康昌（三重大学）、森本悟、金井数明、佐々木良元、岡本和士、紀平為子、監修 葛原茂樹。
     第1章「紀伊 ALS」と第2章「紀伊 ALS-parkinsonism-dementia 症候群」の 2 章立てで、各章が
     Ⅰ．定義・疫学・経過・リスクファクター／Ⅱ．診断／Ⅲ．対応・治療の原則と選択肢 の 3 節に分かれる Q&A 形式。
     第1章は紀伊半島南部の様々な ALS を、第2章は特徴的なタウ病理を示す疾患を扱うため、
     タウ病理を伴う ALS は両章に含まれる（マニュアル本文の記載）。

  収録範囲: 診断基準は全 2 ページを 1 ノード。診療マニュアルは背景（用語・作成の背景）と 2 章 6 節をノードにした。
  表紙・研究班名簿・目次・白ページは収録しない。Ⅲ節の回答はエビデンスに基づくものではなくエキスパートオピニオンである旨が原文に明記されている。
