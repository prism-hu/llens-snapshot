guideline: HTLV-1関連脊髄症（HAM）診療ガイドライン2025
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/pdf/ham_2025_01.pdf
retrieved_at: '2026-09-05'
description: |
  原典正式名: 「HTLV-1 関連脊髄症（HAM）診療ガイドライン 2025 〜HTLV-1 陽性関節リウマチ＆HTLV-1 陽性臓器移植
  診療の対応を含めて〜」。監修 日本神経学会（協力機関: 日本神経治療学会、日本神経免疫学会、日本神経感染症学会、
  日本 HTLV-1 学会、日本リウマチ学会ほか）、編集 HTLV-1 関連脊髄症（HAM）診療ガイドライン作成委員会
  （委員長 佐藤知雄）。2025年10月15日 発行。
  「HTLV-1 関連脊髄症（HAM）診療ガイドライン 2019」（厚生労働省 山野嘉久班）の改訂版。
  第2章の CQ は GRADE アプローチで作成し「推奨の強さ（強い/弱い）」と「エビデンスの確実性（高/中/低/非常に低）」で
  提示する。第3章はエビデンスが不十分で推奨を作成できない重要臨床課題を Q＆A として扱う。

  構成は 4 章立て。
  第1章 HAM や HTLV-1 陽性患者の診療における基本情報（1．HTLV-1 について〈疫学・感染診断と告知・キャリア診療・
  ATL/HU・HAU/シェーグレン症候群/関節炎/肺病変・ATL スクリーニング・臓器移植〉/ 2．HAM について〈疾患概念・病理・
  診断基準・検査・症状・重症度分類・疾患活動性分類・薬物治療・運動療法・神経因性膀胱・合併症・社会福祉支援〉）、
  第2章 HAM 診療の CQ と推奨（CQ1 ステロイド内服 / CQ2 ステロイドパルス / CQ3 インターフェロンα /
  CQ4 抗レトロウイルス薬）、
  第3章 HAM ならびに HTLV-1 陽性患者の診療における Q＆A（1．HAM の診療 19 件 /
  2．HTLV-1 陽性関節リウマチ（RA）患者の診療 10 件 /
  3．臓器移植における HTLV-1 感染への対応 5 件 / 4．ATL のスクリーニング 1 件）、
  第4章 患者と医療者の共有意思決定（SDM）について。

  収録範囲: 本体 227 ページのうち、監修・作成委員会・発行にあたって・序・基本理念および概要（COI 含む）・奥付
  （`00_ガイドライン概要`）、HAM の診療の流れ（3 つのフローチャート）、CQ ダイジェスト、主な用語および略語、
  第1〜4章の全節・全 CQ・全 Q＆A を収録する。目次・索引・白ページは収録しない。
  別冊「補足資料」（89 ページ、CQ1〜CQ4 の文献検索式・採用論文・評価シート・GRADE エビデンスプロファイル・
  定性的システマティックレビュー・SR レポート・Evidence to Decision テーブル・外部評価返答リスト）を
  子セクション `90_補足資料` として収める。
