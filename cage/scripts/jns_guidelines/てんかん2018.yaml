notes: |
  収録範囲と落としたもの
  - `てんかん診療ガイドライン2018_序文・目次等.pdf` (16p) のうち p1-2 は表紙・扉でテキスト層が空 (0 文字) のため収録しない。p12-16 は目次のため収録しない (ツリー自体が目次の役割を果たす)。収録したのは p3-11 (奥付・執筆者一覧・発行にあたって・改訂について・承認されている抗てんかん薬一覧)。索引は元PDFに含まれていない。
  - 第1部の各章 PDF は全ページを CQ ノードに割り当てた (第6章のみ p1 が章扉＋表1「各種てんかん症候群に対する選択薬」なので, 章ディレクトリ `06_てんかん症候群別の治療ガイド` の `_index.md` 本文に載せた)。
  - 第2部の3 CQ は ダイジェスト版 (書籍収載) と 詳細版 (学会HP掲載) の両方を全ページ収録した。

  ファイル名と実体
  - 第1章のファイル名は「診断・分類，識別」だが, 本文・目次の章題は「診断・分類，鑑別」。ノード title は原本の章題 (鑑別) に合わせた。
  - 第9章 p2-3 の CQ9-2「薬剤抵抗性側頭葉てんかんに対して側頭葉切除術は有効か」と p4-6 の CQ9-2「…側頭葉切除術を薬物療法に加えて行うべきか」は原本で同じ CQ 番号を持つ別項目 (前者が従来型の要約, 後者が GRADE SR に基づく推奨)。第10章 p1-2 / p3-5 の CQ10-1 も同様。後者を `_SR` 付きの path segment に分けた。
  - 追補版 CQ4-6「小児・思春期の全般発作にバルプロ酸，部分発作にカルバマゼピンを使用して，血中濃度が治療域でも発作が再発した場合には，次になにを使用すべきか」(https://www.neurology-jp.org/guidelinem/epgl/tenkan_2018_tuiho_cq4-6.pdf) は元のファイル名が UTF-8 で 255 バイトを超えるため ext4 に保存できず, カタログでは 250 バイトに切り詰めた名前 (`…次になにを使用.pdf`) で cache に置いてある。manifest の `file` はこの切り詰め名。配信 PDF 名・overlay 名は URL basename の `tenkan_2018_tuiho_cq4-6` になるので影響しない。追補版 12 項目はこれで全数収録。
  - 追補版 (2021年発表) と 追補版2022 (2022年10月作成/2023年公開) には同名 CQ が2組ある: CQ8-2「けいれん性てんかん重積状態に使う薬剤はなにか」と CQ12-2「血中濃度測定が有用な薬剤はどれか」。両方を残し, どちらが新しいかを各ノードの title 末尾に明記した。追補版2022 の CQ8-2 は図1 (治療フローチャート) 1ページのみ, CQ12-2 は表1・表2 の差し替え1ページのみで, 本文は追補版2021 側にある。

  ページ・テキスト層
  - 全ページに テキスト層あり。ヘッダ/フッタは「ノンブル」「第N章」「章題 (縦組みは ︑︵︶ の異体字)」「CQ N–M」の4種。ノンブルだけ `strip_edge` (先頭/末尾 3 非空行), 残りは `strip`。
  - ノンブルを `strip_edge` に置いたので, 表の数値セル (相互作用表・血中濃度表・Forest plot) と 本文の上付き文献番号は残るようになった。表のページはいずれにせよ vlm_candidates に入れてあり VLM 起こしで置き換える前提。
  - strip の章題パターン (例 `てんかん重積状態`) は各章の章扉ページの見出しも落とす。ノードの title が章・CQ を名乗るので情報は失われない。
  - 各章 PDF の p1 (章扉＋最初の CQ) だけ, 縦組みの柱「第N章」が「第」「章」と章番号の 3 行に割れて出る。`strip` に `第` `章` を足して落とした (全 18 章の p1 だけに現れ, 本文にこの形の行が無いことを確認済み)。章番号の 1 桁だけは strip_edge の窓から外れて本文の途中に残るが, `\d{1,3}` を全行 strip に戻すと文献番号を巻き込むので残す判断をした (overlay で直る)。

  収録しなかった関連ファイル
  - 旧版 (てんかん治療ガイドライン2010) は `,/JNS_Guidelines_ALL` に存在しない。
  - `神経学領域の診療ガイドラインに関する臨床医の意識…_脳神経疾患克服に向けた研究推進の提言2024.pdf` は download_log で本ガイドラインに紐づいて DUPLICATE 記録されているが, 診療指針ではないため収録しない (共通計画の方針2)。
