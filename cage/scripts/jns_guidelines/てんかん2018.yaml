title: てんかん診療ガイドライン2018
guideline: てんかん診療ガイドライン2018
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/tenkan_2018.html
retrieved_at: '2026-09-05'
description: |
  日本神経学会監修『てんかん診療ガイドライン 2018』(編集: 「てんかん診療ガイドライン」作成委員会 / 委員長 宇川義一, 発行: 医学書院, 2018年3月15日 第1版第1刷, ISBN978-4-260-03549-1)。協力学会は日本てんかん学会・日本脳神経外科学会・日本小児神経学会・日本神経治療学会。「てんかん治療ガイドライン 2010」の改訂版で, Minds 診療ガイドライン作成の手引き 2014年版に準拠。

  第1部 (第1章〜第18章, CQ1-1〜CQ18-2 の計89 CQ) と, GRADE システムでシステマティック・レビューを行った3 CQ (CQ9-2 / CQ10-1 / CQ10-2) の第2部からなる。第2部はダイジェスト版が書籍に収載され, 詳細版が学会ホームページに掲載されている。本収録では第2部を「50_第2部_システマティックレビュー」に置き, 各CQごとに ダイジェスト版本文 / ダイジェスト版エビデンス資料 / 詳細版本文 / 詳細版エビデンス資料 に分けた。第1部の第9章・第10章には SR 版と同じ番号の短い CQ (CQ9-2, CQ10-1) が別に存在するため, SR 版のほうを `CQ09-2_SR` / `CQ10-1_SR` として区別している。

  追補版は本体の子セクションとして収録した。
  - `90_追補版` = てんかん診療ガイドライン2018追補版 (2021年発表, 12項目すべて収録)。2018年版本文の該当CQ・表を差し替える改訂。
  - `91_追補版2022` = てんかん診療ガイドライン2018追補版2022 (2022年10月作成, 2023年公開)。CQ8-2「けいれん性てんかん重積状態に使う薬剤はなにか」と CQ12-2「血中濃度測定が有用な薬剤はどれか」の2件で, **これが最新**。同名CQが `90_追補版` にもあるが, そちらは1世代前の改訂である。

  引用するときは 91_追補版2022 > 90_追補版 > 本文 の順で新しい。
