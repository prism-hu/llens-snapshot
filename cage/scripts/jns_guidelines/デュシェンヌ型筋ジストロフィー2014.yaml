notes: |
  ## 版
  - 2014年版が現行版。素材に旧版（2011年 DMD 診療ガイドライン等）は含まれていないので、落とした旧版はない。
  - 学会サイトでは 13 本の分冊 PDF として配布されている。分冊名と実体（URL: dmd_00.pdf 〜 dmd_12.pdf）は
    download_log / カタログの URL と 1 ページ目で照合済みで、ファイル名と実体のずれはない。

  ## 落としたページ
  - 序文・目次等（16p）: p1 中扉、p2 著作権表示（© Societas Neurologica Japonica, Japanese Society of Child Neurology,
    National Center of Neurology and Psychiatry, 2014 / Published by Nankodo）、p3 扉（監修・編集）、p4 作成委員会名簿、
    p15-16 目次。p5-14 を 3 ノードに収録。
  - 各章 PDF の p1: 章の中扉（章名 1 行のみ）。11 本すべてで同じ。
  - 検索式（12p）は全ページを `90_付録_検索式` 1 ノードに収録した（計画方針の「別冊なら付録_検索式 1 ノード」に従う）。

  ## ページ境界の確認
  - すべての CQ 境界は当該ページ本文の「Clinical Question N-M」見出し行を pdftotext 既定モードで直接確認した。
    分冊 PDF なので各章 PDF 内の物理ページ番号（1 始まり）で指定してあり、書籍の通しノンブルではない。
  - 1．総論だけ CQ の前に無番号の解説「デュシェンヌ型筋ジストロフィーとは」（p2-6）があり、`00_…` として別ノートにした。
  - 7．心筋障害治療は CQ 7-1-1〜7-1-6（心機能評価）と CQ 7-2-1〜7-2-4（心筋障害治療）の 2 段枝番を持つ。
    path は `CQ7-01-1`〜`CQ7-01-6`, `CQ7-02-1`〜`CQ7-02-4`, `CQ7-03`, `CQ7-04` としてゼロ埋めし、文字列ソートが原本順になるようにした。
  - 6．呼吸ケア（CQ6-01〜CQ6-13）と 10．食にかかわるケア（CQ10-01〜CQ10-09）も同じ理由で枝番を 2 桁ゼロ埋めしている。

  ## strip / strip_edge について
  - 各章の柱 (章名 1 行) と縦組みの「推」「奨」ラベル、制御文字 \x06 を `strip` に置いた。
    1．総論の柱は「1．総 論」(中黒なしの全角空きあり) で印字されるので、両方の綴りを入れてある。
  - 縦組みの柱に出る全角数字 1 文字 (章番号) も `strip` 側。13 分冊すべてで、全角数字だけの行が
    この柱以外に無いことを確認した。
  - ノンブルは `strip_edge` (lines: 2)。窓を 3 行にすると「検索式」分冊のヒット件数 (24 / 6 / 281 / 121 …) を
    巻き添えにするので 2 に絞った。それでも「検索式」分冊はページ最終行のヒット件数が 1 件ずつ落ちる
    (ノンブルと区別できない)。この分冊は全ページ vlm_candidates に入れてある。
  - 「（エビデンスレベル 4）」「■ 背景・目的」「■ 解説・エビデンス」「■ 文献」「［推奨を臨床に用いる際の注意点］」は
    本文の構造要素なので落としていない。

  ## 章 _index の本文
  - 各分冊の p1 は章扉 (章名 1 行) なので収録していない。各章の `_index.md` は `body_text` で書いた
    案内文と子の一覧だけになる。

