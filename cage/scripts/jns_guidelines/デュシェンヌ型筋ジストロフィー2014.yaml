nodes:
  - path: 00_序論
    title: 序論（発行について・まえがき・ガイダンス）
    body_text: |
      本ガイドラインの序論。日本神経学会がガイドラインを整備してきた経緯、まえがき（筋ジストロフィー医療の歴史と本ガイドラインの位置づけ）、ガイダンス（作成の経緯・目的と対象・構成と作成手順・エビデンスレベルと推奨グレードの定義・今後の課題）を収める。
      原本では分冊「序文・目次等」に当たる。
    children:
      - path: 01_神経疾患診療ガイドラインの発行について
        title: '神経疾患診療ガイドラインの発行について'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_序文・目次等.pdf, pages: [5, 6]}
      - path: 02_まえがき
        title: 'まえがき（作成の経緯・他の筋ジストロフィーへの応用）'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_序文・目次等.pdf, pages: [7, 8]}
      - path: 03_ガイダンス
        title: 'ガイダンス（作成の経緯・目的と対象・構成と作成手順・エビデンスレベルと推奨グレード・今後の課題）'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_序文・目次等.pdf, pages: [9, 14]}
  - path: 01_総論
    title: '1．総論'
    body_text: |
      第1章。CQ の前に無番号の解説「デュシェンヌ型筋ジストロフィーとは」（背景・疫学・診断・小児期と成人期の対応・治療研究の動向、表1 疾患の進行に応じた対応）が置かれ、そのあとに CQ 1-1 が続く。
      原本の分冊 p.1 は章扉（章名 1 行）なので収録していない。
    children:
      - path: 00_デュシェンヌ型筋ジストロフィーとは
        title: 'デュシェンヌ型筋ジストロフィーとは（背景・疫学・診断・小児期の対応・成人期の対応・治療研究の動向／表1 疾患の進行に応じた対応）'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_1．総論.pdf, pages: [2, 6]}
      - path: CQ1-01
        title: '[総論] DMD の生命予後は改善しているか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_1．総論.pdf, pages: [7, 9]}
  - path: 02_診断・告知・遺伝
    title: '2．診断・告知・遺伝'
    body_text: |
      第2章。CQ 2-1〜2-6。確定診断の意義と方法、告知の注意点、遺伝相談、出生前診断の倫理的・精神的配慮、保因者の発症率とフォローアップ、保因者の妊娠・出産・育児・介護のリスクを扱う。
      原本の分冊 p.1 は章扉（章名 1 行）なので収録していない。
    children:
      - path: CQ2-01
        title: '[診断・告知・遺伝] 確定診断にはどのような意義があり，どの時期にどのような方法で行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_2．診断・告知・遺伝.pdf, pages: [2, 6]}
      - path: CQ2-02
        title: '[診断・告知・遺伝] 患者の家族，患者に告知する際の注意点は何か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_2．診断・告知・遺伝.pdf, pages: [7, 8]}
      - path: CQ2-03
        title: '[診断・告知・遺伝] 遺伝に関する相談にどのように対応するか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_2．診断・告知・遺伝.pdf, pages: [9, 11]}
      - path: CQ2-04
        title: '[診断・告知・遺伝] 出生前診断はどのような倫理的・精神的配慮のもとにどのように行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_2．診断・告知・遺伝.pdf, pages: [12, 14]}
      - path: CQ2-05
        title: '[診断・告知・遺伝] 保因者の発症率はどの程度で，どのような症状を呈するか，どのようなフォローアップが必要か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_2．診断・告知・遺伝.pdf, pages: [15, 17]}
      - path: CQ2-06
        title: '[診断・告知・遺伝] 保因者が妊娠・出産，育児・介護をするにはどのようなリスクがあるか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_2．診断・告知・遺伝.pdf, pages: [18, 20]}
  - path: 03_検査・機能評価
    title: '3．検査・機能評価'
    body_text: |
      第3章。CQ 3-1〜3-3。運動機能評価（機能障害度分類・上肢運動機能障害度分類）、定期的な血液検査の項目、診断と経過観察の画像検査を扱う。
      原本の分冊 p.1 は章扉（章名 1 行）なので収録していない。
    children:
      - path: CQ3-01
        title: '[検査・機能評価] DMD の運動機能評価はどのように行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_3．検査・機能評価.pdf, pages: [2, 6]}
      - path: CQ3-02
        title: '[検査・機能評価] 定期的な（血液）検査はどのような項目を検索するか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_3．検査・機能評価.pdf, pages: [7, 9]}
      - path: CQ3-03
        title: '[検査・機能評価] 診断や経過観察にどのような画像検査を行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_3．検査・機能評価.pdf, pages: [10, 13]}
  - path: 04_リハビリテーション
    title: '4．リハビリテーション'
    body_text: |
      第4章。CQ 4-1〜4-4。適切な運動量の決め方、リハビリテーションの内容、装具・福祉用具・環境整備、QOL 改善に必要な要素・資源・アプローチを扱う。
      原本の分冊 p.1 は章扉（章名 1 行）なので収録していない。
    children:
      - path: CQ4-01
        title: '[リハビリテーション] 適切な運動量はどのようにして決めるか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_4．リハビリテーション.pdf, pages: [2, 3]}
      - path: CQ4-02
        title: '[リハビリテーション] どのようなリハビリテーションを行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_4．リハビリテーション.pdf, pages: [4, 5]}
      - path: CQ4-03
        title: '[リハビリテーション] どのような装具・福祉用具・環境整備が有効か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_4．リハビリテーション.pdf, pages: [6, 8]}
      - path: CQ4-04
        title: '[リハビリテーション] QOL 改善に必要な要素・資源・アプローチは何か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_4．リハビリテーション.pdf, pages: [9, 11]}
  - path: 05_ステロイド治療
    title: '5．ステロイド治療'
    body_text: |
      第5章。CQ 5-1〜5-5。ステロイド治療の短期効果（筋力・歩行機能）と長期効果（歩行不能後の継続）、副作用と対策、開始時期と投与方法、服薬中のワクチン接種を扱う。
      原本の分冊 p.1 は章扉（章名 1 行）なので収録していない。
    children:
      - path: CQ5-01
        title: '[ステロイド治療] ステロイド治療で，筋力，歩行機能が改善するか（短期効果）'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_5．ステロイド治療.pdf, pages: [2, 3]}
      - path: CQ5-02
        title: '[ステロイド治療] 歩行不能後もステロイドを継続使用すべきか（長期効果）'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_5．ステロイド治療.pdf, pages: [4, 6]}
      - path: CQ5-03
        title: '[ステロイド治療] どのような副作用と対策があるか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_5．ステロイド治療.pdf, pages: [7, 8]}
      - path: CQ5-04
        title: '[ステロイド治療] いつからどのように投与すべきか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_5．ステロイド治療.pdf, pages: [9, 11]}
      - path: CQ5-05
        title: '[ステロイド治療] ステロイド服薬中にワクチン接種してもよいか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_5．ステロイド治療.pdf, pages: [12, 14]}
  - path: 06_呼吸ケア
    title: '6．呼吸ケア'
    body_text: |
      第6章。CQ 6-1〜6-13。呼吸不全の発生機序、呼吸機能評価、呼吸理学療法、呼吸筋トレーニング、呼吸器感染治療、人工呼吸管理の適応、酸素投与の注意、NPPV の工夫、気管切開下人工呼吸、生活範囲と外出・旅行、在宅人工呼吸療法（HMV）の導入と環境整備、災害への備えを扱う。
      原本の分冊 p.1 は章扉（章名 1 行）なので収録していない。
    children:
      - path: CQ6-01
        title: '[呼吸ケア] 呼吸不全はどのように生じるのか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [2, 3]}
      - path: CQ6-02
        title: '[呼吸ケア] 呼吸機能評価はいつからどのように行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [4, 5]}
      - path: CQ6-03
        title: '[呼吸ケア] 呼吸理学療法はいつからどのように行うか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [6, 8]}
      - path: CQ6-04
        title: '[呼吸ケア] DMD では呼吸筋トレーニングは有効か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [9, 10]}
      - path: CQ6-05
        title: '[呼吸ケア] 呼吸器感染治療などで注意すべき点はあるか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [11, 12]}
      - path: CQ6-06
        title: '[呼吸ケア] 人工呼吸管理の適応はどのように判断するか'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [13, 15]}
      - path: CQ6-07
        title: '[呼吸ケア] 酸素投与における注意点は何か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [16, 16]}
      - path: CQ6-08
        title: '[呼吸ケア] NPPV を成功させるにはどのような工夫が必要か'
        body:
          - {pdf: デュシェンヌ型筋ジストロフィー診療ガイドライン2014_6．呼吸ケア.pdf, pages: [17, 19]}
      - path: CQ6-09
