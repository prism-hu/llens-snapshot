publisher: 日本神経学会・日本小児神経学会・国立精神・神経医療研究センター
source: https://www.neurology-jp.org/guidelinem/pdf/dmd_00.pdf
retrieved_at: '2026-09-05'
description: |
  原典正式名: 「デュシェンヌ型筋ジストロフィー診療ガイドライン 2014」（Practical Guideline for Duchenne Muscular Dystrophy (DMD) 2014）。
  監修 日本神経学会・日本小児神経学会・国立精神・神経医療研究センター、
  編集「デュシェンヌ型筋ジストロフィー診療ガイドライン」作成委員会（委員長 川井充、国立病院機構東埼玉病院院長）。発行 南江堂、2014年。
  作成は Minds 診療ガイドライン作成の手引き 2007 をもとに GRADE システムも参考にし、エビデンスレベルは
  Oxford Centre for Evidence-Based Medicine 2011、推奨はグレード A（行うように強く推奨する）〜 の分類を用いる。
  公募された約 1,000 の臨床疑問から 56 の CQ を選定した。

  章構成（学会サイトでは章ごとに別 PDF として配布されている。全 13 ファイル）:
  序文・目次等／1．総論／2．診断・告知・遺伝／3．検査・機能評価／4．リハビリテーション／5．ステロイド治療／
  6．呼吸ケア／7．心筋障害治療／8．整形外科的治療／9．麻酔・鎮静／10．食にかかわるケア／11．心理社会的ケア／検索式。

  収録範囲: 序論（神経疾患診療ガイドラインの発行について・まえがき・ガイダンス）、全 11 章の CQ 56 件、
  1．総論の冒頭に置かれた解説「デュシェンヌ型筋ジストロフィーとは」、および別冊の文献検索式を収録した。
  中扉・奥付・著作権表示・作成委員会名簿・目次は収録しない。
  7．心筋障害治療の CQ は 2 段の枝番（CQ 7-1-1 〜 7-1-6 心機能評価、CQ 7-2-1 〜 7-2-4 心筋障害治療）を持つため、
  path は文字列ソートが原本順になるよう `CQ7-01-1` のようにゼロ埋めした（title には原本どおり「CQ 7-1-1」相当の文脈を書いている）。
strip:
  - '\x06'
  # 縦組みの柱に出る全角数字 1 文字 (章番号)。本文の途中に現れるので strip 側。
  # 全角数字だけの行はこの柱以外に無いことを 13 分冊すべてで確認した
  - '[０-９]'
  - '推'
  - '奨'
  - '1．総 論'
  - '1．総論'
  - '２．診断・告知・遺伝'
  - '2．診断・告知・遺伝'
  - '3．検査・機能評価'
  - '4．リハビリテーション'
  - '5．ステロイド治療'
  - '6．呼吸ケア'
  - '7．心筋障害治療'
  - '8．整形外科的治療'
  - '9．麻酔・鎮静'
