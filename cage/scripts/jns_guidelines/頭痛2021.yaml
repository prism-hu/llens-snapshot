# 日本神経学会・日本頭痛学会・日本神経治療学会「頭痛の診療ガイドライン2021」取り込み manifest
# pages は各 PDF の物理ページ (1 始まり, 両端含む)。印字ページ (ローマ数字/アラビア数字) とはずれる。
id: 頭痛2021
title: 頭痛の診療ガイドライン2021
guideline: 頭痛の診療ガイドライン2021
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/headache.html
retrieved_at: '2026-09-05'
description: |
  日本神経学会・日本頭痛学会・日本神経治療学会監修『頭痛の診療ガイドライン 2021』(編集: 「頭痛の診療ガイドライン」作成委員会 / 委員長 荒木信夫, 副委員長 竹島多賀夫, 発行: 医学書院, 2021年10月15日 2021年版第1刷, ISBN978-4-260-04698-5)。協力学会は日本脳神経外科学会。

  『慢性頭痛の診療ガイドライン 2013』の改訂版。今版から名称から「慢性」が外れ, 二次性頭痛を含む全面改訂となった。本体は 489 ページの PDF 1 本で, 以下の 8 章 計 132 CQ からなる (序の記述と一致)。

  - 第Ⅰ章 頭痛一般 27 CQ
  - 第Ⅱ章 片頭痛 (1. 診断・疫学・病態・誘発因子・疾患予後 15 CQ / 2. 急性期治療 14 CQ / 3. 予防療法 18 CQ)
  - 第Ⅲ章 緊張型頭痛 8 CQ
  - 第Ⅳ章 三叉神経・自律神経性頭痛 (TACs) 11 CQ
  - 第Ⅴ章 その他の一次性頭痛 7 CQ
  - 第Ⅵ章 薬剤の使用過多による頭痛 (薬物乱用頭痛, MOH) 3 CQ
  - 第Ⅶ章 小児・思春期の頭痛 8 CQ
  - 第Ⅷ章 二次性頭痛 21 CQ

  1 ノード = 1 CQ (推奨 / 背景・目的 / 解説・エビデンス / 文献 / 検索式まで自己完結) で切ってある。CQ の番号は原本の表記 (I-1, II-3-14, VIII-21 など) をそのまま path segment に使い, 子の並びが原本順になるよう末尾を 2 桁ゼロ埋めしている (`CQ_I-01`, `CQ_II-3-14`)。唯一の例外が CQ II-3-14 (CGRP 関連薬剤) で, 1 CQ で 2.6 万字あるため引用文献と検索式だけを `CQ_II-3-14_文献` に分けてある。

  `99_English_digest` は英語版ダイジェスト "Clinical Practice Guideline for Headache Disorders 2021" (Araki N, et al. Neurology and Clinical Neuroscience. 2025. Open Access, 19p)。日本頭痛学会サイトから配信されているもので, 一次性頭痛と MOH の主要な推奨だけを英語でまとめたもの。本体 (日本語 489p) の代替ではなく要約なので, 引くときは日本語本体の CQ を優先すること。
strip:
- '[IVX]{1,4}'
- '第[ⅠⅡⅢⅣⅤⅥⅦⅧ]章'
