- '‑'
- '│'
- '︱ ?(診断・疫学・病態・誘発因子・疾患予後|急性期治療|予防療法)'
- '頭痛一般'
- '片頭痛'
- '緊張型頭痛'
- '三叉神経・自律神経性頭痛（TACs）'
- '三叉神経・自律神経性頭痛︵TACs ︶'
- 'その他の一次性頭痛'
- '薬剤の使用過多による頭痛（薬物乱用頭痛，MOH）'
- '薬剤の使用過多による頭痛︵薬物乱用頭痛︐MOH ︶'
- '小児・思春期の頭痛'
- '二次性頭痛'
- 'Neurology and Clinical Neuroscience, 2025'
strip_edge:
  # ノンブル。**strip 後のページの先頭/末尾 3 非空行だけ**に fullmatch させる
  # (全行に掛けると表の数値セルと上付き文献番号まで消える)
  lines: 3
  patterns:
  - '\d{1,3}'
# 原本のテキスト層で、ローマ数字 XIII の 1 グリフが ToUnicode を持たず U+FFFD
# (置換文字) に落ちている。全 489 ページでこの 2 箇所だけ (p.452、印字 p.436)。
# 原本ページ画像で「経静脈的な第XIII因子」「intravenous factor XIII」を確認した (2026-09-12)。
# U+FFFD は「読めなかった何か」の総称なので substitutions で全ページ一括置換はせず、
# ちょうど 1 回一致を要求する patches で 1 箇所ずつ直す
patches:
  - {pdf: 頭痛診療ガイドライン2021_PDF.pdf, page: 452, find: "経静脈的な第\uFFFD因子", replace: '経静脈的な第ⅩⅢ因子'}
  - {pdf: 頭痛診療ガイドライン2021_PDF.pdf, page: 452, find: "intravenous factor \uFFFD administration", replace: 'intravenous factor ⅩⅢ administration'}
