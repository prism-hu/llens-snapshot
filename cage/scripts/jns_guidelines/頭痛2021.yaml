  - 章扉ページ (p17 / p103 / p281 / p303 / p341 / p363 / p373 / p407) は各章ディレクトリの `_index.md` 本文に入れた。章名だけのページなので strip 後はほぼ空になるが, 子の一覧が付くのでナビとしては成立する。
  - 第Ⅱ章のサブセクション (1. 診断・疫学・病態・誘発因子・疾患予後 / 2. 急性期治療 / 3. 予防療法) には専用の扉ページが無く, 見出しは各サブセクション先頭の CQ ページに印字されている。よってサブセクションノードは `body` を持たず `children` のみ。

  CQ 境界の確かめ方
  - 全 489 ページを 1 ページずつ pdftotext し, 先頭に `CQ` + CQ 番号が立つページを CQ の開始ページとした (5 件は見出しの組方が逆 = 番号が先なので目視で補った: I-13 / II-1-10 / II-2-3 / II-3-7 / II-3-14)。検出された 132 件は序 (p8) の章別 CQ 数と完全に一致する。
  - 目次の印字ページは使っていない (前付けがローマ数字なので 物理ページ = 印字ページ + 16)。
  - CQ の title は本文見出しから拾った (目次はリーダー絚で途切れるものがある)。II-1-1 / II-2-1 / II-3-1 はサブセクション見出しの混入, II-1-15 は推奨文の食い込み, II-3-8 は 2 段組みの語順入れ替わりを手で直した。

  ヘッダ・フッタ (strip / strip_edge)
  - 柱は 4 種: ノンブル / 章番号 (片面は ASCII の `I` `II` …, もう片面は `第Ⅰ章`) / 章名 (縦組みは `︵` `︶` `︐` の異体字を使う) / `CQ I-6` 形式のフッタ。ノンブルだけ `strip_edge` (lines: 3), 残りは `strip`。
  - `[IVX]{1,4}` の fullmatch は全 244 件すべてが章の柱で, 各章のページ数と `第Ⅰ章` 形式の件数の合計が一致することを確かめた (本文行を巻き込まない)。目次ページ p12-15 にだけ例外があるが, 目次は収録しない。
  - 章名の strip (`片頭痛` `緊張型頭痛` など) は表のセルが単独行になるページ (p39 / p105 / p375-377) では表の値も落とす。これらはすべて vlm_candidates に入れてあり, overlay で置き換える前提。
  - ノンブルを `strip_edge` (先頭/末尾 3 非空行) に置いたことで, 本文中の上付き文献番号 (「…から構成されている 1）」の `1` が独立行に出るもの) と 表の数値セルは残るようになった。

  残っている柱の取りこぼし (VLM 待ち)
  - **第Ⅱ章だけ, 節番号のタブ (`1` / `2` / `3` の 1 桁) が本文の途中に残る。** 縦組みの `‑` / `II` / `<節番号>` という 3 行のタブのうち前 2 行は `strip` で落ちるが, 数字はページ端から遠いので `strip_edge` の窓に入らない。第Ⅱ章 177 ページのほぼ全ページに 1 個ずつ (実測 91 個)。
    `strip` に `[123]` を足せば消えるが, そうすると 本文の上付き文献番号 (第Ⅰ章 p18-19 など) と 表の「薬効の group」列 (1〜5) まで消える。段落の途中に数字が 1 行あるだけの実害と引き換えに文献番号を失うのは割に合わないので, 残す判断をした。該当ページの overlay を作るときにここも直る。

  粒度の例外
  - CQ II-3-14 (CGRP 関連薬剤, p255-263) だけが 1 CQ で約 2.6 万字あり目安の 2 万字を超えた。推奨・背景・解説は 1 ノードに残したまま, p261 の「文献」行以降 (引用文献 1〜76 と検索式, 約 1.5 万字) を `until:` / `from:` で `CQ_II-3-14_文献` に切り出した。結果 本体 1.1 万字 / 文献 1.5 万字。p261 は両ノードに載るので文献側に `allow_overlap: true` を付けてある。他の 131 CQ は文献・検索式まで 1 ノードで自己完結する。
  - 英語版ダイジェスト (19p) は全文 7.1 万字あり 1 リーフには大きすぎるので, 論文の大見出しで 3 ノードに分けた (Abstract・Introduction / Migraine / TTH・Cluster・MOH・References)。


  ファイル名と実体
  - `Clinical Practice Guideline for Headache Disorders 2021_PDF.pdf` の配信元は学会サイトではなく日本頭痛学会 (`https://www.jhsnet.net/pdf/20250905.pdf`)。URL basename が日付なので slug は `20250905` になる。内容は 2025 年に Neurology and Clinical Neuroscience に掲載された英語版ダイジェストで, 2021 年版ガイドラインの英語要約。ファイル名の「2021」はガイドラインの版を指し, 論文の発行年ではない。
  - 英語版は 2 段組みの学術誌レイアウト。抽出モードは**ページごとに使い分けた**:
    - 表が主体のページ (p4-8 = TABLE 1/2, p10-12 = TABLE 3/4, p16-17 = TABLE 5/6) は `mode: layout`。既定モードだと薬剤名・推奨の強さ・エビデンスレベル・用量がバラバラの行になって対応が読めなくなるが, layout なら桁が揃って表として読める。
    - 地の文のページ (p1-3, p9, p13-15, p18-19) は既定モードのまま。layout にすると左右の段が 1 行の中で混ざり, 無関係な 2 つの文が 1 行になってしまうため。
    - 既定モードの副作用として, ページ内の節の順序が前後することがある (例: p9 で 4.15 が 4.13 より先に出る, p19 の文献 4 が末尾に回る)。推奨文自体は欠けないが, 連続した文章として読むときは原本 PDF を見ること。
  - Wiley のダウンロードバナー (`20494173, 0, Downloaded from https://onlinelibrary.wiley.com/…`) が全 18 ページに入るので, この PDF だけの `strip` で落としている。

  収録しなかった関連ファイル
  - 旧版 (慢性頭痛の診療ガイドライン 2013 / 2006) は `,/JNS_Guidelines_ALL` に存在しない。
  - 追補版は発行されていない。
