notes: |
  ## ページ対応

  印刷ページ番号と物理ページ番号が一致する（目次の番号どおり）。ページ番号は各ページの
  **上端と下端の両方**に裸の数字として入るため strip で `\d{1,3}` を落としている。
  その副作用として、mRS・CADASIL Scale-J・重症度スケールのスコア列（独立行の数字）も落ちる。
  該当ページは vlm_candidates に入れてある。

  ## ノード分割

  この文書は節がページ先頭で切り替わるので、ページ範囲だけで章立てを再現できている
  （`from` / `until` によるページ内分割が要ったのは p5 の目次残りの 1 箇所のみ）。
  参考文献は 35 ページ・約 3.7 万字あるので 2 ノードに割った（p110 と p111 の境界は文献 115 の途中）。

  ## 落としたページ

  - p4（目次の前半）… 計画書の方針どおり目次は収録しない。
  - p5 の上部にも目次の後半（各論の項目）が載っているが、同じページの下部から
    「遺伝子配列の違いに関する用語について」が始まるので、p5-6 のノードには
    `from: '^遺伝子配列の違いに関する用語について$'` を付けて見出しから下だけを採っている
    （p5 上部の目次はノード本文に出ない）。
  - 上記以外の全 126 ページはいずれかのノードに載っている。

  ## 版・年

  表紙・奥付に版年の記載が無い。本文が「本邦の診断基準は、2024年4月より、CARASIL のみのものから
  症候性保因者を含むものに改訂された」と述べており、PDF 自体の作成日は 2025-03-05。
  計画書の割り当てどおり id には年を付けていない。日本神経学会・日本神経治療学会は「協力」であって
  監修学会ではないため、publisher は研究班名にした。
