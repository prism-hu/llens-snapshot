id: 遺伝性脳小血管病
title: 遺伝性脳小血管病の診療の手引き
guideline: 遺伝性脳小血管病の診療の手引き
publisher: 厚生労働科学研究費補助金 難治性疾患等政策研究事業「治験を目的とした、成人発症白質脳症のレジストリーと評価方法に関する研究」班（協力 一般社団法人 日本神経学会、日本神経治療学会）
source: https://www.neurology-jp.org/guidelinem/pdf/syounin_21.pdf
retrieved_at: '2026-09-05'
description: |
  『遺伝性脳小血管病の診療の手引き』全 127 ページ。
  編集は厚生労働科学研究費補助金 難治性疾患等政策研究事業「治験を目的とした、成人発症白質脳症のレジストリーと
  評価方法に関する研究」班（研究代表者 小野寺理・新潟大学脳研究所脳神経内科）、
  協力 一般社団法人 日本神経学会・日本神経治療学会。作成委員会 委員長 小野寺理、委員 水野敏樹（京都府立医科大学）、
  冨本秀和（三重大学）。表紙に版年の記載はないが、本文が 2024年4月の診断基準改訂に言及しており、
  PDF の作成日は 2025年3月。

  対象は CADASIL（NOTCH3）、HTRA1 関連脳小血管病（CARASIL および症候性保因者）を中心に、
  PADMAL（COL4A1 3'UTR）、RVCL-S（TREX1）、PXE／ヘテロ接合性 ABCC6 変異、CARASAL（CTSA）、
  ファブリー病、MELAS、COL4A1/2 関連疾患などの遺伝性脳小血管病。

  構成:
  - 総論 — 1. 主な遺伝性脳小血管病の概略（脳小血管病とは／疫学／家族歴聴取の注意点／臨床的特徴／鑑別診断／臨床上の注意点）、
    2. 重症度（mRS、食事・栄養・呼吸の評価スケール）、3. 患者・家族への説明をどのように行うか
  - 各論 — 1. CADASIL（症候／画像所見／病理所見／各種評価・検査／どのように診断するのか／治療はどのように行うか）、
    2. HTRA1 関連脳小血管病（概要／症候、臨床経過／画像、病理、及び血液所見／診断／治療）、
    3. その他の遺伝性脳小血管病（PADMAL／RVCL-S／PXE 及びヘテロ接合性 ABCC6 変異）
  - 参考文献（215 件）

  用語について: 本手引きは稀な遺伝子の変化を「変異」と表記している（HGVS が推奨する「バリアント」ではなく、
  臨床現場での理解のしやすさを優先したことを冒頭で明記している）。疾患との関連が確認されたものは「病的変異」、
  機能解析で機能低下が示されたものは「機能喪失型変異」と書き分けられている。
