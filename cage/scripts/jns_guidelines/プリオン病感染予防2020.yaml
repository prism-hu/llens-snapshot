id: プリオン病感染予防2020
title: プリオン病感染予防ガイドライン2020
guideline: プリオン病感染予防ガイドライン2020
publisher: 厚生労働省 プリオン病のサーベイランスと感染予防に関する調査研究班・日本神経学会
source: https://www.neurology-jp.org/guidelinem/prion/prion_2020.pdf
retrieved_at: '2026-09-05'
description: |
  『プリオン病感染予防ガイドライン2020』(プリオン病のサーベイランスと感染予防に関する
  調査研究班 (班長: 水澤英洋) と日本神経学会の合同作成委員会 / 2020 年 3 月発行)。
  「プリオン病感染予防ガイドライン 2008」の改訂版で、目次構成は踏襲しつつ、看護・ケア、
  剖検・病理標本作製、他の神経変性疾患の章を新設し、解説方式から CQ 方式 (MINDS 2014 の
  様式、推奨の強さ 1/2・エビデンスの強さ A〜D) に改めた。日本歯科医師会・日本手術医学会・
  日本眼科学会・日本整形外科学会・日本消化器内視鏡学会の推薦委員が参加している。
  対象読者は一般医家、脳神経内科医、看護・介護従事者。**診療そのものではなく感染予防に
  特化**したガイドラインで、プリオン病の診療は別冊の診療ガイドラインが扱う。

  全 14 章・CQ 30 件。第 1〜2 章がプリオンと不活性化の総論、第 3 章が手術器械の再生処理、
  第 4〜8 章が診療領域別 (脳神経外科・眼科・歯科・整形外科・消化管内視鏡)、第 9〜10 章が
  非侵襲的医療行為/看護ケアと剖検・病理標本作成、第 11 章が神経変性疾患の伝達性、
  第 12〜14 章が倫理・心理支援、社会的問題、インシデント事例への対応。
  巻末に付録 (WHO の臓器感染性カテゴリー別分類)、問合せ先一覧、および
  『プリオン病の剖検マニュアル 第2版』(2017) が綴じ込まれており、いずれも収録した。
