notes: |
  - 版: 2020 年版が現行 (2008 年版の改訂)。2008 年版は素材に無く、収録しない。
  - ファイル名と実体のずれは無い (`プリオン病感染予防ガイドライン2020_PDF.pdf` =
    prion_2020.pdf、172 ページ、1 冊まるごと 1 ファイル)。
  - ページの取り方: 本文の印字ページと物理ページは **物理 = 印字 + 24** でずれる
    (目次の「第10章 … 83」は物理 107)。巻末の『プリオン病の剖検マニュアル 第2版』は
    独立したノンブルを持ち **物理 = 印字 + 150**。いずれも各ページの冒頭を見て確かめた。
  - ノードに載せなかったページ:
    p.1-2 (表紙・白紙)、p.20 (白紙)、p.21-22 (目次)、p.24 (白紙)、
    p.143-146 (索引)、p.148 (白紙)、p.171-172 (奥付・白紙)。
    目次と索引は doc ツリーそのものが役目を果たすので落とした。奥付の情報は description に
    転記した。
  - 章の構成: どの章にも章頭の総論ページが無く、章の 1 ページ目がそのまま最初の CQ なので、
    章ノードは `_index` に本文を持たず子 (CQ) だけを持つ。
  - CQ9-1 (非侵襲的診療・看護でのプリオン感染) だけが 14 ページ (p.89-102) と長いが、
    組織別の感染性・場面別の対応・注一覧・文献まで 1 CQ で自己完結しているので分割しない。
  - **文字化けページがある**: p.42 / p.51 / p.60 / p.169 の 4 つの表は埋め込みフォントの
    ToUnicode が無く、pdftotext が読めない文字列を返す (p.42/51/60 は
    「⾲ᡭ⾡๓࡟ࣉࣜ࢜ࣥ⑓…」、p.169 は「ቢోߣߐࠇࠆṌ⩶ᴺ…」と化け方が違うが原因は同じ)。
    この 4 ページは VLM 起こしが**必須** (他の vlm_candidates は
    「あった方がよい」レベル)。overlay が入るまでは読み手が誤読しないよう、該当ノード
    (CQ3-1 / CQ3-2 / CQ3-3 と `19_剖検マニュアル/05_参考情報`) の `body_text` に
    「この表は本文からは読めない。原本 PDF を見ること」と明記してある
    (文書全体は健全なので `text_caveat` は使わない)。
  - strip はノンブル (`\d{1,3}`) のみ。柱 (running head) は無い。
    各 CQ ページ冒頭の「第N章」「CQn-m：…」は本文の見出しなので残している。
