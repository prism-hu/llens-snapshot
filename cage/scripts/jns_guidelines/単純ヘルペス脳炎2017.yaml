          転帰に影響する要因 (解説「3．転帰影響要因」以降) は CQ2-2 にある。
        body:
          - pdf: 単純ヘルペス脳炎診療ガイドライン2017_単純ヘルペスウィルス脳炎診療ガイドライン2017.pdf
            pages: [19, 20]
