id: 単純ヘルペス脳炎2017
title: 単純ヘルペス脳炎診療ガイドライン2017
guideline: 単純ヘルペス脳炎診療ガイドライン2017
publisher: 日本神経感染症学会・日本神経学会・日本神経治療学会
source: https://www.neurology-jp.org/guidelinem/hse/herpes_simplex_2017.pdf
retrieved_at: '2026-09-05'
description: |
  『単純ヘルペス脳炎診療ガイドライン 2017』(英題 Practical Guideline for Herpes Simplex
  Encephalitis / 日本神経感染症学会・日本神経学会・日本神経治療学会 監修、
  「単純ヘルペス脳炎診療ガイドライン」作成委員会 (委員長 亀井聡、副委員長 細矢光亮) 編集 /
  南江堂 2017 年 8 月 30 日発行)。日本神経学会が 2013 年の理事会で作成を承認した
  新規ガイドラインで、成人・小児の両方を扱う。エビデンスレベルと推奨度 (A〜E の 5 段階) は
  『細菌性髄膜炎診療ガイドライン 2014』と同じ枠組みを採り、**推奨度は引用論文ではなく
  当該の記載文に対する評価**である点に注意。

  全 8 章・CQ 25 件 (補追 1 件を含む)。
  1. 疫学 / 2. 転帰・後遺症 / 3. 症状・症候 / 4. 検査 / 5. 単純ヘルペスウイルスの遺伝子診断 /
  6. 感受性遺伝子の検索 / 7. 鑑別診断 (+ 補追 HIV 検査) / 8. 治療 (8-1 成人、8-2 小児)。
  巻頭に「臨床症状より脳炎が疑われた場合の検査・治療フローチャート」があり、
  アシクロビル投与の判断はここから入るのが早い。
strip:
  # 柱 (各章の章題)。章題を固定文字列で並べる — `N．単純ヘルペス脳炎…` の緩い形だと
  # 本文見出し「1．単純ヘルペス脳炎に特異的な疾患感受性を示す遺伝子異常」まで消える
  - '[0-9０-９]．単純ヘルペス脳炎の疫学'
  - '[0-9０-９]．単純ヘルペス脳炎の転帰・後遺症'
  - '[0-9０-９]．単純ヘルペス脳炎の症状・症候'
  - '[0-9０-９]．単純ヘルペス脳炎の検査'
  - '[0-9０-９]．単純ヘルペス脳炎における単純ヘルペスウイルスの遺伝子診断'
  - '[0-9０-９]．単純ヘルペス脳炎における感受性遺伝子の検索'
  - '[0-9０-９]．単純ヘルペス脳炎における'
  - '[0-9０-９]．単純ヘルペス脳炎の鑑別診断'
  - '[0-9０-９]．単純ヘルペス脳炎の治療'
  # 縦組みの柱の章番号 (全角 1 桁)。端 10 行の窓から外れることがあるので全行に効かせる
  - '[０-９]'
strip_edge:
  # ノンブルと、**ページ末尾にまとまって出る縦組みの柱・side tab (1 文字ずつの行)**。
  # 全行 fullmatch にすると表の 1 文字セル・数値セルを巻き込むので端 10 行に限る
  lines: 10
  patterns:
  - '\d{1,3}'
  - '[ivx]{2,5}'
  - '[一-龥ぁ-んァ-ヶー]'
  - '[．・]'
