notes: |
  - ファイル名と実体: `単純ヘルペス脳炎診療ガイドライン2017_単純ヘルペスウィルス脳炎診療
    ガイドライン2017.pdf` (URL は herpes_simplex_2017.pdf)。ファイル名の「ウィルス」は
    学会サイト側の表記ゆれで、書名は『単純ヘルペス脳炎診療ガイドライン 2017』。1 冊 = 1 ファイル
    (110 ページ)。旧版は無い (2017 年が初版)。
  - ページの取り方: **物理ページと印字ページのオフセットが一定でない**。書籍の白紙 (章扉の裏)
    が PDF に含まれていない箇所があり、印字 2 → 物理 15 (差 13) で始まったオフセットが
    第 5 章以降 12、第 6 章以降 11、第 7 章以降 10、第 8 章以降 9 と縮む。そのため目次の
    印字ページは使わず、本文中の "Clinical Question N-M" 見出しを 1 ページずつ拾って
    CQ 境界を確定した。
  - **CQ 2-1 と CQ 2-2 は同一ページ (物理 p.19 / 印字 6) から始まる**。原本では 2 問の
    「回答」「背景・目的」が 1 つの枠にまとめて書かれており、分かれるのは解説の中
    (「1．成人例の予後」「2．後遺症の頻度」= CQ2-1 / 「3．転帰影響要因」= CQ2-2) だけ。
    そこで p.20 の `3．転帰影響要因` を境に `until` / `from` で 2 ノードに割り、
    共通の回答・背景が CQ2-1 側にしか無いことを両ノードの `body_text` に明記した
    (p.20 を共有するので CQ2-2 側に `allow_overlap: true`)。
  - ノードに載せなかったページ:
    p.1-4 (表紙・英題・中扉・監修/編集者一覧)、p.12-13 (目次)、
    p.14 / 18 / 28 / 42 / 49 / 58 / 63 / 76 (各章の章扉。章名 1 行だけのページ。章名は
    ノードの title が持つ)、p.108-109 (索引)、p.110 (奥付。情報は description に転記)。
  - strip の切り分け:
    - `strip` (全行) … 柱は**各章の章題を固定文字列で**並べた。`[0-9]．単純ヘルペス脳炎.*`
      のような緩い形だと本文見出し「1．単純ヘルペス脳炎に特異的な疾患感受性を示す
      遺伝子異常」まで消える (実測)。
    - `strip_edge` (ページの端 10 行) … ノンブル・前付のローマ数字と、**縦組みの柱と
      「回答」side tab が 1 文字ずつの行に分解される**分。縦組みの柱はほぼページ末尾に
      まとまって出る (実測で本文ページは最長 8 行、索引ページのみ 16 行だが索引は不収録)。
      全行 fullmatch にすると表の 1 文字セル・数値セル (`0` `30` `−` など) まで消えるので、
      端 10 行に限っている。ただし柱の章番号 (全角 1 桁) だけは窓から外れることがあるので
      `strip` 側に置いた。
    - **残る既知の汚れ**: 本文が長いページでは縦組みの柱・side tab (`治` `療` `推` `奨`
      `回` `答` など) が抽出順で中ほどに来て端 10 行の窓から外れ、1 文字の行として
      30 行ほど残る。これを全行 strip で消すと、折り返しで 1 文字になった本文
      (「疑われる場 / 合」「… 8 / 件」など実在する) まで消えるので、**残す方を選んだ**。
  - 本文の節見出し `■ 背景・目的` `■ 解説・エビデンス` `■ 文献` `■ 検索式・参考にした二次資料`
    は 1 行 2 文字以上なので strip されない (残す)。
