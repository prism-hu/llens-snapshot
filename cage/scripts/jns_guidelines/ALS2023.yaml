id: ALS2023
title: 筋萎縮性側索硬化症（ALS）診療ガイドライン2023
guideline: 筋萎縮性側索硬化症（ALS）診療ガイドライン2023
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/pdf/als_2023.pdf
retrieved_at: '2026-09-05'
description: |
  原典正式名: 「筋萎縮性側索硬化症（ALS）診療ガイドライン 2023」（Practical Guideline for Amyotrophic Lateral Sclerosis 2023）。
  監修 日本神経学会（協力機関: 日本神経治療学会、厚生労働省「神経変性疾患領域の基盤的調査研究」班〈研究代表者 中島健二〉）、
  編集 筋萎縮性側索硬化症診療ガイドライン作成委員会（委員長 青木正志、副委員長 漆谷真）。発行 南江堂、2023年5月30日。
  2013年版（筋萎縮性側索硬化症診療ガイドライン2013）の改訂版で、Minds 診療ガイドライン作成マニュアル 2017 / 2020 ver.3.0 に準拠。

  構成は 2 部立て。RCT のエビデンスが蓄積しシステマティックレビュー後に GRADE で推奨を作成できたものを
  **Clinical Questions（CQ）**（CQ1 リルゾール、CQ2 エダラボンの 2 件）、エビデンスは不十分だが臨床上重要な課題を
  **Questions and Answers（Q&A）**（全 10 章 106 件）とする。Q&A の章立ては
  1．疫学，亜型，経過・予後，病因・病態／2．診断，鑑別診断，検査／3．患者・介護者対応／4．薬物治療／5．対症療法／
  6．嚥下・栄養／7．呼吸管理／8．リハビリテーション医療，QOL／9．コミュニケーション／10．療養生活支援。
  巻末資料に ALSFRS-R、Modified Norris scale、TIV 後の意思伝達能力障害 stage 分類、厚生労働省研究班による ALS 重症度分類、
  在宅用人工呼吸器一覧、CQ1/CQ2 の SR 関連資料（評価シート・GRADE エビデンスプロファイル・EtD テーブル）を収める。

  収録範囲: 本体 311 ページのうち、序論（発行にあたって・序・作成手順・COI・略語一覧）、CQ 2 件、Q&A 106 件、巻末資料を収録。
  目次・索引・委員名簿・中扉・白ページは収録しない。
  さらに「ALS 診療ガイドライン2023 追補版2025」（21 ページ、2025年）を子セクション `90_追補版2025` として収録する。
  追補版は CQ2（エダラボン）、Q&A 3-5（遺伝の説明）、Q&A 4-1（薬物治療の概観）、Q&A 4-3（エダラボン投与上の注意点）、
  Q&A 4-7（疾患修飾療法）を **改訂**し、Q&A 4-9（高用量メコバラミン）、Q&A 4-10（トフェルセン）を **新設**する。
  改訂された 5 件については本体の該当ノードより追補版のノードが新しい。
strip:
  - 'Questions and Answers（Q&A）'
  - 'Clinical Questions（CQ）'
  - '巻末資料'
  - '索'
  - '引'
  - '[ＱＡ＆]'
  - '[︵︶︐]'
  # 縦組みの柱に出る全角数字 1 文字 (章番号)。ページの端ではなく本文の途中に現れるので strip 側。
  # p26-300 で確認した限り、全角数字だけの行はこの柱以外に無い
  - '[０-９]'
  # 縦組みの柱の章名は 1 文字ずつの行に割れて出る (末尾が ['29','疫','学','な','ど'] の順)。
  # 放っておくと strip_edge の窓 (lines: 2) からノンブルが押し出されて本文に残るので、
  # 柱に出る文字を CIDP・MMN2024 と同じ形で文字クラスに列挙して落とす。
  # **数字は 1 つも入れない** (ALSFRS-R の素点 0〜4、SR 評価シートの数値セルを守るため)。
  # 柱の実体: 疫学など / 診断鑑別診断検査 / 患者・介護者対応 / 薬物治療 / 対症療法 /
  # 嚥下・栄養 / 呼吸管理 / リハ医療ＱＯＬ / コミュニケーション / 療養生活支援 / 巻末資料
  # (本文由来の 1 文字行 '．' は柱に無いので入れない)
  - '[疫学など診断鑑別検査患者介護対応薬物治療症法嚥下栄養呼吸管理コミュニケーションリハ医生活支援巻末資料ＯＬ・]'
  - '(?:i|ii|iii|iv|v|vi|vii|viii|ix|x|xi|xii|xiii|xiv|xv|xvi|xvii|xviii|xix|xx|xxi|xxii|xxiii|xxiv)'
  - '1．疫学，亜型，経過・予後，病因・病態'
  - '2．診断，鑑別診断，検査'
  - '3．患者・介護者対応'
  - '4．薬物治療'
  - '5．対症療法'
  - '6．嚥下・栄養'
  - '7．呼吸管理'
  - '8．リハビリテーション医療，QOL'
  - '9．コミュニケーション'
  - '10．療養生活支援'
strip_edge:
  # ノンブル。**ページの先頭/末尾 2 非空行だけ**に効かせる
  # (全行 fullmatch だと表の数値セル・文献番号を巻き添えにする)。
  # 実測 (柱の 1 文字漢字を strip で落とした後): 窓 2 行ならノンブルの巻き添えは 0 件、
  # 窓 3 行にすると ALSFRS-R の素点セル (p278 の '0'、p279 の '4') を巻き込むので 2 にした
  lines: 2
  patterns:
  - '\d{1,3}'
