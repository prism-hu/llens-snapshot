  ## strip / strip_edge について
  - ノンブル (算用数字だけの行) は `strip_edge` (lines: 2) に置いてある。`strip` に置くと
    巻末資料の評価尺度 (ALSFRS-R の素点 0〜4) や SR 評価シートの数値セルまで消える。
    窓幅は実測で決めた — 柱の 1 文字漢字を落とした後なら 2 行で巻き添え 0 件、3 行にすると
    ALSFRS-R の素点セル (p278 の「0」、p279 の「4」) を巻き込む。
  - 縦組みの柱に出る `Ｑ` `＆` `Ａ` と全角数字 1 文字 (章番号) は本文の途中に現れるので `strip` 側に置いた。
    p26-300 を全走査して、全角数字だけの行がこの柱以外に無いことを確認している。
  - 縦組み用の括弧・読点 (︵ ︶ ︐) も落としている。
  - 縦組みの柱の章名は 1 文字ずつの行に割れて出る (ページ末尾が「29 / 疫 / 学 / な / ど」の順)。
    これを残すと `strip_edge` の窓 (lines: 2) からノンブルが押し出されて本文に残るので、
    CIDP・MMN2024 と同じ形で柱に出る文字を文字クラスにして `strip` で落とした
    (疫学など / 診断鑑別診断検査 / 患者・介護者対応 / 薬物治療 / 対症療法 / 嚥下・栄養 /
    呼吸管理 / リハ医療ＱＯＬ / コミュニケーション / 療養生活支援 / 巻末資料 に出る文字の和集合)。
    **数字は 1 文字も入れていない** (ALSFRS-R の素点・SR 評価シートの数値セルを守るため)。
    本文由来で出る 1 文字行「．」は柱に無いので文字クラスに入れていない。
    実測: 本体 PDF の収録ページでノンブルが clean 後も残るページは 77 → 9 に減った。
  - Q&A の章名 (「4．薬物治療」等) は柱として全ページ上部に出るので落とした。ノード title が同じ文脈語を持つ。

  ## 章 _index の本文
  - 章の中扉 (章名 1 行) は収録していないので、各章の `_index.md` は `body_text` で書いた案内文と
    子の一覧だけになる。原本のどのページを落としたかも `body_text` に書いてある。
