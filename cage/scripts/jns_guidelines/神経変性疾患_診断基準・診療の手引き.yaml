notes: |
  ## このディレクトリのまとめ方

  日本神経学会のガイドライン掲載ページに単独で置かれている神経変性疾患の診断基準・手引き 5 文書
  （4 疾患）を 1 つの id にまとめた。1 文書 = 1 ノード、または文書が大きい場合（IBGC 手引き 59 ページ、
  EA 手引き 15 ページ）は章単位のサブセクションにしている。
  publisher は代表として「厚生労働省 難治性疾患政策研究事業 研究班（日本神経学会掲載）」を置いた。
  **各文書の実際の発行主体・承認日は description に列挙してある**（研究班名と承認日が文書ごとに違う）。

  ## ページ対応

  - 特発性基底核石灰化症の診療・療養の手引き: **物理ページ = 印刷ページ + 6**（印刷 p1 = 物理 p7）。
    フッタは `- 49 -` 形式。
  - 反復発作性運動失調症: 物理ページ = 印刷ページ（裸の数字のフッタ）。
  - 他の 3 文書はページ番号なし。

  ## strip の振り分け

  ノンブルの形が文書ごとに違う（IBGC 手引き = `- 49 -`、EA = 裸の 1〜15、他の 3 文書 = ノンブル無し）ので、
  `strip_edge` は manifest 直下に置かず **`pdfs[]` ごとに書いてある**。
  ノンブルを持たない 3 文書（IBGC 診断基準・神経核内封入体病・無セルロプラスミン血症）には
  strip_edge を一切与えていないので、ページ端の行が巻き込まれることはない。
  `strip_edge` はページの先頭/末尾 3 非空行にしか効かないため、
  mRS・重症度分類のスコア列（表の中身）は残る。

  ## 落としたページ

  - 特発性基底核石灰化症の診療・療養の手引き **p6（目次）** … 計画書の方針どおり目次は収録しない。
  - これ以外は、5 文書 89 ページ（59 + 6 + 6 + 3 + 15）のうち残り 88 ページがすべて
    いずれかのノードに載っている。

  ## 原本の表記ゆれ・誤植

  - 反復発作性運動失調症: 表紙・見出しでは「反復**発作性**運動失調症」、本文中の見出しでは
    「反復**性発作性**運動失調症」と揺れている（原文どおり）。
  - 特発性基底核石灰化症診断基準: 冒頭に「（いわ**るる**‘ファール病’）」という誤植がある（正しくは「いわゆる」）。
    また「10mmm 未満は点状」も原本の誤植（正しくは 10mm）。
  - 特発性基底核石灰化症の診療・療養の手引きは、章内で「表１」「表 1」の番号が章ごとにリセットする
    （11章にも18章にも「表 1」がある）。
