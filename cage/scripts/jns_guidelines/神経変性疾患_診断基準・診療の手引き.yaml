id: 神経変性疾患_診断基準・診療の手引き
title: 神経変性疾患の診断基準・診療の手引き（特発性基底核石灰化症・神経核内封入体病・無セルロプラスミン血症・反復発作性運動失調症）
guideline: 神経変性疾患 診断基準・診療の手引き集（日本神経学会掲載）
publisher: 厚生労働省 難治性疾患政策研究事業 研究班（日本神経学会掲載）
source: https://www.neurology-jp.org/guidelinem/pdf/syounin_18.pdf
retrieved_at: '2026-09-05'
description: |
  日本神経学会のガイドライン掲載ページから配布されている、神経変性疾患 4 疾患の診断基準・診療の手引きを
  1 つのディレクトリ (`{{DOC_BASE}}/診療ガイドライン/神経疾患/神経変性疾患_診断基準・診療の手引き/`) にまとめたもの。いずれも厚生労働省の難治性疾患政策研究事業の研究班が作成し、日本神経学会が承認・掲載している。
  発行主体・承認日は疾患ごとに異なるので、各サブセクションの説明を参照すること。

  収録した 5 文書（4 疾患）:

  1. **特発性基底核石灰化症（IBGC、いわゆるファール病 / primary familial brain calcification：PFBC）**
     - 『特発性基底核石灰化症の診療・療養の手引き 2023』59 ページ。2023年3月発行（第1版）。
       編集は難治性疾患政策研究事業「神経変性疾患領域の基盤的調査研究」班（研究代表者 中島健二）担当：特発性基底核石灰化症班、
       分担研究者 保住功（岐阜薬科大学）。前身は AMED 難治性疾患実用化研究事業の支援で作られた
       『脳内石灰化症診療の手引き 2021』（2021年2月25日刊行）。全 18 章が
       Clinical Questions ＋ Keywords ＋ Q&A の形式で書かれている。
     - 『特発性基底核石灰化症診断基準について』6 ページ。指定難病の診断基準（頭部 CT の病的石灰化、
       二次性石灰化の除外、緩徐進行性の精神・神経症状、遺伝子診断、病理学的所見／Definite・Probable・Possible）と、
       厚労省指定難病の疾患概要・重症度分類。日本神経学会承認日 2017年5月27日、改訂承認日 2021年10月22日。

  2. **神経核内封入体病（NIID）** — 『神経核内封入体病診断基準』6 ページ。
     概要（NOTCH2NLC 遺伝子 GGC リピート延長、皮膚生検、DWI での皮髄境界高信号）、要件の判定に必要な事項、
     診断基準（A 症状／B 検査所見／C 病理所見／D 遺伝学的検査／E 鑑別診断、Definite・Probable・Possible）、重症度分類。
     情報提供元は難治性疾患政策研究事業「神経核内封入体病(NIID)の臨床疫学調査および疾患概念確立」研究班（曽根淳・愛知医科大学）。

  3. **無セルロプラスミン血症** — 『無セルロプラスミン血症の診断基準』3 ページ。
     診断基準（A 症状／B 検査所見／C 遺伝学的検査／D 鑑別診断、Definite・Possible）と重症度分類（mRS）。
     作成は信州大学医学部神経難病学講座 分子遺伝学部門（責任者 特任教授 吉田邦広）。
     日本神経学会承認日 2015年1月30日、改定 2016年5月18日。

  4. **反復発作性運動失調症（episodic ataxia：EA）** — 『反復発作性運動失調症 診断の手引き（第一版）』15 ページ、2021年2月。
     作成は平成29-30年度 厚生労働科学研究費補助金 難治性疾患等政策研究事業「本邦における反復性発作性運動失調症の実態調査研究」班
     および「運動失調症の医療水準、患者 QOL の向上に資する研究」班。
     EA1（KCNA1）・EA2（CACNA1A）を中心に、頻度、症状、発作の誘引、片頭痛（脳幹性前兆を伴う片頭痛・片麻痺性片頭痛・前庭性片頭痛）との鑑別、
     診断のフローチャート、診断基準、重症度分類、参考のための診断基準を収める。

  いずれも指定難病の診断基準・重症度分類を含むため、医療費助成の申請要件を確認する用途に使える。
# ノンブルの形が PDF ごとに違うので、strip_edge は pdfs[] 側に振り分けてある
# (manifest 直下には置かない = ノンブルを持たない 3 文書の端の行を巻き込まない)
# 埋め込みの SymbolMT / Wingdings は、フォント内の文字コードに 0xF000 を足した私用領域
# (PUA U+F000-F0FF) に落ちる。pdftotext はその PUA をそのまま返すので、ギリシャ文字・
# 数字・読点が本文から**消えて見える** (例「AChR は␣␣␣の 4 つのサブユニット」)。
# **同じコードでもフォントが違えば別の字**なので (F06C は Symbol なら λ、Wingdings なら ●)、
# 一律に写像してはいけない。下の割り当ては原本ページ画像で 1 種ずつ目視確認した (2026-09-12)。
# 箇条書き記号は `- ` でなく**記号そのもの**に写す: pdftotext がこれらを
# 「記号だけの行 + 空行 + 本文行」に割ることが多く (神経疾患全体で 42 出現中 30)、
# `- ` にすると中身の無い箇条書き項目になるため。
substitutions:
  # 反復発作性運動失調症 (Wingdings)。p.11「· EA1：KCNA1 遺伝子」の行頭
  - {pdf: 反復発作性運動失調症診断の手引き.pdf, find: "\uF09E", replace: '·'}
