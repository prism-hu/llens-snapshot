id: ギラン・バレー症候群2024
title: ギラン・バレー症候群，フィッシャー症候群診療ガイドライン2024
guideline: ギラン・バレー症候群，フィッシャー症候群診療ガイドライン2024
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/gbs_2024.html
retrieved_at: '2026-09-05'
description: |
  『ギラン・バレー症候群，フィッシャー症候群診療ガイドライン 2024』(日本神経学会 監修 /
  「ギラン・バレー症候群，フィッシャー症候群診療ガイドライン」作成委員会 編集 / 南江堂
  2024 年 6 月 15 日 発行、ISBN978-4-524-21865-3)。協力機関は日本神経治療学会・
  日本神経免疫学会。2013 年版の改訂版で、2013 年版 (分冊 PDF) は収録していない。

  推奨は Minds 2020 (ver.3.0) 準拠。エビデンスが十分で推奨を提示できる重要臨床課題を
  **CQ** (GBS 5 件・FS 3 件、推奨の強さ 1/2 × エビデンスの強さ A〜D)、推奨を作れない
  重要臨床課題を **Q&A** (GBS 56 件・FS 12 件) として扱う。全 69 項目 + 診療アルゴリズム。

  構成 (全 9 章):
  - 第 1 章 GBS 総論 (疾患概念・疫学・病態・臨床経過・診療アルゴリズム)
  - 第 2 章 GBS 臨床的事項 (先行感染・イベント、臨床症状)
  - 第 3 章 GBS 診断 (診断総論、電気生理学的検査、脳脊髄液検査、血液学的検査、画像検査、病理)
  - 第 4 章 GBS 治療 (治療総論、血漿浄化療法、経静脈的免疫グロブリン療法、その他の免疫療法、支持療法)
  - 第 5 章 GBS 予後予測
  - 第 6〜9 章 フィッシャー症候群 (総論・臨床的事項・診断・治療)

  収録は 1 Q&A / 1 CQ = 1 ノード。序文には本書で頻用する病名・略語の一覧 (表 2) と
  Hughes の機能グレード尺度 (表 3) があるので `00_序文・略語一覧・Hughes機能グレード尺度`
  に収めた。文献検索式は書籍に載らず Web 別冊 (207 ページ) として公開されているので、
  `12_付録_検索式` の下に Q&A / CQ と 1 対 1 で対応する 69 ノードとして収めた。
  患者 (医師) である髙尾洋之外部委員の寄稿文も Web 掲載物なので `11_寄稿文_患者からの視点`
  に収めた。
strip:
  # 柱・章名・縦組みの柱が 1 文字ずつ行に割れたもの。本文と紛れないので全行に効かせる
  - '[ivxl]{1,5}'
  - '第\s?\d\s?章'
  - '＜[^＞]{1,12}＞'
  - '序'
  - '[ＧＢＳＦ]'
  - '[１-９]'                       # 縦組みの柱の章番号 (全角)。ページ中央付近にも出るので strip 側
  - '[総論診断治療臨床的事項予後測]'
strip_edge:
  # ノンブルと、疾患名だけの柱。**ページの先頭/末尾 3 非空行だけ**に効かせる
  # (全行 fullmatch だと表の数値セルや表の行ラベルを巻き添えにするため)
  lines: 3
  patterns:
  - '\d{1,3}'
  - 'ギラン・バレー症候群'
  - 'フィッシャー症候群'
pdfs:
