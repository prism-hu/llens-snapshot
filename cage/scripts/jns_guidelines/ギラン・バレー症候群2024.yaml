notes: |
  - 版: 2024 年版 (2024 年 6 月 15 日発行) が現行。2013 年版は収録しない。
  - **ファイル名と実体のずれ (重要)**: 素材の `ギラン・バレー症候群，フィッシャー症候群診療
    ガイドライン2024_*.pdf` のうち、分冊 9 本 (`_01-総論` `_02-臨床的事項` `_03-診断`
    `_04-治療` と各 `_2` 付き) と `_序文・目次等` は、URL が
    `guidelinem/gbs/sinkei_gbs_2013_01〜09.pdf` = **2013 年版の分冊**。
    `_序文・目次等.pdf` の 1 ページ目は「ギラン・バレー症候群，フィッシャー症候群診療
    ガイドライン 2013 / © Societas Neurologica Japonica, 2013」と印字されており、
    `_01-総論.pdf` の 1 ページ目も 2013 年版の章立て「Ⅰ．ギラン・バレー症候群 総論」で
    2024 年版 (「第 1 章 … ＜総論＞」) と違う。**この 10 本は旧版として収録しない**。
    2024 年版の本体は `..._2024_PDF.pdf` (190 ページ、URL `pdf/gbs_2024_01.pdf`) 1 本のみ。
  - 一方 `_検索式.pdf` (207 ページ) と `_寄稿文…kikou.pdf` (3 ページ) は URL が
    `guidelinem/gbs_2024/sinkei_gbs_2024_kensaku.pdf` / `…_kikou.pdf` = **2024 年版の
    Web 別冊**。本文中 (基本理念 7.患者の価値観 / 序 追記) からも参照されているので収録した。
  - ページの取り方: 本体 PDF の物理ページ = 書籍の印刷ページ + 17 (印刷 p.2 = 物理 p.19、
    印刷 p.162 = 物理 p.179)。目次の印刷ページから機械的に換算したうえで、全 69 件の
    `Question & Answer N-M` / `Clinical Question N-M` 見出しの出現ページを本文側で照合し、
    すべて一致することを確認した。
  - 本体 PDF で落としたページ: p.1-2 (表紙・白紙)、p.9 / p.17 / p.31 / p.43 / p.137 /
    p.157 / p.165 / p.189-190 (白紙)、p.13 (利益相反 (COI) 開示 = 委員の申告一覧表)、
    p.14-16 (目次。doc ツリー自体が目次になる)、p.18 / p.32 / p.44 / p.82 / p.138 /
    p.148 / p.158 / p.166 / p.178 (章の中扉。章名しか無い)、p.184-187 (索引)、
    p.188 (奥付。内容は description に転記)。
  - ノード粒度: 1 Q&A / 1 CQ = 1 ノード (69 件)。CQ か Q&A かは path でなく title の
    文脈欄 (`[GBS治療/血漿浄化療法 CQ 15-1]` のように) に入れた。path を数字始まりの
    ゼロ埋め (`15-01`, `18-11`) にしてあるので文字列ソートで原本順に並ぶ。
    フィッシャー症候群は章ごとに番号が振り直されるので、章ディレクトリ配下で `01`〜`12` /
    `CQ1`〜`CQ3` とした。
  - 検索式 (別冊 207 ページ) は計画書では「`付録_検索式` 1 ノード」だが、49 万字あり
    1 ノードに収まらない。Q&A / CQ と 1 対 1 に対応する構成なので `12_付録_検索式/` の
    下に 69 ノードに割った (path は本文側と同じキー。フィッシャー症候群分は `FS-` 接頭辞)。
    検索式 PDF は本文の Q&A 番号と違う番号を使う箇所がある (第 1 章が `Q&A 1-1〜1-4`、
    本文では `Q&A 1-1 / 2-1 / 3-1 / 4-1`)。設問文で突き合わせて対応させた。
  - strip / strip_edge:
    - `strip` (全行) … 柱の `第N章` `＜総論＞` `序`、前付のローマ数字ノンブル、および
      ページ下部の縦組みの柱が 1 文字ずつ行に割れたもの (`Ｇ` `Ｂ` `Ｓ` `Ｆ` `総` `論`
      `診` `断` `治` `療` `臨` `床` `的` `事` `項` `予` `後` `測` と全角の章番号
      `[１-９]`)。**全角の章番号はページ中央付近にも出る**ので端限定にできない。
    - `strip_edge` (端 3 行) … ノンブル `\d{1,3}` と、疾患名だけの柱
      (`ギラン・バレー症候群` `フィッシャー症候群`)。柱を端限定にしたことで、
      **p.8 表 2 (略語一覧) の行「フィッシャー症候群」が残るようになった**。
      p.68 表 1 (脳脊髄液蛋白細胞解離の鑑別診断) の行「ギラン・バレー症候群」だけは
      ページ 2 行目にあり端の窓に入るので落ちる (当該ページは vlm_candidates)。
      物理 p.29 (診療アルゴリズム) にも柱が本文中に紛れて 1 行残る (同じく図のページ)。
    - 検索式 PDF は **ノンブルが必ずページ末尾 1 行目**に来ることを 207 ページ全数で
      確認したので `pdfs[].strip_edge: {lines: 1}` に絞った。これで「検索件数」列の
      裸の数字 259 個が消えずに残る。
    - この設定でノンブルは全ページ除去できている。裸の数字だけの行が残るのは
      物理 p.27 (図 1 のグラフ軸)、p.46 (Brighton 診断基準のレベル 1〜4)、
      p.119 (mEGRIS スコア表)、p.146 (mEGOS スコア表)、p.162 (FS の症候頻度表) の
      5 ページで、いずれも**表・図の中身**なので残すのが正しい (全部 vlm_candidates)。
  - 診療アルゴリズム (物理 p.29-30) は 2 つの図だけのページで、テキスト層からは意味を
    復元できない。ノード `02_GBS総論/05-01_診療アルゴリズム` に `body_text` で
    「図の読み取りは原本 PDF を参照 (VLM 起こしを予定)」と断りを置いた。**overlay 待ち**。
