  - 分冊 18 本 (序文・目次等 / 第 1〜16 章 / 略語一覧) をそのまま 1 ガイドラインに束ねた。
    ファイル名と実体のずれは無い (URL degl_2017_00〜17 と章番号が一致)。
    ただし第 9 章のファイル名は「進行型核上性麻痺」だが本文・目次とも「進行性核上性麻痺」
    (原本のファイル名の誤り)。title は本文に合わせて「進行性核上性麻痺」とした。
  - ページの取り方: 各分冊の物理ページと書籍の印刷ページは一定のオフセット
    (第 1 章 +1、第 2 章 +17、… 第 16 章 +339) でずれる。目次の印刷ページを実ページで
    確かめたうえで CQ 境界を確定した (全 141 CQ の開始ページを本文側の CQ 見出しで照合済み)。
  - 落としたページ (序文・目次等 20p のうち):
    p.1 表紙(白紙)、p.2 奥付、p.3〜5 執筆者一覧、p.15〜20 目次。
    奥付の情報は description に転記した。目次は doc ツリーそのものが目次になるため不要。
  - 書籍の印刷ページ 202〜203 (「各論」の中扉) と 350 は、どの分冊 PDF にも入っていない
    (学会の分冊化で落ちている)。索引 (355 頁〜) も配布 PDF に無い。
  - CQ3A-7 は原本が CQ3A-7-1 / CQ3A-7-2 に分かれているので、ノードも 2 つに割った。
  - strip の切り分け:
    - `strip_edge` (ページの端 3 行だけ) … ノンブル `\d{1,3}` と前付のローマ数字ノンブル。
      表の数値セル・上付き文献番号を巻き込まないため全行 strip にはしない。
    - `strip` (全ページ全行) … `第 N 章` と奇数頁下部の `CQ 1–1` 形式のフッタ。
      どの分冊にも共通で、本文と紛れない 2 つだけ。
    - `pdfs[].strip` (その分冊だけ) … **章名の柱は分冊ごとに分けた**。全体 strip に置くと
      第 1 章 表1「認知症や認知症様症状をきたす主な疾患・病態」や第 2 章の鑑別表で
      1 行 1 疾患名として並ぶ「血管性認知症」「大脳皮質基底核変性症」「Alzheimer 型認知症」
      などを本文から消してしまう (実測で第 1 章 7 行・第 2 章 16 行・第 14 章 2 行)。
      分冊ごとに自分の章名だけを落とすので、この巻き添えは起きない。
    - 第 6・7 章は柱が縦組みで 1 文字ずつの行に分解されるので、その 2 分冊に限り
      `[型認知症小体]` `Alzheimer` / `Lewy` も落とす (実測で第 6 章 64 行 = 16 頁 × 4 字、
      第 7 章 78 行 = 13 頁 × 6 字。ちょうど柱の分だけで、本文への巻き添えは 0)。
  - CQ 見出し自体は pdftotext が `CQ` / `–` / `1 1` の 3 行に割ってしまうが、本文の一部
    なので残した (front matter の title に正規の CQ 番号と設問がある)。
  - vlm_candidates: 診断フローチャート・治療アルゴリズム・多列の評価尺度表・薬剤表・
    滅菌方法表など、既定モードの pdftotext で列の対応が壊れるページを挙げた。
    診断基準の箇条書き型の表 (表1 ICD-10、表2 NIA-AA など) は既定モードでも読めるので外した。
