description: |
  『認知症疾患診療ガイドライン 2017』(日本神経学会 監修 /「認知症疾患診療ガイドライン」作成
  委員会 編集 / 医学書院 2017 年 8 月 1 日 第 1 版第 1 刷、ISBN978-4-260-02858-5)。
  2002 年『痴呆疾患治療ガイドライン』、2010 年『認知症疾患治療ガイドライン 2010』の改訂版で、
  診断から治療・介護までを扱うため「診療ガイドライン」として作成された。日本神経学会・
  日本神経治療学会・日本精神神経学会・日本認知症学会・日本老年医学会・日本老年精神医学会の
  6 学会合同。Minds 2014 に準拠し、CQ 形式 (推奨度を付けられない CQ は「回答」) を採る。

  構成は総論 (第 1〜5 章) と各論 (第 6〜16 章) の 16 章、CQ 139 件。
  - 第 1 章 認知症全般：疫学，定義，用語 (CQ1-1〜1-8)
  - 第 2 章 症候，評価尺度，診断，検査 (CQ2-1〜2-12)
  - 第 3 章 治療 (A 治療総論 CQ3A-1〜3A-7-2 / B BPSD の治療 CQ3B-1〜3B-7 / C 合併症への対応 CQ3C-1〜3C-13)
  - 第 4 章 経過と治療 (A 危険因子・防御因子 CQ4A-1〜4A-12 / B 軽度認知障害 CQ4B-1〜4B-7 / C 重症度と重症度別対応 CQ4C-1〜4C-5)
  - 第 5 章 認知症の本人や家族を支えるための諸制度と社会資源 (A 医療・介護の諸制度 CQ5A-1〜5A-5 / B 権利擁護 CQ5B-1〜5B-3 / C 若年性認知症 CQ5C-1〜5C-4 / D 道路交通法 CQ5D-1)
  - 第 6〜16 章 各論 (Alzheimer 型認知症、Lewy 小体型認知症、前頭側頭葉変性症、進行性核上性麻痺、
    大脳皮質基底核変性症、嗜銀顆粒性認知症、神経原線維変化型老年期認知症、Huntington 病、
    血管性認知症、プリオン病、内科的疾患等)

  収録は 1 CQ = 1 ノード。章の冒頭に総論 (目的・歴史・疫学など) がある章 (第 2, 6, 8, 9, 10 章)
  は章の `_index.md` 本文に収めた。序文と略語一覧も 1 ノードずつ収めている。
  APOE 遺伝学的検査 (CQ6-4) とアミロイド PET (CQ6-6) は本ガイドライン刊行後に適正使用
  ガイドラインが改訂されているので、`認知症関連_適正使用ガイドライン` の現行版も併せて参照する。
strip:
  # 全ページの全行に効く。柱のうち **どの章にも共通** のものだけをここに置く
  # (章名の柱は本文 (鑑別診断の表など) と紛れるので pdfs[].strip に分けた)
  - '第\s?\d{1,2}\s?章'
  - 'CQ \d{1,2}[A-D]?[\u2013\u2011-]\d{1,2}(?:[\u2013\u2011-]\d)?'
strip_edge:
  # ノンブル等。**ページの先頭/末尾 3 非空行だけ**に効かせる
  # (全行 fullmatch だと表の数値セル・文献番号を巻き添えにするため)
  lines: 3
  patterns:
  - '\d{1,3}'
  - '[ivx]{2,6}'
