id: 脳腱黄色腫症CTX
title: 脳腱黄色腫症（CTX）診療ガイドライン
guideline: 脳腱黄色腫症（Cerebrotendinous Xanthomatosis）診療ガイドライン
publisher: 厚生労働科学研究費補助金 難治性疾患政策研究事業「脳腱黄色腫症の実態把握と診療ガイドライン作成に関する研究班」「原発性高脂血症に関する調査研究班」（日本神経学会承認 2018年5月23日）
source: https://www.neurology-jp.org/guidelinem/pdf/syounin_14.pdf
retrieved_at: '2026-09-05'
description: |
  『脳腱黄色腫症（Cerebrotendinous Xanthomatosis：CTX）診療ガイドライン』全 19 ページ。
  作成は厚生労働科学研究費補助金（難治性疾患政策研究事業）「脳腱黄色腫症の実態把握と診療ガイドライン作成に関する研究班」
  （研究代表者 関島良樹・信州大学）および「原発性高脂血症に関する調査研究班」。
  **日本神経学会承認日 2018年5月23日**（本文末尾に記載）。日本神経学会のガイドライン掲載ページから配布されている。

  脳腱黄色腫症は CYP27A1 遺伝子変異（27-水酸化酵素欠損）による常染色体劣性の遺伝性疾患で、
  胆汁酸合成障害により血清コレスタノールが上昇し、腱黄色腫・若年発症白内障・慢性下痢・骨粗鬆症・冠動脈疾患と、
  知的障害・小脳失調・錐体外路症状・痙性歩行・てんかん・末梢神経障害などの神経症状をきたす。
  ケノデオキシコール酸の補充療法により生化学的異常が改善する**治療可能な疾患**であり、早期診断・早期治療が予後を左右する。

  構成: 疾患概念／疫学／臨床症状・病型（古典型・脊髄型・非神経型・新生児胆汁うっ滞型）／
  検査所見（生化学的検査・画像検査・遺伝子検査）／診断基準（Definite・Probable・Possible）／
  重症度分類／鑑別診断／治療（ケノデオキシコール酸、HMG-CoA 還元酵素阻害薬、LDL アフェレーシス、個々の症状に対する治療）／
  確定診断後のフォローアップの指針／予後／文献／重症度分類表（mRS・食事栄養・呼吸の評価スケール）。

  なお表紙の目次では「脳腱黄色腫症の診断基準**案**」「重**要**度分類表」と表記されているが、
  本文の見出しはそれぞれ「脳腱黄色腫症の診断基準」「重**症**度分類表」である（原本の表記ゆれ）。
strip_edge:
  # ノンブル等。**ページの先頭/末尾 3 非空行だけ**に効かせる
  # (全行 fullmatch だと表の数値セル・文献番号を巻き添えにするため)
  lines: 3
  patterns:
  - '\d{1,2}'
# 埋め込みの SymbolMT / Wingdings は、フォント内の文字コードに 0xF000 を足した私用領域
# (PUA U+F000-F0FF) に落ちる。pdftotext はその PUA をそのまま返すので、ギリシャ文字・
# 数字・読点が本文から**消えて見える** (例「AChR は␣␣␣の 4 つのサブユニット」)。
# **同じコードでもフォントが違えば別の字**なので (F06C は Symbol なら λ、Wingdings なら ●)、
# 一律に写像してはいけない。下の割り当ては原本ページ画像で 1 種ずつ目視確認した (2026-09-12)。
# 箇条書き記号は `- ` でなく**記号そのもの**に写す: pdftotext がこれらを
# 「記号だけの行 + 空行 + 本文行」に割ることが多く (神経疾患全体で 42 出現中 30)、
# `- ` にすると中身の無い箇条書き項目になるため。
substitutions:
  # p.5「診断までに平均で 16.5 ± 13.5 年を要しており」(± が消えていた)
  - {pdf: CTX診療ガイドライン.pdf, find: "\uF0B1", replace: '±'}
  # p.11「ケノデオキシコール酸（チノカプセル®）」
  - {pdf: CTX診療ガイドライン.pdf, find: "\uF0E2", replace: '®'}
  # p.13 フォローアップの箇条書きの行頭 (Wingdings)
  - {pdf: CTX診療ガイドライン.pdf, find: "\uF09F", replace: '•'}
