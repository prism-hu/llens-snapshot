notes: |
  ## テキスト層

  本文は 1 段組で素直に取り出せるが、字間が空いた組版（1 文字ごとに空白が入る行が多い）のため
  文字列としては読めても検索でヒットしないことがある。フッタはページ番号（1〜19）のみ。

  ## `±` がテキスト層から落ちる

  この PDF は **`±` が pdftotext の出力に出ない**（2026-09-06 に確認）。数値のあるページは p8 だけで、
  「血清コレスタノールの平均値は 21.1 ± 10.5 μg/mL」「健常者の平均値 ± SD: 2.35 ± 0.73 μg/mL」の
  3 つの `±` のうち**最後の 1 つしか残らない**（`21.1  10.5`・`平均値  SD` と空白になる）。
  ほかの 18 ページに `±` は無いので影響はこの 1 ページに閉じる。
  p8 は機械判定で VLM 候補に拾われており overlay（`syounin_14-p008.md`）で `±` を含む形に
  起こし直してあるが、**manifest 側にも記録として `vlm_candidates` に p8 を明記した**
  （既に候補集合に入っているページなので、追加してもバッチ構成・overlay は変わらない）。

  ## strip

  フッタのページ番号（1〜19）は `strip_edge`（ページの先頭/末尾 3 非空行だけ）で落としている。
  全行 strip にすると p18 の mRS 表の左列（0〜6 が独立行）まで消えるため。

  ## ノード分割

  章が同一ページの途中で切り替わる 2 箇所は `from` / `until` でページ内を割ってある。
  - p7 の「検査所見」見出しで `02_疫学・臨床症状`（〜見出しの直前）と `03_検査所見`（見出しから）を分けた
  - p13 の「文献」見出しで `06_フォローアップ・予後` と `07_文献` を分けた
  どちらも境界ページを両ノードが共有するので、後ろのノードに `allow_overlap: true` を付けている。
  それ以外の節境界はページ先頭で切り替わるので分割不要。

  ## 発行主体・年

  表紙に発行年は無い。本文末尾（p19）の「日本神経学会承認日 ２０１８年５月２３日」が唯一の日付。
  p5 の全国調査が 2012年9月〜2015年8月、文献の最新が 2015〜2016 年であることとも整合する。
  発行主体は厚生労働科学研究費補助金（難治性疾患政策研究事業）の 2 研究班で、日本神経学会は承認学会。
  そのため id は年を付けず `脳腱黄色腫症CTX` のままにした（計画書の割り当てどおり）。

  ## 落としたページ

  なし。全 19 ページがいずれかのノードに載っている（p1-3 の表紙・研究班名簿・執筆担当者一覧も
  出典確認に使えるので `00_作成組織` として残した）。
