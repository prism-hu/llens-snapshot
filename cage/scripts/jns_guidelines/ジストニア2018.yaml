notes: |
  原本は 219 ページの単一 PDF（分冊なし）。CQ は 89 本（総論 24 + 各論 65）。全 CQ を 1 ノード = 1 CQ で収録した。
  CQ が 1 本しかない節（②病型・⑥遺伝性ジストニアを疑う場合・⑦原因遺伝子・⑧遺伝性変性疾患・⑨予後・㉔その他の神経疾患に伴う・
  ㉗緊急性・㉘心因性・㉙経済負担・㉚重症度 rating scale）は，節ディレクトリを作らず節そのものをリーフにしている。

  ノードに載せなかったページ（すべて本文を持たないため意図的に落とした）:
  - p.1‑2 表紙・英文書名と copyright 表示
  - p.10‑12 目次
  - p.14 「１．総論」部扉，p.66 「2．各論」部扉，p.196 「巻末資料」部扉（いずれも 1 行の扉のみ）
  - p.215‑218 索引
  - p.219 奥付（発行日・発行所・ISBN。内容は description に転記した）

  ページ対応: 印刷ページ N = 物理ページ N + 13（部扉が印刷ページ数に含まれるため全体で一定）。全 CQ の開始ページは
  本文の「Clinical Question N-M」見出しで確認済みで，目次の印字ページと 89 本すべて一致した。

  テキスト層とヘッダ/フッタ:
  - 小口の柱（「1．総 / 論」「2．各 / 論」「巻 / 末 / 資 / 料」「索 / 引」）が 1 文字ずつ改行されて出るため，
    柱を構成する文字（論 各 総 巻 末 資 料 索 引 目 次）だけを 1 文字行として strip している。
    「1 文字行はすべて落とす」にはしていない（折り返しの末尾 1 文字を巻き込むため）。縦組みの見出しラベル
    「回 / 答」「推 / 奨」は意味があるので残しており，1 文字ずつの行として出る。build 側で連続する 1 文字行を
    連結できると読みやすくなる。
  - 柱（ページ下の節名。例「⑬頸部ジストニア（痙性斜頸）」）は CQ 見出しブロックにも同じ文字列が出るため，
    節名 30 本を exact で strip した。節名はノード title の [文脈] 部分に入れてある。
  - 別表のフッタは「別表」＋通し番号（別表 1〜18）で，これも strip 済み。

  表だけのページ（巻末別表 197‑213，遺伝性ジストニアの原因遺伝子表 40‑42，重症度スケール表 194‑195）は
  `mode: layout` で取り直し，インデントと列の対応を保った。**ただしテキスト層だけでは読めない**ので
  vlm_candidates に残してある:
  - **表・別表のキャプションがテキスト層に出ない**。巻末別表は各ページの「別表 N ○○○のジストニア」という
    副題が丸ごと欠け，`別表` の 2 文字だけが残る（p197 の「別表 1 乳幼児・小児期発症のジストニア」，
    p198 の「別表 2 思春期から青年期発症のジストニア・パーキンソニズム」…）。本文中の表も同じで，p34 は
    「表 1 ジストニアの鑑別で注意すべき症候群（巻末別表も参照）」が `表` だけ，
    p35 は「表 2 ジストニアと類似した疾患（Pseudodystonia）」が `表` だけになる。
    どの別表が何の一覧なのかは**テキスト層からは判別できない**。
  - **斜体の遺伝子名が抜ける**。p34 の「DYT1（DYT-*TOR1A*），DYT5（DYT/PARK-*GCH1*），DYT6（DYT-*THAP1*），
    DYT10（PxMD-*PRRT2*），DYT11（DYT-*SGCE*），DYT25（DYT-*GNAL*）」は `DYT1` `DYT10` `DYT11` の
    数字部分だけが残り，括弧内の斜体部分が消える。遺伝子名は誤ると危険なので overlay が要る。
  - 表の枠内は `-layout` でも列の対応が崩れる（p67 の「表 1 来院理由となった愁訴」は
    愁訴の行と % の列が別ブロックに分かれて出る）。
