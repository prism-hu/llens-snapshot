id: ジストニア2018
title: ジストニア診療ガイドライン2018
guideline: ジストニア診療ガイドライン2018
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/dystonia_2018.html
retrieved_at: '2026-09-05'
description: |
  日本神経学会監修『ジストニア診療ガイドライン2018』（編集: 「ジストニア診療ガイドライン」作成委員会，委員長 梶龍兒，発行: 南江堂，2018年6月5日発行，ISBN978-4-524-24818-6）の全文。
  協力機関は厚生労働省 難治性疾患等政策研究事業「遺伝性ジストニア・ハンチントン病の診療ガイドラインに関するエビデンス構築のための臨床研究班」。

  Minds 診療ガイドライン 2014 に基づき CQ を設定。ジストニアではボツリヌス治療などごく一部を除き RCT／システマティックレビューが存在しないため，
  個々の論文への形式的なエビデンス評価は行わず「エビデンス総体」として強さを示している。推奨は「推奨の強さ（1 強く推奨する / 2 弱く推奨する）」と
  「エビデンスの強さ（A 強〜D とても弱い）」の 2 軸併記。

  構成:
  - 1．総論（CQ 1‑1〜10‑9, 24 CQ）— 疾患概念・病型・疫学・病態と原因・必要な診察と検査・遺伝性ジストニアを疑う場合・原因遺伝子・
    ジストニアをきたす遺伝性変性疾患・予後・治療（内服/ボツリヌス/MAB/バクロフェン髄注/手術/経頭蓋刺激/リハビリ/日常生活）
  - 2．各論（CQ 11‑1〜30‑1, 65 CQ）— 眼瞼痙攣・顎口舌・頸部（痙性斜頸）・体幹体軸・喉頭・書痙上肢・職業/スポーツ/外傷・音楽家・下肢・
    全身性・片側性・小児・パーキンソン病に伴う・その他の神経疾患に伴う・発作性・薬剤性・緊急性・心因性・経済負担と社会資源・重症度 rating scale
  - 巻末資料 — 別表「ジストニア鑑別の手引き」（17 ページの大判鑑別表）とジストニアコンソーシアムのホームページ案内

  各 CQ は「回答」「■ 解説・エビデンス」「■ 文献」「■ 検索式・参考にした二次資料」の構成（一部に「推奨」を併記）。
