id: パーキンソン病2018
title: パーキンソン病診療ガイドライン2018
guideline: パーキンソン病診療ガイドライン2018
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/parkinson_2018.html
retrieved_at: '2026-09-05'
description: |
  日本神経学会監修『パーキンソン病診療ガイドライン2018』（編集: 「パーキンソン病診療ガイドライン」作成委員会，発行: 医学書院，2018年）の全文。
  「パーキンソン病治療ガイドライン2011」の改訂版で，2018年版から書名が「治療ガイドライン」→「診療ガイドライン」に変わった。
  文献検索は原則 1983-01-01〜2015-12-31（一部 2016 年以降の追加検索あり）。

  構成は 3 編:
  - 序章 パーキンソン病とは — 診断（MDS 診断基準 2015）・疫学・遺伝子・環境因子・運動症状と非運動症状
  - 第Ⅰ編 抗パーキンソン病薬，外科手術，リハビリテーションの有効性と安全性 — 薬剤別/術式別に「2008年10月以降のエビデンス」「ガイドライン作成委員会の結論（有効性・安全性・臨床への応用・今後検討されるべき事項）」を記載する全12章。冒頭に資料1（各薬剤の特徴）・資料2（L‑ドパ換算用量）
  - 第Ⅱ編 Evidence Based Medicine の手法を用いた推奨 — GRADE システムによる CQ 2 本（CQ 1 早期パーキンソン病の治療 / CQ 2 運動合併症に対する治療）。各 CQ にエビデンスプロファイル・フォレストプロット・Evidence‑to‑Decision テーブルの supplementary data が付く
  - 第Ⅲ編 パーキンソン病診療に関する Q&A — 6章 60 項目（診断・予後 / 治療総論 / 運動症状 / 非薬物療法 / 非運動症状 / 将来の治療）。各項目は「回答」「背景・目的」「解説」「臨床に用いる際の注意点」「文献」「検索式・参考にした二次資料」の構成

  注意: 第Ⅰ編（薬剤別）と第Ⅲ編（Q&A）で「第N章」の番号が独立して振られており，原本の分冊 PDF もその両系列を同じ「第N章」名で配布している。本ツリーでは編ごとに分けて配置している。
