notes: |
  収録は原本 30 分冊のうち 28 本。落としたのは以下 2 本（いずれも本文を持たないナビゲーション用）:
  - パーキンソン病診療ガイドライン2018_目次.pdf（5p, parkinson_2018_05.pdf）— 目次
  - パーキンソン病診療ガイドライン2018_索引.pdf（7p, parkinson_2018_30.pdf）— 索引
  収録した 28 本については全ページがいずれかのノードに載っている（欠落なし）。

  ファイル名と実体:
  - 分冊名の「第N章」が第Ⅰ編（薬剤・手術・リハビリ）系列と第Ⅲ編（Q&A）系列で重複している。
    たとえば「第5章 アマンタジン」= 第Ⅰ編第5章，「第5章 非運動症状の治療」= 第Ⅲ編第5章。URL 番号でも区別でき，
    第Ⅰ編が parkinson_2018_09〜20，第Ⅱ編が _21〜23（supplementary data は _01/_02），第Ⅲ編が _24〜29。
  - 「第1章 GRADEシステムを用いたエビデンスの質と推奨」(_21) は第Ⅱ編第1章。
  - 「第2章 CQ1早期パーキンソン病の治療はどのとうに行うべきか」(_22) はファイル名が原本の誤植（「どのとうに」= どのように）。本文・目次は「どのように」。
  - supplementary data 2 本のファイル名にある「第Ⅱ編 第2章 / 第3章」は第Ⅱ編の章立てを指す（本体分冊の _22/_23 に対応）。

  ページ割りの判断:
  - 第Ⅲ編第1章の Q and A 1‑2（画像検査は有用か）の総論と Q and A 1‑2‑1（MRI）は同一ページに始まるので，
    `until` / `from`（境界は Q 番号の飾り行 `1 2 1`）でページ内分割して 1 CQ = 1 ノードにした。
  - 第Ⅲ編第4章の Q and A 4‑1 と 4‑2 も同一ページ（分冊 p.1 = 印刷 200 頁）に並ぶので，同じく `4 2` を境に分割した。
  - 第Ⅱ編の章末文献・検索式は CQ 個別ではなく章末にまとまっているので，「資料 CQ 1」「資料 CQ 2」ノードの末尾に含めた。
  - 目次の印字ページと物理ページのオフセットは分冊ごとに一定（例: 第Ⅲ編第5章は 物理 = 印字 − 216）。全境界を本文で確認済み。

  テキスト層とヘッダ/フッタ:
  - 章扉は「第 / N / 章 / 章題」のように 1 文字ずつ改行される縦組み。strip の `第` `章` `編`，ノンブルは strip_edge の
    `\d{1,3}` がこれを落とす。
  - 小口の柱（章番号だけの数字）はページの端に来ないので strip_edge では取れない。分冊ごとに `pdfs[].strip` で
    その章の番号だけを落としている（例: 第Ⅲ編第5章の PDF は `'5'`）。他の分冊の表の数値セルは巻き込まない。
  - Q&A 番号の飾り（`Q and A` / `–` / `5 2` の 3 行）も分解されて出る。`5 2` のような「数字 空白 数字」の行は
    strip していない（表のセルと区別できないため）。ノード title に Q 番号があるので実害は小さく，
    Q and A 1‑2/1‑2‑1 と 4‑1/4‑2 のページ内分割ではこの行を境界に使っている。
  - 全ページが表の箇所（資料 1・2，序章の MDS 診断基準表，治療総論の原因薬品表・妊婦授乳婦表）は範囲ごとに
    `mode: layout` にして桁を保った。それ以外は既定モード。
