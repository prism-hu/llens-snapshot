notes: |
  - 版: 2014 年版が現行 (2026-09-05 時点で学会サイトの掲載版)。旧版は無い。
  - 分冊 10 本 (序文等 / 第 1〜8 章 / 付録) をそのまま 1 ガイドラインに束ねた。
    URL は zuimaku_guide_2014_01〜10 で、01 が序文等、02〜09 が第 1〜8 章、10 が付録
    (**ファイル名の章番号と URL の連番が 1 ずれる**ので取り違えに注意)。
    ファイル名と実体のずれはこれ以外に無い。
  - ページの取り方: 各分冊の物理ページと書籍の印字ページはファイルごとに一定のオフセットで
    ずれる (第 1 章のみ物理 = 印字、第 2 章 +30、第 3 章 +36、…)。目次の印字ページを
    本文中の "Clinical Question N-M" 見出しで 1 ページずつ照合して CQ 境界を確定した。
  - ノードに載せなかったページ:
    序文等 p.1-4 (表紙・英題・中扉・監修/編集者一覧) と p.19-20 (目次)、
    各章分冊の p.1 (章扉。章名 1 行だけのページ。章名はノードの title が持つ)。
    索引 (印字 121 頁) は配布 PDF に含まれていない。
  - 第 5 章には CQ が 1 つ (CQ5-1) しかなく、続く「Knowledge gaps（今後の課題）」が
    独立した設問形式の節になっているので、`Knowledge_gaps` として 1 ノードに切った
    (path は文字列ソートで CQ5-1 の後ろに来る)。
  - CQ1-3 / CQ8-1 は原本の目次で設問が 2〜3 行に分かれている (複数の問いを 1 CQ に
    まとめている) ので、title でも `／` で並べた。
  - strip の切り分け:
    - `strip_edge` (ページの端 3 行) … ノンブル `\d{1,3}` と前付のローマ数字ノンブル。
    - `pdfs[].strip` … 柱は**分冊ごとにその章の章題だけ**を落とす。`N．細菌性髄膜炎…` の
      ような緩い正規表現を全体に掛けると、第 6 章本文の見出し「2．細菌性髄膜炎以外の
      細菌感染症」まで消える (実測)。章題を分冊ごとに固定文字列で書けばこれは起きない。
    - `pdfs[].strip` の後半 … **縦組みの柱と「回答」「推奨」の side tab が 1 文字ずつの
      行に分解される**ので、その章の柱に実際に出る文字だけを文字クラスにして落とす
      (例: 第 1 章 `[疫学的現況回答１]`、第 7 章 `[治療回答推奨７]`)。全ページ全行に
      `[一-龥]` を掛けると本文中の 1 文字セル (第 1 章の「不」「明」「件」など) まで
      消えるが、章ごとの数文字に絞れば巻き添えは起きない。
      (縦組みの柱は本文が長いページでは抽出順が中ほどに来るため、`strip_edge` の
      端 N 行では取り切れなかった — 実測で第 7 章に 39 行残った。)
    - `pdfs[].strip_edge` (端 12〜14 行) … 縦組みの柱に付く `．` `・` だけ。
      本文中の `．` (参照付き文の句点が折り返しで 1 行になったもの) は残す。
  - 巻頭フローチャートと巻頭表 2・3 は本ガイドラインの中核 (起炎菌未確定時の経験的治療と
    起炎菌判明後の薬剤選択) で、いずれも図表としてしか存在しない。**VLM 起こしの優先度が
    最も高いのはこの 6 ページ (序文等 p.10-15)**。
