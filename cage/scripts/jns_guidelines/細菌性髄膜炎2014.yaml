id: 細菌性髄膜炎2014
title: 細菌性髄膜炎診療ガイドライン2014
guideline: 細菌性髄膜炎診療ガイドライン2014
publisher: 日本神経学会・日本神経治療学会・日本神経感染症学会
source: https://www.neurology-jp.org/guidelinem/pdf/zuimaku_guide_2014_01.pdf
retrieved_at: '2026-09-05'
description: |
  『細菌性髄膜炎診療ガイドライン 2014』(英題 Practical Guideline for Bacterial Meningitis 2014 /
  日本神経学会・日本神経治療学会・日本神経感染症学会 監修、「細菌性髄膜炎診療ガイドライン」
  作成委員会 (委員長 亀井聡、副委員長 細矢光亮) 編集 / 南江堂 2014 年発行)。
  2011 年の日本神経学会理事会で「診断・検査を含めた診療ガイドライン」として作成が決まった
  6 疾患のひとつ (ガイドライン 2013 群) で、成人・小児の両方を扱う。
  推奨度は A〜E の 5 段階 (『単純ヘルペス脳炎診療ガイドライン 2017』と同じ枠組み)。

  全 8 章・CQ 25 件 + Knowledge gaps 1 件。
  1. 疫学的現況 / 2. 転帰・後遺症 / 3. 症状・症候 / 4. 検査 / 5. 起炎菌の遺伝子診断 /
  6. 鑑別診断 / 7. 治療 (7-1 抗菌薬の選択、7-2 副腎皮質ステロイド薬の併用) / 8. 発症予防。
  巻頭に検査手順・治療のフローチャートと巻頭表 1〜3 (標準的な投与期間、起炎菌判明時の
  抗菌薬の標準的選択 成人/小児) があり、実務ではまずここを見る。巻末の付録は
  付録表 1「抗菌薬の髄液移行率」。
  学会サイトでは 10 分冊 (序文等 + 第 1〜8 章 + 付録) で配布されている。
strip_edge:
  # ノンブル (本文の数値セルを巻き込まないようページの端 3 行だけ)
  lines: 3
  patterns:
  - '\d{1,3}'
  - '[ivx]{2,6}'
# 上付きの潰れ。テキスト層が 10³ を「103」で返す (指数が並字に落ちる)。
# 原本 p.9 の画像で 10³/mL を確認。算術でも裏が取れる (10³/mL × 5 µL = 5 個。
# 103/mL なら 0.5 個で本文と矛盾する)。数字列なので substitutions は使えない
