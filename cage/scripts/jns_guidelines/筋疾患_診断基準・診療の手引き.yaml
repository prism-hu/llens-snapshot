  ## 抽出モードと本文が無いページ
  - **シュワルツ・ヤンペル症候群だけ PDF 全体を `mode: layout` で抽出している。** 2 段組の小冊子で、
    既定モードでは左右の段が行単位で交互に混ざって本文として読めない。p5 の重症度分類 (Barthel Index) も
    layout でないと点数セルが本文から離れてしまう。
    この PDF は InDesign の出力痕 (ファイル名 + タイムスタンプ) が刷り込まれており、layout では 1 行に並ぶので
    PDF 単位の `strip` で落とし、ノンブル `−  N  −` は PDF 単位の `strip_edge` で落としている。
  - シュワルツ・ヤンペル p4 (診断基準) は**ページ全体が画像でテキスト層に本文が無い**。
    build の「テキスト層がほぼ無い」注記に加えて `body_text` で「本文はここには出ない。原本 PDF を参照」と明記した。

  ## strip / strip_edge について
  - 14 本に共通で効かせるのは制御文字 \x06 だけ。研究班文書には走り柱がほとんど無い。
  - ノンブルは `strip_edge` (lines: 2)。窓を 3 行にすると重症度分類 (Barthel Index) や
    「診断と治療のサマリー」表の点数セルを巻き込む。実測で 2 行なら巻き添えは起きなかった。
  - シュワルツ・ヤンペルの InDesign 出力痕とノンブル飾り (`−`) は、他の 13 本に効かせる必要が無いので
    `pdfs[]` 側の `strip` / `strip_edge` に閉じ込めてある。

  ## 章 _index の本文
  - 各文書の表紙・編集委員・目次は収録していないので、疾患ごとのディレクトリと手引きごとのディレクトリの
    `_index.md` は `body_text` で書いた案内文 (発行主体・版・章構成) と子の一覧だけになる。

