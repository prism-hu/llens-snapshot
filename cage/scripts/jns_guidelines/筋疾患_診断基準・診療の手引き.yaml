    可読性は overlay に劣る。vlm_candidates には残してある。
  - 先天性筋無力症候群の表1 (病型×遺伝子×遺伝形式×症例数×治療反応性)、筋チャネル病の診断フローチャート (p25)、
    筋ジストロフィー病型診断の各章フローチャートは、いずれもテキスト層に本体が無いか桁が崩れる。
    vlm_candidates 70 ページの中心はこれら。
  ## build へ出した要望とその後
  - ページ端だけを狙う strip (`strip_edge`)、2 段組ページの `mode: layout`、テキスト層が無いページの注記、
    ページ範囲の重複を許す `allow_overlap`、ページ内分割の `from` / `until`、章 `_index` の `body_text` は
    いずれも実装されたので、この manifest はすべて使っている。追加の要望は今のところ無い。
