id: 筋疾患_診断基準・診療の手引き
title: 筋疾患の診断基準・診療の手引き（研究班文書）
guideline: 筋疾患 診断基準・診療の手引き（厚生労働省 難治性疾患政策研究事業 研究班／日本神経学会掲載）
publisher: 厚生労働省 難治性疾患政策研究事業 研究班（日本神経学会掲載）
source: https://www.neurology-jp.org/guidelinem/pdf/syounin_17.pdf
retrieved_at: '2026-09-05'
description: |
  日本神経学会が掲載している、希少な筋疾患についての研究班作成の「診療の手引き」と「診断基準」14 本を
  1 つのディレクトリ (`{{DOC_BASE}}/診療ガイドライン/神経疾患/筋疾患_診断基準・診療の手引き/`) にまとめたもの。いずれも学会が自ら作成した診療ガイドラインではなく、厚生労働省の難治性疾患政策研究事業
  （難治性疾患等政策研究事業）の研究班が作成し、日本神経学会が承認・掲載しているもの。

  発行主体（各文書の 1 ページ目・奥付で確認した実際の作成者）:
  - 厚生労働科学研究費 難治性疾患等政策研究事業「希少難治性筋疾患に関する調査研究」班
    （研究代表者 青木正志 東北大学大学院医学系研究科神経内科学講座 教授）
    … 封入体筋炎（診療の手引き2023改訂版・診断基準改訂2025）、臨床医のための遠位型ミオパチーの診療の手引き2025、
      縁取り空胞を伴う遠位型ミオパチー診断基準、三好型ミオパチー診断基準、眼咽頭遠位型ミオパチー診断基準、
      先天性筋無力症候群の診療の手引き、筋チャネル病 診療の手引き、自己貪食空胞性ミオパチーの診療の手引き、
      ベスレムミオパチー診断基準、ウルリッヒ病診断基準、マリネスコ-シェーグレン症候群診断基準、
      シュワルツ・ヤンペル症候群診断の手引き
  - 厚生労働科学研究費 難治性疾患政策研究事業「筋ジストロフィーの標準的医療普及のための調査研究」班
    … 筋ジストロフィーの病型診断を進めるための手引き（第 0.1 版）
  診断基準 8 本（縁取り空胞を伴う遠位型ミオパチー／三好型ミオパチー／眼咽頭遠位型ミオパチー／ベスレムミオパチー／
  ウルリッヒ病／マリネスコ-シェーグレン症候群）は日本神経学会承認日 2016年1月29日。
  シュワルツ・ヤンペル症候群診断の手引きは 2017年1月、自己貪食空胞性ミオパチーの診療の手引きは 2019年1月1日 第1版。

  構成は「1 疾患 = 1 ディレクトリ」。数ページの診断基準は 1 文書 = 1 ノード、
  数十ページの手引きは原本の章立てでサブノードに割った。文献リスト・表・図のページも節として収録している。
  中扉・作成委員会名簿・目次・奥付は収録しない（要点は本 `_index` の description に転記した）。
strip:
  # 全 14 本に共通で効かせるのはこれだけ (研究班文書には走り柱がほとんど無い)
  - '\x06'
strip_edge:
  # ノンブル。この 14 本はいずれも「ページ最終行 = ノンブル」なので窓を 2 行に絞る。
  # 3 行にすると重症度分類 (Barthel Index) や診断と治療のサマリー表の点数セルを巻き込む。
  lines: 2
  patterns:
  - '\d{1,3}'
# 埋め込みの SymbolMT / Wingdings は、フォント内の文字コードに 0xF000 を足した私用領域
# (PUA U+F000-F0FF) に落ちる。pdftotext はその PUA をそのまま返すので、ギリシャ文字・
# 数字・読点が本文から**消えて見える** (例「AChR は␣␣␣の 4 つのサブユニット」)。
# **同じコードでもフォントが違えば別の字**なので (F06C は Symbol なら λ、Wingdings なら ●)、
# 一律に写像してはいけない。下の割り当ては原本ページ画像で 1 種ずつ目視確認した (2026-09-12)。
# 箇条書き記号は `- ` でなく**記号そのもの**に写す: pdftotext がこれらを
# 「記号だけの行 + 空行 + 本文行」に割ることが多く (神経疾患全体で 42 出現中 30)、
# `- ` にすると中身の無い箇条書き項目になるため。
substitutions:
  # 先天性筋無力症候群 (SymbolMT)。p.9「AChR はα1, β1, δ, εの 4 つのサブユニットからなり、
  # α1サブユニットのみが 2 分子含まれる 5 量体である(α2βδε)」、p.17「ラミニンはα, β, γの 3 量体」、
  # p.29「2020 年に報告」「報告時には 14 歳」を原本画像で確認した
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF061", replace: 'α'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF062", replace: 'β'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF064", replace: 'δ'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF065", replace: 'ε'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF067", replace: 'γ'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF02C", replace: ','}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF030", replace: '0'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF031", replace: '1'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF032", replace: '2'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF034", replace: '4'}
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF035", replace: '5'}
  # p.53 表 1 の欄外の箇条書き (Wingdings)
  - {pdf: 先天性筋無力症候群の診療の手引き.pdf, find: "\uF09F", replace: '•'}
  # 封入体筋炎 (SymbolMT)。p.4「アミロイドβ(Aβ)」、p.7「β-APP」
  - {pdf: 封入体筋炎の診療の手引き.pdf, find: "\uF062", replace: 'β'}
  # 遠位型ミオパチー (Wingdings)。p.33-34 の疾患一覧の行頭 ●
  - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, find: "\uF06C", replace: '●'}
  # マリネスコ-シェーグレン (SymbolMT)。p.1「鑑別疾患」5 項目の行頭 •
  - {pdf: マリネスコ-シェーグレン症候群診断基準.pdf, find: "\uF0B7", replace: '•'}
