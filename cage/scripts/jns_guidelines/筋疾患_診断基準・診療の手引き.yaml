  - file: ウルリッヒ病診断基準.pdf
    url: https://www.neurology-jp.org/guidelinem/pdf/syounin_07.pdf
    label: ウルリッヒ病診断基準
  - file: マリネスコ-シェーグレン症候群診断基準.pdf
    url: https://www.neurology-jp.org/guidelinem/pdf/syounin_09.pdf
    label: マリネスコ-シェーグレン症候群診断基準
  - file: シュワルツ・ヤンペル症候群診断の手引き.pdf
    url: https://www.neurology-jp.org/guidelinem/pdf/sjs_tebiki.pdf
    label: シュワルツ・ヤンペル症候群 診断の手引き
    # この PDF だけ 2 段組の小冊子。既定モードでは左右の段が行単位で交互に混ざって
    # 本文として読めないので、PDF 全体を layout で抽出する
    # (p5 の重症度分類表も layout でないと点数セルが本文から離れてしまう)。
    mode: layout
    # InDesign の出力痕 (ファイル名 + タイムスタンプ) が刷り込まれており、
    # layout では 1 行に並ぶ。ノンブルは `−  5  −` の形。
    strip:
      - '\s*SJS診断の手引き\.indd \d+\s+\d{4}/\d{2}/\d{2}\s+\d{1,2}:\d{2}\s*'
    strip_edge:
      lines: 3
      patterns:
        - '\s*−\s*\d{1,3}\s*−\s*'
nodes:
  - path: 01_封入体筋炎
    title: 封入体筋炎（sporadic inclusion body myositis, sIBM）
    body_text: |
      封入体筋炎（sporadic inclusion body myositis, sIBM）についての 2 文書。研究班作成の「診療の手引き 2023年改訂版」（27 ページ）と、独立して改訂された「診断基準 2025改訂版」（4 ページ）。
      診断基準は 2025改訂版が現行。手引きの中にも 2023年版の診断基準が載っているが、そちらは置き換わっている。
    children:
      - path: 01_診療の手引き2023改訂版
        title: 封入体筋炎 診療の手引き 2023年改訂版
        body_text: |
          「封入体筋炎 診療の手引き 2023年改訂版」（27 ページ）。編集は厚生労働科学研究費 難治性疾患等政策研究事業「希少難治性筋疾患に関する調査研究」班 封入体筋炎分科会。
          疾患概要から結語まで 8 章＋診断基準（2023年版）＋文献。原本の表紙・作成委員会・目次は収録していない。
        children:
          - path: 01_疾患概要
            title: '[封入体筋炎/手引き] 1．疾患概要（定義・臨床像・代表的病理像 図1）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [4, 5]}
          - path: 02_疫学・経過・予後
            title: '[封入体筋炎/手引き] 2．疫学・経過・予後（患者数はどのくらいか／経過・予後）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [6, 6]}
          - path: 03_病因・病態
            title: '[封入体筋炎/手引き] 3．病因・病態（変性と炎症、KLRG1、xenograft モデル）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [7, 8]}
          - path: 04_診察・電気生理・診断基準
            title: '[封入体筋炎/手引き] 4．診察・電気生理（診断に有用な診察・検査所見、HTLV-1/HCV との関連、既存の診断基準と診断の難しさ）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [9, 11]}
          - path: 05_病理・血清マーカー
            title: '[封入体筋炎/手引き] 5．病理・血清バイオマーカー（縁取り空胞、CD8陽性T細胞、MHCクラスI、抗cN1A抗体）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [12, 12]}
          - path: 06_嚥下障害とリハビリテーション
            title: '[封入体筋炎/手引き] 6．嚥下障害とリハビリテーション（バルーン拡張法、メンデルソン手技、呼気抵抗負荷トレーニング、HAL）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [14, 17]}
          - path: 07_治療
            title: '[封入体筋炎/手引き] 7．治療（ステロイド・IVIg の位置づけ、治療開発の現状）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [18, 19]}
          - path: 08_結語
            title: '[封入体筋炎/手引き] 8．結語'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [20, 20]}
          - path: 09_診断基準2023年版
            title: '[封入体筋炎/手引き] 「希少難治性筋疾患に関する調査研究班」封入体筋炎 診断基準（2023年版。2025改訂版に置き換わっている）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [21, 22]}
          - path: 10_文献
            title: '[封入体筋炎/手引き] 文献（1〜77）'
            body:
              - {pdf: 封入体筋炎の診療の手引き.pdf, pages: [23, 27]}
      - path: 02_診断基準改訂2025
        title: 封入体筋炎 診断基準 2025改訂版（＋参考：2024 ENMC 封入体筋炎診断基準 邦訳版）
        body:
          - {pdf: 封入体筋炎 診断基準改訂2025.pdf, pages: [1, 4]}
  - path: 02_遠位型ミオパチー
    title: 遠位型ミオパチー（GNEミオパチー・眼咽頭遠位型ミオパチー・三好型ミオパチーほか）
    body_text: |
      遠位型ミオパチーについての 4 文書。研究班作成の「臨床医のための遠位型ミオパチーの診療の手引き 2025」（58 ページ）と、日本神経学会承認 2016年1月29日の診断基準 3 本（縁取り空胞を伴う遠位型ミオパチー／三好型ミオパチー／眼咽頭遠位型ミオパチー）。
      手引きの「7．付記」にも厚生労働省指定難病の診断基準が載っており、独立 PDF の診断基準と文言に差があるため両方を収録している。
    children:
      - path: 01_診療の手引き2025
        title: 臨床医のための遠位型ミオパチーの診療の手引き 2025
        body_text: |
          「臨床医のための遠位型ミオパチーの診療の手引き 2025」（58 ページ）。編集は厚生労働省 難治性疾患等政策研究事業「希少難治性筋疾患に関する調査研究」班、協力 一般社団法人 日本神経学会。
          概論（遺伝学的分類と各疾患の概要）に続き、GNE ミオパチー・眼咽頭遠位型ミオパチー（OPDM）・三好型ミオパチーを個別に詳述し、付記に指定難病の診断基準、末尾に図と表を置く。
        children:
          - path: 01_序文
            title: '[遠位型ミオパチー/手引き] 1．序文'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [5, 5]}
          - path: 02_概論
            title: '[遠位型ミオパチー/手引き] 2．遠位型ミオパチー概論（2-A 臨床遺伝学的視点からの分類／2-B 各疾患の概要）'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [6, 12]}
          - path: 03_GNEミオパチー
            title: '[遠位型ミオパチー/手引き] 3．GNE ミオパチー（縁取り空胞を伴う遠位型ミオパチー）疾患概要・病態・臨床症状・検査所見・治療'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [13, 17]}
          - path: 04_眼咽頭遠位型ミオパチー
            title: '[遠位型ミオパチー/手引き] 4．眼咽頭遠位型ミオパチー（OPDM）疾患概要・病態・遺伝・画像・鑑別疾患'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [18, 22]}
          - path: 05_三好型ミオパチー
            title: '[遠位型ミオパチー/手引き] 5．三好型ミオパチー（dysferlinopathy）疾患概要・臨床経過・病理・遺伝・治療開発'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [23, 28]}
          - path: 06_結語
            title: '[遠位型ミオパチー/手引き] 6．結語'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [29, 29]}
          - path: 07_付記_厚生労働省指定難病診断基準
            title: '[遠位型ミオパチー/手引き] 7．付記：厚生労働省指定難病 診断基準（GNEミオパチー／眼咽頭遠位型ミオパチー／三好型ミオパチー／その他の遠位型ミオパチー）'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [30, 34]}
          - path: 08_参考文献
            title: '[遠位型ミオパチー/手引き] 8．参考文献（1〜237）'
            body:
              - {pdf: 臨床医のための遠位型ミオパチーの手引き.pdf, pages: [35, 49]}
