    実際の作成班は 2 つあり（希少難治性筋疾患に関する調査研究班／筋ジストロフィーの標準的医療普及のための調査研究班）、
    研究代表者・承認日を含めて description に列挙してある。日本神経学会は承認・掲載の立場で、作成主体ではない。

