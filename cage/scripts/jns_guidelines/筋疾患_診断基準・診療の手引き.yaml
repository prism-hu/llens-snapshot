    封入体筋炎（手引き＋診断基準）と遠位型ミオパチー（手引き＋3 つの診断基準）はそれぞれ 1 ディレクトリの下に置いた。
  - 数ページの診断基準（縁取り空胞／三好型／眼咽頭／ベスレム／ウルリッヒ／マリネスコ-シェーグレン）は 1 文書 = 1 ノード。
  - 数十ページの手引き（封入体筋炎 27p／遠位型ミオパチー 58p／先天性筋無力症候群 53p／筋チャネル病 47p／
    筋ジストロフィー病型診断 38p／自己貪食空胞性ミオパチー 15p／シュワルツ・ヤンペル 8p）は原本の章立てで割った。

