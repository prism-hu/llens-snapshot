notes: |
  - 版: 単一版のみ (2011 年編纂、PDF は 2013 年作成)。年号がタイトルに入らない手引き類なので
    id は主題のみ (`家族性アミロイドポリニューロパチー`) とした (計画書の規則どおり)。
  - 発行主体: 巻頭言に「厚生労働省、難治性疾患克服対策事業の中の『アミロイド―シスの
    調査研究班』(山田正仁班長 (当時)) の共同作業の一環として作成」「信州大学の池田修一
    教授のご指導を得て、同研究班が主なアミロイド―シスのガイドラインを作成した一環として
    2011 年に編纂されました」、署名は「熊本大学大学院生命科学研究部、神経内科学分野
    安東 由喜雄」とある。**日本神経学会が監修した診療ガイドラインではない**ので
    `publisher` は研究班名にした (日本神経学会は掲載元)。
  - `source` は代表 PDF の URL。学会サイトに単独の掲載ページが見当たらないため
    (`guidelinem/pdf/neuropathy.pdf` を直リンクしている)。
  - ページの取り方: 印刷ページ = 物理ページ (ノンブル 1〜24 と一致)。節見出し
    (`1. 概説` `2. 診断` `3. 治療` `エビデンス` `図表の説明` `■文献■`) の出現ページで
    境界を確定した。落としたページは無い (全 24 ページを収録)。
  - 節の切れ目がページの途中にある箇所 (疫学 / 初発症状 / 検査所見 / 病理学的所見) は
    ページ単位でしか切れないので、概説を 2 ノード (p.2-5 と p.6-9) にまとめた。
  - 図表: 図 1〜6・表 2・表 3 はページ埋め込みのラスタ画像で、pdftotext では出ない。
    とくに **p.10 は診断基準 (表 2) がページ全面の画像**で、テキスト層は導入の 4 行だけ。
    診断基準を引ける状態にするには VLM 起こしが要る (vlm_candidates)。
  - 内容が古い: 治療の記述が「ジフルニサルや FX1006A が国際臨床試験中 (グレード C1)」
    「siRNA … 臨床応用が行われようとしている」で止まっている。現行の疾患修飾薬
    (タファミジス・パチシラン・ブトリシランなど) は載っていない。日本神経学会の掲載物と
    しては現行版だが、**利用時は刊行年 (2011) を前提にする必要がある**ことを
    description に明記した。
  - strip / strip_edge: この PDF には柱が無く、落とすのは中央下のノンブルだけなので
    `strip_edge: {lines: 3, patterns: ['\d{1,3}']}` のみ。端限定なので表 1
    (TTR 点変異一覧) の「No.」列の数字は本文中に残る。
  - p.10 (診断基準 = ページ全面が画像) はノード `03_診断` に `body_text` で
    「診断基準と図は原本 PDF を参照 (VLM 起こしを予定)」と断りを置いた。**overlay 待ち**。
    p.5 (図 1 分布図) はテキスト層がほぼ無く build が thin_page として注記を挿す。
