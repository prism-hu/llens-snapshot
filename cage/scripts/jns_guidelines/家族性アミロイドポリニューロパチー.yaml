id: 家族性アミロイドポリニューロパチー
title: 家族性アミロイドポリニューロパチーの診療ガイドライン
guideline: 家族性アミロイドポリニューロパチー（FAP）の診断と治療のガイドライン
publisher: 厚生労働省 難治性疾患克服対策事業「アミロイドーシスに関する調査研究班」
source: https://www.neurology-jp.org/guidelinem/pdf/neuropathy.pdf
retrieved_at: '2026-09-05'
description: |
  『家族性アミロイドポリニューロパチー(FAP)の診断と治療のガイドライン』(全 24 ページ)。
  厚生労働省 難治性疾患克服対策事業「アミロイドーシスに関する調査研究班」(山田正仁 班長
  (当時)) の共同作業として、信州大学 池田修一教授の指導のもと **2011 年に編纂**され、
  熊本大学大学院生命科学研究部 神経内科学分野 安東由喜雄 が執筆した (巻頭言に明記)。
  日本神経学会の「神経疾患診療ガイドライン」ページに掲載されている。学会監修の
  診療ガイドラインではなく研究班の手引きなので、`publisher` は研究班名にした。
  刊行年が古く、TTR 四量体安定化薬 (ジフルニサル・Fx-1006A = タファミジス) が
  「国際臨床試験中」、siRNA が「臨床応用が行われようとしている」段階の記述である点に注意
  (現在は複数の疾患修飾薬が承認済み)。

  構成:
  - 巻頭言 (成立の経緯・執筆者)
  - 1. 概説 (疾患概念・TTR 点変異一覧・疫学と国内分布・初発症状・臨床症状・検査所見・病理学的所見)
  - 2. 診断 (診断基準 (表 2)・組織診断・血清診断・遺伝子診断・診断のフローチャート (図 4))
  - 3. 治療 (肝移植 (グレード B)・対症療法 (表 3)・ジフルニサル / FX1006A (グレード C1)・開発中の治療)
  - エビデンス (肝移植の効果と予後・TTR 四量体安定化薬)
  - 図表の説明 / 文献 (49 件)

  収録は節単位で 8 ノード。図表 (図 1〜6・表 1〜3) の大半はページ埋め込み画像で、
  特に診断基準 (表 2) はページ全体が 1 枚の画像なのでテキスト層に本文が無い
  (vlm_candidates 参照)。
strip_edge:
  # ノンブル等。**ページの先頭/末尾 3 非空行だけ**に効かせる
  # (全行 fullmatch だと表の数値セル・文献番号を巻き添えにするため)
  lines: 3
  patterns:
  - '\d{1,3}'
