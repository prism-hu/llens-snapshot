notes: |
  ## ページ対応

  印刷ページ番号と物理ページ番号がずれる。巻頭はローマ数字 i〜xi が物理 p3〜p13、
  本文は **物理ページ = 印刷ページ + 13**（印刷 p2 = 物理 p15、印刷 p130 = 物理 p143）。
  manifest の pages はすべて物理ページ。

  ## ノード分割

  - BQ は 1 項目 = 1 ノード（15 ノード）。
  - CQ は「推奨文と解説」を CQ 単位で 1 ノード（4 ノード）とした。原本ではさらに CQ1-1〜CQ1-6 の
    サブクエスチョンに分かれるが、サブ CQ が同一ページ内で切り替わるため物理ページで割ると
    どちらのノードにも半端が出る。1 CQ = 8 ページ前後（約 1.1 万字）で分量的にも 1 ノードに収まる。
  - SR ダイジェストも CQ 単位で 1 ノード。CQ2 が 13 ページと最大だが約 1.6 万字で上限内。
  - 部の中扉ページ（物理 p14 / p38 / p64 / p94 / p130）は、その部のディレクトリノードの body に入れた。

  ## 落としたページ

  - p1-2（表紙・標題紙）… 書名・監修・編集のみ。description に転記した。
  - p11-13（CONTENTS＝目次）… 計画書の方針どおり目次は収録しない。
  - p146 / p148 … 完全な白ページ。
  - p37 / p93 / p129 … 部の切れ目の白ページ。テキスト層に印刷ページ番号（24 / 80 / 116）が
    1 行あるだけで本文が無く、`strip_edge` を掛ければ空になる。以前は直前のノードの末尾に
    含めていたが、【p.N】マーカーだけが並んで本文が読めないページに見えるためノード範囲から
    外した（該当ノードの pages は 34-36 / 89-92 / 125-128 に縮めてある）。
  - 上記以外の全ページはいずれかのノードに載っている。

  ## 版・関係

  - 前版は『副腎白質ジストロフィー診療ガイドライン 2017（研究班版）／2019（学会版、日本先天代謝異常学会編集）』。
    今回収録したのは 2025 年版のみで、旧版は同じ束に無いため落としてもいない。
  - この PDF は「研究班版」。学会版（日本先天代謝異常学会・日本神経学会の承認を経た市販版）は
    別途刊行される旨が p9「外部評価について」に記されている。
  - ファイル名が `..._http＿＿＿www.japan-lsd-mhlw.jp＿doc＿ald2025_guideline.pdf.pdf` と冗長なのは
    取得時に URL をそのままファイル名に埋めたため。実体は研究班サイト（japan-lsd-mhlw.jp）の
    ald2025_guideline.pdf で、日本神経学会のガイドライン掲載ページからこの URL へリンクされている。

  ## テキスト層

  本文は 1 段組で素直に取り出せる。表・図はテキスト層に文字が残るがセルの対応が崩れるため
  vlm_candidates に挙げた。柱（章タイトル）が縦組みで 1 文字ずつ改行される箇所があり、
  strip に `[診断治療]` の 1 文字パターンを入れてある。
