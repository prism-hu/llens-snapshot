id: 副腎白質ジストロフィー2025
title: 副腎白質ジストロフィー（ALD）診療ガイドライン2025
guideline: 副腎白質ジストロフィー（ALD）診療ガイドライン2025
publisher: 厚生労働科学研究費補助金 難治性疾患政策研究事業「ライソゾーム病、ペルオキシソーム病（副腎白質ジストロフィーを含む）における早期診断・早期治療を可能とする診療提供体制の確立に関する研究」研究班（日本先天代謝異常学会・日本神経学会 共同編集）
source: http://www.japan-lsd-mhlw.jp/doc/ald2025_guideline.pdf
retrieved_at: '2026-09-05'
description: |
  『副腎白質ジストロフィー（ALD）診療ガイドライン2025』（Practical guideline for the management of
  adrenoleukodystrophy (ALD) 2025、2025年10月、研究班版、日経印刷）の全文、148 ページ。
  監修は厚生労働科学研究費補助金 難治性疾患政策研究事業「ライソゾーム病、ペルオキシソーム病
  （副腎白質ジストロフィーを含む）における早期診断・早期治療を可能とする診療提供体制の確立に関する研究」研究班
  （研究代表者 奥山虎之、課題番号 23FC1032）、編集は ALD 診療ガイドライン2025作成委員会（委員長 下澤伸行）。
  日本先天代謝異常学会（診断基準・診療ガイドライン委員長 小林弘典）と**日本神経学会**（ガイドライン統括委員長 小野寺理）の
  共同編集で、日本神経学会のガイドライン掲載ページから配布されている。

  『副腎白質ジストロフィー診療ガイドライン 2017（研究班版）／2019（学会版）』の改訂版。
  ALD 患者の約半数が成人以降に発症することを踏まえ、今回から成人領域の日本神経学会が共同編集に加わった。
  『Minds 診療ガイドライン作成マニュアル 2020 Ver.3.0』に準拠。前版の 44 ページから 110 ページ以上に増補されている。

  構成:
  - 巻頭（刊行にあたって、序文、診療ガイドラインの作成方法、編集組織、Introduction）
  - I. 副腎白質ジストロフィーの概要 — 疾患概要（定義・疫学・疾患の歴史・病態・臨床症状・予後）、診断（診断基準）、
    治療（ロレンツォオイル、造血幹細胞移植、AMN および女性発症者、副腎皮質ホルモン補充療法）、遺伝カウンセリング、文献
  - II. 疾患に関するバックグラウンドクエスチョン（BQ）— BQ1-1〜BQ14 の 15 項目
  - III. 診療に関するクリニカルクエスチョン（CQ）— CQ1〜CQ4 の推奨文と解説（各 CQ はサブクエスチョン CQn-1〜n-6 に分かれる）
  - IV. システマティックレビュー（SR）ダイジェスト — CQ ごとの文献検索式・定性的 SR・SR レポート・RC-7 EtD フレームワーク
  - V. 最新のトピックス — 新生児スクリーニングの国内外動向、遺伝子治療、AMN・女性発症者に対する治療戦略、病態解明とバイオマーカー
  - 関連資料・リンク先、診療支援・相談に関する情報

  推奨の強さは 1（強い推奨）／2（弱い推奨・提案）／なし、エビデンスの強さは A〜D で、
  「1A」のように併記される。希少疾患のため文献的エビデンスが少ない項目では GRADE の
  RC-7 evidence to decisions framework（Clinical recommendation：Individual perspective）を用い、
  国内移植拠点病院エキスパートの合意と作成委員会の投票で推奨度を決定している。
