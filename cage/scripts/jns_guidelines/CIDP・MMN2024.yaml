id: CIDP・MMN2024
title: 慢性炎症性脱髄性多発根ニューロパチー，多巣性運動ニューロパチー診療ガイドライン2024
guideline: 慢性炎症性脱髄性多発根ニューロパチー，多巣性運動ニューロパチー診療ガイドライン2024
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/cidp_2024.html
retrieved_at: '2026-09-05'
description: |
  『慢性炎症性脱髄性多発根ニューロパチー，多巣性運動ニューロパチー診療ガイドライン 2024』
  (日本神経学会 監修 / 同ガイドライン作成委員会 編集 / 南江堂 2024 年 6 月 15 日 発行)。
  協力機関は日本神経治療学会・日本神経免疫学会・日本末梢神経学会、および厚生労働省
  「神経免疫疾患領域における難病の医療水準と患者の QOL 向上に資する研究班
  (神経免疫班：23FC1009)」。2013 年版の改訂版で、2013 年版 (分冊 PDF) は収録していない。

  CIDP (chronic inflammatory demyelinating polyradiculoneuropathy) と
  MMN (multifocal motor neuropathy) の 2 疾患を 1 冊で扱う。推奨は GRADE
  (推奨の強さ 1/2 × エビデンスの確実性 A〜D)。CQ 8 件 (CIDP 5・MMN 3)、
  Q&A 32 件 (CIDP 23・MMN 9)、基本情報 35 節、フローチャート 2 件。

  構成 (全 7 章):
  - 第 1 章 CIDP の診療における基本情報 (疾患概念・疫学・病態・診断・評価・検査・治療・公的制度)
  - 第 2 章 CIDP の診療における CQ と推奨 (CQ1〜5)
  - 第 3 章 CIDP の診療における Q&A (病態・診断・治療選択肢・マネジメント・類縁疾患)
  - 第 4 章 フローチャート (診断・治療。EAN/PNS ガイドライン 2021 に準じる)
  - 第 5 章 MMN の診療における基本情報
  - 第 6 章 MMN の診療における CQ と推奨 (CQ1〜3)
  - 第 7 章 MMN の診療における Q&A (Q&A1〜9)

  収録は 1 CQ / 1 Q&A / 1 節 = 1 ノード。略語一覧を 1 ノードに切り出してある。
  文献検索式は書籍に載らず Web 別冊 (24 ページ) として公開されているので `11_付録_検索式`
  の下に CQ ごとの 8 ノードとして収めた。初版・第 1 刷の正誤表 (南江堂 2026 年 2 月 24 日)
  も `00_正誤表` に収めた。**ただし収録した Web 公開 PDF は 2 箇所とも訂正済み**
  (基本理念 5.治療目標「身体機能の長期的改善」、CQ5 の推奨「GRADE 2C」)。
strip:
  # 柱・章名と、縦組みの柱が 1 文字ずつ行に割れたもの。本文と紛れないので全行に効かせる
  - '[ivxl]{1,5}'
  - '第\s?\d\s?章'
  - '(CIDP|MMN) の診療における\s?(基本情報|CQ と推奨|Q&A)'
  - 'フローチャート'
  - '[ＣＩＤＰＭＮＱＡ＆]'
  - '[１-９]'                       # 縦組みの柱の章番号 (全角)。ページ中央付近にも出るので strip 側
  - '[診療基本情報推奨のにおけると]'
