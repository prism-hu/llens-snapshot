notes: |
  - 版: 2024 年版 (2024 年 6 月 15 日発行) が現行。2013 年版は収録しない。
  - **ファイル名と実体のずれ**: 素材の `慢性炎症性脱髄性多発根ニューロパチー、多巣性運動
    ニューロパチー診療ガイドライン2013_*.pdf` 5 本 (`_序文・目次等` `_01-総論` `_01-総論_2`
    `_02-各論` `_02-各論_2`) は URL が `guidelinem/cidp/sinkei_cidp_2013_01〜05.pdf` =
    **2013 年版の分冊**。`_序文・目次等.pdf` の 1 ページ目は「…診療ガイドライン 2013 /
    © Societas Neurologica Japonica, 2013」と印字されている。**旧版として収録しない**。
    2024 年版は `..._2024_PDF.pdf` (196 ページ、URL `pdf/cidp_2024_01.pdf`) 1 本にまとまって
    いる (GBS のようなファイル名の年号ずれは無い — 2013 分冊は名前も 2013 になっている)。
  - **正誤表 (`…2024_初版・第1刷 正誤表.pdf`、南江堂 2026 年 2 月 24 日) が直す箇所**:
    (1) 書籍 ix ページ「5．治療目標」1 行目 誤「身体機能の長期敵改善」→ 正「身体機能の
    長期的改善」、(2) 書籍 63 ページ「推奨」の GRADE 誤「GRADE 2B」→ 正「GRADE 2C」
    (= CQ5「CIDP の治療において，免疫抑制療法は推奨されるか？」の推奨提示)。
    **収録した Web 公開 PDF (cidp_2024_01.pdf) は 2 箇所とも訂正済み**であることを
    物理 p.10 (「身体機能の長期的改善を目指す．」) と物理 p.80 (「［GRADE 2C：推奨の強さ 2
    「条件付き推奨」，エビデンスの確実性 C「低」］」) で確認した。正誤表は provenance として
    `00_正誤表` に置き、CQ5 の title にもその旨を書いた。
  - ページの取り方: 本体 PDF の物理ページ = 書籍の印刷ページ + 17 (印刷 p.2 = 物理 p.19、
    印刷 p.48 = 物理 p.65、印刷 p.128 = 物理 p.145)。目次の印刷ページから換算したうえで、
    節見出し (`4.2．診断基準` など) と `Clinical Question N` / `Question & Answer N.M` の
    出現ページを本文側で照合して確定した。
  - 本体 PDF で落としたページ: p.1-2 (表紙・白紙)、p.9 / p.63 / p.139 / p.143 / p.173 /
    p.195-196 (白紙)、p.13 (利益相反 (COI) 開示)、p.14-16 (目次)、p.18 / p.64 / p.84 /
    p.140 / p.144 / p.164 / p.174 (章の中扉)、p.188-193 (索引)、p.194 (奥付。内容は
    description に転記)。
  - `source` の URL (`guidelinem/cidp_2024.html`) は学会サイトの掲載ページとして推定した
    もの (GBS 2024 が `guidelinem/gbs_2024.html` で、CIDP の付属 PDF が
    `guidelinem/cidp_2024/` 配下にあることから)。代表 PDF は `pdf/cidp_2024_01.pdf`。
  - 5.3．画像検査 は 5.3.1 超音波検査 / 5.3.2 MRI の 2 項に分かれ、5.3 自身の本文が無いので
    中間ノードを作らず `05-3-1` `05-3-2` として並べた。
  - strip / strip_edge:
    - `strip` (全行) … 柱の `第N章` `CIDP の診療における基本情報` 等、前付のローマ数字
      ノンブル、`フローチャート`、およびページ下部の縦組みの柱が 1 文字ずつ行に割れたもの
      (`Ｃ` `Ｉ` `Ｄ` `Ｐ` `Ｍ` `Ｎ` `Ｑ` `Ａ` `＆` と `の` `に` `お` `け` `る` `診` `療`
      `基` `本` `情` `報` `推` `奨` `と`、全角の章番号 `[１-９]`)。
      **全角の章番号はページ中央付近にも出る**ので端限定にできない。
    - ノンブル `\d{1,3}` は manifest 直下に置かず **本体 PDF の `pdfs[].strip_edge`
      (端 3 行) だけ**に効かせた。検索式 PDF (24 ページ) には**ノンブルが無く**、
      ページ末尾の数字はすべて「検索件数」なので、全数を確認したうえで対象外にしている。
    - この設定でノンブルは全ページ除去できている。裸の数字だけの行が残るのは
      物理 p.17 (略語一覧の "severe acute respiratory syndrome coronavirus 2" の折り返し)
      と p.152 (表 1 MMN 診断基準の項番) の 2 ページだけで、どちらも本文・表の中身。
  - 第 4 章のフローチャート 2 ページはテキスト層からは分岐が復元できない。各ノードに
    `body_text` で「分岐の読み取りは原本 PDF を参照 (VLM 起こしを予定)」と断りを置いた。
    **overlay 待ち** (vlm_candidates 参照)。
