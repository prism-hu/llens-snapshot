notes: |
  原本は 297 ページの単一 PDF（分冊なし）。CQ は 122 本。全 CQ を 1 ノード = 1 CQ で収録した。
  章の下は原本の節（①②③…）でディレクトリを切り，CQ が 1 本しかない節は節そのものをリーフにしている。
  第 5 章だけは節が無いので CQ を章直下に置いた。

  ノードに載せなかったページ（すべて本文を持たないため意図的に落とした）:
  - p.1‑2 表紙・英文書名と copyright 表示
  - p.11‑16 目次
  - p.19 / 43 / 144 / 169 / 209 / 215 / 273 各章の部扉（1 行の扉のみ）
  - p.292‑296 索引
  - p.297 奥付（発行日・発行所。第2刷であることは description に転記した）

  ページ対応: 印刷ページと物理ページのオフセットは部扉の入り方で章ごとに変わる（総論 +18 → 各論 +18 →
  第3章 +17 → 第4章 +16 → 第5章 +16 → 第6章 +15 → 第7章 +16）。目次の頁数はそのままでは使えないため，
  全 122 CQ の開始ページを本文の「Clinical Question N-M」見出しで直接確認し，目次と突き合わせた。

  テキスト層とヘッダ/フッタ:
  - 小口の柱（「1．総 / 論」「4．検 / 査」「6．治 / 療 / ・ / ケ / ア」「7．リ / ハ / ビ …」）が 1 文字ずつ改行されて出るため，
    柱を構成する文字（論 各 総 検 査 診 断 鑑 別 治 療 ケ ア 臨 床 症 状 徴 候 リ ハ ビ テ ー シ ョ ン 福 祉 サ ス 索 引 目 次 ・）だけを
    1 文字行として strip している。「1 文字行はすべて落とす」にはしていない（折り返しの末尾 1 文字を巻き込むため）。
    縦組みの見出しラベル「回 / 答」「推 / 奨」も同じ扱いで落とした — 枠の左肩に組まれていて，pdftotext では
    回答本文の**文の途中**に 1 文字ずつ挿し込まれてしまい，残すほうが読みにくいため。回答ブロックは先頭の
    ❶❷… の箇条書きと，続く `■ 背景・目的` で判別でき，推奨の強さは各項末尾の（グレード 1B）等に残っている。
    ページ下の柱に出る全角数字（１〜７）も 1 文字行として落としている。
  - 柱と CQ 見出しブロックの節名（「②分類―a．遺伝性脊髄小脳変性症」など 85 種）は exact で strip した。
    節名はノード title の [文脈] 部分に入れてある。柱を分解した中黒・長音符などの記号 1 文字の行も落としている。
  - MSA の診断基準（p.86‑90）や遺伝子一覧表はテキスト層で列が崩れるため vlm_candidates に入れた。

  第 5 章「診断と鑑別診断」は原本に節（①②…）が無く CQ が 2 本だけなので，章の直下に CQ リーフを置いた
  （他章は 章 → 節 → CQ）。

  p.65 表1（AR‑SCD・X‑linked SCD にみられる特徴的な臨床所見）は原本 PDF 自体の刷りが二重になっている
  （抽出の問題ではない）。「全身徴候（神経以外の症候）」以下の行で，行ラベルと値が 1 行分ずれて
  重なって印字されており，「脊柱の側彎・後彎ミオパチー」「凹足脊柱の側彎・後彎」のように隣接する
  2 行のラベルが融合し，値も「MSSMSS」「ABLFRDA」「NPCCTX」のように結合して見える
  （130dpi のページ画像でも 300dpi の高解像度画像でも同じ融合が見え，pdftotext -layout の抽出結果とも
  一致するため，ラスタ描画由来ではなく原本 PDF のコンテンツ自体が二重に配置されている）。
  該当行は原本を正としても判読できないため，vlm_candidates の当該ページは overlay 作成時に
  原本 PDF の当該行が本質的に読み取り不能である旨を明記すること。

