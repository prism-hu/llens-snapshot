title: 脊髄小脳変性症・多系統萎縮症診療ガイドライン2018
guideline: 脊髄小脳変性症・多系統萎縮症診療ガイドライン2018
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/sd_mst_2018.html
retrieved_at: '2026-09-05'
description: |
  日本神経学会・厚生労働省「運動失調症の医療基盤に関する調査研究班」監修
  『脊髄小脳変性症・多系統萎縮症診療ガイドライン2018』（編集: 「脊髄小脳変性症・多系統萎縮症診療ガイドライン」作成委員会，
  協力機関: 日本神経治療学会，発行: 南江堂，2018年6月5日 第1刷 / 2019年2月5日 第2刷。学会が掲載している PDF は第2刷）の全文。

  利用者として一般医家・神経内科医を対象とする。対象疾患が稀少疾患で治験の論文数が極めて少ないことから，
  症例報告なども採用してエビデンスレベルを付記する方式をとっている。

  構成（CQ 122 本）:
  - 1．総論（CQ 1‑1〜1‑11）— 定義，分類（遺伝性 SCD / 孤発性 SCD /（遺伝性）痙性対麻痺），全体の疫学
  - 2．各論（CQ 2‑1〜2‑42）— AD‑SCD（MJD/SCA3, SCA6, DRPLA, SCA31 ほか），AR‑SCD・X‑linked SCD（EAOH/AOA1,
    ビタミン E 単独欠損性運動失調症, FXTAS），MSA，CCA，遺伝性痙性対麻痺（SPG4, SPG11, JASPAC），その他の失調症
  - 3．臨床症状・徴候（CQ 3‑1〜3‑13）— 運動失調症候・錐体路症候・錐体外路症候・自律神経症候・認知機能障害・末梢神経障害・眼球運動障害・精神症候
  - 4．検査（CQ 4‑1〜4‑19）— 血液髄液・画像（MRI/MRS/SPECT/MIBG）・神経生理・神経眼科神経耳科・自律神経・遺伝カウンセリングと遺伝子検査・その他
  - 5．診断と鑑別診断（CQ 5‑1〜5‑2）
  - 6．治療・ケア（CQ 6‑1〜6‑26）— 病態修飾治療・脳刺激治療・症状改善治療（症候別）・合併症予防と治療
  - 7．リハビリテーション・福祉サービス（CQ 7‑1〜7‑9）— 理学/作業/言語聴覚/摂食嚥下療法，指定難病・障害者総合支援法・介護保険・就労支援・障害年金

  各 CQ は「回答」「■ 背景・目的」「■ 解説・エビデンス」「■ 文献」「■ 検索式・参考にした二次資料」の構成。
