notes: |
  ## チャート本体はテキスト層が無い

  `脳心血管病予防に関する包括的リスク管理チャート2019.pdf`（4 ページ）は全面が図版で、
  pdftotext で取り出せる文字は「（日本老年医学会・日本糖尿病学会 編・著：高齢者糖尿病診療ガイドライン 2017，
  P.46，南江堂，2017 より引用）」という引用表示の 1 行だけ（156 バイト）。
  埋め込みフォントも 1 つしかない。計画書の指示どおり **1 ノードとして枝は作り、全 4 ページを
  vlm_candidates に入れてある**。VLM 起こしが済むまで、このノードの本文はほぼ空になる。

  ## 解説の出典・ページ対応

  解説は日本内科学会雑誌 108巻5号 1024-1070 頁の再録で、フッタに「日本内科学会雑誌 108 巻 5 号」と
  誌面ページ番号（1024〜1070）が入る。**物理ページ = 誌面ページ - 1023**。
  manifest の pages は物理ページ。誌面ページ番号は `strip_edge`（ページの先頭/末尾 3 非空行だけ）で
  `\d{4}` を落としており、表の中の 4 桁数値は残る。柱の「日本内科学会雑誌 108 巻 5 号」は
  本文と紛れないので `strip`（全行）のままにしてある。

  ## ノード分割

  解説は 15 章のうち 12 箇所で章がページの途中で切り替わる。境界ページは
  **章見出し（`3．わが国における脳心血管病の疫学とリスク評価` 等）を `from` / `until` のアンカーにして
  ページ内で割ってある**ので、1 ノード = 1 章になっている。
  境界ページは前後 2 ノードが共有するため、後ろのノードに `allow_overlap: true` を付けた。
  15章→各章の執筆担当者→文献 の 3 箇所だけはページ先頭で切り替わるので分割していない。

  ## 最終ページ（物理 p47）の扱い

  p47 は**「標準的な質問票」1 面だけの全面図版**（受診者情報欄 ＋ 質問項目 22 問）。
  章番号も表番号も持たず、解説の本文からも参照されていない巻末の付図で、
  p3 の **表1「追加質問票」**（5 問）とは**別の様式**。
  テキスト層に落ちてくるのは設問 13（「食事をかんで食べる時の状態はどれにあてはまりますか」）の
  選択肢だけなので、当初これを「p3 の表1 からはみ出した断片」と誤読して
  `18_追加問診票の断片` というノードにしていた。**2026-09-06 に原本ページを確認して
  `18_標準的な質問票` に改めた**（title / body_text / vlm_candidates も実体に合わせた）。
  overlay（`syounin_13-p047.md`）は質問票 22 問を全面起こししており、そちらが正。

  ## 発行主体

  発行主体は単一学会ではなく **脳心血管病協議会**（14 学会 ＋ 日本医学会連合、編集協力 日本医師会）。
  日本神経学会は参加学会の 1 つで、学会のガイドライン掲載ページからこの 2 つの PDF が配布されている。
  publisher にはこの構成をそのまま書いた。チャート本体は 2019 年版、初版は 2015年4月公表。

  ## 落としたページ

  なし。チャート 4 ページ ＋ 解説 47 ページの計 51 ページすべてがいずれかのノードに載っている。
