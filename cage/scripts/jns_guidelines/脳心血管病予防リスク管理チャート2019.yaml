description: |
  『脳心血管病予防に関する包括的リスク管理チャート 2019年版』（Comprehensive risk management chart
  for cerebro-cardiovascular disease 2019）と、その解説『脳心血管病予防に関する包括的リスク管理チャート
  2019年版について』（日本内科学会雑誌 108巻5号 1024-1070 頁）の 2 点。
  作成は**脳心血管病協議会**（The Japanese Council on Cerebro-Cardiovascular Disease）。
  参加学会・団体は日本疫学会、日本高血圧学会、日本循環器学会、日本腎臓学会、日本総合健診医学会、日本体力医学会、
  日本痛風・核酸代謝学会、日本糖尿病学会、日本動脈硬化学会、日本内科学会、日本脳卒中学会、日本肥満学会、
  日本老年医学会、**日本神経学会**、日本医学会連合の 14 学会＋日本医学会連合、編集協力は日本医師会。
  2015年4月公表の初版を、各学会ガイドラインの改訂と人口高齢化を踏まえて改訂したもの（3 学会が新たに参加）。

  対象は「健康診断等で偶発的に脳心血管病リスクを指摘され来院する患者」（一次予防が主眼だが、
  加療中の患者の管理状態評価にも使える）。Step 1（スクリーニングと専門医紹介の判断）→ Step 2（各リスク因子の診断と追加評価）
  → Step 3（治療開始前に確認すべきリスク因子）→ Step 4（リスクと病態に応じた管理目標）→ Step 5（生活習慣の改善）
  → Step 6（薬物療法）の 6 ステップで構成される。

  収録した 2 ファイル:
  - **チャート本体**（4 ページ、`脳心血管病予防に関する包括的リスク管理チャート2019.pdf`）は
    **図版だけでテキスト層をほとんど持たない**（全 4 ページで抽出できる文字は引用表示の 1 行のみ）。
    ノードとしては枝を作ってあるが、本文は VLM 起こしが前提。全 4 ページを vlm_candidates に挙げている。
  - **解説**（47 ページ、`…2019年版について.pdf`）は 15 章立てで、はじめに／チャートの使い方（アルゴリズム）／
    わが国の疫学とリスク評価／心血管病のリスク因子／脳血管病のリスク因子／生活習慣の改善（禁煙・食事療法・運動療法）／
    CKD／PAD／血圧管理／血糖管理／脂質管理／肥満管理／高齢者の考え方、各章の執筆担当者、文献。
