  - 序文・目次等 p1（表紙）… 書名と監修・編集・発行社のみ。description に転記した。
  - 序文・目次等 p11-14（目次）… 計画書の方針どおり目次は収録しない。
  - 上記以外の全ページはいずれかのノードに載っている。

