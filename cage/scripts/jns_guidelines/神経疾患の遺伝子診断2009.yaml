id: 神経疾患の遺伝子診断2009
title: 神経疾患の遺伝子診断ガイドライン2009
guideline: 神経疾患の遺伝子診断ガイドライン2009
publisher: 日本神経学会（監修）／「神経疾患の遺伝子診断ガイドライン」作成委員会（編集）
source: https://www.neurology-jp.org/guidelinem/gdgl/sinkei_gdgl_2009_01.pdf
retrieved_at: '2026-09-05'
description: |
  『神経疾患の遺伝子診断ガイドライン 2009』（監修 日本神経学会、編集「神経疾患の遺伝子診断ガイドライン」作成委員会、
  委員長 辻省次、発行 医学書院、2009年10月1日 第1版第1刷／2011年6月1日 第1版第2刷、ISBN978-4-260-00945-4）の全文。
  日本神経学会が治療ガイドライン改訂（慢性頭痛・パーキンソン病・てんかん・認知症・脳血管障害・多発性硬化症）と同時期に
  **新規作成**した、神経内科診療における遺伝子診断のガイドライン。エビデンスに基づく推奨（evidence-based）ではなく
  **専門家による推奨（expert recommendation）**というスタイルを明示的に採っている。
  対象は「神経内科診療において行われる、患者（発症者）の確定診断あるいは鑑別・除外診断のための遺伝子診断」（前文）。
  遺伝カウンセリングそのもののガイドラインではない。

  構成（学会サイトでは 7 分冊 PDF として公開）:
  - 序文・目次等（監修者一覧、発行について、序、前文＝用語と表記の規約、謝辞、目次）
  - 総論 第1〜9章: 基本理念／遺伝子診断の目的と概要／遺伝子診断に際して確認すべき点と進め方／
    インフォームド・コンセント（参考説明文書例・参考同意書例を含む）／代諾同意を必要とする患者についての遺伝子診断／
    遺伝子検査法（遺伝学的検査）と結果の解釈／遺伝子検査結果の説明／家系図の書き方／遺伝カウンセリング
  - 各論 第10〜12章: 未成年で発症する疾患（7 疾患）／治療法が未確立の遅発性の疾患（3 疾患）／
    治療法が具体化しつつある疾患（3 項目）。各疾患は A．臨床／B．遺伝学及び遺伝子診断／
    C．臨床神経学における遺伝子診断の意義、有用性／D．遺伝子診断の適応を考慮する上でのポイント／E．遺伝相談 の型で記述される
  - 参考文献（A 関連ガイドライン等／B 臨床遺伝医学一般／C データベース及び関連検索サイト／D 各論疾患別参考文献）
  - 用語集（あ行〜ら行）
  - 疾患遺伝子一覧（疾患名・MIM・遺伝形式・染色体座・遺伝子記号・遺伝子名・遺伝子 MIM・文献の一覧表、19 ページ）
  - 遺伝子検査実施機関（研究班等による遺伝子検査の問い合わせ先、民間検査サービス）

  **本ガイドラインは 2009 年（第2刷 2011 年）の情報である。** 保険収載されている遺伝子診断の範囲、
  遺伝子検査実施機関の連絡先、疾患遺伝子一覧の内容（MIM 番号・原因遺伝子・文献）、遺伝カウンセラー養成課程の
  設置校などは、いずれも当時の状況であり現在とは大きく異なる。特に「遺伝子検査実施機関」の連絡先は
  そのまま利用できないと考えるべきである。用語も「常染色体優性／劣性」など現行の「顕性／潜性」以前の表記。

  **原本 PDF のテキスト層に重大な欠損がある**（下の notes を参照）。本文の日本語は正しく取り出せるが、
  **数字がほぼ全滅している**（章番号・節番号・割合・年・MIM 番号・染色体座・文献の巻号ページなど）。
  数値を要する場面では必ず原本 PDF を参照すること。
text_caveat: |
  **この文書はテキスト層の数字が信用できない。** 原本 PDF の埋め込みフォント (Type1C サブセット /
  CID Type0C Identity-H) に数字グリフの ToUnicode が無い・誤っているため、本文中の数字
  (章番号・節番号・図表番号・染色体座・MIM 番号・変異の位置・%・年・保険点数・文献の巻号ページ) が
  **欠落するか別の文字に化けている** (例: `100%`→`yzz%`、`SCA1`→`SCAy`、`22q11.2`→`¦¦qyy.¦`)。
  日本語の散文はそのまま読んでよいが、**数値は必ず末尾リンクの原本 PDF で確認すること。**
