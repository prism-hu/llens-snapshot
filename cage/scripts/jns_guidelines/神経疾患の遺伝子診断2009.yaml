notes: |
  ## テキスト層の重大な欠損（最重要）

  7 分冊すべてが医学書院の DTP（Type1C サブセットフォント + CID Type0C Identity-H）で作られており、
  **数字とごく一部の記号のグリフに ToUnicode マッピングが無い／誤っている**。結果として pdftotext・
  Ghostscript(txtwrite) のいずれでも、本文中の数字が

  - 消える（グリフ名 `c00F7`〜`c0100` の 10 字＝数字 0〜9 に ToUnicode が無く、制御文字になる）か、
  - 別の文字に化ける（Identity-H の CID フォント。例: `100%`→`yzz%`、`SCA1`→`SCAy`、`22q11.2`→`¦¦qyy.¦`、
    `1/4(25%)`→`¸/í(º»%)`、`3,000 点`→`,kkk 点`）

  という状態になる。フォントごとに化け方が違うため一律の置換表では復元できない。
  ページ番号も同様に壊れるので、strip では数字パターンではなく
  「かな・漢字を含まない 4 文字以下の行」を落とす形にしてある。
  **この欠損はガイドライン 1 本まるごとに及ぶため、vlm_candidates に全 PDF の全ページを挙げてある。**
  日本語の散文自体は正しく取り出せるので、テキストは「読める本文」として収録しつつ、
  数値が要る場面は原本 PDF / VLM 起こしに送る前提。

  ## ノード分割

  - 総論・各論は物理ページ境界で分割し、章（総論）・疾患（各論）を 1 ノードとした。
    節が同一ページで切り替わる箇所は「その節が始まるページからノードを開始し、次の節が始まるページの
    直前で終える」規則にしてある（ノード先頭に前節の末尾、末尾に次節の冒頭が混じることがある）。
  - **各論 p58 は割っていない**（`from` / `until` を使っていない）。この 1 ページは前半が
    第12章 1「根治を目指した治療が可能となってきた遺伝性神経疾患」の成人型シトルリン血症の続き、
    後半が「2 家族性アミロイド多発ニューロパチー」の書き出しで、節境界がページ中ほどにある。
    ページ内分割ができないのは **overlay がページ全置換だから**で、
    `scripts/build_jns_guidelines.py` の `render()` は
    「`if key in overlays:` で overlay をそのまま採る／`else:` の中でだけ `slice_page()` に
    `from` / `until` を掛ける」構造になっている。つまり overlay のあるページで `from` / `until` を
    書いても**無視され、両ノードに overlay の全文がまるごと入る**。しかも `check()` は
    overlay ではなく生の pdftotext 出力に対してマッチを確かめるので `--check` は通ってしまい、
    黙って二重掲載になる。各論の全ページに overlay があるため（p58 も
    `overlays/神経疾患の遺伝子診断2009/sinkei_gdgl_2009_03-p058.md` がある）、
    ここは分割せず、p58 全体を FAP ノード側（pages: 58-62）に置いたままにしてある。
    FAP ノードの冒頭にシトルリン血症の記述が数段落混じるが、上の「節が同一ページで切り替わる箇所」
    の規則どおりの扱い。
  - 疾患遺伝子一覧は 19 ページの 1 枚表なので、表中の疾患カテゴリ見出しを境に 9 ノードに割った。
  - 参考文献・用語集・遺伝子検査実施機関は分量が小さいので分冊ごと 1 ノード。

