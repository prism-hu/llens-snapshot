description: |
  原典正式名: 「重症筋無力症／ランバート・イートン筋無力症候群診療ガイドライン 2022」。
  監修 日本神経学会（協力機関: 日本神経治療学会、日本神経免疫学会、日本小児神経学会、厚生労働省
  「難治性疾患等政策研究事業 神経免疫疾患のエビデンスに基づく診断基準・重症度分類・ガイドラインの
  妥当性と患者 QOL の検証」班）、編集 「重症筋無力症/ランバート・イートン筋無力症候群診療ガイドライン」
  作成委員会。発行 南江堂、2022年5月18日 第1刷（2022年8月30日 第2刷）。
  「重症筋無力症診療ガイドライン 2014」の改訂版で、ランバート・イートン筋無力症候群（LEMS）を新たに収載した。
  推奨は「Minds 診療ガイドライン作成の手引き 2014」に準拠し、推奨の強さ 2 段階（1 強く推奨 / 2 弱く推奨）×
  エビデンスの強さ 4 段階（A 強い / B 中程度 / C 弱い / D とても弱い）で提示する（例: 1C）。

  本体は 4 章 11 節・全 60 CQ。
  第1章 重症筋無力症（MG）総論（1．MG の病因 / 2．MG の症状・合併症 / 3．診断・評価・病型分類 / 4．疫学・予後）、
  第2章 成人期発症 MG の治療（治療ガイド〈CQ マップ・治療アルゴリズム〉/ 5．成人期発症全身型 MG の治療指針 /
  6．成人期発症眼筋型 MG の治療指針 / 7．病態ごとの治療とマネジメント）、
  第3章 小児期発症 MG の治療（8．基本情報と治療指針 / 9．病態ごとの治療指針）、
  第4章 ランバート・イートン筋無力症候群（LEMS）（10．LEMS の基本情報 / 11．LEMS の治療指針）。

  収録範囲: 本体 207 ページのうち、監修・作成委員・発行にあたって・序・COI・奥付（`00_ガイドライン概要`）、
  略語一覧、全 60 CQ と各節の扉を収録する。目次・索引・白ページは収録しない。
  別冊「文献の検索式・参考にした二次資料」（47 ページ）を `付録_検索式` に、
  「追補版 2025」（27 ページ、分子標的治療薬 6 剤と眼筋型 MG のステロイドパルス）を子セクション
  `90_追補版2025` に収める。
