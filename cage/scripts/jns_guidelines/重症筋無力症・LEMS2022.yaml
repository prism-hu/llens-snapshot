    全 60 CQ 分があるわけではなく、検索式が掲載されている CQ のみが載っている（原本どおり）。
  - **ページ範囲は物理ページ**。本体の印字ノンブルは物理ページ − 14（印字 1 = 物理 15）、
    追補版 2025 は物理ページ − 5（印字 1 = 物理 6）。目次の印字ページをそのまま使ってはいけない。
  - **テキスト層の癖**: 上付きの文献番号のあとの「．」が単独行に分かれて出る（例: 「…である 17）」の次行が「．」）。
    strip では 1 文字の全角記号（．，）は落としていない（本文の一部のため）。
    ページ左右の縦組みツメ（章・節名を 1 文字ずつ縦に並べたもの）は 1 文字行として現れるので、
    ひらがな/カタカナ/漢字/全角英数の 1 文字行を strip している。副作用として本文中の 1 文字だけの行
    （まれ）も落ちうるが、実データでは確認されなかった。
  - **ノンブルの `strip_edge` は PDF ごとに持たせている。** 本体と追補版 2025 は
    `lines: 3` + `\d{1,3}` で印字ノンブルが全ページ取り切れることを実測で確認した（残り 0）。
    別冊「文献の検索式」には**印字ノンブルが無い**（全 47 ページで確認）ので strip_edge を付けていない。
    manifest 直下に置くと、ページ末尾に並ぶ**検索件数**（裸の数字）が 61 行消えてしまう。
  - 生成物に残る裸の数字行は、`03_診断・評価・病型分類/CQ3-2`（MGFA 分類・MG-ADL・QMG・MGC の素点）、
    `10_LEMSの基本情報/CQ10-3`、`付録_検索式/*`（検索件数）など**表の数値セルと検索件数**であり、
    ノンブルの残りではない。表の桁の対応はテキスト層では復元できないので vlm_candidates に挙げてある。
