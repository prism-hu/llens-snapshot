id: 認知症関連_適正使用ガイドライン
title: 認知症関連 適正使用ガイドライン
guideline: 認知症関連 適正使用ガイドライン (アミロイドPET・脳脊髄液/血液バイオマーカー・APOE遺伝学的検査・BPSD向精神薬)
publisher: 日本神経学会ほか認知症関連学会
source: https://www.neurology-jp.org/guidelinem/pdf/syounin_22.pdf
retrieved_at: '2026-09-05'
description: |
  日本神経学会が「承認したガイドライン」として掲載している、認知症診療の検査・薬物療法に
  関する適正使用ガイドライン 4 本を 1 つのディレクトリ
  (`{{DOC_BASE}}/診療ガイドライン/神経疾患/認知症関連_適正使用ガイドライン/`) にまとめたもの。
  いずれも認知症関連学会
  (日本認知症学会・日本老年精神医学会・日本神経学会・日本精神神経学会・日本老年医学会・
  日本神経治療学会、アミロイド PET は日本核医学会を加えた 7 学会) の監修で、厚生労働科学
  研究費の研究班を母体に作成・改訂されている。**収録したのは各文書の現行版のみ**。

  - アミロイド PET イメージング剤の適正使用ガイドライン 改訂第 4 版 (2025 年 4 月 30 日)
    — 検査依頼・薬剤製造・撮像・読影・臨床使用 (適切/不適切) の適正化。
  - 認知症に関する脳脊髄液・血液バイオマーカーの適正使用ガイドライン 第 3 版 (2025 年 3 月 31 日)
    — 第 1 版 2021 年 3 月 31 日 / 第 2 版 2023 年 9 月 30 日。脳脊髄液 Aβ・タウ、血液
    バイオマーカーの測定・解釈・開示。
  - 認知症に関する APOE 遺伝学的検査の適正使用ガイドライン 第 2 版 (2026 年 7 月 16 日)
    — 初版 2025 年 3 月 31 日。抗アミロイドβ抗体薬の ARIA リスク評価を主目的とする検査の
    適正使用と、同意説明モデル文書を含む。
  - かかりつけ医・認知症サポート医のための BPSD に対応する向精神薬使用ガイドライン 第 3 版
    — 治療アルゴリズムと薬剤ごとの有効性・副作用・留意点・推奨初期投与量。

  『認知症疾患診療ガイドライン 2017』(`{{DOC_BASE}}/診療ガイドライン/神経疾患/認知症疾患2017/`) の CQ6-4 (APOE 遺伝子検査)・
  CQ6-6 (アミロイド PET)・CQ2-9 (血液/脳脊髄液検査)・第 3 章 B (BPSD の治療) は
  2017 年時点の記述なので、実務ではこちらの現行版が優先する。
strip_edge:
  # ノンブル等。**ページの先頭/末尾 3 非空行だけ**に効かせる
  # (全行 fullmatch だと表の数値セル・文献番号を巻き添えにするため)
  lines: 3
  patterns:
  - '\d{1,3}'
# 埋め込みの SymbolMT / Wingdings は、フォント内の文字コードに 0xF000 を足した私用領域
# (PUA U+F000-F0FF) に落ちる。pdftotext はその PUA をそのまま返すので、ギリシャ文字・
# 数字・読点が本文から**消えて見える** (例「AChR は␣␣␣の 4 つのサブユニット」)。
# **同じコードでもフォントが違えば別の字**なので (F06C は Symbol なら λ、Wingdings なら ●)、
# 一律に写像してはいけない。下の割り当ては原本ページ画像で 1 種ずつ目視確認した (2026-09-12)。
# 箇条書き記号は `- ` でなく**記号そのもの**に写す: pdftotext がこれらを
# 「記号だけの行 + 空行 + 本文行」に割ることが多く (神経疾患全体で 42 出現中 30)、
# `- ` にすると中身の無い箇条書き項目になるため。
substitutions:
  # APOE 第2版 (Wingdings)。p.9/p.10 の「適切な使用」「不適切な使用」と p.20 の
  # 生活習慣の箇条書きの行頭。p.2「改定の履歴」の行頭だけ別コード
  - {pdf: APOE適正使用ガイドライン第2版_PDF.pdf, find: "\uF09E", replace: '·'}
  - {pdf: APOE適正使用ガイドライン第2版_PDF.pdf, find: "\uF09F", replace: '•'}
