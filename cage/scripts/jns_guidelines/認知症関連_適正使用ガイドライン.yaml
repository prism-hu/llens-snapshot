notes: |
  - **版の重複の解き方** (素材には同じ文書の別版が混ざっている):
    - アミロイド PET: `認知症関連ガイドライン改定版_アミロイドPETイメージング剤の適正使用ガイドライン（第4版）.pdf`
      (syounin_22) と `アミロイドPETイメージング剤の適正使用ガイドライン.pdf` (syounin_01) は
      **pdftotext 出力が 1 行も違わない同一文書** (どちらも 23p、改訂第 4 版 2025 年 4 月 30 日)。
      学会が旧 URL (syounin_01) を第 4 版に差し替えたもの。ファイル名に版が入っている
      syounin_22 のほうを収録し、syounin_01 は落とした。
    - APOE: `…APOE遺伝学的検査の適正使用ガイドライン（初版）.pdf` (syounin_24、初版 2025-03-31、20p) と
      `APOE適正使用ガイドライン第2版_PDF.pdf` (syounin_26、第 2 版 2026-07-16、22p) は別物。
      第 2 版で「薬事承認・保険適用に伴う記載変更」「日本人の ARIA リスクデータ追加」
      「代諾者の設定」「文献追加」が入っているので、**第 2 版のみ収録**し初版は落とした。
    - 脳脊髄液・血液バイオマーカー: `認知症バイオマーカー適正使用指針について.pdf`
      (dementia_biomarker、17p) の実体は「認知症に関する脳脊髄液・血液バイオマーカーの
      適正使用指針 **第 1 版** 2021 年 3 月 31 日」(厚労科研 研究班)。同じ系列の現行版が
      syounin_23 の「…適正使用**ガイドライン** 第 3 版 2025 年 3 月 31 日」(名称変更あり、
      第 2 版で APOE を追補に取り込み、第 3 版で APOE を分離) なので、**第 3 版のみ収録**し
      第 1 版は落とした。
    - 落とした 3 本 (syounin_01 / syounin_24 / dementia_biomarker) は `pdfs:` に宣言していない。
  - ファイル名と実体のずれ: 上記のとおり `認知症バイオマーカー適正使用指針について.pdf` は
    「指針」であって現行「ガイドライン」ではない。`アミロイドPETイメージング剤の適正使用
    ガイドライン.pdf` は名前に版が無いが中身は第 4 版。
  - ノードに載せなかったページ:
    - アミロイド PET 第 4 版 … 無し (p.1-3 は表紙・WG メンバー・目次で、文書ノード
      (`01_アミロイドPET適正使用GL第4版` 自身の本文) に入れた)。
    - 脳脊髄液・血液バイオマーカー 第 3 版 … p.3 (目次) を落とした。
    - APOE 第 2 版 … p.4 (目次) を落とした。
    - BPSD 向精神薬 第 3 版 … 無し (p.1 は表紙 + 目次で文書ノードの本文に入れた)。
  - 節と物理ページ: 4 本とも PDF の物理ページと文書内の印字ページが一致する
    (目次の「p5」等がそのまま物理ページ)。境界は各ページの冒頭を見て確認した。
    節が 1 ページの途中で切り替わる箇所 (アミロイド PET の 2.目的/3.意義、BPSD の
    抗認知症薬/抗精神病薬 など) は、ページ単位で分けられる最小のまとまりにグループ化した。
  - strip はノンブル (`\d{1,3}`) のみ。4 本とも柱 (running head) を持たない。
    BPSD の薬剤表は数値だけの行があるため、この strip が表の数値を巻き込みうる
    (p.9-11)。当該ページは vlm_candidates に入れてあるので、VLM overlay で置き換える前提。
