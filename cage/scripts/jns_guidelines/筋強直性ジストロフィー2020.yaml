    body_text: |
      Ⅰ．総論 第2章。BQ 2-1〜2-5。診断の進め方（スクリーニング問診票・病型診断フローチャート・遺伝学的検索法）と、挙児希望／出生前・着床前診断／妊娠中に診断された場合／出産後に診断された場合の遺伝カウンセリングを扱う。
      原本の章扉（p.31）は章名 1 行だけなので収録していない。
    children:
      - path: Q2-1
        title: '[総論／2．診断・遺伝相談 BQ2-1] どのように診断するか'
