    body_text: |
      Ⅱ．各論 第10章。BQ 10-1〜10-3。中枢神経障害の特徴（認知機能障害・過眠・無気力）、評価方法、有効な介入方法を扱う。
      原本の章扉（p.101）は章名 1 行だけなので収録していない。
    children:
      - path: Q10-1
