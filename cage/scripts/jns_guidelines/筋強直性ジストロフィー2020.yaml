          - {pdf: 筋強直性ジストロフィー診療ガイドライン2020_PDF.pdf, pages: [32, 37]}
      - path: Q2-2
        title: '[総論／2．診断・遺伝相談 BQ2-2] 挙児希望を有する患者への遺伝カウンセリングはいつ，どのように行うか'
