notes: |
  ## 版
  - 2020年版が現行版。素材に旧版はない。追補版も存在しない。
  - `guideline` / `title` に発行年を含めた（学会サイトの掲載名がそのまま「筋強直性ジストロフィー診療ガイドライン2020」）。

  ## 落としたページ（本体 171p）
  - p1 中扉、p2 著作権表示（© Societas Neurologica Japonica, 2020 / Published by Nankodo）、p3 扉（監修・編集）、
    p4-5 作成委員会・評価・調整委員名簿。委員長名と協力学会は description に転記済み。
  - p8 白ページ。p16-17 目次。p19, 31, 47, 55, 59, 65, 73, 81, 89, 101, 111, 121, 131, 145, 155 は章の中扉（章名のみ）。
  - p30, 54, 64, 80, 88, 110, 120, 130 は白ページ。
  - p167-170 索引、p171 奥付（発行日・発行所は description に転記済み）。

  ## ページ境界の確認
  - 全 45 問の境界は当該ページ本文の「Background Question N-M」「Foreground Question N-M」見出し行を
    pdftotext 既定モードで直接確認した。目次（p16-17）の印字ページ番号は物理ページより 18 小さいので使っていない。
  - FQ11-2（p114）は 1 ページで完結する。BQ3-1（p48-53）と BQ2-1（p32-37）は 6 ページと長いが、
    節見出しでの分割は原文の「1 問 = 1 回答」を壊すため分けていない（約 1.1 万字で 2 万字以内）。

  ## strip / strip_edge について
  - 章の柱 (「Ⅰ．総論」「Ⅱ．各論」と各章名)、縦組みの「回」「答」「推」「奨」ラベル、制御文字 \x06、
    巻末資料の柱 (「巻末資料」「検索式」「主な外部評価コメントと対応」) を `strip` に置いた。
  - 縦組みの柱に出る全角数字 1 文字 (章番号) も `strip` 側。全ページを走査して、全角数字だけの行が
    この柱以外に無いことを確認した。
  - ノンブルは `strip_edge` だが、この版面だけ **lines: 1** にしてある。窓を 2 行にすると
    p147 の図 (context-sensitive half-time) の軸ラベル 300 / 250 と、p156 の検索式のヒット件数 275 / 10 を
    巻き添えにする。実測で 1 行のとき巻き添え 1 件、2 行で 5 件、3 行で 8 件だった。
  - 縦組みの柱に出る 1 文字漢字 (「障」「害」「性」「管」など) は本文の 1 文字行と区別できないため残している。
  - 「■ 背景・目的」「■ 解説・エビデンス」「■ 文献」「■ 参考にした二次資料」「重要な文献はハンドサーチで追加した．」は
    各問の構造要素なので落としていない。

  ## 章 _index の本文
  - 章の中扉 (章名 1 行) は収録していないので、各章の `_index.md` は `body_text` で書いた案内文と
    子の一覧だけになる。BQ / FQ の別と、その章がどの問を持つかを `body_text` に書いた。

  ## 既知の残件 (VLM 待ち)
  - vlm_candidates に挙げた 18 ページ (DM1 と DM2 の対比表、多臓器障害の一覧、遺伝学的検索法、
    病型診断フローチャート、予防に必要な検査の 3 表、評価シート、COI 一覧) は多列表・図で、
    テキスト層では桁が崩れる。
  - p156 の検索式ページは最終行のヒット件数がノンブルと区別できず 1 件落ちる。同ページは vlm_candidates にある。
