      Ⅱ．各論 第9章。FQ 9-1・9-2・9-5 が推奨つき（定期的な嚥下評価、代替栄養法、口腔ケアと歯科治療の注意）、BQ 9-3・9-4 が下部消化管の異常と口腔内の特徴。
