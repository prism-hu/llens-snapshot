id: 筋強直性ジストロフィー2020
title: 筋強直性ジストロフィー診療ガイドライン2020
guideline: 筋強直性ジストロフィー診療ガイドライン2020
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/myotonic/myotonic_2020.pdf
retrieved_at: '2026-09-05'
description: |
  原典正式名: 「筋強直性ジストロフィー診療ガイドライン 2020」（Practical Guideline for Dystrophia Myotonica (DM) 2020）。
  監修 日本神経学会（協力学会: 日本顎口腔機能学会、日本産科婦人科学会、日本神経治療学会、日本糖尿病学会、
  日本不整脈心電学会、日本麻酔科学会）、編集「筋強直性ジストロフィー診療ガイドライン」作成委員会（委員長 松村剛）。
  発行 南江堂、2020年9月10日。Minds の指導を受けて作成され、評価・調整委員には
  特定非営利活動法人 筋強直性ジストロフィー患者会の代表者も参加している。

  Question は 2 種類。エビデンスの整理と回答文で答える **Background Question（BQ）** と、
  推奨文を作成する **Foreground Question（FQ、推奨つき）** に分かれる。
  構成は Ⅰ．総論（1．筋強直性ジストロフィーとは／2．診断・遺伝相談／3．機能評価・検査，合併症検索／
  4．治療開発の現状と治験推進のための基盤整備／5．社会支援・制度）と
  Ⅱ．各論（6．運動機能障害・リハビリテーション／7．呼吸の障害／8．心臓の障害・不整脈／
  9．嚥下障害・消化管・歯科学的問題／10．中枢神経障害／11．代謝障害／12．その他合併症／
  13．妊娠周産期管理・先天性患者／14．全身麻酔・外科的処置）の 14 章 45 問。
  巻末資料に代表的な検索式・文献検索フローチャート・評価シート・各委員の COI・主な外部評価コメントと対応を収める。
  なお全 CQ の検索式は https://doctors.mdcst.jp/guideline/DM2020CQsearch に置かれている（本 PDF には代表例のみ）。

  収録範囲: 本体 171 ページのうち序論（発行にあたって・序・作成方法・略語一覧）、全 45 問、巻末資料を収録。
  中扉・著作権表示・委員名簿・目次・索引・奥付・白ページは収録しない。
  リーフの path は章ディレクトリ配下で `Q<章>-<番号>` に統一し（BQ と FQ が混在する章でも原本順に並ぶようにするため）、
  BQ / FQ の別は title に「BQ9-3」「FQ9-1・推奨」の形で明記した。
