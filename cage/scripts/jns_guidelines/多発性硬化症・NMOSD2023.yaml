  # mode: raw の出力に合わせてある。ページ左右の縦組みツメは
  # 「基 本 情 報 B ． 多 発 性 硬 化 症 ︵ M S ︶」のように 1 字ずつ空白区切りで出る。
  # 表のセルも同じ形で出るページがある (妊娠・授乳の薬剤表、EDSS 表) ので、
  # ツメの接頭辞 (基 本 情 報 / C C / Q Q Q) を明示して当てる。
  - '基 本 情 報(?: \S)+'
  - 'C C(?: \S)+'
  - 'Q Q Q(?: \S)+'
  - '[‒‑–—―]+'
