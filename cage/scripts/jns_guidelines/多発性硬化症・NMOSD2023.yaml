notes: |
  - **旧版・不採用**: 同じ束にある `多発性硬化症・視神経脊髄炎診療ガイドライン2017追補版―フマル酸ジメチル―_PDF.pdf`
    （URL https://www.neurology-jp.org/guidelinem/msgl/koukasyo_tuiho_2017_01.pdf）は **2017 年版の追補版**であり、
    本 2023 年版の追補ではない。フマル酸ジメチル（DMF）は 2023 年版の第Ⅰ章 3-G「フマル酸ジメチル（DMF）」
    （物理 p88-92）に本文として取り込まれているため、旧版追補は**収録しない**（計画書の「現行版のみ収録」に従う）。
  - **収録しなかったページ**（323 ページ）:
    - p1〜p3 … 表紙・中扉（テキスト層 0 文字）。
    - p15〜p19 … 目次。`/doc/list` が目次の役割を果たすため収録しない。
    - p22・p170・p314 … 白ページ。
    - p315〜p323 … 索引。grep で代替できるため収録しない。
    - 章扉（p23 第Ⅰ章 / p133 第Ⅱ章 / p171 第Ⅲ章）は、それぞれ `11_中枢神経系炎症性脱髄疾患概要` /
      `20_CQと推奨` / `31_QandA_急性増悪期の治療` の `_index` 本文に割り当てて被覆漏れを作らないようにした。
  - **ページ範囲は物理ページ**。印字ノンブルは物理ページ − 22（印字 1 = 物理 23、印字 114 の CQ1 = 物理 136、
    印字 293 の索引 = 物理 315）。前付けはローマ数字で、印字と物理がずれる。目次の印字ページをそのまま使ってはいけない。
  - **抽出モードは `raw`**（`pdfs[].mode: raw`）。この PDF は本文の左右に縦組みの柱を持ち、
    既定モードだと段落の 1 行目がページ末尾に回るなど**読み順が入れ替わる**
    （例: 物理 p27 では「MS は，遺伝的要因と…」で始まる段落の 1 行目がページ最下部に出ていた）。
    `-raw` にすると読み順が本文どおりになり、ノンブルと柱が「`5 1. 中枢神経系炎症性脱髄疾患概要`」の
    形でページ先頭 1 行にまとまる。`strip` / `strip_edge` はこの `-raw` の出力に合わせて書き直してある。
  - **strip / strip_edge の設計**:
    - 縦組みのツメは `-raw` では「`基 本 情 報 B ． 多 発 性 硬 化 症 ︵ M S ︶`」「`Q Q Q Q 5`」
      「`C C 資 料 C Q 1`」のように 1 字ずつ空白区切りで出る。ただし**表のセルも同じ形で出る**
      （妊娠・授乳の薬剤表 p192-198、EDSS 表 p232-233 の「`母 乳 移 行 の デ ー タ は 限 ら れ る`」など）
      ので、総称の「1 字＋空白の繰り返し」では当てず、ツメの接頭辞
      （`基 本 情 報` / `C C` / `Q Q Q`）を明示している。
    - ノンブルは柱と同じ行に出るため、`strip_edge` には裸の数字・ローマ数字に加えて
      「`<ノンブル> <柱>`」の形を**柱の語を列挙して**入れてある。総称の `\d{1,3} .+` にすると
      「`50 patients. Part 2: …`」のような文献の折り返し行や、CQ ページの数値行
      （「`9 0.79 8.21 8.21 5 9`」= 推奨決定の投票集計）まで落ちる。実測で確認済み。
    - `-raw` にしたことで、既定モード向けに書いていた `C?Q\d` や `[A-O]．…` の strip は不要になった。
      その結果、本文の見出し行（`CQ1 RRMS 患者の…`、`A． MS の診断基準`、
      MOGAD 診断基準の `A．中核的臨床事象（ⅰ）` など）はすべて本文に残る。
  - **テキスト層の漢字欠落は「pdfminer で見たときだけ」の現象**（2026-09-06 に確認）。
    この PDF は埋め込みフォントの多くが ToUnicode を持たない CID Type0C Identity-H なので、
    pdfplumber / pdfminer で読むと `倦`（cid:7674、28 箇所）・`疼`（cid:20175）・`梗`（cid:20279）・
    `叉`（cid:20281）・箇条書きの `●`（cid:12256）などが `(cid:N)` に落ち、
    「疲労・倦怠感」が「疲労・(cid:7674)怠感」に見える。
    **build が使う `pdftotext` は Adobe-Japan1 の CID から正しく Unicode に戻せており、
    出力にも生成後のノードにも欠落は無い**（`倦` 28 / `鞘` 17 / `泌` 16 / `疼` 21 / `梗` 16 / `叉` 11 で
    pdfminer の (cid:N) 出現数と一致）。**したがって `text_caveat` は付けない。**
    `profile_jns_gaps.py` の `cidmiss` 判定はこの PDF を過検出するので、
    「候補に挙がった＝本文が欠けている」と読み替えないこと。
  - **Q&A のノード名**: 第Ⅲ章 5．フォローアップは Q5-1〜Q5-12 と 2 桁になるため、文字列ソートで原本順に
    並ぶよう path のみ `Q5-01`〜`Q5-12` とゼロ埋めした（title は原本どおり Q5-1 / Q5-10）。
  - 第Ⅱ章の「資料 各 CQ のシステマティックレビューレポート」は 24 ページあり、CQ ごとに 5 ノード
    （`Z1_SRレポート_CQ1`〜`Z5_SRレポート_CQ5`）へ割った。CQ 本体（`CQ1`〜`CQ5`）と対で読む想定。
