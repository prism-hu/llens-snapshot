id: 多発性硬化症・NMOSD2023
title: 多発性硬化症・視神経脊髄炎スペクトラム障害診療ガイドライン2023
guideline: 多発性硬化症・視神経脊髄炎スペクトラム障害診療ガイドライン2023
publisher: 日本神経学会
source: https://www.neurology-jp.org/guidelinem/pdf/koukasyo_nmosd_2023.pdf
retrieved_at: '2026-09-05'
description: |
  原典正式名: 「多発性硬化症・視神経脊髄炎スペクトラム障害診療ガイドライン 2023」。
  監修 日本神経学会（協力 日本神経免疫学会、日本神経治療学会）、
  編集 「多発性硬化症・視神経脊髄炎スペクトラム障害診療ガイドライン」作成委員会。
  発行 医学書院、2023年9月1日 第1版第1刷。
  『多発性硬化症治療ガイドライン 2010』→『多発性硬化症・視神経脊髄炎診療ガイドライン 2017』の改訂版。
  第Ⅱ章の CQ は『Minds 診療ガイドライン作成マニュアル 2020 ver.3.0』に沿って GRADE アプローチで作成し、
  推奨の強さと「エビデンスの確実性（A 強い / B 中 / C 弱い / D 非常に弱い）」で提示する。
  第Ⅲ章の Q&A はエビデンスが不十分だがコンセンサスの得られる事項を回答形式で示す（推奨度は付かない）。

  対象疾患は多発性硬化症（MS）、視神経脊髄炎スペクトラム障害（NMOSD）、MOG 抗体関連疾患（MOGAD）、
  急性散在性脳脊髄炎（ADEM）、バロー同心円硬化症（BCS）を含む中枢神経系炎症性脱髄疾患。
  構成は 3 章立て。
  第Ⅰ章 中枢神経系炎症性脱髄疾患診療における基本情報（1．疾患概要 / 2．診断基準の概説と診断アルゴリズム /
  3．各治療概要〈副腎皮質ステロイド薬・血漿浄化療法・IVIg・IFNβ・GA・フィンゴリモド・DMF・ナタリズマブ・
  オファツムマブ・シポニモド・免疫抑制薬・エクリズマブ・サトラリズマブ・イネビリズマブ・リツキシマブ〉/
  4．医療経済学的側面および社会資源の活用）、
  第Ⅱ章 CQ と推奨（CQ1〜CQ5 + 各 CQ のシステマティックレビューレポート）、
  第Ⅲ章 Q&A（1．急性増悪期の治療 / 2．MS の再発予防・進行抑制治療 / 3．NMOSD の再発予防治療 /
  4．再発性 MOGAD の治療 / 5．フォローアップ / 6．対症療法 / 7．妊娠・出産，性ホルモン / 8．リハビリテーション、
  計 40 件の Q&A と 3 件の治療アルゴリズム資料）。

  収録範囲: 323 ページのうち、奥付・執筆者一覧・発行にあたって・序・本ガイドラインの概要（`00_ガイドライン概要`）、
  略語一覧、第Ⅰ章の全節、第Ⅱ章の CQ5 件と SR レポート、第Ⅲ章の Q&A 40 件と資料、巻末の COI 開示を収録する。
  目次・索引・白ページは収録しない。
