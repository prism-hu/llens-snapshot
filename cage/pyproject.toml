[project]
name = "cage"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps of the server itself (a thin set). This alone runs in the air-gapped site.
# PDF/HTML parsing libs (heavy, compiled wheels) are used only for entries-generation prep,
# so they are split into [dependency-groups] ingest (the server never imports them).
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "markdown-it-py>=3.0",
]

[project.scripts]
cage = "cage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cage"]

[dependency-groups]
# Heavy deps used only by entries generation (PDF/HTML → markdown). Pulls in lxml/pdfminer/pypdfium2/
# pillow/cryptography etc. Online/prep only; not needed on the air-gapped server.
# To use: uv sync --group ingest. Used by scripts/parse_*.py.
ingest = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.9",
    # Used by scripts/fetch_*.py (fetching from the hospital intranet). Also in dev, but
    # in an env synced with `uv sync --group ingest` without dev, fetch dies with ImportError,
    # so declare it on the ingest side too
    "requests>=2.33.1",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "requests>=2.33.1",
]
